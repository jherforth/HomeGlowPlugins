<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grill</title>
<link rel="stylesheet" href="/index.css">

<script type="application/json" id="homeglow-manifest">
{
  "manifestVersion": 1,
  "id": "grill-card",
  "name": "Grill",
  "version": "1.13.0",
  "description": "Your grill and probes from Home Assistant: temps, a cook graph you can zoom and compare with past cooks, multi-step cook programs, Ready by times that learn from your grill, a grill journal and alerts. Works with smart grills (Pit Boss, Traeger, recteq…) or any grill with a temperature sensor.",
  "author": "jasonstantler",
  "category": "meals",
  "apiVersion": "v1",
  "storage": true,
  "notify": true,
  "homeAssistant": {
    "domains": ["climate", "sensor", "binary_sensor", "number", "script", "weather"],
    "control": true
  },
  "events": ["ha.state"],
  "hideableControls": [
    { "id": "changeTemps", "label": "Change temps and timers, and start or stop cooks and programs" },
    { "id": "nextStep", "label": "Move a program on to its next step, and dismiss alerts" },
    { "id": "chooseFood", "label": "Turn probes on or off and choose food sensors" },
    { "id": "newCook", "label": "Start or end a cook" },
    { "id": "shutDown", "label": "Shut down the grill" }
  ],
  "settings": [
    { "key": "pullEarly", "label": "Heads-up degrees before target (0 = off)", "type": "number", "default": 5, "min": 0, "max": 20 },
    { "key": "keepWarmTemp", "label": "Keep-warm grill temp", "type": "number", "default": 165, "min": 50, "max": 250 },
    { "key": "dangerZone", "label": "Warn if food is under 140° after", "type": "select", "options": ["Off", "3 hours", "4 hours", "5 hours", "6 hours"], "default": "4 hours" },
    { "key": "leftOnMinutes", "label": "Grill left on: remind after (minutes)", "type": "number", "default": 30, "min": 0, "max": 240 },
    { "key": "learning", "label": "Learn from my cooks for Ready by and done times. Off uses rules of thumb; what it learned is kept", "type": "boolean", "default": true },
    { "key": "quietStart", "label": "Quiet hours start, like 22:00", "type": "string", "default": "", "scope": "device" },
    { "key": "quietEnd", "label": "Quiet hours end, like 07:00", "type": "string", "default": "", "scope": "device" },
    { "key": "quietProblems", "label": "Grill problems still chime in quiet hours", "type": "boolean", "default": false, "scope": "device" },
    { "key": "chime", "label": "Chime on this display", "type": "boolean", "default": true, "scope": "device" },
    { "key": "lockSeconds", "label": "Lock after seconds untouched (0 = never)", "type": "number", "default": 30, "min": 0, "max": 600, "scope": "device" },
    { "key": "lockForgot", "label": "Forgot the screen lock pattern? Turn on to clear it. It turns itself back off", "type": "boolean", "default": false },
    { "key": "idleMinutes", "label": "Big numbers after idle minutes (0 = off)", "type": "number", "default": 2, "min": 0, "max": 30, "scope": "device" },
    { "key": "sampleSeconds", "label": "Graph: seconds between readings", "type": "number", "default": 15, "min": 5, "max": 60 }
  ]
}
</script>

<style>
  :root {
    /* The lines on the graph and the probe keys. On a light card these are dark enough to read against white. */
    --grill: #c2410c;
    --s0: #1d5fb8; --s1: #2f9e6c; --s2: #7c3aed; --s3: #be185d; --s4: #0e7490;
    --ink: var(--text, var(--text-color, #222));
    --ink2: var(--text-secondary, #6b6b6b);
    --line: var(--border, rgba(127,127,127,.28));
    --tile: rgba(127,127,127,.09);
    --band: rgba(127,127,127,.1);
    --warn: var(--warning, #e0a100);
    --bad: var(--hg-error, #d64545);
    --badtext: #c62828;
    --star: #9a5b12;
    --ok: #15925f;
    --radius: var(--hg-radius-md, 10px);
    --panel: var(--surface, var(--card-bg, #fff));
    --solid: linear-gradient(var(--card-bg, #FBFAF8), var(--card-bg, #FBFAF8)), #FBFAF8;
    --tabh: 56px;
  }
  :root[data-theme="dark"] {
    --grill: #e07a3f;
    --s0: #4a9be0; --s1: #6fcf9f; --s2: #b39dfa; --s3: #e58fb5; --s4: #3cc4d6;
    --ink: var(--text, var(--text-color, #ececec));
    --ink2: var(--text-secondary, #a3a3a3);
    --tile: rgba(255,255,255,.06);
    --band: rgba(255,255,255,.06);
    --badtext: #ff8a80;
    --star: var(--warning, #f5b400);
    --ok: #34c27a;
    --panel: var(--surface, var(--card-bg, #2a2a28));
    --solid: linear-gradient(var(--card-bg, #2C2A26), var(--card-bg, #2C2A26)), #2C2A26;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 0;               /* index.css pads the dashboard's body; not ours */
    min-height: 0;
    color: var(--ink);
    font-family: var(--hg-font-body, system-ui, sans-serif);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button {
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--line); background: var(--tile);
    border-radius: var(--hg-button-radius, 8px);
    padding: 6px 12px; min-height: 44px;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary {
    background: var(--hg-button-bg, var(--accent, #4a7));
    color: var(--hg-button-text, #fff);
    border-color: transparent;
    font-weight: var(--hg-button-weight, 600);
  }
  button.quiet { background: transparent; border-color: var(--hg-button-quiet-border, var(--line)); }
  button.icon { width: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  button.danger { color: var(--badtext); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  button.link { all: unset; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  button:focus-visible, .tap:focus-visible { outline: 2px solid var(--accent, #4a7); outline-offset: 2px; }
  input[type=text], input[type=search] {
    font: inherit; color: inherit; background: var(--tile); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; width: 100%; min-height: 44px;
  }
  .h, .heading {
    font-family: var(--hg-font-heading, inherit);
    text-transform: var(--hg-heading-transform, none);
    letter-spacing: var(--hg-heading-letter-spacing, normal);
  }

  /* Always a solid card, like HomeHealth and Vacuum. HomeGlow clears a plugin's page and paints its frame
     at the household's card opacity, so the card paints its own surface over a solid base, in case the
     theme's card color is see-through. The widget's own Transparent switch still clears it. */
  #app { height: 100%; display: flex; flex-direction: column; position: relative; background: var(--solid); }
  html.see-through #app { background: none; }
  html, html[data-theme] body, body { background: transparent !important; background-image: none !important; }
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 8px; position: relative; overflow: hidden; }

  /* The band: the grill, the main food, the timer (or the program's step) and when it's done. Each one opens its sheet. */
  .band { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1fr); gap: 2px; padding: 4px; border-radius: var(--radius); background: var(--band); flex: none; }
  /* Expanded to half or the whole page (HomeGlow.onExpand): the four top boxes at twice the size, in proportion */
  html.expanded .band { zoom: 2; }
  .cell { display: flex; flex-direction: column; gap: 2px; padding: 7px 10px; border-radius: calc(var(--radius) - 2px); min-width: 0; min-height: 44px; }
  .cell .lab, .chan .nm {
    display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden;
    font-family: var(--hg-font-heading, inherit); text-transform: var(--hg-heading-transform, none); letter-spacing: var(--hg-heading-letter-spacing, normal);
  }
  .cell .lab > .t, .chan .nm > .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cell .val { font-size: 24px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .val.long { font-size: 20px; line-height: 1.38; }
  .cell .val.xlong { font-size: 17px; line-height: 1.62; }
  .cell .val.muted { color: var(--ink2); font-weight: 500; }
  /* The grill's and the food's temp, with its set temp or target after it: 249°/250° */
  .cell .val.temp { font-size: 26px; }
  .cell .val.temp.long { font-size: 22px; }
  .cell .val.temp.xlong { font-size: 19px; }
  .val .of, .chan .of { font-size: .56em; font-weight: 500; color: var(--ink2); }
  .cell .sub { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.warn { background: color-mix(in srgb, var(--warn) 24%, transparent); }
  .cell.warn .sub { color: var(--ink); }
  .cell .sub.warn { color: color-mix(in srgb, var(--warn) 55%, var(--ink)); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink2); margin-right: 5px; vertical-align: 1px; }
  #status.on .dot { background: var(--ok); }
  #status.warnc .dot { background: var(--warn); }
  #status.warnc { color: var(--ink); }
  #status.badc .dot { background: var(--bad); }
  #status.badc { color: var(--badtext); font-weight: 600; }
  .parts { display: flex; gap: 4px; margin-left: auto; color: var(--ink2); flex: none; }
  /* A locked box: the lock takes the color key's place, so the name still fits next to the fan and auger */
  .cell .lab:has(.lockmark) .key { display: none; }
  .cell .lab .t { flex: 0 1 auto; }
  .parts svg { opacity: .32; width: 14px; height: 14px; }
  .parts svg.on { opacity: 1; color: var(--ink); }
  .parts:empty { display: none; }

  /* Each probe besides the main food: a slim box, only while it's plugged in */
  .chans { display: grid; gap: 6px; flex: none; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  .chans:empty { display: none; }
  .chan { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--line); min-width: 0; min-height: 44px; }
  .chan .nm { flex: 0 1 auto; }
  .chan .big { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .chan .x { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; text-align: right; }
  .chan .x.warn { color: color-mix(in srgb, var(--warn) 55%, var(--ink)); font-weight: 600; }
  .chan.dim .big { color: var(--ink2); font-weight: 500; }
  .chan.add { border-style: dashed; justify-content: center; text-align: center; color: var(--ink2); }
  .chan.add .big { color: var(--ink2); font-weight: 400; }
  .chan.add .x { flex: none; text-align: center; }
  .key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .nm .key { margin-right: 1px; }

  /* The whole cell or card opens its sheet */
  .tap { cursor: pointer; transition: background .15s; -webkit-user-select: none; user-select: none; }
  .tap:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .tap:active { background: color-mix(in srgb, var(--ink) 12%, transparent); }
  .cell.warn.tap:hover { background: color-mix(in srgb, var(--warn) 32%, transparent); }

  /* A cook plan's steps (in its sheet) */
  .plansteps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .plansteps:empty { display: none; }
  .plansteps .st { flex: none; font-size: 13px; padding: 6px 11px; border-radius: 999px; background: var(--tile); color: var(--ink2); white-space: nowrap; }
  .plansteps .st.done { color: var(--ink); }
  .plansteps .st.now { color: var(--ink); font-weight: 600; background: color-mix(in srgb, var(--accent, #4a7) 22%, transparent); box-shadow: inset 0 0 0 1.5px var(--accent, #4a7); }
  .plansteps .st.wait { background: color-mix(in srgb, var(--warn) 25%, transparent); box-shadow: inset 0 0 0 1.5px var(--warn); }
  .plansteps .grow { flex: 1 0 100%; height: 0; }
  .plansteps button { flex: none; white-space: nowrap; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--tile); color: var(--ink2); margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
  .badge.mine { background: color-mix(in srgb, var(--accent, #4a7) 20%, transparent); color: var(--ink); }
  .seg2 button.sel { border-color: var(--accent, #4a7); box-shadow: inset 0 0 0 1px var(--accent, #4a7); background: color-mix(in srgb, var(--accent, #4a7) 14%, transparent); font-weight: 600; }
  .seg2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .plan-box { background: color-mix(in srgb, var(--accent, #4a7) 14%, transparent); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .plan-box.late { background: color-mix(in srgb, var(--warn) 18%, transparent); }
  .plan-box .head { font-size: 1.25em; font-weight: 700; }
  .lines { display: grid; grid-template-columns: 1fr auto; row-gap: 4px; font-size: 14px; }
  .lines .src { color: var(--ink2); text-align: right; padding-left: 12px; }
  .lines .tot { font-weight: 600; border-top: 1px solid var(--line); padding-top: 4px; }
  .hint { display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--accent, #4a7) 14%, transparent); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  .hint span { flex: 1; }
  .list .snip { display: block; font-size: 13px; color: var(--ink); opacity: .8; overflow: hidden; text-overflow: ellipsis; }
  .list .starbtn { width: 44px; padding: 0; font-size: 1.3em; background: transparent; border-color: transparent; color: var(--ink2); }
  .list .starbtn.on { color: var(--star); }
  .list .num { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--panel); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; margin-right: 8px; }
  .list .learn { display: block; font-size: 13px; color: color-mix(in srgb, var(--accent, #4a7) 60%, var(--ink)); }
  button.tog { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
  button.tog .n { flex: 1; min-width: 0; }

  .banner { display: flex; align-items: center; gap: 8px; font-size: 14px; background: var(--band); border-radius: var(--radius); padding: 0 6px 0 12px; min-height: 44px; flex: none; }
  .banner .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner button { min-height: 40px; padding: 2px 12px; }
  .banner.bad { background: color-mix(in srgb, var(--bad) 18%, var(--band)); }
  .banner.rate .rs { display: inline-flex; flex: none; }
  .banner.rate .rs button { min-height: 44px; min-width: 32px; padding: 0 2px; font-size: 1.55em; line-height: 1; background: transparent; border-color: transparent; color: var(--star); }
  .banner.entry { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px 8px; }
  .banner.entry .top { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .banner.entry .top b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banner.entry .top .meta { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .banner.entry .steps { color: var(--ink2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banner.entry .btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .banner.entry .btns .grow { flex: 1; }
  .banner .on { color: var(--star); }
  button.soundbar { min-height: 44px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 14px; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--warn) 24%, transparent); border-color: transparent; border-radius: var(--radius); flex: none; }

  /* Under the probes: the cook's name and length, Compare, zoom and ⋯ */
  .cookline { display: flex; align-items: center; gap: 6px 8px; min-height: 44px; flex-wrap: wrap; flex: none; }
  .cl-text { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; }
  #title { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  #cookInfo { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .chiprow { display: flex; gap: 6px; align-items: center; flex: 1 1 0; min-width: 0; }
  .chiprow > .add { order: -1; }
  .chips { display: flex; gap: 6px; align-items: center; flex: 0 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
  .chips::-webkit-scrollbar { display: none; }
  .chips.fr { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); }
  .chips.fl { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px); mask-image: linear-gradient(to right, transparent, #000 28px); }
  .chips.fl.fr { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent); }
  button.pill.chip { display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 12px; background: var(--tile); }
  button.pill.add { background: var(--tile); }
  button.pill.chip .lb { font-weight: 500; }
  button.pill.chip.paused { opacity: .6; }
  button.pill.chip.done { background: color-mix(in srgb, var(--warn) 24%, transparent); border-color: transparent; }
  button.pill.add { flex: none; width: 48px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
  button.pill.add svg { flex: none; }
  .onebig { font-size: 2.2em; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; padding: 4px 0; }
  .cl-ctl { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
  .seg:empty { display: none; }
  .seg button { border: 0; border-radius: 0; min-height: 42px; padding: 0 10px; font-size: 13px; background: transparent; color: var(--ink2); }
  .seg button.sel { background: color-mix(in srgb, var(--accent, #4a7) 24%, transparent); color: var(--ink); font-weight: 600; }
  .seg button.now { color: var(--ink); font-weight: 600; }
  button.pill { min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 13px; background: transparent; border: 1px solid var(--line); white-space: nowrap; flex: none; }
  button.pill.on { background: color-mix(in srgb, var(--accent, #4a7) 24%, transparent); border-color: transparent; font-weight: 600; }
  button.round { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--ink2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  button.round:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }

  .chartwrap { flex: 1; min-height: 120px; position: relative; display: flex; flex-direction: column; gap: 4px; }
  .plot { flex: 1; position: relative; min-height: 100px; }
  canvas.overview { position: static; display: block; width: 100%; height: 30px; flex: none; cursor: grab; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .readout {
    position: absolute; top: 4px; pointer-events: none;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 9px; font-size: 13px; line-height: 1.45;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); display: none; white-space: nowrap; z-index: 2;
  }
  .readout b { font-variant-numeric: tabular-nums; }
  .readout .k { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin-right: 6px; vertical-align: middle; }
  .readout .t { color: var(--ink2); }
  .readout .mk { color: var(--ink); font-style: italic; }
  /* No cook going: what's next, and the last cook */
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: var(--ink2); font-size: 15px; padding: 10px; overflow: auto; }
  .empty > :first-child { margin-top: auto; }
  .empty > :last-child { margin-bottom: auto; }
  .empty .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .empty .lastcook { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; max-width: 420px; padding: 10px 12px; background: var(--band); border: 0; border-radius: var(--radius); color: var(--ink); }
  .empty .lastcook .n { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .empty .lastcook small { font-size: 13px; color: var(--ink2); }
  .empty .lastcook b { font-size: 15px; }
  .empty .lastcook .stars { color: var(--star); white-space: nowrap; }
  .empty .plan-box { width: 100%; max-width: 440px; text-align: left; color: var(--ink); }

  /* Cook · Journal · Plans · Setup */
  .tabbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); height: var(--tabh); flex: none; position: relative; z-index: 6; }
  .tabbar button {
    border: 0; border-radius: 0; background: transparent; min-height: 0; padding: 0; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink2); font-size: 13px;
    font-family: var(--hg-font-heading, inherit); text-transform: var(--hg-heading-transform, none); letter-spacing: var(--hg-heading-letter-spacing, normal);
  }
  .tabbar button:active { transform: none; background: color-mix(in srgb, var(--ink) 8%, transparent); }
  .tabbar button.on { color: var(--ink); font-weight: 600; }
  .tabbar button.on svg { color: var(--accent, #4a7); }
  .tabbar button.on::before { content: ''; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent, #4a7); }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* A short card (a Nest Hub, a small tile): everything a little tighter so the graph keeps some room */
  @media (max-height: 460px) {
    :root { --tabh: 46px; }
    .tabbar button { flex-direction: row; gap: 7px; }
    .tabbar svg { width: 18px; height: 18px; }
    .page { padding: 8px 10px 6px; gap: 6px; }
    .cell { padding: 4px 8px; min-height: 0; }
    .cell .val { font-size: 20px; }
    .cell .val.temp { font-size: 22px; }
    .chartwrap { min-height: 60px; }
    .plot { min-height: 0; }
  }

  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
  .sheet {
    position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: calc(100% - 16px); overflow: auto;
    background: var(--panel); color: var(--ink);
    border-radius: var(--hg-radius-lg, 14px); padding: 14px; box-shadow: 0 6px 30px rgba(0,0,0,.3);
    display: flex; flex-direction: column; gap: 12px;
  }
  .sheet h4 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .sheet h5 { margin: 4px 0 0; font-size: 14px; color: var(--ink2); font-weight: 600; }
  /* Journal, Plans and Setup: the same sheets, as a page above the tabs */
  .sheet-bg.docked { bottom: var(--tabh); background: none; z-index: 5; }
  .sheet-bg.docked .sheet { inset: 0; max-height: none; border-radius: 0; box-shadow: none; background: var(--solid); padding: 14px 14px 12px; }
  html.see-through .sheet-bg.docked .sheet { background: none; }
  .sheet.root > h4 { font-size: 18px; min-height: 44px; }
  #app.docked .page { visibility: hidden; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .stepper .val { font-size: 2.2em; font-weight: 600; min-width: 3.6em; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper button { width: 52px; height: 52px; font-size: 1.4em; border-radius: 50%; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .presets.left { justify-content: flex-start; }
  .presets button { min-width: 52px; }
  .presets button.sel { border-color: var(--accent, #4a7); box-shadow: inset 0 0 0 1px var(--accent, #4a7); }
  .hm { display: flex; justify-content: center; gap: 18px; }
  .hm .stepper .val { min-width: 2.2em; }
  .hm small { display: block; text-align: center; color: var(--ink2); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
  .actions .grow { flex: 1; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .list .item { display: flex; gap: 6px; align-items: stretch; }
  .list .item > button:first-child { flex: 1; min-width: 0; }
  .list button.row { text-align: left; display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 9px 12px; background: var(--band); border-color: transparent; border-radius: var(--radius); }
  .list button.sel { border-color: var(--accent, #4a7); box-shadow: inset 0 0 0 1px var(--accent, #4a7); }
  .list .v { color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14px; }
  .list .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .list .id { display: block; font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; }
  .list .chev { color: var(--ink2); flex: none; display: inline-flex; }
  .note { font-size: 13px; color: var(--ink2); margin: 0; line-height: 1.4; }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: color-mix(in srgb, var(--ink2) 40%, transparent); position: relative; flex: none; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
  .switch.on { background: var(--accent, #4a7); }
  .switch.on::after { left: 21px; }
  /* Grill and probes → Adjust readings, and the folded More */
  .offsets { display: flex; flex-direction: column; }
  .offrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .offrow:last-child { border-bottom: 0; }
  .offrow .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .offrow .id { display: block; font-size: 13px; color: var(--ink2); }
  .offrow .stepper { gap: 6px; flex: none; }
  .offrow .stepper .val { font-size: 1.1em; min-width: 3em; }
  .offrow .stepper button { width: 44px; height: 44px; font-size: 1.15em; }
  .morebtn { margin-top: 12px; width: 100%; text-align: left; }
  /* Setup → Phone alerts: the phones, then a row for each kind of alert */
  .phonesbox { display: flex; flex-direction: column; gap: 6px; }
  .phonechips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .phonechips button { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 0 14px 0 10px; font-size: 14px; }
  .phonechips button.sel { border-color: var(--accent, #4a7); box-shadow: inset 0 0 0 1px var(--accent, #4a7); background: color-mix(in srgb, var(--accent, #4a7) 14%, transparent); font-weight: 600; }
  .phonechips .tick { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--ink2); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; flex: none; }
  .phonechips .sel .tick { background: var(--accent, #4a7); border-color: var(--accent, #4a7); color: var(--hg-button-text, #fff); }
  .loudtxt { color: color-mix(in srgb, var(--warn) 55%, var(--ink)); }
  .needbox { background: color-mix(in srgb, var(--warn) 16%, transparent); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .palerts { display: flex; flex-direction: column; gap: 4px; }
  .prow { display: flex; align-items: center; gap: 6px; min-height: 50px; padding: 3px 6px 3px 12px; border-radius: var(--radius); background: var(--band); }
  .prow .n { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .prow .n b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .n small { font-size: 13px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .n small.loud { color: color-mix(in srgb, var(--warn) 55%, var(--ink)); font-weight: 600; }
  .prow button { min-height: 44px; flex: none; padding: 0 10px; font-size: 13px; }
  .prow button.psw { display: inline-flex; align-items: center; gap: 6px; border-color: transparent; background: transparent; padding: 0 4px; color: var(--ink2); }
  .prow button.scr { width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; color: var(--ink2); }
  .palerts.noapi .prow button.scr { width: 190px; }
  @media (max-width: 440px) { .prow { flex-wrap: wrap; padding: 6px 6px 6px 12px; } .prow .n { flex-basis: 100%; } .prow button.scr, .palerts.noapi .prow button.scr { flex: 1 1 0; width: auto; min-width: 0; } }
  textarea { font: inherit; color: inherit; background: var(--tile); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-height: 6em; resize: vertical; }
  .stars { display: flex; gap: 4px; justify-content: center; }
  .stars button { font-size: 1.8em; width: 52px; height: 52px; padding: 0; border: 0; background: transparent; color: var(--ink2); line-height: 1; }
  .stars button.on { color: var(--star); }
  .hold { position: relative; overflow: hidden; }
  .hold .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--bad) 30%, transparent); pointer-events: none; }
  .hold.go .fill { width: 100%; transition: width 2s linear; }
  .hold span { position: relative; }

  /* ⋯: what you might do to this cook */
  .menu-scrim { position: absolute; inset: 0; z-index: 14; }
  .menu {
    position: absolute; right: 12px; z-index: 15; width: min(300px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 6px; display: flex; flex-direction: column;
  }
  .menu > button { border: 0; background: transparent; text-align: left; min-height: 44px; padding: 6px 12px; border-radius: 8px; font-size: 15px; display: flex; flex-direction: column; justify-content: center; align-items: stretch; }
  .menu > button:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .menu > button small { font-size: 13px; color: var(--ink2); }
  .menu > button.danger { color: var(--badtext); font-weight: 600; }
  .menu .mnote { font-size: 13px; color: var(--ink2); padding: 8px 12px; line-height: 1.4; display: flex; gap: 6px; align-items: center; }

  .alert {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    border-radius: var(--radius); text-align: center; padding: 16px;
    animation: pulse 1s ease-in-out infinite alternate;
  }
  .alert.bad { --pulse: var(--bad); }
  .alert { --pulse: var(--warn); }
  .alert .box { background: var(--panel); padding: 14px 20px; border-radius: 14px; max-width: 92%; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
  .alert .msg { font-size: 1.5em; font-weight: 700; }
  .alert .why { font-size: 15px; color: var(--ink2); margin-top: 6px; line-height: 1.45; }
  .alert .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .alert .btns button { font-size: 1.05em; padding: 10px 20px; }
  .alert .more { font-size: 13px; color: var(--ink); background: var(--panel); border-radius: 999px; padding: 2px 10px; }
  .alert .more:empty { display: none; }
  @keyframes pulse { from { background: color-mix(in srgb, var(--pulse) 12%, transparent); } to { background: color-mix(in srgb, var(--pulse) 50%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .alert { animation: none; background: color-mix(in srgb, var(--pulse) 35%, transparent); } }

  .msgbox { margin: auto; text-align: center; color: var(--ink2); max-width: 34em; line-height: 1.5; }
  .toast { position: absolute; left: 50%; bottom: calc(var(--tabh) + 12px); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 14px; display: none; align-items: center; gap: 12px; z-index: 30; box-shadow: 0 2px 10px rgba(0,0,0,.15); max-width: 90%; }
  .toast button { min-height: 40px; padding: 2px 12px; font-weight: 600; color: var(--ink); border-color: var(--accent, #4a7); background: transparent; white-space: nowrap; }

  [hidden] { display: none !important; }
  .lockmark { margin-left: auto; display: inline-flex; opacity: .7; flex: none; }
  .lockglyph { color: var(--ink2); display: inline-flex; align-items: center; flex: none; }

  /* Screen lock: a clear cover over the card that takes every tap; a tap brings up the 3×3 pattern */
  .lock { position: absolute; inset: 0; z-index: 40; }
  .lock .lockpanel { display: none; }
  .lock.open { background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 8px; }
  .lock.open .lockpanel { display: flex; flex-direction: column; gap: 4px; align-items: center; max-height: 100%; background: var(--panel); color: var(--ink); border-radius: 16px; padding: 10px 18px 12px; box-shadow: 0 6px 30px rgba(0,0,0,.3); }
  .lockhead { font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: center; }
  .lockhint { font-size: 14px; color: var(--ink2); min-height: 1.35em; text-align: center; }
  .lockhint.bad, .padhint.bad { color: var(--badtext); font-weight: 600; }
  /* The 3×3 dots, drawn through like a phone's unlock pattern */
  .pad { --pc: var(--accent, #4a7); position: relative; width: var(--pad, 220px); height: var(--pad, 220px); flex: none; touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
  .pad svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .pad .dot { fill: var(--ink2); transition: r .12s; }
  .pad .ring { fill: transparent; stroke: transparent; stroke-width: 3; }
  .pad .on .dot { fill: var(--pc); r: 11px; }
  .pad .on .ring { stroke: var(--pc); fill: color-mix(in srgb, var(--pc) 14%, transparent); }
  .pad .path { fill: none; stroke: var(--pc); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
  .pad.ok { --pc: #2e9e5b; }
  .pad.bad { --pc: var(--bad); }
  .pad.off { opacity: .3; pointer-events: none; }
  .pad.shake { animation: shake .36s; }
  @keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { .pad.shake { animation: none; } .pad .dot { transition: none; } }
  #lockPadHost .pad { --pad: clamp(120px, min(250px, calc(100vh - 96px), calc(100vw - 72px)), 250px); }
  .lock .mutebtn { width: 100%; min-height: 44px; margin-top: 4px; }
  .lock .lockpanel.withmute #lockPadHost .pad { --pad: clamp(110px, min(250px, calc(100vh - 150px), calc(100vw - 72px)), 250px); }
  .padwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 6px 0 10px; }
  .padwrap .pad { --pad: clamp(150px, min(230px, calc(100vw - 80px)), 230px); }
  .padhint { font-weight: 600; text-align: center; min-height: 1.4em; }

  /* Food and doneness */
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5em, 1fr)); gap: 6px; }
  .opt { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; padding: 7px 10px; }
  .opt b { font-weight: 600; }
  .opt small { color: var(--ink2); font-size: 13px; }
  .opt .usual { font-size: 12px; color: color-mix(in srgb, var(--accent, #4a7) 60%, var(--ink)); font-weight: 600; }
  .opt.sel { border-color: var(--accent, #4a7); box-shadow: inset 0 0 0 1px var(--accent, #4a7); background: color-mix(in srgb, var(--accent, #4a7) 14%, transparent); }
  .usda { font-size: 13px; color: color-mix(in srgb, var(--warn) 45%, var(--ink)); margin: 0; }
  .remrow { display: flex; align-items: center; gap: 6px; background: var(--tile); border-radius: 8px; padding: 6px 6px 6px 10px; }
  .remrow .n { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .remrow .n small { color: var(--ink2); font-size: 13px; }
  .remrow button { min-height: 40px; padding: 2px 12px; }
  .editbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .editbox .edhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .editbox .edhead small { color: var(--ink2); font-size: 13px; }
  /* The timer and food sheets fit a wall display's card without scrolling: rows share a line where they can */
  .sheet.tight { gap: 10px; }
  .trow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 44px; }
  .trow h5 { flex: 1 1 auto; margin: 0; }
  .trow button { min-height: 44px; padding: 0 12px; }
  .hm { align-items: flex-start; flex-wrap: wrap; }
  .hm > button { align-self: center; min-height: 46px; padding: 0 16px; }
  .sheet.tight .hm { gap: 12px; }
  .sheet.tight .hm .stepper { gap: 6px; }
  .sheet.tight .hm .stepper button { width: 46px; height: 46px; font-size: 1.25em; }
  .sheet.tight .hm .stepper .val { font-size: 1.9em; min-width: 1.9em; }
  .sheet.tight .presets { gap: 5px; }
  .sheet.tight .presets button { min-width: 44px; padding: 0 9px; }
  button.wide small { color: var(--ink2); font-size: 13px; margin-left: 8px; }
  .editbare { display: flex; flex-direction: column; gap: 10px; }
  .sheet.tight .editbox .presets, .sheet.tight .editbare .presets { gap: 4px; }
  .sheet.tight .editbox .presets button, .sheet.tight .editbare .presets button { min-width: 40px; padding: 0 7px; }
  .inrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .inrow input { flex: 1 1 180px; min-width: 0; }
  .inrow button { min-height: 44px; }
  .tgtrow { display: flex; gap: 10px 24px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .tgtbox { display: flex; align-items: center; gap: 10px; }
  .tgtbox .tl { font-size: 14px; color: var(--ink2); font-weight: 600; }
  .tgtbox .note { max-width: 18em; }
  .tgtbox .stepper { gap: 6px; }
  .tgtbox .stepper .val { font-size: 1.7em; min-width: 2.7em; }
  .tgtbox .stepper button { width: 46px; height: 46px; font-size: 1.25em; }
  button.wide { width: 100%; min-height: 44px; text-align: left; padding: 0 12px; }

  /* Big numbers: the main food as big as the card allows, for reading across the yard. Any tap comes back. */
  .yard { position: absolute; inset: 0; z-index: 8; display: none; flex-direction: column; gap: 4px; padding: clamp(12px, 4vmin, 26px); cursor: pointer; background: var(--solid); color: var(--ink); overflow: hidden; }
  html.see-through .yard { background: none; }
  #app.yard .yard { display: flex; }
  #app.yard .page, #app.yard .tabbar { visibility: hidden; }
  .yhead { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .ylab { display: flex; align-items: center; gap: 8px; font-size: clamp(14px, 4.4vmin, 24px); color: var(--ink2); white-space: nowrap; overflow: hidden; min-width: 0;
    font-family: var(--hg-font-heading, inherit); text-transform: var(--hg-heading-transform, none); letter-spacing: var(--hg-heading-letter-spacing, normal); }
  .ylab .key { width: clamp(14px, 4vmin, 22px); height: clamp(3px, .9vmin, 5px); }
  .yhuge { font-size: clamp(56px, min(34vh, 30vw), 230px); font-weight: 700; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ysub { font-size: clamp(15px, 5vmin, 30px); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .yrow { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; margin-top: auto; }
  .yrow > div { min-width: 0; }
  .ybig { font-size: clamp(22px, min(8vmin, calc((100vw - 60px) / var(--n, 3) / 4.2)), 52px); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ysound { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: color-mix(in srgb, var(--warn) 26%, transparent); color: var(--ink); font-size: clamp(13px, 3.4vmin, 16px); font-weight: 600; white-space: nowrap; margin-left: auto; flex: none; }

  /* Viewing a cook from the journal: its graph, its banner, nothing live */
  #app.viewing .band, #app.viewing .chans, #app.viewing #limitNote, #app.viewing #offBar, #app.viewing #soundChip, #app.viewing #more { display: none !important; }

  /* Phones and other narrow cards */
  @media (max-width: 440px) {
    .page { padding: 10px 10px 6px; gap: 7px; overflow-y: auto; }
    .chartwrap { flex: 1 0 240px; }
    .band { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cell .val { font-size: 21px; }
  }
  @media (min-width: 700px) {
    .cell .val { font-size: 26px; }
  }
</style>

<body>
<div id="app">
  <div class="page" id="page">
    <div id="main" style="display:contents">
      <div class="band" id="band">
        <div class="cell" id="grillTile">
          <span class="lab"><span class="key" style="background:var(--grill)"></span><span class="t" id="grillLab">Grill</span><span class="parts" id="parts"></span></span>
          <span class="val temp" id="grillVal">--</span>
          <span class="sub" id="status"><span class="dot"></span><span id="statusText">…</span></span>
        </div>
        <div class="cell" id="foodTile">
          <span class="lab"><span class="key" style="background:var(--s0)"></span><span class="t" id="foodLabel">Food</span></span>
          <span class="val temp" id="foodTemp">--</span>
          <span class="sub" id="foodEta"></span>
        </div>
        <div class="cell" id="timerTile">
          <span class="lab"><span class="t" id="timerLabel">Timer</span></span>
          <span class="val" id="timerText">0:00</span>
          <span class="sub" id="timerSub"></span>
        </div>
        <div class="cell" id="readyTile">
          <span class="lab"><span class="t" id="readyLab">Ready by</span></span>
          <span class="val" id="readyVal">—</span>
          <span class="sub" id="readySub"></span>
        </div>
      </div>

      <button type="button" class="soundbar" id="soundChip" hidden title="Browsers keep a page quiet until someone taps it">🔇 Tap here for sound. Alerts can’t chime until the card is tapped.</button>
      <div class="banner" id="limitNote" hidden></div>
      <div class="banner bad" id="offBar" hidden><span class="grow" id="offText"></span></div>

      <!-- A slim box for each probe besides the main food, only while it's plugged in -->
      <div class="chans" id="chans"></div>

      <div class="banner" id="banner" style="display:none"></div>

      <div class="cookline">
        <div class="cl-text">
          <h3 class="h" id="title">Grill</h3>
          <span class="lockglyph" id="lockGlyph" hidden title="Locked. Tap the card, then draw the pattern to unlock."></span>
          <span id="cookInfo"></span>

  function openLearned() {
    var ls = learnOn();
    openSheet(function (sh) {
      sh.appendChild(heading('What your grill has learned'));
      var on = learningOn();
      sh.appendChild(el('div', { className: 'list' }, [can.temps
        ? toggleRow('Learn from my cooks', on ? 'On: Ready by and done times use your own cooks' : 'Off: rules of thumb only, and nothing new is recorded', on, function () { setLearning(!on).then(openLearned); })
        : el('p', { className: 'note', textContent: on ? 'Learning is on.' : 'Learning is off.' })]));
      if (!on) {
        sh.appendChild(el('p', { className: 'note', textContent: 'What it learned before is kept, and comes back when you turn learning on again.' }));
        sh.appendChild(el('div', { className: 'actions' }, [el('button', { className: 'quiet', textContent: 'Back', on: { click: closeSheet } })]));
        return;
      }
      sh.appendChild(el('p', { className: 'note', textContent: 'From the cooks in your Grill journal. It uses the middle of your last 5 or so, so one odd day doesn’t throw it off, and trusts something once it has 2 cooks of it.' }));
      var box = function (pairs) { var b = el('div', { className: 'lines', style: 'background:var(--tile);border-radius:8px;padding:8px 10px' }); pairs.forEach(function (p) { b.appendChild(typeof p[0] === 'string' ? el('span', { textContent: p[0] }) : p[0]); b.appendChild(typeof p[1] === 'string' ? el('span', { className: 'src', textContent: p[1] }) : p[1]); }); return b; };
      var any = false;
      // Warm-up, grouped by set temp
      var buckets = {};
      ls.filter(function (e) { return e.warm; }).forEach(function (e) { var k = Math.round(e.warm.set / 25) * 25; (buckets[k] = buckets[k] || { all: [], mild: [] }).all.push(e.warm.mins); if (mild(e)) buckets[k].mild.push(e.warm.mins); });
      Object.keys(buckets).forEach(function (k) { buckets[k] = buckets[k].mild.length >= 2 ? buckets[k].mild : buckets[k].all; });
      var keys = Object.keys(buckets).map(Number).sort(function (a, b) { return a - b; });
      if (keys.length) {
        any = true;
        sh.appendChild(el('h5', { textContent: 'Warm-up' }));
        sh.appendChild(box(keys.map(function (k) { var xs = buckets[k].slice(0, 5); return ['To ' + deg(Math.round(tF(k) / 5) * 5), xs.length >= 2 ? fmtDur(median(xs) * 60000) + ' · ' + buckets[k].length + ' cooks' : fmtDur(xs[0] * 60000) + ' · 1 cook, needs 2']; })));
      }
      // Plans
      var pairs = [];
      S.plans.forEach(function (p) {
        var mine = ls.filter(function (e) { return e.lid === p.lid && arr(e.steps).length; });
        if (!mine.length) return;
        var pi = planIn(p);
        if (mine.length < 2) { pairs.push([p.name, 'Rule of thumb · 1 cook']); return; }
        pi.steps.forEach(function (st, i) {
          var u = stepStats(p.lid, i, st, null), w = st.end === 'temp' ? stepStats(p.lid, i, st, 1) : null;
          if (!u) return;
          pairs.push([p.name + ': ' + st.name + (st.end === 'temp' ? ' to ' + deg(st.temp) : ''), (w && w.rate ? fmtRate(w.rate) : fmtDur(u.mins * 60000)) + ' · ' + u.n + ' cooks']);
        });
        var sf = stallFor(p.lid);

      if (pairs.length) { any = true; sh.appendChild(el('h5', { textContent: 'Programs' })); sh.appendChild(box(pairs)); }
      // Rise while resting
      var rises = [];
      S.plans.forEach(function (p) {
        var pf = foodById(p.food); if (pf && pf.poultry) return;   // poultry never pulls early
        var c = carryFor(p.lid); if (!c) return;
        var cur = p.pullEarly !== null ? p.pullEarly : pullDefault(), want = Math.round(isC() ? c.deg * 5 / 9 : c.deg);
        var right = Math.abs(cur - want) < 2 ? 'matches its heads-up' : (can.temps ? el('button', { textContent: 'Set heads-up to ' + want + '°', on: { click: function () {
          savePlans(S.plans.map(function (x) { return x.id === p.id ? Object.assign({}, x, { pullEarly: want }) : x; })).then(function () { toast(p.name + ': heads-up ' + want + '° before the target'); openLearned(); });
        } } }) : 'heads-up is ' + cur + '°');
        rises.push([p.name + ' climbs about ' + want + '°', right]);
      });
      if (rises.length) { any = true; sh.appendChild(el('h5', { textContent: 'Rise while resting' })); sh.appendChild(box(rises)); }
      // Outdoor
      sh.appendChild(el('h5', { textContent: 'Outdoor temperature' }));
      var cf = coldFactor();
      if (!settingId('outdoor')) sh.appendChild(el('p', { className: 'note', textContent: 'Pick an outdoor temperature in Setup → Grill and probes, and each cook records it so this can learn how cold slows your grill.' }));
      else if (!cf) sh.appendChild(el('p', { className: 'note', textContent: 'Needs 2 cooks below ' + deg(tF(40)) + ' to compare with milder days.' }));
      else {

        if (op.length) sh.appendChild(box(op));

      sh.appendChild(el('p', { className: 'note', textContent: 'Leave a cook out with “Learn from this cook” in the Grill journal. Learning only covers time the card was recording, and the rise while resting needs the probe left in.' }));

    });
  }

  });
  function markTiles() {
    Array.prototype.forEach.call(document.querySelectorAll('#band .cell, #chans .chan'), function (t) {
      var id = t.id || 'probe', ok = tileOk(id), host = t.querySelector('.lab, .nm'), lm = t.querySelector('.lockmark');
      t.classList.toggle('tap', ok);
      if (!ok && !can.temps && !lm && host) host.appendChild(lockIcon('lockmark', 'Locked on this display'));
      else if (ok && lm) lm.remove();
      var words = (id === 'timerTile' ? (progOn() ? 'The program’s steps' : 'Timer and reminders') : TILE_WORDS[id]) || ((S.slots[Number(t.dataset.slot)] || {}).name || 'Probe') + ': what’s cooking and its target';
      if (ok) { t.setAttribute('role', 'button'); t.tabIndex = 0; t.setAttribute('aria-label', t.textContent.replace(/\s+/g, ' ').trim() + '. ' + words); }
      else { t.removeAttribute('role'); t.removeAttribute('tabindex'); t.removeAttribute('aria-label'); }
    });
  }
  function lockIcon(cls, title) {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'), body = document.createElementNS(ns, 'rect'), loop = document.createElementNS(ns, 'path');
    svg.setAttribute('viewBox', '0 0 16 16'); svg.setAttribute('width', '13'); svg.setAttribute('height', '13'); svg.setAttribute('aria-hidden', 'true');
    body.setAttribute('x', '3'); body.setAttribute('y', '7'); body.setAttribute('width', '10'); body.setAttribute('height', '7.5'); body.setAttribute('rx', '1.6'); body.setAttribute('fill', 'currentColor');
    loop.setAttribute('d', 'M5.2 7V5.2a2.8 2.8 0 0 1 5.6 0V7'); loop.setAttribute('fill', 'none'); loop.setAttribute('stroke', 'currentColor'); loop.setAttribute('stroke-width', '1.6');
    svg.appendChild(body); svg.appendChild(loop);
    var span = el('span', { className: cls, title: title || '' }); span.appendChild(svg);
    return span;
  }
  $('more').addEventListener('click', openMore);
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (!can.temps) { toast('Temps, timers and cooks are locked on this display.'); return; }
    if (b.dataset.kind === 'add') openNewTimerSheet(); else openCountdown(b.dataset.kind, b.dataset.key);
  });
  $('chipList').addEventListener('scroll', fadeChips, { passive: true });
  // A mouse wheel slides the boxes sideways.
  $('chipList').addEventListener('wheel', function (e) {
    var box = $('chipList');
    if (box.scrollWidth > box.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) { box.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive: false });
  // The tap itself turns sound on (the pointerdown above); this says so with a chime.
  $('soundChip').addEventListener('click', function () {
    unlockAudio();
    setTimeout(function () { if (audio && audio.state === 'running') { chime(false); toast('Sound’s on'); } else toast('This browser still won’t play sound. The Grill guide says how to allow it.'); paintSound(); }, 250);
  });

  // ---------- start ----------
  function loadSettings() { return HG.settings.get().then(function (s) { S.settings = s || {}; resolve(); if (S.settings.lockForgot === true) forgetLock(); }).catch(function () {}); }
  function loadShared() {
    return Promise.all([
      loadMeta().catch(function () {}),
      loadPlans().catch(function () {}),
      HG.storage.get('usual').then(function (u) { S.usual = u && typeof u === 'object' && !Array.isArray(u) ? u : {}; }).catch(function () {}),
      loadLearn().catch(function () {}),
      loadProbeSetup().catch(function () {}),
      loadLock().catch(function () {}),
      loadSetup().catch(function () {}),
      loadJournal().catch(function () {}),
      HG.storage.get('aim').then(function (a) { S.aim = a && num(a.value); }).catch(function () {}),
      loadMarks().catch(function () {}),
    ]);
  }
  if (!HG || !HG.homeAssistant) {
    $('msgbox').textContent = 'This HomeGlow is too old for the Grill card (it needs Home Assistant for plugins).';
    $('msgbox').style.display = 'block'; $('main').style.display = 'none';
    return;
  }
  if (HG.onTheme) HG.onTheme(function () { render(); });
  // Double-tapped to half or the whole page: the top boxes grow (a HomeGlow without expanding never calls this).
  if (typeof HG.onExpand === 'function') HG.onExpand(function (size) {
    var big = size === 'half' || size === 'full';
    if (document.documentElement.classList.contains('expanded') === big) return;
    document.documentElement.classList.toggle('expanded', big);
    try { render(); } catch (e) { /* not started yet: the first render picks it up */ }
  });
  HG.on('ha.state', function () { poll(); });

  makeAudio();
  loadSettings().then(function () {
    return Promise.all([loadSession().catch(function () {}), loadTimers().catch(function () {}), loadSetup().catch(function () {})]);
  }).then(loadShared).then(function () { S.booted = true; poll(); scheduleRecording(); render(); restoreCompare(); });

  setInterval(function () { if (document.visibilityState === 'visible') poll(); }, 2000);
  setInterval(function () { renderTicks(); renderProbesTick(); tickPlan(); tickAlerts(); checkYard(); checkLock(); retryAudio(); paintSound(); }, 500);
  // Timers, Ready by and the cook's plan, shared with the other displays.
  setInterval(function () {
    Promise.all([loadTimers(), loadMeta()]).then(function () { render(); tickAlerts(); }).catch(function () {});
    loadLock().catch(function () {});
    refreshAcks();
  }, 4000);
  setInterval(function () {
    loadSettings().then(render);
    loadSession().then(function () { scheduleRecording(); return loadShared(); }).then(function () { render(); restoreCompare(); }).catch(function () {});
  }, 20000);
  // Every 10 seconds, so done-time estimates and stall minutes move even when no temp changed.
  var tickCount = 0;
  function renderProbesTick() { tickCount = (tickCount + 1) % 20; if (tickCount === 0 && S.ha) render(); }
})();
</script>
</body>
</html>
