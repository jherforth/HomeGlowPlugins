               '<span class="spacer"></span>' +
               '<button class="btn" data-edit="' + esc(r.id) + '">Edit</button>' +
               '<button class="btn' + (state.pendingDelete === r.id ? ' danger' : '') + '" data-delete="' + esc(r.id) + '">' +
               (state.pendingDelete === r.id ? 'Confirm delete' : 'Delete') + '</button></div>';
        });
        h += '</div>';
      }

      // New routine
      var editing = state.editing ? findRoutine(state.editing) : null;
      h += '<div class="section" id="routineForm"><h2>' + (editing ? 'Edit routine' : 'New routine') + '</h2>';
      if (editing) {
        h += '<p class="help">Changes apply from today. Its history and streak carry on.</p>';
      }
      h += field('Name',
        '<div class="row">' + iconButton2('routinePicker', draft.routineIcon) +
        '<input type="text" id="rName" class="grow" placeholder="Morning routine" value="' + esc(draft.name) + '"></div>' +
        pickerHtml('routinePicker', 'data-routineicon', draft.routineIcon));

      var people = '<select id="rUser">';
      state.users.forEach(function (u) {
        people += '<option value="' + u.id + '"' + (u.id === draft.userId ? ' selected' : '') + '>' + esc(u.username) + '</option>';
      });
      h += field('For', people + '</select>');

      var byCalendar = draft.trigger === 'calendar';
      var when = '<div class="row">' +
        '<span class="pill ' + (byCalendar ? '' : 'on') + '" data-trigger="days">On these days</span>' +
        '<span class="pill ' + (byCalendar ? 'on' : '') + '" data-trigger="calendar">\u{1F4C5} On calendar events</span></div>';
      when += '<div class="row" id="daysRow" style="margin-top:8px' + (byCalendar ? ';display:none' : '') + '">';
      DAY_NAMES.forEach(function (d, i) {
        when += '<span class="pill ' + (draft.days.indexOf(i) !== -1 ? 'on' : '') + '" data-day="' + i + '">' + d + '</span>';
      });
      when += '</div>';
      when += '<div id="calendarRows"' + (byCalendar ? '' : ' style="display:none"') + '>';
      when += field('Event title contains',
        '<div class="row"><input type="text" id="rMatch" class="grow" placeholder="Soccer" value="' + esc(draft.match) + '">' +
        '<label class="check"><input type="checkbox" id="rWhole"' + (draft.wholeWord ? ' checked' : '') + '> Whole words</label></div>',
        'Whole words keeps "France" from matching "Francesca".');
      when += field('Due',
        '<div class="row"><input type="number" id="rLead" min="0" max="720" value="' + esc(draft.lead) + '">' +
        '<span class="inline">minutes before the event starts</span></div>',
        'All-day events use the time below instead.');
      if (state.sources.length > 1) {
        var cals = '<div class="row">';
        state.sources.forEach(function (src) {
          cals += '<span class="pill ' + (draft.sources.indexOf(src.id) !== -1 ? 'on' : '') + '" data-source="' + src.id + '">' + esc(src.name) + '</span>';
        });
        when += field('Calendars', cals + '</div>', 'None picked means every calendar.');
      }
      when += '<p class="help">Looks ' + CAL_LOOKAHEAD_DAYS + ' days ahead. A display showing Routines picks up new events within minutes.</p>';
      when += '</div>';
      h += field('When', when);

      var stepPills = '<div class="row">';
      state.library.forEach(function (s) {
        stepPills += '<span class="pill ' + (draft.steps.indexOf(s.id) !== -1 ? 'on' : '') +
                     '" data-pick="' + esc(s.id) + '">' + (s.icon || '') + ' ' + esc(s.label) + '</span>';
      });
      stepPills += '</div>';
      h += field('Steps', state.library.length ? stepPills : '<p class="muted" style="margin:0">Add a step above first.</p>',
        state.library.length ? 'Tap to include, in the order they should be done.' : '');

      h += field('Time <span style="font-weight:400;opacity:0.7">(optional)</span>',
        '<div class="row"><input type="time" id="rStart" value="' + esc(draft.startTime) + '"><span class="inline">to</span>' +
        '<input type="time" id="rEnd" value="' + esc(draft.endTime) + '"></div>',
        'The start time orders the list; nothing fires at it. The end time decides whether a finish counts as on time.');

      h += field('Reward',
        '<div class="row"><span class="inline">Every</span>' +
        '<input type="number" id="rThreshold" min="0" max="365" value="' + esc(draft.threshold) + '">' +
        '<span class="inline">days in a row, worth</span>' +
        '<input type="number" id="rClams" min="0" max="999" value="' + esc(draft.milestoneClams) + '">' +
        '<span class="inline">clams</span></div>',
        'Steps never pay out on their own. Set either to 0 for no reward.');

      h += '<div class="actions"><button class="btn primary" id="createRoutine">' + (editing ? 'Save changes' : 'Create routine') + '</button>' +
           (editing ? '<button class="btn" id="cancelEdit">Cancel</button>' : '') + '</div>';
      h += '</div>';

      view.innerHTML = h;
    }

    // ---------- events ----------

    // Put an armed Delete back, in place, without re-rendering the form.
    function disarmDelete() {
      if (!state.pendingDelete) return;
      var armed = document.querySelector('[data-delete="' + state.pendingDelete + '"]');
      if (armed) {
        armed.textContent = 'Delete';
        armed.classList.remove('danger');
      }
      state.pendingDelete = null;
    }

    document.addEventListener('click', function (ev) {
      var el;
      if (state.pendingDelete && !ev.target.closest('[data-delete]')) disarmDelete();

      if ((el = ev.target.closest('[data-step]'))) {
        var r = findRoutine(el.getAttribute('data-for'));
        if (r) toggleStep(r, el.getAttribute('data-step'));
        return;
      }
      if ((el = ev.target.closest('[data-toggle]'))) {
        var id = el.getAttribute('data-toggle');
        state.expanded[id] = !state.expanded[id];
        render();
        return;
      }
      // Toggle in place rather than re-rendering: a re-render would wipe
      // whatever has been typed into the label field beside the picker.
      if ((el = ev.target.closest('[data-iconbtn]'))) {
        var grid = document.getElementById(el.getAttribute('data-iconbtn'));
        if (grid) grid.hidden = !grid.hidden;
        return;
      }
      if ((el = ev.target.closest('[data-stepicon], [data-routineicon]'))) {
        var isStep = el.hasAttribute('data-stepicon');
        var value = el.getAttribute(isStep ? 'data-stepicon' : 'data-routineicon');
        var already = el.classList.contains('on');
        var picker = el.closest('.picker');
        if (picker) {
          picker.querySelectorAll('.ic.on').forEach(function (n) { n.classList.remove('on'); });
        }
        if (!already) el.classList.add('on');
        if (isStep) draft.stepIcon = already ? '' : value;
        else draft.routineIcon = already ? '' : value;
        // Show the choice on its button and fold the grid away again.
        if (picker) {
          picker.hidden = true;
          var glyph = document.querySelector('[data-iconbtn="' + picker.id + '"] .glyph');
          var chosen = isStep ? draft.stepIcon : draft.routineIcon;
          if (glyph) {
            glyph.textContent = chosen || NO_ICON;
            glyph.classList.toggle('none', !chosen);
          }
        }
        return;
      }
      // Shown and hidden in place, like the pickers, so switching does not
      // wipe a half-typed name.
      if ((el = ev.target.closest('[data-trigger]'))) {
        draft.trigger = el.getAttribute('data-trigger');
        document.querySelectorAll('[data-trigger]').forEach(function (n) {
          n.classList.toggle('on', n.getAttribute('data-trigger') === draft.trigger);
        });
        var calendar = draft.trigger === 'calendar';
        var daysRow = document.getElementById('daysRow');
        var calendarRows = document.getElementById('calendarRows');
        if (daysRow) daysRow.style.display = calendar ? 'none' : '';
        if (calendarRows) calendarRows.style.display = calendar ? '' : 'none';
        return;
      }
      if ((el = ev.target.closest('[data-source]'))) {
        var src = +el.getAttribute('data-source');
        var si = draft.sources.indexOf(src);
        if (si === -1) draft.sources.push(src); else draft.sources.splice(si, 1);
        el.classList.toggle('on');
        return;
      }
      if ((el = ev.target.closest('[data-day]'))) {
        var d = +el.getAttribute('data-day');
        var at = draft.days.indexOf(d);
        if (at === -1) draft.days.push(d); else draft.days.splice(at, 1);
        el.classList.toggle('on');
        return;
      }
      if ((el = ev.target.closest('[data-pick]'))) {
        var p = el.getAttribute('data-pick');
        var pi = draft.steps.indexOf(p);
        if (pi === -1) draft.steps.push(p); else draft.steps.splice(pi, 1);
        el.classList.toggle('on');
        return;
      }
      if ((el = ev.target.closest('[data-delstep]'))) {
        var sid = el.getAttribute('data-delstep');
        captureForm();
        state.library = state.library.filter(function (s) { return s.id !== sid; });
        store.write('library', state.library).then(renderSetup);
        return;
      }
      if ((el = ev.target.closest('[data-edit]'))) {
        var editTarget = findRoutine(el.getAttribute('data-edit'));
        if (!editTarget) return;
        state.editing = editTarget.id;
        draft = draftFromRoutine(editTarget);
        state.notes = [];
        renderSetup();
        var form = document.getElementById('routineForm');
        if (form && form.scrollIntoView) form.scrollIntoView({ block: 'start' });
        return;
      }
      // Two taps: the first arms the button, the second deletes. The plugin
      // sandbox blocks confirm(), as the Polls plugin found.
      if ((el = ev.target.closest('[data-delete]'))) {
        var target = findRoutine(el.getAttribute('data-delete'));
        if (!target) return;
        if (state.pendingDelete === target.id) {
          state.pendingDelete = null;
          el.disabled = true;
          captureForm();
          deleteRoutine(target).then(renderSetup);
        } else {
          disarmDelete();
          state.pendingDelete = target.id;
          el.textContent = 'Confirm delete';
          el.classList.add('danger');
        }
        return;
      }

      switch (ev.target.id) {
        case 'gear':
        case 'closeSetup':
          // The button is gone under the gate; a stale reference must not open
          // the setup view either.
          if (HIDE_SET_UP) break;
          state.setup = ev.target.id === 'gear' ? !state.setup : false;
          // Closing setup abandons an edit in progress.
          if (!state.setup && state.editing) { state.editing = null; draft = newDraft(); }
          state.pendingDelete = null;
          var gear = document.getElementById('gear');
          gear.textContent = state.setup ? 'Close' : '+ Add';
          gear.classList.toggle('add', !state.setup);
          render();
          // The calendar filter in the form lists the enabled calendars.
          if (state.setup) {
            fetchJson(API + '/api/calendar-sources')
              .then(function (rows) {
                state.sources = (rows || []).filter(function (s) { return s.enabled; })
                  .map(function (s) { return { id: s.id, name: s.name }; });
                if (state.setup) renderSetup();
              })
              .catch(function () {});
          }
          break;

        case 'addStep': {
          var label = document.getElementById('stepLabel').value.trim();
          if (!label) { note('Give the step a name.'); render(); return; }
          captureForm();
          state.library.push({ id: uid(), label: label.slice(0, 60), icon: draft.stepIcon });
          draft.stepIcon = '';
          store.write('library', state.library).then(function () { state.notes = []; renderSetup(); });
          break;
        }

        case 'cancelEdit':
          state.editing = null;
          draft = newDraft();
          state.notes = [];
          renderSetup();
          break;

        case 'createRoutine': {
          var name = document.getElementById('rName').value.trim();
          var sel = document.getElementById('rUser');
          if (!name) { note('Give the routine a name.'); render(); return; }
          if (!draft.steps.length) { note('Pick at least one step.'); render(); return; }
          if (!sel || !sel.value) { note('No family members to assign this to.'); render(); return; }
          var byCalendar = draft.trigger === 'calendar';
          var match = byCalendar ? document.getElementById('rMatch').value.trim() : '';
          if (byCalendar && !match) { note('Say which calendar events this routine is for.'); render(); return; }

          var btn = document.getElementById('createRoutine');
          btn.disabled = true;
          var editingRoutine = state.editing ? findRoutine(state.editing) : null;
          var save = editingRoutine
            ? function (f) { return updateRoutine(editingRoutine, f); }
            : createRoutine;
          save({
            name: name.slice(0, 80),
            icon: draft.routineIcon,
            userId: parseInt(sel.value, 10),
            trigger: draft.trigger,
            match: match.slice(0, 80),
            wholeWord: byCalendar ? document.getElementById('rWhole').checked : true,
            lead: byCalendar ? Math.min(720, Math.max(0, parseInt(document.getElementById('rLead').value, 10) || 0)) : 0,
            sources: draft.sources.slice(),
            days: draft.days.slice(),
            startTime: document.getElementById('rStart').value,
            endTime: document.getElementById('rEnd').value,
            steps: draft.steps.slice(),
            threshold: parseInt(document.getElementById('rThreshold').value, 10) || 0,
            milestoneClams: parseInt(document.getElementById('rClams').value, 10) || 0
          })
            .then(function () {
              state.editing = null;
              draft = newDraft();
              state.notes = [];
              renderSetup();
            })
            .catch(function (e) {
              note((editingRoutine ? 'Could not save the routine: ' : 'Could not create the routine: ') + e.message);
              btn.disabled = false;
              render();
            });
          break;
        }
      }
    });

    // ---------- boot ----------

    document.addEventListener('DOMContentLoaded', function () {
      var params = new URLSearchParams(window.location.search);
      var theme = params.get('theme');
      if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
      if (params.get('transparent') === 'true') document.body.style.background = 'transparent';

      var start = SDK
        ? SDK.settings.get().then(function (v) { state.settings = Object.assign(state.settings, v || {}); })
            .catch(function () {})
        : Promise.resolve();

      // Calendar routines are matched to the calendar after each load, by
      // whichever display claims the current sync window. A new event day
      // then reaches the board within one window.
      function loadAndSync() {
        return loadAll().then(function () { return syncCalendarRoutines(false); });
      }

      start.then(loadAndSync).then(render).catch(function (e) {
        note('Could not load: ' + e.message);
        render();
      });

      // Polled, not event-driven: the plugin event stream does not reach the
      // browser on every deployment, and a routine that silently stops
      // updating is worse than one that updates a beat late.
      setInterval(function () {
        if (state.setup || document.hidden) return;
        var was = state.today;
        loadAndSync().then(function () {
          if (was !== state.today) state.expanded = {};
          render();
        }).catch(function () {});
      }, 60 * 1000);

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && !state.setup) loadAll().then(render).catch(function () {});
      });
    });
  })();
  </script>
</body>
</html>
