<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Routines</title>
  <link rel="stylesheet" href="/index.css">

  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "routines",
    "name": "Routines",
    "description": "Groups everyday steps into a routine - brush teeth, make bed, get dressed - that a child ticks off as a checklist, on chosen weekdays or on days with a matching calendar event. Each routine is one ordinary chore, so it counts toward the day once. Clams are paid at streak milestones you choose.",
    "category": "chores-rewards",
    "author": "HomeGlow",
    "apiVersion": "v1",
    "storage": true,
    "settings": [
      { "key": "person", "label": "Show routines for (username, blank = everyone)", "type": "string",
        "default": "", "scope": "device" },
      { "key": "showDone", "label": "Show finished routines", "type": "boolean",
        "default": true, "scope": "device" }
    ],
    "hideableControls": [
      { "id": "setUp", "label": "Set up routines (add, edit, delete, manage steps)" }
    ]
  }
  </script>

  <style>
    /* Styling deliberately mirrors ChoreWidget: 1px --card-border cards at
       8px radius, a 32px round --accent button carrying the icon, the same
       green tint on completion, and the same clam/time chips. A routine
       should not look like a different application. */
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: var(--card-bg, #fff);
      /* The host defines --text, not --text-color. */
      color: var(--text, #333);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .head h1 { font-size: 0.9rem; margin: 0; font-weight: 700; }
    .head .today { font-size: 0.75rem; opacity: 0.6; margin-left: auto; }

    .btn {
      background: transparent;
      border: 1px solid var(--card-border, rgba(128,128,128,0.35));
      color: inherit;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 4px 9px;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--accent, #757575); }
    .btn.primary { background: var(--accent, #757575); color: #fff; border-color: var(--accent, #757575); font-weight: 600; }
    /* The header's "+ Add": green, so the way in stands out; it becomes a
       plain "Close" while setting up. */
    .btn.add {
      background: var(--success, #2e7d32);
      border-color: var(--success, #2e7d32);
      color: #fff;
      font-weight: 700;
    }
    .btn.add:hover { border-color: var(--success, #2e7d32); filter: brightness(1.08); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    /* An armed Delete: the next tap deletes. */
    .btn.danger {
      background: var(--hg-error, #d32f2f);
      border-color: var(--hg-error, #d32f2f);
      color: #fff;
      font-weight: 600;
    }

    .note {
      font-size: 0.72rem;
      opacity: 0.65;
      border: 1px dashed var(--card-border, rgba(128,128,128,0.35));
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    .err {
      border: 1px solid rgba(244, 67, 54, 0.55);
      background: rgba(244, 67, 54, 0.10);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 0.78rem;
      margin-bottom: 8px;
    }

    .group-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.5;
      margin: 10px 0 5px;
      font-weight: 700;
    }
    .group-label:first-child { margin-top: 0; }

    /* --- cards: same geometry as .chore-card --- */
    .card {
      border: 1px solid var(--card-border, rgba(128,128,128,0.3));
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .card.done { background: rgba(0, 255, 0, 0.10); }

    .crow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      cursor: pointer;
      user-select: none;
    }
    .crow .title { font-size: 0.85rem; font-weight: 700; }
    .card.done .crow .title { font-weight: 400; }
    .spacer { margin-left: auto; }

    .chip {
      display: inline-block;
      font-size: 0.7rem;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--card-border, rgba(128,128,128,0.35));
      white-space: nowrap;
      vertical-align: middle;
    }
    .chip.solid { background: var(--accent, #757575); color: #fff; border-color: var(--accent, #757575); }
    .chip.needs { border-style: dashed; border-color: var(--accent, #757575); }

    /* Routines found in the chore list after a reinstall. */
    .found {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--accent, #757575);
      background: rgba(var(--accent-rgb, 158,127,255), 0.10);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }
    .found span { flex: 1; }
    .hint { font-size: 0.78rem; opacity: 0.75; padding: 8px 12px; }

    /* The 32px round action button, exactly as the chore card uses it. */
    .go {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      border: none;
      background: var(--accent, #757575);
      color: #fff;
      font-size: 1.15rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .go.off {
      background: transparent;
      border: 1px solid var(--card-border, rgba(128,128,128,0.4));
      color: inherit;
    }

    .steps { border-top: 1px solid var(--card-border, rgba(128,128,128,0.25)); }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
    }
    .step + .step { border-top: 1px solid var(--card-border, rgba(128,128,128,0.15)); }
    .step.on .slabel { text-decoration: line-through; opacity: 0.55; }
    .slabel { font-size: 0.82rem; }

    .bar { height: 3px; background: rgba(var(--accent-rgb, 158,127,255), 0.15); }
    .bar > i {
      display: block;
      height: 100%;
      background: var(--accent, #757575);
      transition: width 0.18s ease;
    }

    .empty { opacity: 0.6; font-size: 0.82rem; padding: 12px 2px; }

    /* --- the caught-up scene ---
       In place of an empty list: someone reading against a big tree, legs
       out on the grass, green trees on the hill beyond, under a sky that
       follows the time of day. All that moves is the odd leaf coming down.
       The picture keeps its own colors, like a photo would. */
    .scene {
      position: relative;
      height: 180px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--card-border, rgba(128,128,128,0.3));
      margin-bottom: 10px;
    }
    /* Alone in the tile, the scene takes the room the list would have. */
    .scene.full { height: calc(100vh - 76px); min-height: 180px; }
    .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    [data-theme="dark"] .scene.morning svg, [data-theme="dark"] .scene.day svg { filter: brightness(0.86) saturate(0.92); }
    /* The words sit on a frosted panel, so the leaves and the sun behind
       them never cost a letter. */
    .scene .msg {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 8px 14px;
      border-radius: 12px;
      text-align: center;
      color: #1d2b3a;
      background: rgba(255, 255, 255, 0.55);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .scene.evening .msg, .scene.night .msg { color: #fff; background: rgba(20, 22, 45, 0.35); }
    .scene .msg h2 { margin: 0; font-size: clamp(1rem, 4.5vw, 1.6rem); font-weight: 800; letter-spacing: -0.01em; }
    .scene .msg p { margin: 3px 0 0; font-size: 0.82rem; opacity: 0.85; }
    .scene:not(.full) .msg { top: 10px; padding: 6px 12px; }
    .scene:not(.full) .msg h2 { font-size: 1.05rem; }

    /* A leaf seesaws down from the canopy to the grass, then rests a while
       before the next. */
    .scene .leaf { opacity: 0; transform-box: fill-box; transform-origin: center; animation: rt-leaf 16s linear infinite; }
    @keyframes rt-leaf {
      0%       { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      3%       { opacity: 1; }
      10%      { transform: translate(12px, 22px) rotate(50deg); }
      18%      { transform: translate(-6px, 46px) rotate(-20deg); }
      26%      { transform: translate(14px, 72px) rotate(60deg); }
      34%      { transform: translate(-2px, 98px) rotate(-10deg); }
      42%      { transform: translate(16px, 124px) rotate(40deg); }
      48%      { transform: translate(8px, 144px) rotate(80deg); opacity: 1; }
      52%, 100% { transform: translate(8px, 144px) rotate(80deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene * { animation: none !important; }
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      background: var(--accent, #757575);
      color: #fff;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 40;
    }

    /* --- setup ---
       Three sections, each a bordered panel with a full-strength heading.
       Every field has its label above it and its help text below it, so the
       directions read as part of the field instead of floating between them. */
    .section {
      border: 1px solid var(--card-border, rgba(128,128,128,0.3));
      border-radius: 10px;
      padding: 12px 14px 14px;
      margin-bottom: 12px;
    }
    .section h2 { font-size: 0.95rem; font-weight: 700; margin: 0; }
    .section > .help:first-of-type { margin-top: 3px; }
    .field { margin-top: 14px; }
    .label { font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; }
    .help { font-size: 0.75rem; opacity: 0.75; margin: 6px 0 0; line-height: 1.45; }
    .muted { font-size: 0.8rem; opacity: 0.6; margin: 8px 0 0; }
    .inline { font-size: 0.8rem; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .grow { flex: 1 1 160px; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    .actions .btn { font-size: 0.85rem; padding: 7px 14px; }
    input[type="text"], input[type="time"], input[type="number"], select {
      background: transparent;
      color: inherit;
      border: 1px solid var(--card-border, rgba(128,128,128,0.35));
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.82rem;
      font-family: inherit;
      height: 34px;
    }
    input[type="text"] { min-width: 130px; }
    input[type="number"] { width: 64px; }
    select option { color: initial; }
    label.check { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8rem; cursor: pointer; }

    /* The icon is a small button showing the chosen picture; the grid opens
       under it on tap and closes again once one is picked. */
    .iconbtn {
      height: 34px;
      min-width: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0 6px;
      border: 1px solid var(--card-border, rgba(128,128,128,0.35));
      border-radius: 8px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-family: inherit;
    }
    .iconbtn:hover { border-color: var(--accent, #757575); }
    .iconbtn .glyph { font-size: 1.1rem; line-height: 1; }
    .iconbtn .glyph.none { font-size: 0.75rem; opacity: 0.7; }
    .iconbtn .caret { font-size: 0.6rem; opacity: 0.6; }
    .picker {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      border: 1px solid var(--card-border, rgba(128,128,128,0.3));
      border-radius: 8px;
      padding: 6px;
      margin-top: 6px;
      max-height: 116px;
      overflow-y: auto;
    }
    .picker[hidden] { display: none; }
    .ic {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .ic:hover { border-color: var(--card-border, rgba(128,128,128,0.5)); }
    .ic.on { border-color: var(--accent, #757575); background: rgba(var(--accent-rgb, 158,127,255), 0.18); }

    .pill {
      border: 1px solid var(--card-border, rgba(128,128,128,0.35));
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
    }
    .pill.on {
      border-color: var(--accent, #757575);
      background: rgba(var(--accent-rgb, 158,127,255), 0.18);
      font-weight: 600;
    }

    .line {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--card-border, rgba(128,128,128,0.18));
      font-size: 0.85rem;
    }
    .line:last-of-type { border-bottom: none; }
    .line .name { font-weight: 600; }
  </style>
</head>
<body>
  <div class="head">
    <h1>Routines</h1>
    <span class="today" id="today"></span>
    <button class="btn add" id="gear">+ Add</button>
  </div>

  <div id="notes"></div>
  <div id="view"></div>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
  (function () {
    'use strict';

    // ---------------------------------------------------------------------
    // A routine is ONE ordinary chore with clam_value 0, plus a schedule.
    // The individual steps live in plugin storage and never become chores.
    //
    // That split is forced by the core: a "regular chore" is defined as
    // clam_value === 0, and only regular chores gate the daily-completion
    // bonus and its celebration. If steps were chores, either every step
    // would gate the daily bonus (clam_value 0) or every step would pay out
    // on completion (clam_value > 0) - and the second contradicts paying
    // only at streak milestones. Hiding step-chores is no escape either:
    // /api/chores/complete refuses a schedule with visible = 0.
    // ---------------------------------------------------------------------

    var API = '';

    // Storage has two backends. The plugin API is preferred, because it is
    // shared across every display in the house. But it is only reachable when
    // HomeGlow injected this plugin's identity, which requires the file to have
    // been installed through the Admin Panel (a file dropped straight into the
    // widgets directory is served without an id). Rather than dead-end there,
    // fall back to this browser's localStorage so the plugin always works -
    // and say which one is in use, instead of silently discarding writes.
    var SDK = window.HomeGlow && window.HomeGlow.pluginId ? window.HomeGlow : null;
    var LOCAL_PREFIX = 'homeglow.routines.';

    // Control limits: the dashboard names this plugin's hidden controls on the
    // iframe URL, already unprefixed. No param means hide nothing, which is what
    // an older dashboard and a direct load of this page both produce. Set up is
    // the one gate: everything that edits a routine lives behind it, while
    // marking steps done stays on the board.
    var HIDDEN_CONTROLS = (new URLSearchParams(window.location.search).get('hide') || '')
      .split(',').filter(Boolean);
    var HIDE_SET_UP = HIDDEN_CONTROLS.indexOf('setUp') !== -1;

    // At parse time, not on DOMContentLoaded: this script sits after the button
    // in the document, so a hidden one can go before it is ever painted.
    if (HIDE_SET_UP) {
      var gearBtn = document.getElementById('gear');
      if (gearBtn) gearBtn.remove();
    }

    var store = {
      shared: !!SDK,

      readAll: function () {
        if (SDK) return SDK.storage.list().then(function (all) { return all || {}; });
        var out = {};
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k.indexOf(LOCAL_PREFIX) !== 0) continue;
            try { out[k.slice(LOCAL_PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch (e) {}
          }
        } catch (e) {}
        return Promise.resolve(out);
      },

      write: function (key, value) {
        if (SDK) {
          return SDK.storage.set(key, value).catch(function (e) {
            note('Could not save "' + key + '": ' + e.message);
          });
        }
        try { localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(value)); }
        catch (e) { note('Could not save "' + key + '": ' + e.message); }
        return Promise.resolve();
      },

      drop: function (key) {
        if (SDK) return SDK.storage.remove(key).catch(function () {});
        try { localStorage.removeItem(LOCAL_PREFIX + key); } catch (e) {}
        return Promise.resolve();
      }
    };

    // The chore icon bank (issue #141), so a routine speaks the same visual
    // language as the chores beside it.
    var ICONS = [
      '\u{1F6CF}\u{FE0F}', '\u{1F455}', '\u{1F9FA}', '\u{1F45F}', '\u{1F9F8}', '\u{1F392}',
      '\u{1FAA5}', '\u{1F6BF}', '\u{1F6C1}', '\u{1F6BD}', '\u{1F9FC}', '\u{1F487}',
      '\u{1F9F9}', '\u{1F9FD}', '\u{1F300}', '\u{1FAA3}', '\u{1F5D1}\u{FE0F}', '\u{267B}\u{FE0F}',
      '\u{1F37D}\u{FE0F}', '\u{1F374}', '\u{1F964}', '\u{1F9CA}', '\u{1F6B0}', '\u{1F35D}',
      '\u{1F966}', '\u{1F34E}', '\u{1F6CB}\u{FE0F}', '\u{1FA91}', '\u{1FAB4}', '\u{1F4A1}',
      '\u{1F4DA}', '\u{1F4EC}', '\u{1F431}', '\u{1F436}', '\u{1F41F}', '\u{1F426}',
      '\u{1F43E}', '\u{1F9B4}', '\u{1F342}', '\u{2744}\u{FE0F}', '\u{1F331}', '\u{1F3CA}',
      '\u{1F697}', '\u{1F4A7}',
      '\u{26BD}', '\u{1F3C0}', '\u{1F3C8}', '\u{26BE}', '\u{1F94E}', '\u{1F3BE}',
      '\u{1F3D0}', '\u{1F3C9}',
      '\u{1F4DD}', '\u{1F4D6}', '\u{1F3B5}', '\u{1F4BB}',
      '\u{23F0}', '\u{2B50}'
    ];

    var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var PROGRESS_KEEP_DAYS = 45;

    // ---------------------------------------------------------------------
    // Calendar routines: on days with a matching calendar event, not on
    // fixed weekdays ("Get ready for soccer" on practice and game days).
    //
    // The core keeps chores and calendars independent, so the bridge lives
    // here. For each matching event day this plugin gives the routine's chore
    // an ordinary schedule pinned to that date - crontab "0 0 D M *", which
    // fires on that day only - due at the event's start. On the day, the core
    // shows it, counts it toward the daily bonus and logs it if missed, like
    // any chore; on other days it does not exist.
    //
    // Past days are hidden, not deleted: deleting a schedule unlinks its
    // completions from the ledger, which is where streaks are read. Hiding
    // also stops the date from firing again next year. They are deleted once
    // older than the history window this plugin reads.
    // ---------------------------------------------------------------------
    var CAL_LOOKAHEAD_DAYS = 14;
    // The nightly missed-chore job reads the day that just ended, so a day is
    // left alone until it is safely past.
    var CAL_HIDE_AFTER_DAYS = 2;
    var CAL_DELETE_AFTER_DAYS = 120;
    // One display syncs per window; the others skip it (see claimSyncSlot).
    var CAL_SYNC_SLOT_MINUTES = 10;

    var state = {
      tz: null, today: null, weekday: 0,
      users: [], routines: [], library: [], progress: {}, awards: {},
      // Calendar routines: routine id -> { 'YYYY-MM-DD': { id, time } }.
      dates: {}, sources: [],
      history: [], expanded: {}, notes: [],
      // Routine chores no routine here claims (see findOrphans).
      orphans: [],
      settings: { person: '', showDone: true },
      setup: false,
      // Id of the routine being edited in the setup form, or null.
      editing: null,
      // Id of the routine whose Delete is armed, or null.
      pendingDelete: null
    };

    // ---------- helpers ----------

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function note(m) { if (state.notes.indexOf(m) === -1) state.notes.push(m); }

    function fetchJson(url, options) {
      return fetch(url, options).then(function (r) {
        if (!r.ok) {
          return r.text().then(function (b) {
            var e = new Error('HTTP ' + r.status + ' ' + b.slice(0, 140));
            e.status = r.status;
            throw e;
          });
        }
        return r.status === 204 ? null : r.json();
      });
    }
    function send(method, url, body) {
      return fetchJson(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }
    // No body, and so no JSON content type: the server rejects a JSON
    // request whose body is empty. Already gone counts as deleted.
    function remove(url) {
      return fetchJson(url, { method: 'DELETE' })
        .catch(function (e) { if (e.status !== 404) throw e; });
    }

    function dateStringIn(tz, date) {
      var d = date || new Date();
      if (!tz) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
               '-' + String(d.getDate()).padStart(2, '0');
      }
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(d);
    }
    function weekdayIn(tz) {
      return Math.max(0, DAY_NAMES.indexOf(
        new Intl.DateTimeFormat('en-US', { timeZone: tz || undefined, weekday: 'short' }).format(new Date())
      ));
    }
    function shiftDate(dateStr, delta) {
      var p = dateStr.split('-');
      var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
      d.setUTCDate(d.getUTCDate() + delta);
      return d.toISOString().slice(0, 10);
    }
    function weekdayOf(dateStr) {
      var p = dateStr.split('-');
      return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
    }
    function nowHHMM() {
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: state.tz || undefined, hour: '2-digit', minute: '2-digit', hour12: false
      }).format(new Date());
    }
    function crontabForDays(days) {
      if (!days || !days.length || days.length === 7) return '0 0 * * *';
      return '0 0 * * ' + days.slice().sort().join(',');
    }
    // Fires on that date only (and the same date in later years, which is
    // why past days are hidden).
    function crontabForDate(dateStr) {
      var p = dateStr.split('-');
      return '0 0 ' + (+p[2]) + ' ' + (+p[1]) + ' *';
    }
    function timeIn(tz, date) {
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: tz || undefined, hour: '2-digit', minute: '2-digit', hour12: false
      }).format(date);
    }
    // "17:00" minus 30 minutes is "16:30"; never earlier than midnight.
    function minusMinutes(hhmm, minutes) {
      var p = hhmm.split(':');
      var total = Math.max(0, (+p[0]) * 60 + (+p[1]) - (minutes || 0));
      return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
    }
    // Whole-word by default, so "France" matches "France practice" but not
    // "Francesca's party". Letters and digits in any script count as a word.
    function titleMatches(r, title) {
      var text = String(title || '');
      var needle = String(r.match || '').trim();
      if (!needle) return false;
      if (!r.wholeWord) return text.toLowerCase().indexOf(needle.toLowerCase()) !== -1;
      var escaped = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('(^|[^\\p{L}\\p{N}])' + escaped + '($|[^\\p{L}\\p{N}])', 'iu').test(text);
    }

    // ---------- load ----------

    function loadStored() {
      return store.readAll().then(function (values) {
        state.library = values.library || [];
        state.routines = values.routines || [];
        state.awards = values.awards || {};
        state.progress = {};
        state.dates = {};
        Object.keys(values).forEach(function (k) {
          if (k.indexOf('progress:') === 0) state.progress[k.slice(9)] = values[k] || {};
          // Separate keys per routine, so two displays syncing different
          // routines never overwrite each other's work.
          if (k.indexOf('dates:') === 0) state.dates[k.slice(6)] = values[k] || {};
        });
      });
    }

    function saveProgress(routineId) {
      var map = state.progress[routineId] || {};
      var cutoff = shiftDate(state.today, -PROGRESS_KEEP_DAYS);
      Object.keys(map).forEach(function (d) { if (d < cutoff) delete map[d]; });
      return store.write('progress:' + routineId, map);
    }

    function loadAll() {
      state.notes = [];
      if (!store.shared) {
        note('Saved on this device only. Install the plugin from the Admin Panel to share routines across displays.');
      }
      return fetchJson(API + '/api/timezone').catch(function () { return {}; })
        .then(function (tz) {
          state.tz = tz && tz.timezone;
          state.today = dateStringIn(state.tz);
          state.weekday = weekdayIn(state.tz);
          return Promise.all([
            fetchJson(API + '/api/users'),
            loadStored(),
            fetchJson(API + '/api/chore-history?date_from=' + shiftDate(state.today, -120))
              .catch(function () { return []; })
          ]);
        })
        .then(function (res) {
          // id 0 is the synthetic "bonus" pool the core uses for unassigned
          // bonus chores, not a person - a routine must never land on it.
          state.users = (res[0] || []).filter(function (u) { return u.id !== 0; });
          state.history = res[2] || [];
        });
    }

    function refreshHistory() {
      return fetchJson(API + '/api/chore-history?date_from=' + shiftDate(state.today, -120))
        .then(function (rows) { state.history = rows || []; })
        .catch(function () {});
    }

    // ---------- recovering routines ----------
    //
    // Deleting the plugin deletes its storage, but not the chores its
    // routines made. Those chores are recognisable - description "Routine",
    // worth 0 clams - and still carry the name, icon, person, weekdays and
    // start time, so a reinstall can take them back on, chore and schedule
    // and all, and their history and streaks carry on. Steps, rewards and a
    // calendar routine's event match lived only in storage; a restored
    // routine asks for them through Edit.

    function isRoutineChore(c) {
      return c && c.description === 'Routine' && (+c.clam_value || 0) === 0;
    }

    // Routine chores no routine here claims, each with its schedules.
    function findOrphans() {
      return Promise.all([
        fetchJson(API + '/api/chores'),
        fetchJson(API + '/api/chore-schedules')
      ]).then(function (res) {
        var schedules = res[1] || [];
        state.orphans = (res[0] || []).filter(isRoutineChore).map(function (c) {
          return {
            choreId: c.id, name: c.title, icon: c.icon || '',
            schedules: schedules.filter(function (s) { return s.chore_id === c.id; })
          };
        });
      }).catch(function () { state.orphans = []; });
    }

    // Against the routines loaded most recently, so one another display has
    // just made (or restored) never shows as lost here.
    function orphans() {
      var claimed = {};
      state.routines.forEach(function (r) { claimed[r.choreId] = true; });
      return (state.orphans || []).filter(function (o) { return !claimed[o.choreId]; });
    }

    // "0 0 * * 1,3,5" -> [1, 3, 5]; "0 0 * * *" -> every day.
    function daysFromCrontab(cron) {
      var m = /^0 0 \* \* (\*|[0-6](,[0-6])*)$/.exec(cron || '');
      if (!m) return null;
      if (m[1] === '*') return [0, 1, 2, 3, 4, 5, 6];
      return m[1].split(',').map(Number);
    }
    // "0 0 14 10 *" -> the 14 October nearest today: a pinned event day
    // carries no year.
    function dateFromCrontab(cron) {
      var m = /^0 0 (\d{1,2}) (\d{1,2}) \*$/.exec(cron || '');
      if (!m) return null;
      var year = +state.today.slice(0, 4);
      var best = null;
      [year - 1, year, year + 1].forEach(function (y) {
        var d = y + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
        var gap = Math.abs(Date.UTC(y, +m[2] - 1, +m[1]) - Date.UTC(year, +state.today.slice(5, 7) - 1, +state.today.slice(8, 10)));
        if (!best || gap < best.gap) best = { date: d, gap: gap };
      });
      return best.date;
    }

    // The routine a lost chore describes, or null when its schedules say too
    // little to show it on any day (no schedule left at all).
    function routineFromOrphan(o) {
      var weekly = o.schedules.filter(function (s) { return s.visible && daysFromCrontab(s.crontab); });
      var pinned = o.schedules.filter(function (s) { return dateFromCrontab(s.crontab); });
      var base = {
        id: uid(), name: o.name, icon: o.icon, choreId: o.choreId,
        // No reward until one is set again: better than paying out on a guess.
        endTime: '', steps: [], threshold: 0, milestoneClams: 0
      };
      if (weekly.length) {
        var s = weekly[0];
        return Object.assign(base, {
          userId: s.user_id, scheduleId: s.id, days: daysFromCrontab(s.crontab),
          startTime: s.due_time || ''
        });
      }
      if (pinned.length) {
        var dates = {};
        pinned.forEach(function (p) { dates[dateFromCrontab(p.crontab)] = { id: p.id, time: p.due_time || '' }; });
        var latest = Object.keys(dates).sort().pop();
        var owner = pinned.filter(function (p) { return p.id === dates[latest].id; })[0];
        return Object.assign(base, {
          userId: owner.user_id, trigger: 'calendar', match: '', wholeWord: true,
          sources: [], lead: 0, startTime: '', dates: dates
        });
      }
      return null;
    }

    // Storage is read again first, so two displays restoring at once can't
    // both add the same routine.
    function restoreOrphans(choreIds) {
      return loadStored().then(function () {
        var claimed = {};
        state.routines.forEach(function (r) { claimed[r.choreId] = true; });
        var writes = [];
        var skipped = [];
        orphans().forEach(function (o) {
          if (choreIds && choreIds.indexOf(o.choreId) === -1) return;
          if (claimed[o.choreId]) return;
          var r = routineFromOrphan(o);
          if (!r) { skipped.push(o.name); return; }
          if (r.dates) {
            state.dates[r.id] = r.dates;
            writes.push(store.write('dates:' + r.id, r.dates));
            delete r.dates;
          }
          state.routines.push(r);
          claimed[o.choreId] = true;
        });
        writes.push(store.write('routines', state.routines));
        return Promise.all(writes).then(function () {
          if (skipped.length) {
            note('Could not restore ' + skipped.join(', ') + ': no schedule is left. Delete it in the Admin Panel, or make the routine again.');
          }
        });
      })
        .then(refreshHistory)
        .then(announceChoreChange);
    }

    // What a restored routine still needs before it works as it did.
    function missing(r) {
      var out = [];
      if (!r.steps.length) out.push('steps');
      if (isCalendarRoutine(r) && !String(r.match || '').trim()) out.push('which events');
      return out;
    }

    function userById(id) {
      for (var i = 0; i < state.users.length; i++) if (state.users[i].id === id) return state.users[i];
      return null;
    }
    function stepById(id) {
      for (var i = 0; i < state.library.length; i++) if (state.library[i].id === id) return state.library[i];
      return null;
    }
    function findRoutine(id) {
      for (var i = 0; i < state.routines.length; i++) if (state.routines[i].id === id) return state.routines[i];
      return null;
    }

    // ---------- status ----------

    function isCalendarRoutine(r) { return r.trigger === 'calendar'; }
    function datesOf(r) { return state.dates[r.id] || {}; }
    // The schedule a routine's chore is completed against on a date: its one
    // weekday schedule, or that day's pinned schedule for a calendar routine.
    function scheduleIdOn(r, date) {
      if (!isCalendarRoutine(r)) return r.scheduleId;
      var entry = datesOf(r)[date];
      return entry ? entry.id : null;
    }
    // When the routine starts today: the matching event's time for a
    // calendar routine, otherwise the routine's own optional start time.
    function startTimeToday(r) {
      if (!isCalendarRoutine(r)) return r.startTime || '';
      var entry = datesOf(r)[state.today];
      return (entry && entry.time) || r.startTime || '';
    }

    function scheduledToday(r) {
      if (isCalendarRoutine(r)) return !!scheduleIdOn(r, state.today);
      return !r.days || !r.days.length || r.days.indexOf(state.weekday) !== -1;
    }
    function dayProgress(r, date) {
      return (state.progress[r.id] || {})[date] || { done: [], at: null };
    }
    function stepsDone(r, date) {
      var done = dayProgress(r, date).done || [];
      return r.steps.filter(function (s) { return done.indexOf(s) !== -1; }).length;
    }
    function allStepsDone(r, date) {
      return r.steps.length > 0 && stepsDone(r, date) === r.steps.length;
    }
    // Completion of record is the chore ledger: a parent may tick the routine
    // straight off the main chore widget.
    function completedInLedger(r, date) {
      return completedOnSchedule(scheduleIdOn(r, date), date);
    }
    // By schedule, for the sync: a routine switched off calendar events no
    // longer looks its event days up through scheduleIdOn.
    function completedOnSchedule(scheduleId, date) {
      if (!scheduleId) return false;
      for (var i = 0; i < state.history.length; i++) {
        var row = state.history[i];
        if (row.chore_schedule_id === scheduleId && row.date === date &&
            (row.kind === 'completion' || !row.kind)) return true;
      }
      return false;
    }
    function isDone(r) {
      return allStepsDone(r, state.today) || completedInLedger(r, state.today);
    }

    // Streak = consecutive SCHEDULED days, back from today, carrying a
    // completion. Read from the ledger, so it survives a storage reset.
    function streakFor(r) {
      // A calendar routine's scheduled days are its event days.
      if (isCalendarRoutine(r)) {
        var eventDays = Object.keys(datesOf(r)).filter(function (d) { return d <= state.today; }).sort().reverse();
        if (eventDays[0] === state.today && !completedInLedger(r, state.today)) eventDays.shift();
        var run = 0;
        for (var k = 0; k < eventDays.length; k++) {
          if (!completedInLedger(r, eventDays[k])) break;
          run++;
        }
        return run;
      }
      var done = {};
      state.history.forEach(function (row) {
        if (row.chore_schedule_id === r.scheduleId && (row.kind === 'completion' || !row.kind)) {
          done[row.date] = true;
        }
      });
      var days = r.days && r.days.length ? r.days : [0, 1, 2, 3, 4, 5, 6];
      var cursor = state.today;
      if (!done[cursor]) cursor = shiftDate(cursor, -1);
      var streak = 0, guard = 0;
      while (guard++ < 400) {
        if (days.indexOf(weekdayOf(cursor)) !== -1) {
          if (!done[cursor]) break;
          streak++;
        }
        cursor = shiftDate(cursor, -1);
      }
      return streak;
    }

    function onTime(r) {
      if (!r.endTime) return null;
      var at = dayProgress(r, state.today).at;
      if (!at) return null;
      return new Intl.DateTimeFormat('en-GB', {
        timeZone: state.tz || undefined, hour: '2-digit', minute: '2-digit', hour12: false
      }).format(new Date(at)) <= r.endTime;
    }

    // ---------- actions ----------

    function toggleStep(r, stepId) {
      var map = state.progress[r.id] || (state.progress[r.id] = {});
      var day = map[state.today] || (map[state.today] = { done: [], at: null });
      var was = allStepsDone(r, state.today);
      var i = day.done.indexOf(stepId);
      if (i === -1) day.done.push(stepId); else day.done.splice(i, 1);

      var now = allStepsDone(r, state.today);
      day.at = now ? (day.at || new Date().toISOString()) : null;
      saveProgress(r.id);

      var work = Promise.resolve();
      if (now && !was) work = complete(r);
      else if (!now && was) work = uncomplete(r);
      render();
      work.then(render);
    }

    function complete(r) {
      return send('POST', API + '/api/chores/complete', {
        chore_schedule_id: scheduleIdOn(r, state.today), user_id: r.userId, date: state.today
      })
        .catch(function (e) {
          // 409 = already recorded today, which is success for our purposes.
          if (e.status !== 409) { note('Could not record completion: ' + e.message); throw e; }
        })
        .then(refreshHistory)
        .then(function () { return awardIfMilestone(r); })
        .then(announceChoreChange)
        .catch(function () {});
    }

    function uncomplete(r) {
      return send('POST', API + '/api/chores/uncomplete', {
        chore_schedule_id: scheduleIdOn(r, state.today), user_id: r.userId, date: state.today
      })
        .catch(function (e) { note('Could not undo: ' + e.message); })
        .then(refreshHistory)
        .then(announceChoreChange);
    }

    // Clams are paid ONLY here - never per step, never per day.
    function awardIfMilestone(r) {
      if (!r.threshold || !r.milestoneClams) return Promise.resolve();
      var streak = streakFor(r);
      if (!streak || streak % r.threshold !== 0) return Promise.resolve();
      if (state.awards[r.id] === streak) return Promise.resolve();

      return send('POST', API + '/api/users/' + r.userId + '/clams/add', { amount: r.milestoneClams })
        .then(function () {
          state.awards[r.id] = streak;
          return store.write('awards', state.awards);
        })
        .then(function () { toast(r.name + ' - ' + streak + ' in a row!  +' + r.milestoneClams + ' \u{1F95F}'); })
        .catch(function (e) { note('Could not award milestone clams: ' + e.message); });
    }

    // Tell the host we wrote chore data, so the chore widget on this display
    // repaints instead of showing the routine as undone until its own refresh
    // timer fires. Ignored by hosts that predate the listener, so it is safe
    // to send unconditionally.
    function announceChoreChange() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'homeglow:data-changed', scope: 'chores' }, '*');
        }
      } catch (e) { /* best effort */ }
    }

    var toastTimer = null;
    function toast(text) {
      var el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
    }

    function createRoutine(f) {
      if (f.trigger === 'calendar') return createCalendarRoutine(f);
      return send('POST', API + '/api/chores', {
        title: f.name, description: 'Routine', clam_value: 0, icon: f.icon || null
      })
        .then(function (chore) {
          return send('POST', API + '/api/chore-schedules', {
            chore_id: chore.id,
            user_id: f.userId,
            crontab: crontabForDays(f.days),
            duration: 'day-of',
            // 1/0, not true/false: these columns bind straight to SQLite,
            // which rejects a JavaScript boolean.
            visible: 1,
            due_time: f.startTime || null
          }).then(function (s) { return { choreId: chore.id, scheduleId: s.id }; });
        })
        .then(function (ids) {
          state.routines.push({
            id: uid(), name: f.name, icon: f.icon || '', userId: f.userId,
            choreId: ids.choreId, scheduleId: ids.scheduleId, days: f.days,
            startTime: f.startTime || '', endTime: f.endTime || '', steps: f.steps,
            threshold: f.threshold, milestoneClams: f.milestoneClams
          });
          return store.write('routines', state.routines);
        })
        .then(refreshHistory)
        .then(announceChoreChange);
    }

    // A calendar routine starts as just its chore; its schedules are made by
    // syncCalendarRoutine, one per matching event day.
    function createCalendarRoutine(f) {
      return send('POST', API + '/api/chores', {
        title: f.name, description: 'Routine', clam_value: 0, icon: f.icon || null
      })
        .then(function (chore) {
          var r = {
            id: uid(), name: f.name, icon: f.icon || '', userId: f.userId,
            choreId: chore.id, trigger: 'calendar',
            match: f.match, wholeWord: f.wholeWord !== false, sources: f.sources || [],
            lead: f.lead || 0, startTime: f.startTime || '', endTime: f.endTime || '',
            steps: f.steps, threshold: f.threshold, milestoneClams: f.milestoneClams
          };
          state.routines.push(r);
          return store.write('routines', state.routines).then(function () { return r; });
        })
        // Straight away, not on the next sync window: the person setting it
        // up wants to see it on today's board if today has an event.
        .then(function (r) { return syncCalendarRoutine(r); })
        .then(refreshHistory)
        .then(announceChoreChange);
    }

    // Change a routine in place. Only what changed is written, and the chore
    // and its schedules are updated rather than replaced, so its history and
    // streak carry on. Switching between weekdays and calendar events swaps
    // the kind of schedule: the old one is hidden or removed, and a new one
    // made, as creating the routine would.
    function updateRoutine(r, f) {
      var wasCalendar = isCalendarRoutine(r);
      var toCalendar = f.trigger === 'calendar';
      var work = Promise.resolve();

      if (f.name !== r.name || (f.icon || '') !== (r.icon || '')) {
        // The chore endpoint replaces every field, so send them all.
        work = work.then(function () {
          return send('PATCH', API + '/api/chores/' + r.choreId, {
            title: f.name, description: 'Routine', clam_value: 0, icon: f.icon || null
          });
        });
      }

      if (!wasCalendar && !toCalendar) {
        var patch = {};
        if (crontabForDays(f.days) !== crontabForDays(r.days)) patch.crontab = crontabForDays(f.days);
        if ((f.startTime || '') !== (r.startTime || '')) patch.due_time = f.startTime || null;
        if (f.userId !== r.userId) patch.user_id = f.userId;
        if (Object.keys(patch).length) {
          work = work.then(function () { return send('PATCH', API + '/api/chore-schedules/' + r.scheduleId, patch); });
        }
      } else if (wasCalendar && toCalendar) {
        // The sync below reworks the days and times; a new person is moved
        // onto the days still to come first, so they are kept, not remade.
        if (f.userId !== r.userId) {
          work = work.then(function () {
            var map = datesOf(r);
            return Promise.all(Object.keys(map).filter(function (d) { return d >= state.today; }).map(function (d) {
              return send('PATCH', API + '/api/chore-schedules/' + map[d].id, { user_id: f.userId });
            }));
          });
        }
      } else if (!wasCalendar && toCalendar) {
        // The weekday schedule is retired; event days are made by the sync.
        work = work.then(function () {
          return send('PATCH', API + '/api/chore-schedules/' + r.scheduleId, { visible: 0 })
            .catch(function (e) { if (e.status !== 404) throw e; });
        });
      } else {
        // Calendar to weekdays: one weekday schedule takes over. The event
        // days are left to the sync below, which removes those still to
        // come (today's stays if it has been done) and hides past ones.
        work = work.then(function () {
          return send('POST', API + '/api/chore-schedules', {
            chore_id: r.choreId, user_id: f.userId, crontab: crontabForDays(f.days),
            duration: 'day-of', visible: 1, due_time: f.startTime || null
          });
        }).then(function (sched) { r.scheduleId = sched.id; });
      }

      return work.then(function () {
        r.name = f.name;
        r.icon = f.icon || '';
        r.userId = f.userId;
        r.steps = f.steps;
        r.startTime = f.startTime || '';
        r.endTime = f.endTime || '';
        r.threshold = f.threshold;
        r.milestoneClams = f.milestoneClams;
        if (toCalendar) {
          r.trigger = 'calendar';
          r.match = f.match;
          r.wholeWord = f.wholeWord !== false;
          r.lead = f.lead || 0;
          r.sources = f.sources || [];
          delete r.days;
          if (!wasCalendar) delete r.scheduleId;
        } else {
          delete r.trigger; delete r.match; delete r.wholeWord; delete r.lead; delete r.sources;
          r.days = f.days;
        }
        return store.write('routines', state.routines);
      })
        .then(function () {
          return toCalendar || wasCalendar ? syncCalendarRoutine(r) : null;
        })
        .then(refreshHistory)
        .then(announceChoreChange);
    }

    // Delete a routine and everything it made in the core. The chore delete
    // also removes every schedule linked to it - the weekday one or each
    // event day - so nothing is left to manage in the Admin Panel. History is
    // kept: completions stay in the ledger and clams already earned stay
    // earned, as when a chore is deleted there.
    function deleteRoutine(r) {
      return remove(API + '/api/chores/' + r.choreId)
        .then(function () {
          state.routines = state.routines.filter(function (x) { return x.id !== r.id; });
          delete state.dates[r.id];
          delete state.progress[r.id];
          var hadAward = Object.prototype.hasOwnProperty.call(state.awards, r.id);
          delete state.awards[r.id];
          if (state.editing === r.id) { state.editing = null; draft = newDraft(); }
          return Promise.all([
            store.write('routines', state.routines),
            store.drop('progress:' + r.id),
            store.drop('dates:' + r.id),
            hadAward ? store.write('awards', state.awards) : null
          ]);
        })
        .then(announceChoreChange)
        .catch(function (e) { note('Could not delete "' + r.name + '": ' + e.message); });
    }

    // ---------- calendar sync ----------

    // One display syncs per window. The storage increment is atomic on the
    // server, so exactly one caller sees 1 for a slot; the rest skip it.
    // Without shared storage there is nothing to coordinate with.
    function claimSyncSlot() {
      if (!SDK) return Promise.resolve(true);
      var minutes = (function () {
        var hm = nowHHMM().split(':');
        return (+hm[0]) * 60 + (+hm[1]);
      })();
      var slot = 'b' + Math.floor(minutes / CAL_SYNC_SLOT_MINUTES);
      return SDK.storage.increment('calsync:' + state.today, slot, 1)
        .then(function (res) {
          // Yesterday's lock document is no longer needed.
          store.drop('calsync:' + shiftDate(state.today, -1));
          return res && res.result === 1;
        })
        .catch(function () { return false; });
    }

    // Matching events in the next CAL_LOOKAHEAD_DAYS, as date -> due time
    // ('' for an all-day event, which then uses the routine's own time).
    // The earliest matching event decides a day's time.
    function matchingDays(r, events) {
      var last = shiftDate(state.today, CAL_LOOKAHEAD_DAYS);
      var days = {};
      events.forEach(function (ev) {
        if (!titleMatches(r, ev.title)) return;
        if (r.sources && r.sources.length && r.sources.indexOf(ev.source_id) === -1) return;
        var start = new Date(ev.start);
        var date = dateStringIn(state.tz, start);
        if (date < state.today || date > last) return;
        var time = ev.all_day ? '' : minusMinutes(timeIn(state.tz, start), r.lead);
        if (!(date in days) || (time && (!days[date] || time < days[date]))) days[date] = time;
      });
      return days;
    }

    function fetchEvents() {
      // A day either side of the window, so every event in it is returned
      // whatever the host's offset; matchingDays trims to the local dates.
      var from = new Date(Date.now() - 24 * 3600 * 1000).toISOString();
      var to = new Date(Date.now() + (CAL_LOOKAHEAD_DAYS + 2) * 24 * 3600 * 1000).toISOString();
      return fetchJson(API + '/api/calendar-events?start=' + encodeURIComponent(from) + '&end=' + encodeURIComponent(to));
    }

    // Make the routine's pinned schedules match the calendar: one for each
    // matching day ahead, none for days whose event went away, past days
    // hidden and eventually deleted. Safe to run repeatedly.
    function syncCalendarRoutine(r, events) {
      // A restored routine without its event match would match nothing, and
      // the sync would take its days ahead away. It waits for an Edit.
      if (isCalendarRoutine(r) && !String(r.match || '').trim()) return Promise.resolve();
      var load = events ? Promise.resolve(events) : fetchEvents();
      return Promise.all([
        load,
        fetchJson(API + '/api/chore-schedules?chore_id=' + r.choreId).catch(function () { return []; })
      ]).then(function (res) {
        var wanted = isCalendarRoutine(r) ? matchingDays(r, res[0] || []) : {};
        var rows = {};
        (res[1] || []).forEach(function (s) { rows[s.id] = s; });
        var map = Object.assign({}, datesOf(r));
        var work = [];

        // A pinned schedule another display made for this chore, which this
        // display's map does not know yet: adopt it rather than add another.
        function adoptable(date) {
          var cron = crontabForDate(date);
          var mapped = {};
          Object.keys(map).forEach(function (d) { mapped[map[d].id] = true; });
          var found = null;
          Object.keys(rows).forEach(function (id) {
            var s = rows[id];
            if (!found && !mapped[s.id] && s.crontab === cron && s.user_id === r.userId && s.visible) found = s;
          });
          return found;
        }

        Object.keys(wanted).forEach(function (date) {
          var time = wanted[date] || r.startTime || null;
          var entry = map[date];
          if (entry && rows[entry.id]) {
            if ((rows[entry.id].due_time || null) !== time) {
              work.push(send('PATCH', API + '/api/chore-schedules/' + entry.id, { due_time: time })
                .then(function () { map[date] = { id: entry.id, time: time || '' }; }));
            }
            return;
          }
          var existing = adoptable(date);
          if (existing) { map[date] = { id: existing.id, time: existing.due_time || '' }; return; }
          work.push(send('POST', API + '/api/chore-schedules', {
            chore_id: r.choreId,
            user_id: r.userId,
            crontab: crontabForDate(date),
            duration: 'day-of',
            visible: 1,
            due_time: time
          }).then(function (s) { map[date] = { id: s.id, time: time || '' }; }));
        });

        Object.keys(map).forEach(function (date) {
          var entry = map[date];
          var row = rows[entry.id];
          if (!row) {
            // Deleted elsewhere (by hand in the Admin Panel, say).
            delete map[date];
            return;
          }
          if (date >= state.today) {
            if (date in wanted) return;
            // The event moved or was cancelled. Today's stays if it has been
            // done, so the completion keeps its schedule.
            if (date === state.today && completedOnSchedule(entry.id, date)) return;
            work.push(remove(API + '/api/chore-schedules/' + entry.id)
              .then(function () { delete map[date]; }));
            return;
          }
          if (date < shiftDate(state.today, -CAL_DELETE_AFTER_DAYS)) {
            work.push(remove(API + '/api/chore-schedules/' + entry.id)
              .then(function () { delete map[date]; }));
          } else if (date < shiftDate(state.today, -CAL_HIDE_AFTER_DAYS) && row.visible) {
            work.push(send('PATCH', API + '/api/chore-schedules/' + entry.id, { visible: 0 }));
          }
        });

        return Promise.all(work).then(function () {
          if (!isCalendarRoutine(r) && !Object.keys(map).length) {
            delete state.dates[r.id];
            return store.drop('dates:' + r.id);
          }
          state.dates[r.id] = map;
          return store.write('dates:' + r.id, map);
        });
      }).catch(function (e) {
        note('Could not match "' + r.name + '" to the calendar: ' + e.message);
      });
    }

    // Every calendar routine, by whichever display claims the slot; `force`
    // skips the claim (a routine was just created or edited here).
    function syncCalendarRoutines(force) {
      // Calendar routines, and any routine switched off calendar events
      // that still has event days to tidy.
      var list = state.routines.filter(function (r) {
        return isCalendarRoutine(r) || Object.keys(datesOf(r)).length > 0;
      });
      if (!list.length) return Promise.resolve(false);
      return (force ? Promise.resolve(true) : claimSyncSlot()).then(function (mine) {
        if (!mine) return false;
        return fetchEvents().then(function (events) {
          return list.reduce(function (chain, r) {
            return chain.then(function () { return syncCalendarRoutine(r, events); });
          }, Promise.resolve());
        }).then(function () { return true; })
          .catch(function (e) { note('Could not read the calendar: ' + e.message); return false; });
      });
    }

    // ---------- render ----------

    function iconButton(icon, on, extraClass) {
      return '<button class="go ' + (on ? '' : 'off') + ' ' + (extraClass || '') + '">' +
             (icon ? icon : (on ? '✓' : '')) + '</button>';
    }

    function routineCard(r) {
      var done = isDone(r);
      var total = r.steps.length;
      var count = stepsDone(r, state.today);
      var streak = streakFor(r);
      var user = userById(r.userId);
      var open = state.expanded[r.id];
      var punctual = onTime(r);

      var html = '<div class="card ' + (done ? 'done' : '') + '">';
      html += '<div class="crow" data-toggle="' + esc(r.id) + '">';
      html += iconButton(done ? '✓' : (r.icon || ''), !done);
      html += '<div><span class="title">' + esc(r.name) + '</span>';
      if (user) html += ' <span class="chip">' + esc(user.username) + '</span>';
      var start = startTimeToday(r);
      if (start) {
        html += ' <span class="chip">\u{1F551} ' + esc(start) +
                (r.endTime ? '–' + esc(r.endTime) : '') + '</span>';
      }
      if (isCalendarRoutine(r)) html += ' <span class="chip" title="On days with a matching calendar event">\u{1F4C5}</span>';
      html += '</div><span class="spacer"></span>';
      if (done && punctual === true) html += '<span class="chip">on time</span> ';
      if (done && punctual === false) html += '<span class="chip">late</span> ';
      if (!done && total) html += '<span class="chip">' + count + '/' + total + '</span> ';
      if (streak > 0) html += '<span class="chip solid">' + streak + ' \u{1F525}</span>';
      html += '</div>';

      if (!done && total) {
        html += '<div class="bar"><i style="width:' + Math.round((count / total) * 100) + '%"></i></div>';
      }

      if ((open || !done) && total) {
        var doneIds = dayProgress(r, state.today).done || [];
        html += '<div class="steps">';
        r.steps.forEach(function (sid) {
          var st = stepById(sid);
          if (!st) return;
          var on = doneIds.indexOf(sid) !== -1;
          html += '<div class="step ' + (on ? 'on' : '') + '" data-step="' + esc(sid) +
                  '" data-for="' + esc(r.id) + '">';
          html += iconButton(on ? '✓' : (st.icon || ''), on);
          html += '<span class="slabel">' + esc(st.label) + '</span></div>';
        });
        html += '</div>';
      }

      // A restored routine without its steps (or event match) yet says so,
      // instead of showing as a card with nothing to tick.
      var needs = missing(r);
      if (needs.length && !done) {
        html += '<div class="steps"><div class="hint">Restored. ' +
                (HIDE_SET_UP
                  ? 'It needs ' + needs.join(' and ') + ' set up again.'
                  : 'Open <strong>+ Add</strong> and choose Edit to give it ' + needs.join(' and ') + '.') +
                '</div></div>';
      }

      return html + '</div>';
    }

    // ---------- the caught-up scene ----------

    // The part of the day, in the household's timezone, that paints the sky.
    function dayPart() {
      var h = parseInt(new Intl.DateTimeFormat('en-GB', {
        timeZone: state.tz || undefined, hour: '2-digit', hourCycle: 'h23'
      }).format(new Date()), 10);
      if (h >= 5 && h < 11) return 'morning';
      if (h >= 11 && h < 17) return 'day';
      if (h >= 17 && h < 20) return 'evening';
      return 'night';
    }

    // and a wash over the whole picture brings the evening and the night in.
    var SKIES = {

      day:     { sky: ['#74c0fc', '#d0ebff'], sun: '#ffe066', wash: '' },
      evening: { sky: ['#9775fa', '#ffa94d'], sun: '#ff8787', wash: 'rgba(255, 120, 60, 0.16)' },
      night:   { sky: ['#2a3170', '#4a5296'], sun: '#f1f3f5', wash: 'rgba(10, 14, 40, 0.50)' }
    };
    var LAND = {

      bark: ['#4a3022', '#6b4a35', '#8a6443'], groove: '#3b2519',
      // Leaf clusters, each lit from the upper left: [light, dark].
      leaves: [['#6fc25e', '#2f7d35'], ['#86d272', '#3f9142'], ['#a4e38f', '#58a94e']],
      skin: '#f2c48d', skinShade: '#d9a26b', hair: ['#41474e', '#16191c'],
      shirt: ['#f25555', '#c92a2a'], jeans: ['#7896cb', '#4c679b'], jeansFar: '#435d8f',

    function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }

    // shadow on the grass.
    function hillTree(x, base, s) {

             '<path d="M' + (x - 3.4 * s).toFixed(1) + ' ' + (base + 1) + ' L' + (x - 2.2 * s).toFixed(1) + ' ' + (base - 28 * s).toFixed(1) +
             ' L' + (x + 2.2 * s).toFixed(1) + ' ' + (base - 28 * s).toFixed(1) + ' L' + (x + 3.4 * s).toFixed(1) + ' ' + (base + 1) + ' Z" fill="url(#rt-bark)"/>' +
             c(-15, -30, 15, 0) + c(16, -31, 16, 0) + c(0, -38, 20, 1) + c(-9, -52, 14, 1) + c(10, -51, 14, 1) +
             c(-4, -55, 8, 2) + c(-12, -40, 7, 2) + c(8, -44, 6, 2);
    }

    // outer edge are each [top, bottom].
    function printLines(spine, outer) {
      var out = '';
      [0.16, 0.25, 0.34, 0.43, 0.58, 0.67, 0.76, 0.85].forEach(function (t, i) {
        var a = lerp(spine[0], spine[1], t), b = lerp(outer[0], outer[1], t);

    var SIGNOFF = {
      morning: 'Have a great day!',
      day: 'Enjoy the rest of the day!',
      evening: 'Enjoy your evening!',
      night: 'Sweet dreams!'
    };

    // The scene and its words, plus a key that changes only when what it
    // shows does, so the minute refresh doesn't restart its animations.
    function scene(kind, full, doneCount) {
      var part = dayPart();
      var who = (state.settings.person || '').trim();
      var title, line;
      if (kind === 'done') {
        title = who ? 'Nice work, ' + who + '!' : 'All caught up!';
        line = (doneCount === 1 ? 'The routine is done. ' : 'All ' + doneCount + ' routines are done. ') + SIGNOFF[part];
      } else {
        title = part === 'night' ? 'A quiet night' : 'A free day';
        line = 'No routines on the schedule today.';
      }
      var key = [kind, part, full ? 'full' : 'top', title, line].join('|');
      var html = '<div class="scene ' + part + (full ? ' full' : '') + '" data-key="' + esc(key) + '">' +
                 sceneSvg(part) +
                 '<div class="msg"><h2>' + esc(title) + '</h2><p>' + esc(line) + '</p></div></div>';
      return { key: key, html: html };
    }

    // Fills the view, leaving a scene that is already showing the same thing
    // in place and replacing only what follows it.
    function paint(view, sc, rest) {
      var cur = view.firstElementChild;
      if (sc && cur && cur.classList.contains('scene') && cur.getAttribute('data-key') === sc.key) {
        while (cur.nextSibling) view.removeChild(cur.nextSibling);
        cur.insertAdjacentHTML('afterend', rest);
        return;
      }
      view.innerHTML = (sc ? sc.html : '') + rest;
    }

    function render() {
      document.getElementById('today').textContent = state.today
        ? new Intl.DateTimeFormat(undefined, {
            timeZone: state.tz || undefined, weekday: 'long', month: 'short', day: 'numeric'
          }).format(new Date())
        : '';

      var noteBox = document.getElementById('notes');
      var html = '';
      state.notes.forEach(function (n) {
        var bad = /could not|failed/i.test(n);
        html += '<div class="' + (bad ? 'err' : 'note') + '">' + esc(n) + '</div>';
      });
      // Lost routines are offered on the board too, where a reinstall lands;
      // setup lists them one by one.
      var lost = orphans();
      if (lost.length && !state.setup && !HIDE_SET_UP) {
        html += '<div class="found"><span>Found ' + lost.length + (lost.length === 1 ? ' routine' : ' routines') +
                ' from before Routines was reinstalled.</span>' +
                '<button class="btn primary" id="restoreAll">Restore</button></div>';
      }
      noteBox.innerHTML = html;

      if (state.setup) return renderSetup();

      var view = document.getElementById('view');
      if (!state.routines.length) {
        view.innerHTML = HIDE_SET_UP
          ? '<div class="empty">No routines yet.</div>'
          : '<div class="empty">No routines yet. Choose <strong>+ Add</strong> to build one.</div>';
        return;
      }

      var want = (state.settings.person || '').trim().toLowerCase();
      var list = state.routines.filter(function (r) {
        if (!scheduledToday(r)) return false;
        if (!want) return true;
        var u = userById(r.userId);
        return u && String(u.username).toLowerCase() === want;
      });

      if (!list.length) { paint(view, scene('free', true), ''); return; }

      var now = nowHHMM();
      var todo = [], later = [], done = [];
      list.forEach(function (r) {
        var start = startTimeToday(r);
        if (isDone(r)) done.push(r);
        else if (start && start > now) later.push(r);
        else todo.push(r);
      });

      var out = '';
      function section(label, arr) {
        if (!arr.length) return;
        arr.sort(function (a, b) { return (startTimeToday(a) || '99:99').localeCompare(startTimeToday(b) || '99:99'); });
        out += '<div class="group-label">' + label + '</div>';
        arr.forEach(function (r) { out += routineCard(r); });
      }
      section('Now', todo);
      section('Later today', later);
      if (state.settings.showDone) section('Done', done);

      // Everything for today is finished: the scene, with the finished
      // routines under it when the display shows those.
      var caughtUp = !todo.length && !later.length;
      paint(view, caughtUp ? scene('done', !out, done.length) : null, out);
    }

    // ---------- setup ----------

    function newDraft() {
      return {
        days: [0, 1, 2, 3, 4, 5, 6], steps: [], stepIcon: '', routineIcon: '',
        trigger: 'days', match: '', wholeWord: true, lead: 0, sources: [],
        name: '', userId: null, startTime: '', endTime: '', threshold: 5, milestoneClams: 10
      };
    }
    var draft = newDraft();

    // What has been typed into the routine form, kept in the draft before
    // anything re-renders it (adding or removing a step does).
    function captureForm() {
      var val = function (id) { var n = document.getElementById(id); return n ? n.value : null; };
      if (val('rName') !== null) draft.name = val('rName');
      if (val('rUser') !== null && val('rUser') !== '') draft.userId = parseInt(val('rUser'), 10);
      if (val('rStart') !== null) draft.startTime = val('rStart');
      if (val('rEnd') !== null) draft.endTime = val('rEnd');
      if (val('rThreshold') !== null) draft.threshold = val('rThreshold');
      if (val('rClams') !== null) draft.milestoneClams = val('rClams');
      if (val('rMatch') !== null) draft.match = val('rMatch');
      if (val('rLead') !== null) draft.lead = val('rLead');
      var whole = document.getElementById('rWhole');
      if (whole) draft.wholeWord = whole.checked;
    }

    // The form, filled from an existing routine for editing.
    function draftFromRoutine(r) {
      return {
        days: (r.days && r.days.length ? r.days : [0, 1, 2, 3, 4, 5, 6]).slice(),
        steps: r.steps.slice(), stepIcon: '', routineIcon: r.icon || '',
        trigger: isCalendarRoutine(r) ? 'calendar' : 'days',
        match: r.match || '', wholeWord: r.wholeWord !== false, lead: r.lead || 0,
        sources: (r.sources || []).slice(),
        name: r.name, userId: r.userId, startTime: r.startTime || '', endTime: r.endTime || '',
        threshold: r.threshold || 0, milestoneClams: r.milestoneClams || 0
      };
    }

    // Shown on the icon button until a picture is chosen.
    var NO_ICON = 'Icon';

    // The grid of pictures, closed until its icon button is tapped.
    function pickerHtml(id, attr, selected) {
      var h = '<div class="picker" id="' + id + '" hidden>';
      ICONS.forEach(function (e) {
        h += '<button class="ic ' + (selected === e ? 'on' : '') + '" ' + attr + '="' + esc(e) + '">' + e + '</button>';
      });
      return h + '</div>';
    }
    function iconButton2(pickerId, selected) {
      return '<button type="button" class="iconbtn" data-iconbtn="' + pickerId + '" title="Choose an icon">' +
             '<span class="glyph' + (selected ? '' : ' none') + '">' + (selected || NO_ICON) + '</span>' +
             '<span class="caret">\u25BE</span></button>';
    }
    function field(label, body, help) {
      return '<div class="field"><div class="label">' + label + '</div>' + body +
             (help ? '<p class="help">' + help + '</p>' : '') + '</div>';
    }

    function renderSetup() {
      var view = document.getElementById('view');
      var h = '';

      h += '<div class="section"><h2>Steps</h2>';
      h += '<p class="help">Build a step once, then reuse it in any routine.</p>';

      state.library.forEach(function (s) {
        h += '<div class="line"><span style="font-size:1.15rem">' + (s.icon || '') + '</span>' +
             '<span class="name">' + esc(s.label) + '</span><span class="spacer"></span>' +
             '<button class="btn" data-delstep="' + esc(s.id) + '">Remove</button></div>';
      });
      h += field('New step',
        '<div class="row">' + iconButton2('stepPicker', draft.stepIcon) +
        '<input type="text" id="stepLabel" class="grow" placeholder="Brush teeth">' +
        '<button class="btn primary" id="addStep">Add step</button></div>' +
        pickerHtml('stepPicker', 'data-stepicon', draft.stepIcon));
      h += '</div>';

      // Routine chores left from an earlier install
      var lost = orphans();
      if (lost.length) {
        h += '<div class="section"><h2>Found in the chore list</h2>';

             'and their history and streaks carry on. Steps, rewards and calendar-event matching were kept with the plugin, ' +
             'so add those again with Edit.</p>';
        lost.forEach(function (o) {
          h += '<div class="line"><span style="font-size:1.15rem">' + (o.icon || '') + '</span>' +
               '<span class="name">' + esc(o.name) + '</span><span class="spacer"></span>' +
               '<button class="btn" data-restore="' + o.choreId + '">Restore</button></div>';
        });
        if (lost.length > 1) h += '<div class="actions"><button class="btn primary" id="restoreAll">Restore all</button></div>';
        h += '</div>';
      }

      // Existing routines
      if (state.routines.length) {
        h += '<div class="section"><h2>Your routines</h2>';
        h += '<p class="help">Deleting a routine removes its chore too. Clams already earned and the completion history stay.</p>';
        state.routines.forEach(function (r) {
          var u = userById(r.userId);
          h += '<div class="line"><span style="font-size:1.15rem">' + (r.icon || '') + '</span>' +
               '<span class="name">' + esc(r.name) + '</span>' +
               '<span class="chip">' + (u ? esc(u.username) : '?') + '</span>' +
               (r.steps.length
                 ? '<span class="chip">' + r.steps.length + (r.steps.length === 1 ? ' step' : ' steps') + '</span>'
                 : '<span class="chip needs">needs steps</span>') +
               (isCalendarRoutine(r)
                 ? (String(r.match || '').trim()
                   ? '<span class="chip">\u{1F4C5} ' + esc(r.match) + '</span>'
                   : '<span class="chip needs">\u{1F4C5} needs events</span>')
                 : '') +
               '<span class="spacer"></span>' +
               '<button class="btn" data-edit="' + esc(r.id) + '">Edit</button>' +
               '<button class="btn' + (state.pendingDelete === r.id ? ' danger' : '') + '" data-delete="' + esc(r.id) + '">' +
               (state.pendingDelete === r.id ? 'Confirm delete' : 'Delete') + '</button></div>';
        });
        h += '</div>';
      }

      // New routine
      var editing = state.editing ? findRoutine(state.editing) : null;
      h += '<div class="section" id="routineForm"><h2>' + (editing ? 'Edit routine' : 'New routine') + '</h2>';
      if (editing) {
        h += '<p class="help">Changes apply from today. Its history and streak carry on.</p>';
      }
      h += field('Name',
        '<div class="row">' + iconButton2('routinePicker', draft.routineIcon) +
        '<input type="text" id="rName" class="grow" placeholder="Morning routine" value="' + esc(draft.name) + '"></div>' +
        pickerHtml('routinePicker', 'data-routineicon', draft.routineIcon));

      var people = '<select id="rUser">';
      state.users.forEach(function (u) {
        people += '<option value="' + u.id + '"' + (u.id === draft.userId ? ' selected' : '') + '>' + esc(u.username) + '</option>';
      });
      h += field('For', people + '</select>');

      var byCalendar = draft.trigger === 'calendar';
      var when = '<div class="row">' +
        '<span class="pill ' + (byCalendar ? '' : 'on') + '" data-trigger="days">On these days</span>' +
        '<span class="pill ' + (byCalendar ? 'on' : '') + '" data-trigger="calendar">\u{1F4C5} On calendar events</span></div>';
      when += '<div class="row" id="daysRow" style="margin-top:8px' + (byCalendar ? ';display:none' : '') + '">';
      DAY_NAMES.forEach(function (d, i) {
        when += '<span class="pill ' + (draft.days.indexOf(i) !== -1 ? 'on' : '') + '" data-day="' + i + '">' + d + '</span>';
      });
      when += '</div>';
      when += '<div id="calendarRows"' + (byCalendar ? '' : ' style="display:none"') + '>';
      when += field('Event title contains',
        '<div class="row"><input type="text" id="rMatch" class="grow" placeholder="Soccer" value="' + esc(draft.match) + '">' +
        '<label class="check"><input type="checkbox" id="rWhole"' + (draft.wholeWord ? ' checked' : '') + '> Whole words</label></div>',
        'Whole words keeps "France" from matching "Francesca".');
      when += field('Due',
        '<div class="row"><input type="number" id="rLead" min="0" max="720" value="' + esc(draft.lead) + '">' +
        '<span class="inline">minutes before the event starts</span></div>',
        'All-day events use the time below instead.');
      if (state.sources.length > 1) {
        var cals = '<div class="row">';
        state.sources.forEach(function (src) {
          cals += '<span class="pill ' + (draft.sources.indexOf(src.id) !== -1 ? 'on' : '') + '" data-source="' + src.id + '">' + esc(src.name) + '</span>';
        });
        when += field('Calendars', cals + '</div>', 'None picked means every calendar.');
      }
      when += '<p class="help">Looks ' + CAL_LOOKAHEAD_DAYS + ' days ahead. A display showing Routines picks up new events within minutes.</p>';
      when += '</div>';
      h += field('When', when);

      var stepPills = '<div class="row">';
      state.library.forEach(function (s) {
        stepPills += '<span class="pill ' + (draft.steps.indexOf(s.id) !== -1 ? 'on' : '') +
                     '" data-pick="' + esc(s.id) + '">' + (s.icon || '') + ' ' + esc(s.label) + '</span>';
      });
      stepPills += '</div>';
      h += field('Steps', state.library.length ? stepPills : '<p class="muted" style="margin:0">Add a step above first.</p>',
        state.library.length ? 'Tap to include, in the order they should be done.' : '');

      h += field('Time <span style="font-weight:400;opacity:0.7">(optional)</span>',
        '<div class="row"><input type="time" id="rStart" value="' + esc(draft.startTime) + '"><span class="inline">to</span>' +
        '<input type="time" id="rEnd" value="' + esc(draft.endTime) + '"></div>',
        'The start time orders the list; nothing fires at it. The end time decides whether a finish counts as on time.');
