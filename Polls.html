<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poll Widget</title>
  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "family-polls",
    "name": "Family Poll",
    "description": "Runs a quick family vote. Ask a question, add the options, and everyone picks their profile and votes straight from the dashboard. Polls and votes are saved on the server, so every display shows the same tally.",
    "apiVersion": "v1",
    "storage": true
  }
  </script>
  <link rel="stylesheet" href="/index.css">
  <style>
    * {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    body {
      background: transparent !important;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0.75rem;
      box-sizing: border-box;
      font-size: 0.85rem;
      color: #333;
    }

    [data-theme="dark"] body {
      color: #a6a6d1;
      background: transparent !important;
    }

    .widget-container {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      border-radius: 12px;
      padding: 0.5rem;
      text-align: center;
      width: 100%;
      max-height: calc(100vh - 1.5rem);
      overflow-y: auto;
    }

    .widget-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
      color: inherit;
    }

    .user-selection {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    [data-theme="dark"] .user-selection {
      background: rgba(30, 30, 50, 0.3) !important;
      border-color: rgba(100, 100, 150, 0.3);
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .user-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.05) !important;
    }

    [data-theme="dark"] .user-option {
      background: rgba(30, 30, 50, 0.2) !important;
    }

    .user-option:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      transform: translateY(-2px);
    }

    [data-theme="dark"] .user-option:hover {
      background: rgba(30, 30, 50, 0.4) !important;
    }

    .user-option.selected {
      border-color: #00ddeb;
      background: rgba(0, 221, 235, 0.1) !important;
    }

    [data-theme="dark"] .user-option.selected {
      border-color: #00ddeb;
      background: rgba(0, 221, 235, 0.2) !important;
    }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1) !important;
      margin-bottom: 0.5rem;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    [data-theme="dark"] .user-avatar {
      background: rgba(30, 30, 50, 0.3) !important;
      border-color: rgba(100, 100, 150, 0.3);
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .user-name {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .current-user-display {
      background: rgba(0, 221, 235, 0.1) !important;
      border: 1px solid #00ddeb;
      border-radius: 6px;
      padding: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .poll-section {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .poll-creation {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    [data-theme="dark"] .poll-creation {
      border-color: rgba(100, 100, 150, 0.3);
    }

    .form-group {
      margin-bottom: 0.75rem;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 0.8rem;
    }

    .form-input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1) !important;
      color: inherit;
      font-size: 0.8rem;
      box-sizing: border-box;
    }

    [data-theme="dark"] .form-input {
      border-color: rgba(100, 100, 150, 0.3);
      background: rgba(30, 30, 50, 0.3) !important;
    }

    .form-input:focus {
      outline: none;
      border-color: #00ddeb;
    }

    .option-input-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .option-input {
      flex: 1;
    }

    .remove-option-btn {
      background: #dc3545 !important;
      color: white !important;
      border: none;
      border-radius: 4px;
      padding: 0.5rem;
      cursor: pointer;
      font-size: 0.7rem;
      min-width: auto;
    }

    .custom-button {
      background: linear-gradient(45deg, #00ddeb, #ff6b6b) !important;
      color: #333 !important;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s ease;
      margin: 0.25rem;
    }

    [data-theme="dark"] .custom-button {
      background: linear-gradient(45deg, #2e2767, #620808) !important;
      color: #a6a6d1 !important;
    }

    .custom-button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .custom-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .poll-item {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: left;
    }

    [data-theme="dark"] .poll-item {
      border-color: rgba(100, 100, 150, 0.3);
    }

    .poll-question {
      font-weight: 600;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .poll-option {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }

    .poll-option:hover {
      background: rgba(255, 255, 255, 0.1) !important;
    }

    [data-theme="dark"] .poll-option:hover {
      background: rgba(30, 30, 50, 0.3) !important;
    }

    .poll-option input[type="radio"] {
      margin-right: 0.5rem;
    }

    .poll-results {
      margin-top: 1rem;
    }

    .result-bar {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .result-label {
      min-width: 100px;
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }

    .result-progress {
      flex: 1;
      height: 20px;
      background: rgba(255, 255, 255, 0.1) !important;
      border-radius: 10px;
      overflow: hidden;
      margin-right: 0.5rem;
    }

    [data-theme="dark"] .result-progress {
      background: rgba(30, 30, 50, 0.3) !important;
    }

    .result-fill {
      height: 100%;
      background: linear-gradient(45deg, #00ddeb, #ff6b6b) !important;
      transition: width 0.5s ease;
      border-radius: 10px;
    }

    [data-theme="dark"] .result-fill {
      background: linear-gradient(45deg, #2e2767, #620808) !important;
    }

    .result-percentage {
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 40px;
    }

    .poll-meta {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 0.5rem;
      text-align: center;
    }

    [data-theme="dark"] .poll-meta {
      color: rgba(166, 166, 209, 0.7);
    }

    .voter-list {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.25rem;
    }

    [data-theme="dark"] .voter-list {
      color: rgba(166, 166, 209, 0.6);
    }

    .no-polls {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
      padding: 2rem;
    }

    [data-theme="dark"] .no-polls {
      color: rgba(166, 166, 209, 0.7);
    }

    .error-message {
      background: rgba(220, 53, 69, 0.1) !important;
      border: 1px solid #dc3545;
      color: #dc3545;
      padding: 0.5rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }

    [data-theme="dark"] .error-message {
      color: #ff6b6b;
      border-color: #ff6b6b;
    }

    .success-message {
      background: rgba(40, 167, 69, 0.1) !important;
      border: 1px solid #28a745;
      color: #28a745;
      padding: 0.5rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }

    [data-theme="dark"] .success-message {
      color: #00ddeb;
      border-color: #00ddeb;
    }

    .loading {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
      padding: 1rem;
    }

    [data-theme="dark"] .loading {
      color: rgba(166, 166, 209, 0.7);
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <h1 class="widget-title">📊 Family Poll</h1>
    
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    <div id="successMessage" class="success-message" style="display: none;"></div>
    
    <!-- User Selection Section -->
    <div class="user-selection">
      <h3 style="margin-top: 0; font-size: 0.9rem;">Select Your Profile</h3>
      <div id="userGrid" class="user-grid">
        <div class="loading">Loading family members...</div>
      </div>
    </div>
    
    <!-- Current User Display -->
    <div id="currentUserDisplay" class="current-user-display" style="display: none;">
      Voting as: <span id="currentUserName"></span>
      <button type="button" class="custom-button" onclick="clearUserSelection()" style="margin-left: 0.5rem; font-size: 0.7rem; padding: 4px 8px;">Switch User</button>
    </div>
    
    <!-- Poll Creation Section -->
    <div class="poll-section">
      <div class="poll-creation">
        <h3 style="margin-top: 0; font-size: 1rem;">Create New Poll</h3>
        
        <div class="form-group">
          <label class="form-label">Poll Question:</label>
          <input type="text" id="pollQuestion" class="form-input" placeholder="What should we decide on?">
        </div>
        
        <div class="form-group">
          <label class="form-label">Options:</label>
          <div id="optionsContainer">
            <div class="option-input-group">
              <input type="text" class="form-input option-input" placeholder="Option 1">
            </div>
            <div class="option-input-group">
              <input type="text" class="form-input option-input" placeholder="Option 2">
            </div>
          </div>
          <button type="button" class="custom-button" id="addOptionBtn" onclick="addOption()">+ Add Option</button>
        </div>
        
        <button type="button" class="custom-button" id="createPollBtn" onclick="createPoll()">Create Poll</button>
        <button type="button" class="custom-button" id="cancelEditBtn" onclick="cancelEdit()" style="display: none; margin-left: 0.5rem; background: #6c757d !important;">Cancel</button>
      </div>
    </div>
    
    <!-- Active Polls Section -->
    <div class="poll-section">
      <h3 style="margin-top: 0; font-size: 1rem;">Family Polls</h3>
      <div id="pollsContainer">
        <div class="no-polls">No polls created yet. Create your first poll above!</div>
      </div>
    </div>
  </div>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
    let polls = [];
    let users = [];
    let currentUser = null;
    // Votes keyed by poll id, then by user id: { [pollId]: { [userId]: {o, u, t} } }.
    // Tallies are derived from this at render time rather than stored, so there is
    // no counter to drift out of step with the votes themselves.
    let votes = {};
    // False until polls are actually in hand. Gates every write: without it a
    // failed read leaves an empty list that the next write would persist.
    let dataLoaded = false;
    // Which poll the form is editing, or null when creating a new one.
    let editingPollId = null;
    // Which poll's Delete has been armed. The sandbox blocks confirm(), so the
    // second click on the button is the confirmation.
    let pendingDeleteId = null;

    // This page is served from the API origin, so relative paths reach the
    // backend wherever it is. The previous ':3000' -> ':5000' rewrite only held
    // for one dev layout.
    const API_BASE = '';

    const POLLS_KEY = 'polls';
    const VOTE_PREFIX = 'v:';
    const MIGRATION_KEY = 'migratedFromLocalStorage';
    const LEGACY_POLLS_KEY = 'pollWidget_polls';

    const SDK = window.HomeGlow && window.HomeGlow.pluginId ? window.HomeGlow : null;
    const STORAGE = SDK ? SDK.storage : null;
    const PLATFORM_AVAILABLE = Boolean(STORAGE);

    // One key per voter per poll. A single document holding nested votes would
    // be get-modify-set, so two people voting at the same moment on different
    // displays would lose one of the votes.
    const voteKey = (pollId, userId) => VOTE_PREFIX + pollId + ':' + userId;

    // Date.now() alone collides when two displays create a poll within the same
    // millisecond, and under one-key-per-poll a collision silently overwrites.
    const newPollId = () => String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);

    const pollVotes = (pollId) => votes[pollId] || {};
    const voteCountsFor = (poll) => {
      const cast = Object.values(pollVotes(poll.id));
      const counts = poll.options.map(() => []);
      for (const v of cast) {
        if (typeof v.o === 'number' && counts[v.o]) counts[v.o].push(v.u);
      }
      return { counts, total: cast.length };
    };

    document.addEventListener('DOMContentLoaded', () => {
      // Handle theme
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }

      // Render once the stored polls are actually in hand, so the list is never
      // drawn empty and then repopulated.
      (async () => {
        await loadData();
        await loadUsers();
        renderPolls();
      })();
    });

    async function loadUsers() {
      try {
        const response = await fetch(`${API_BASE}/api/users`);
        if (!response.ok) throw new Error('Failed to fetch users');
        
        const allUsers = await response.json();
        // Filter out the bonus user (ID 0) as it's not a real family member
        users = allUsers.filter(user => user.id !== 0);
        
        renderUserSelection();
        
        // Load saved user selection
        const savedUserId = localStorage.getItem('pollWidget_currentUser');
        if (savedUserId) {
          const savedUser = users.find(u => u.id === parseInt(savedUserId));
          if (savedUser) {
            selectUser(savedUser);
          }
        }
      } catch (error) {
        console.error('Error loading users:', error);
        showError('Could not load family members. Please check your connection.');
        document.getElementById('userGrid').innerHTML = '<div class="error-message">Failed to load family members</div>';
      }
    }

    function renderUserSelection() {
      const apiBase = window.location.origin;
      const userGrid = document.getElementById('userGrid');

      if (users.length === 0) {
        userGrid.innerHTML = '<div class="no-polls">No family members found</div>';
        return;
      }

      userGrid.innerHTML = users.map(user => `
        <div class="user-option" onclick="selectUser(${JSON.stringify(user).replace(/"/g, '&quot;')})">
          <div class="user-avatar">
            ${user.profile_picture ?
              `<img src="${apiBase}/Uploads/users/${user.profile_picture}" alt="${user.username}">` :
              `<span style="font-size: 1.5rem;">👤</span>`
            }
          </div>
          <div class="user-name">${escapeHtml(user.username)}</div>
        </div>
      `).join('');
    }

    function selectUser(user) {
      currentUser = user;
      localStorage.setItem('pollWidget_currentUser', user.id.toString());
      
      // Update UI
      document.getElementById('currentUserName').textContent = user.username;
      document.getElementById('currentUserDisplay').style.display = 'block';
      document.querySelector('.user-selection').style.display = 'none';
      
      // Update user selection visual
      document.querySelectorAll('.user-option').forEach(option => {
        option.classList.remove('selected');
      });
      
      renderPolls(); // Re-render polls to show user-specific voting status
      showSuccess(`Selected ${user.username} as current voter`);
    }

    function clearUserSelection() {
      currentUser = null;
      localStorage.removeItem('pollWidget_currentUser');
      
      document.getElementById('currentUserDisplay').style.display = 'none';
      document.querySelector('.user-selection').style.display = 'block';
      
      renderPolls(); // Re-render polls
    }

    // Poll metadata only. Votes never live in here -- see voteKey().
    function normalizePoll(candidate) {
      if (!candidate || typeof candidate !== 'object') return null;
      if (typeof candidate.question !== 'string' || !candidate.question.trim()) return null;
      if (!Array.isArray(candidate.options) || candidate.options.length < 2) return null;
      const options = candidate.options
        .map((o) => (o && typeof o.text === 'string' ? { text: o.text } : null))
        .filter(Boolean);
      if (options.length < 2) return null;
      return {
        id: String(candidate.id != null ? candidate.id : newPollId()),
        question: candidate.question,
        options,
        createdBy: typeof candidate.createdBy === 'string' ? candidate.createdBy : 'Anonymous',
        createdAt: typeof candidate.createdAt === 'string' ? candidate.createdAt : new Date().toISOString()
      };
    }

    async function loadData() {
      polls = [];
      votes = {};
      dataLoaded = false;

      if (!PLATFORM_AVAILABLE) {
        showError('Shared storage unavailable — install this widget through Admin > Widgets.');
        return;
      }

      try {
        const all = await STORAGE.list();
        const documents = all && typeof all === 'object' && !Array.isArray(all) ? all : {};

        const stored = documents[POLLS_KEY];
        polls = Array.isArray(stored) ? stored.map(normalizePoll).filter(Boolean) : [];

        for (const key of Object.keys(documents)) {
          if (key.indexOf(VOTE_PREFIX) !== 0) continue;
          // v:<pollId>:<userId> — the poll id may itself contain '-', never ':'.
          const rest = key.slice(VOTE_PREFIX.length);
          const split = rest.lastIndexOf(':');
          if (split <= 0) continue;
          const pollId = rest.slice(0, split);
          const userId = rest.slice(split + 1);
          const value = documents[key];
          if (!value || typeof value !== 'object') continue;
          (votes[pollId] = votes[pollId] || {})[userId] = value;
        }

        dataLoaded = true;

        if (polls.length === 0 && documents[MIGRATION_KEY] === undefined) {
          await migrateFromLocalStorage();
          await STORAGE.set(MIGRATION_KEY, { at: new Date().toISOString() });
        }
      } catch (error) {
        console.error('Error loading poll data:', error);
        showError('Error loading saved polls');
        polls = [];
        votes = {};
        dataLoaded = false;
      }
    }

    // Writes the poll list only. Votes are written one key at a time by vote(),
    // so a concurrent vote elsewhere cannot be clobbered by a metadata write.
    async function savePolls() {
      if (!dataLoaded) {
        console.error('Polls: data was never loaded; refusing to overwrite stored polls.');
        showError('Error saving poll data');
        return false;
      }
      try {
        await STORAGE.set(POLLS_KEY, polls);
        return true;
      } catch (error) {
        console.error('Error saving poll data:', error);
        showError('Error saving poll data');
        return false;
      }
    }

    // Polls written before this plugin moved to server storage live in one
    // browser. Imported once; the original key is left intact as a fallback.
    async function migrateFromLocalStorage() {
      let legacy = [];
      try {
        const saved = localStorage.getItem(LEGACY_POLLS_KEY);
        const parsed = saved ? JSON.parse(saved) : null;
        legacy = Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.error('Error reading legacy polls:', error);
        return;
      }
      if (legacy.length === 0) return;

      const imported = [];
      for (const candidate of legacy) {
        const poll = normalizePoll(candidate);
        if (!poll) continue;
        imported.push(poll);

        // Votes were nested per option; fan them out into per-voter keys.
        const optionList = Array.isArray(candidate.options) ? candidate.options : [];
        for (let index = 0; index < optionList.length; index++) {
          const cast = Array.isArray(optionList[index] && optionList[index].votes)
            ? optionList[index].votes : [];
          for (const v of cast) {
            if (!v || v.userId === undefined || v.userId === null) continue;
            const record = {
              o: index,
              u: typeof v.username === 'string' ? v.username : '',
              t: typeof v.timestamp === 'string' ? v.timestamp : new Date().toISOString()
            };
            await STORAGE.set(voteKey(poll.id, v.userId), record);
            (votes[poll.id] = votes[poll.id] || {})[String(v.userId)] = record;
          }
        }
      }

      if (imported.length === 0) return;
      polls = imported;
      await STORAGE.set(POLLS_KEY, polls);
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 5000);
    }

    function showSuccess(message) {
      const successDiv = document.getElementById('successMessage');
      successDiv.textContent = message;
      successDiv.style.display = 'block';
      setTimeout(() => {
        successDiv.style.display = 'none';
      }, 3000);
    }

    function addOption() {
      const container = document.getElementById('optionsContainer');
      const optionCount = container.children.length + 1;
      
      const optionGroup = document.createElement('div');
      optionGroup.className = 'option-input-group';
      
      optionGroup.innerHTML = `
        <input type="text" class="form-input option-input" placeholder="Option ${optionCount}">
        <button type="button" class="remove-option-btn" onclick="removeOption(this)">×</button>
      `;
      
      container.appendChild(optionGroup);
    }

    function removeOption(button) {
      const container = document.getElementById('optionsContainer');
      if (container.children.length > 2) {
        button.parentElement.remove();
      } else {
        showError('A poll must have at least 2 options');
      }
    }

    async function createPoll() {
      const question = document.getElementById('pollQuestion').value.trim();
      const optionInputs = document.querySelectorAll('.option-input');
      
      if (!question) {
        showError('Please enter a poll question');
        return;
      }
      
      const options = [];
      optionInputs.forEach(input => {
        const value = input.value.trim();
        if (value) {
          options.push(value);
        }
      });
      
      if (options.length < 2) {
        showError('Please provide at least 2 options');
        return;
      }
      
      if (editingPollId) {
        const poll = polls.find(p => String(p.id) === editingPollId);
        if (!poll) { showError('That poll no longer exists'); cancelEdit(); return; }
        if (options.length !== poll.options.length) {
          showError('Adding or removing options would invalidate existing votes');
          return;
        }

        const before = { question: poll.question, options: poll.options };
        poll.question = question;
        poll.options = options.map(text => ({ text }));
        if (!await savePolls()) {
          poll.question = before.question;
          poll.options = before.options;
          return;
        }
        cancelEdit();
        renderPolls();
        showSuccess('Poll updated');
        return;
      }

      const poll = {
        id: newPollId(),
        question: question,
        // Metadata carries no votes or counts; both are derived from the
        // per-voter keys at render time.
        options: options.map(option => ({ text: option })),
        createdAt: new Date().toISOString(),
        createdBy: currentUser ? currentUser.username : 'Anonymous'
      };

      const previous = polls;
      polls = [poll].concat(polls);
      if (!await savePolls()) { polls = previous; return; }
      renderPolls();
      
      // Clear form
      document.getElementById('pollQuestion').value = '';
      const container = document.getElementById('optionsContainer');
      container.innerHTML = `
        <div class="option-input-group">
          <input type="text" class="form-input option-input" placeholder="Option 1">
        </div>
        <div class="option-input-group">
          <input type="text" class="form-input option-input" placeholder="Option 2">
        </div>
      `;
      
      showSuccess('Poll created successfully!');
    }

    async function vote(pollId, optionIndex) {
      if (!currentUser) {
        showError('Please select your profile first');
        return;
      }
      if (!dataLoaded) {
        console.error('Polls: data was never loaded; refusing to vote.');
        showError('Error saving vote');
        return;
      }

      const poll = polls.find(p => String(p.id) === String(pollId));
      if (!poll || !poll.options[optionIndex]) return;

      // The voter writes only their own key, so two people voting at once
      // cannot collide. Voting again overwrites that one key, which moves the
      // vote rather than adding a second.
      const userId = String(currentUser.id);
      const previous = pollVotes(poll.id)[userId];
      const moved = previous !== undefined && previous.o !== optionIndex;
      if (previous !== undefined && previous.o === optionIndex) return;

      const record = { o: optionIndex, u: currentUser.username, t: new Date().toISOString() };
      try {
        await STORAGE.set(voteKey(poll.id, userId), record);
      } catch (error) {
        console.error('Error saving vote:', error);
        showError('Error saving vote');
        return;
      }

      (votes[poll.id] = votes[poll.id] || {})[userId] = record;
      renderPolls();
      showSuccess(moved
        ? `Vote moved for ${currentUser.username}`
        : `Vote recorded for ${currentUser.username}!`);
    }

    // The first click arms, the second deletes. confirm() is ignored in the
    // sandboxed iframe the dashboard embeds plugins in -- it returns false, so
    // the original confirm-guarded delete silently did nothing there.
    async function deletePoll(pollId) {
      const id0 = String(pollId);
      if (pendingDeleteId !== id0) {
        pendingDeleteId = id0;
        renderPolls();
        return;
      }
      pendingDeleteId = null;

      if (!dataLoaded) {
        console.error('Polls: data was never loaded; refusing to delete.');
        showError('Error deleting poll');
        return;
      }

      const id = String(pollId);
      const previous = polls;
      polls = polls.filter(p => String(p.id) !== id);
      if (!await savePolls()) { polls = previous; return; }

      // Every v:<pollId>:* key has to go. Left behind they are invisible and
      // count against the 500-keys-per-plugin cap forever.
      const cast = Object.keys(pollVotes(id));
      const results = await Promise.allSettled(cast.map(userId => STORAGE.remove(voteKey(id, userId))));
      delete votes[id];

      const failed = results.filter(r => r.status === 'rejected').length;
      renderPolls();
      if (failed > 0) {
        showError(`Poll deleted, but ${failed} of ${cast.length} votes could not be removed`);
      } else {
        showSuccess('Poll deleted');
      }
    }

    // Editing reuses the create form rather than prompt(): the dashboard embeds
    // plugins in an iframe sandboxed without allow-modals, so prompt() and
    // confirm() are ignored outright and return null / false. Anything built on
    // them silently does nothing.
    //
    // Text only. Votes reference an option *index*, so relabelling is safe while
    // adding or removing an option would silently repoint every vote cast so far
    // -- hence the option inputs are fixed in number while editing.
    function editPoll(pollId) {
      const poll = polls.find(p => String(p.id) === String(pollId));
      if (!poll) return;

      editingPollId = String(poll.id);
      document.getElementById('pollQuestion').value = poll.question;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = poll.options.map((option, index) => `
        <div class="option-input-group">
          <input type="text" class="form-input option-input" placeholder="Option ${index + 1}">
        </div>
      `).join('');
      const inputs = document.querySelectorAll('.option-input');
      poll.options.forEach((option, index) => {
        if (inputs[index]) inputs[index].value = option.text;
      });

      document.getElementById('createPollBtn').textContent = 'Save Changes';
      document.getElementById('cancelEditBtn').style.display = '';
      // Options cannot be added or removed mid-edit without repointing votes.
      const addBtn = document.getElementById('addOptionBtn');
      if (addBtn) addBtn.style.display = 'none';
    }

    function cancelEdit() {
      editingPollId = null;
      document.getElementById('pollQuestion').value = '';
      document.getElementById('optionsContainer').innerHTML = `
        <div class="option-input-group">
          <input type="text" class="form-input option-input" placeholder="Option 1">
        </div>
        <div class="option-input-group">
          <input type="text" class="form-input option-input" placeholder="Option 2">
        </div>
      `;
      document.getElementById('createPollBtn').textContent = 'Create Poll';
      document.getElementById('cancelEditBtn').style.display = 'none';
      const addBtn = document.getElementById('addOptionBtn');
      if (addBtn) addBtn.style.display = '';
      pendingDeleteId = null;
    }

    function getUserVoteForPoll(poll) {
      if (!currentUser) return null;
      const own = pollVotes(poll.id)[String(currentUser.id)];
      return own && typeof own.o === 'number' ? own.o : null;
    }

    function renderPolls() {
      const container = document.getElementById('pollsContainer');
      
      if (polls.length === 0) {
        container.innerHTML = '<div class="no-polls">No polls created yet. Create your first poll above!</div>';
        return;
      }
      
      if (pendingDeleteId && !polls.some(p => String(p.id) === pendingDeleteId)) {
        pendingDeleteId = null;
      }

      container.innerHTML = polls.map(poll => {
        const userVoteIndex = getUserVoteForPoll(poll);
        const hasVoted = userVoteIndex !== null;
        const { counts, total } = voteCountsFor(poll);
        const pollId = escapeHtml(String(poll.id));
        const armed = pendingDeleteId === String(poll.id);

        return `
          <div class="poll-item">
            <div class="poll-question">${escapeHtml(poll.question)}</div>
            
            ${!hasVoted && currentUser ? `
              <div class="poll-options">
                ${poll.options.map((option, index) => `
                  <div class="poll-option" onclick="vote('${pollId}', ${index})">
                    <input type="radio" name="poll_${pollId}" value="${index}">
                    <span>${escapeHtml(option.text)}</span>
                  </div>
                `).join('')}
              </div>
            ` : `
              <div class="poll-results">
                ${poll.options.map((option, index) => {
                  const voters = counts[index] || [];
                  const percentage = total > 0 ? Math.round((voters.length / total) * 100) : 0;
                  const isUserVote = index === userVoteIndex;
                  
                  return `
                    <div class="result-bar">
                      <div class="result-label">${escapeHtml(option.text)}${isUserVote ? ' ✓' : ''}</div>
                      <div class="result-progress">
                        <div class="result-fill" style="width: ${percentage}%"></div>
                      </div>
                      <div class="result-percentage">${percentage}%</div>
                    </div>
                    ${voters.length > 0 ? `
                      <div class="voter-list">
                        Voted by: ${voters.map(name => escapeHtml(name)).join(', ')}
                      </div>
                    ` : ''}
                  `;
                }).join('')}
              </div>
            `}
            
            ${!currentUser ? '<div style="text-align: center; color: rgba(255,255,255,0.7); font-style: italic; margin: 1rem 0;">Select your profile above to vote</div>' : ''}
            
            <div class="poll-meta">
              Total votes: ${total} | Created by: ${escapeHtml(poll.createdBy)} | ${new Date(poll.createdAt).toLocaleDateString()}
              <button type="button" class="custom-button" onclick="editPoll('${pollId}')" style="margin-left: 1rem; font-size: 0.7rem; padding: 4px 8px;">Edit</button>
              <button type="button" class="custom-button" onclick="deletePoll('${pollId}')" style="margin-left: 0.5rem; font-size: 0.7rem; padding: 4px 8px;${armed ? ' background: #ff6b6b !important;' : ''}">${armed ? 'Confirm delete' : 'Delete'}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
