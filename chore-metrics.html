<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chore Metrics</title>
  <link rel="stylesheet" href="/index.css">

  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "chore-metrics",
    "name": "Chore Metrics",
    "version": "1.1.0",
    "description": "Turns HomeGlow's chore history into charts: an activity heatmap, per-person completion counts, rates and streaks, how each chore is going for each person, the chores done most often, and clams earned against clams spent over the last 7, 30 or 90 days.",
    "category": "chores-rewards",
    "author": "HomeGlow",
    "apiVersion": "v1",
    "storage": true,
    "settings": [
      { "key": "defaultRange", "label": "Time range (days)", "type": "select",
        "options": ["7", "30", "90"], "default": "30", "scope": "device" },
      { "key": "showHeatmap", "label": "Show activity heatmap", "type": "boolean",
        "default": true, "scope": "device" },
      { "key": "showSpending", "label": "Show clams earned vs spent", "type": "boolean",
        "default": true, "scope": "household" }
    ],
    "hideableControls": [
      { "id": "peopleSettings", "label": "Choose who is shown" }
    ],
    "events": ["chore.completed", "chore.uncompleted", "clam.deposited", "clam.withdrawn"]
  }
  </script>

  <style>
    /* Color strategy: the host accent is user-configurable, so nothing here
       depends on distinguishing two saturated hues. Magnitude = one hue
       (accent) stepped by alpha; the second series (spent) is a texture-striped
       neutral — identity is carried by pattern + legend, never color alone.

       Type, borders, corners, buttons and the bars read the theme's roles
       (docs/guides/plugin-development.md), each falling back to the look from
       before themes. Borders read --border, which the dashboard sends;
       --card-border never reached plugins. Quiet text takes --text-secondary
       rather than an opacity.

       No color-scheme of our own. The dashboard declares none, and a frame
       whose scheme differs from the page around it is painted opaque: with
       "light dark", a computer in dark mode got a black tile on a light theme.
       No background either: the dashboard's frame draws it. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      color: var(--text, #333);
      font-family: var(--hg-font-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
      font-size: 14px;
    }
    h2 {
      margin: 0; font-size: 1.05rem;
      font-family: var(--hg-font-heading, inherit);
      text-transform: var(--hg-heading-transform, none);
      letter-spacing: var(--hg-heading-letter-spacing, normal);
    }
    .quiet { color: var(--text-secondary, color-mix(in srgb, currentColor 65%, transparent)); }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; position: relative; }
    .header .tools { display: flex; align-items: center; gap: 6px; }
    .header select { height: 28px; }
    .header select, .chore-filter {
      background: transparent; color: inherit;
      border: 1px solid var(--border, var(--card-border, rgba(127,127,127,.35)));
      border-radius: var(--hg-radius-sm, 6px); padding: 3px 6px; font: inherit; font-size: .8rem;
    }
    /* A drawn gear rather than the ⚙ character: a glyph sits on the text
       baseline and lands off-center by a different amount in every theme's
       font. */
    .gear {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; padding: 0;
      background: transparent; color: inherit; cursor: pointer;
      border: 1px solid var(--hg-button-quiet-border, var(--border, var(--card-border, rgba(127,127,127,.35))));
      border-radius: var(--hg-button-radius, 6px);
    }
    .gear svg { width: 16px; height: 16px; display: block; }
    .gear[aria-expanded="true"] { background: rgba(var(--accent-rgb, 110,68,255), .14); }
    .people-panel {
      position: absolute; right: 0; top: calc(100% + 6px); z-index: 2; min-width: 190px;
      background: var(--surface, var(--card-bg, #fff));
      border: 1px solid var(--border, var(--card-border, rgba(127,127,127,.35)));
      border-radius: var(--hg-radius-md, 10px); padding: 10px 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }
    .people-panel[hidden] { display: none; }
    .people-panel .panel-title { font-size: .72rem; font-weight: 600; margin-bottom: 6px; }
    .people-panel label { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: .85rem; cursor: pointer; }
    .people-panel input { width: 16px; height: 16px; accent-color: rgb(var(--accent-rgb, 110,68,255)); }
    .section-title {
      font-size: .72rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; margin: 16px 0 8px;
      font-family: var(--hg-font-heading, inherit);
      color: var(--text-secondary, color-mix(in srgb, currentColor 60%, transparent));
    }
    .muted { color: var(--text-secondary, color-mix(in srgb, currentColor 60%, transparent)); }
    .empty { color: var(--text-secondary, color-mix(in srgb, currentColor 60%, transparent)); font-size: .85rem; padding: 12px 0; }

    /* Stat tiles */
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .tile {
      border: 1px solid var(--border, var(--card-border, rgba(127,127,127,.25)));
      border-radius: var(--hg-radius-md, 10px); padding: 10px 12px;
    }
    .tile .kid { font-weight: 700; font-size: .85rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .tile .kid::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: rgba(var(--accent-rgb, 110,68,255), .9); flex-shrink: 0;
    }
    .tile .big { font-size: 1.45rem; font-weight: 700; line-height: 1.1; }
    .tile .row { display: flex; justify-content: space-between; font-size: .74rem; margin-top: 4px; }
    .tile .row .v { font-weight: 600; }
    .streak-fire { font-size: .74rem; }

    /* Highlight chip */
    .highlight {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
      border: 1px solid rgba(var(--accent-rgb, 110,68,255), .5);
      background: rgba(var(--accent-rgb, 110,68,255), .12);
      border-radius: 999px; padding: 4px 12px; font-size: .78rem; font-weight: 600;
    }
    .vacation-note {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; margin-left: 8px;
      border: 1px solid var(--border, var(--card-border, rgba(127,127,127,.3)));
      border-radius: 999px; padding: 4px 12px; font-size: .78rem;
      color: var(--text-secondary, color-mix(in srgb, currentColor 75%, transparent));
    }

    /* Heatmap: sequential single hue, 2px cell gaps, rounded cells */
    .heatmap { display: flex; gap: 8px; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
    .heatmap svg { display: block; }
    .heatmap-legend { display: flex; align-items: center; gap: 3px; font-size: .68rem; margin-top: 4px; color: var(--text-secondary, color-mix(in srgb, currentColor 70%, transparent)); }
    .heatmap-legend .cell { width: 10px; height: 10px; border-radius: 2px; }

    /* Bar lists: thin marks, rounded data end, 2px gaps, value labels in ink */
    .bar-row { display: grid; grid-template-columns: minmax(70px, 30%) 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; font-size: .8rem; }
    .bar-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { min-height: 12px; display: flex; align-items: center; }
    .bar-fill {
      height: var(--hg-meter-thickness, 10px); border-radius: 0 4px 4px 0; min-width: 2px;
      background: var(--hg-meter-fill, rgba(var(--accent-rgb, 110,68,255), .9));
    }
    .bar-fill.spent {
      background: repeating-linear-gradient(45deg,
        currentColor 0 3px, transparent 3px 6px);
      opacity: .55;
    }
    .bar-row .value { font-variant-numeric: tabular-nums; font-weight: 600; font-size: .76rem; }

    .legend { display: flex; gap: 14px; font-size: .72rem; margin-bottom: 8px; color: var(--text-secondary, color-mix(in srgb, currentColor 80%, transparent)); }
    .legend .swatch { display: inline-block; width: 12px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
    .legend .swatch.earned { background: var(--hg-meter-fill, rgba(var(--accent-rgb, 110,68,255), .9)); }
    .legend .swatch.spent {
      background: repeating-linear-gradient(45deg, currentColor 0 3px, transparent 3px 6px);
      opacity: .55;
    }

    /* Accessible table view */
    details.table-view { margin-top: 14px; font-size: .78rem; }
    details.table-view summary { cursor: pointer; color: var(--text-secondary, color-mix(in srgb, currentColor 70%, transparent)); }
    details.table-view table { border-collapse: collapse; margin-top: 8px; width: 100%; }
    details.table-view th, details.table-view td {
      text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--border, var(--card-border, rgba(127,127,127,.2)));
      font-variant-numeric: tabular-nums;
    }
    details.table-view th { font-weight: 600; color: var(--text-secondary, color-mix(in srgb, currentColor 70%, transparent)); }

    /* By chore: one block per chore, a line per person. Done is a filled dot,
       missed a hollow ring, so the two never rely on color alone. */
    .by-chore-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 8px; }
    .by-chore-head .section-title { margin: 0; }
    .chore-block { margin-bottom: 12px; }
    .chore-name { font-weight: 600; font-size: .85rem; margin-bottom: 4px; }
    .chore-row { display: grid; grid-template-columns: minmax(60px, 22%) 1fr; gap: 4px 10px; align-items: center; font-size: .8rem; padding: 2px 0; }
    .chore-row .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chore-row .what { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    .dots { display: inline-flex; flex-wrap: wrap; gap: 3px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.done { background: var(--hg-meter-fill, rgba(var(--accent-rgb, 110,68,255), .9)); }
    .dot.missed { border: 1.5px solid var(--text-secondary, color-mix(in srgb, currentColor 55%, transparent)); }
    .chore-row .stat { font-variant-numeric: tabular-nums; }
    .chore-row .stat b { font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <h2>📊 Chore Metrics</h2>
    <div class="tools">
      <select id="range" aria-label="Time range">
        <option value="7">7 days</option>
        <option value="30">30 days</option>
        <option value="90">90 days</option>
      </select>
      <button type="button" class="gear" id="people-gear" aria-label="Choose who is shown"
              aria-expanded="false" aria-controls="people-panel" title="Choose who is shown"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9" stroke-width="3.2" stroke-dasharray="3.53 3.53"/><circle cx="12" cy="12" r="5.6" stroke-width="3"/></svg></button>
    </div>
    <div class="people-panel" id="people-panel" hidden></div>
  </div>
  <script>
    // Control limits: drop the people gear at parse time, before it paints,
    // when this display hides it. No hide param means hide nothing.
    (function () {
      var hidden = (new URLSearchParams(location.search).get('hide') || '').split(',');
      if (hidden.indexOf('peopleSettings') !== -1) {
        var gear = document.getElementById('people-gear');
        var panel = document.getElementById('people-panel');
        if (gear) gear.remove();
        if (panel) panel.remove();
      }
    })();
  </script>

  <div id="content"><div class="empty">Loading…</div></div>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
  (function () {
    'use strict';

    var state = {
      users: [], history: [], schedules: [], rangeDays: 30, settings: null, hasKind: false, vacation: null,
      // User ids hidden on this display. Kept as the chore widget keeps its
      // own: ids, so a rename changes nothing, set only from the gear, and
      // not a declared setting, which the Admin Panel would show as a raw
      // field. Stored per display in the plugin's storage (peopleKey).
      // Hidden rather than shown, so someone added later appears without a
      // visit to the gear.
      hiddenPeople: [],
      choreFilter: ''
    };
    var refetchTimer = null;

    // ---------- utilities ----------
    function dateStr(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function daysAgo(n) { var d = new Date(); d.setDate(d.getDate() - n); return d; }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function fetchJson(url) {
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
        return r.json();
      });
    }

    // Graceful degradation: pre-migration-20 servers return rows without
    // `kind`. Classify with the legacy heuristics so counts/streaks/heatmap
    // still work; rate and spending tiles are hidden (hasKind = false).
    function kindOf(row) {
      if (row.kind) return row.kind;
      if (row.title === 'Regular chores' && row.chore_schedule_id == null) return 'daily_bonus';
      if (row.title === 'Transfer bonus') return 'transfer_bonus';
      if (row.title === 'Adjustment') return 'adjustment';
      return 'completion';
    }

    function isShown(userId) { return state.hiddenPeople.indexOf(Number(userId)) === -1; }

    // This display's storage key. Storage keys allow only A-Za-z0-9 : _ . -
    // and 128 characters, and display names are free text, so anything else
    // (and "_" itself) is written as _ and its UTF-8 bytes in hex. A name too
    // long for that is hashed. No device (a direct load): nothing is saved.
    var deviceName = new URLSearchParams(location.search).get('device') || '';
    function peopleKey() {
      if (!deviceName) return null;
      var enc = Array.prototype.map.call(unescape(encodeURIComponent(deviceName)), function (ch) {
        return /[A-Za-z0-9.-]/.test(ch) ? ch : '_' + ('0' + ch.charCodeAt(0).toString(16)).slice(-2);
      }).join('');
      var key = 'people:' + enc;
      if (key.length <= 128) return key;
      var h = 2166136261;
      for (var i = 0; i < deviceName.length; i++) { h ^= deviceName.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
      return 'people:#' + h.toString(16);
    }
    // People this display shows, in the household's order. The bonus
    // pseudo-user (id 0) is never a person.
    function shownUsers() {
      return state.users.filter(function (u) { return u.id !== 0 && isShown(u.id); });
    }

    // Vacation days (issues #121/#72): the household `vacation_mode` setting.
    // While active, the server skips missed logging and this plugin treats the
    // days as NEUTRAL for streaks — they neither extend nor break a run.
    // Note: only date-bounded vacations bridge PAST gaps; a bare toggle
    // bridges while it stays enabled.
    function isVacationDay(d) {
      var v = state.vacation;
      if (!v || v.enabled !== true) return false;
      if (v.startDate && d < v.startDate) return false;
      if (v.endDate && d > v.endDate) return false;
      return true;
    }

    // ---------- metrics ----------
    function computeMetrics() {
      var perKid = {};
      shownUsers().forEach(function (u) {
        perKid[u.id] = {
          name: u.username, completions: 0, missed: 0,
          bonusDates: [], earned: 0, spent: 0,
          firstHalf: 0, secondHalf: 0, byDay: {}
        };
      });

      var mid = dateStr(daysAgo(Math.floor(state.rangeDays / 2)));
      var byDayHousehold = {};

      state.history.forEach(function (row) {
        var kid = perKid[row.user_id];
        if (!kid) return;
        var kind = kindOf(row);
        if (kind === 'completion') {
          kid.completions++;
          kid.byDay[row.date] = (kid.byDay[row.date] || 0) + 1;
          byDayHousehold[row.date] = (byDayHousehold[row.date] || 0) + 1;
          if (row.date < mid) kid.firstHalf++; else kid.secondHalf++;
        } else if (kind === 'missed') {
          kid.missed++;
        } else if (kind === 'daily_bonus') {
          kid.bonusDates.push(row.date);
        }
        if (kind === 'spent') kid.spent += -row.clam_value;
        else if (row.clam_value > 0) kid.earned += row.clam_value;
      });

      Object.keys(perKid).forEach(function (id) {
        var kid = perKid[id];
        var streaks = computeStreaks(kid.bonusDates);
        kid.currentStreak = streaks.current;
        kid.longestStreak = streaks.longest;
      });

      return { perKid: perKid, byDayHousehold: byDayHousehold };
    }

    // Streaks from all-chores-done days (daily_bonus rows). Vacation days are
    // neutral: skipped, never a break. "Current" = a run reaching today,
    // yesterday, or bridged to them by vacation days.
    function computeStreaks(dates) {
      var set = {};
      dates.forEach(function (d) { set[d] = true; });

      var longest = 0, run = 0;
      for (var i = state.rangeDays; i >= 0; i--) {
        var d = dateStr(daysAgo(i));
        if (set[d]) { run++; if (run > longest) longest = run; }
        else if (isVacationDay(d)) { /* neutral: keep the run alive */ }
        else run = 0;
      }

      // Today isn't over — start counting from yesterday unless today already
      // has a bonus or is a vacation day.
      var offset = 0;
      var today = dateStr(daysAgo(0));
      if (!set[today] && !isVacationDay(today)) offset = 1;

      var current = 0;
      while (offset <= state.rangeDays) {
        var day = dateStr(daysAgo(offset));
        if (set[day]) { current++; offset++; }
        else if (isVacationDay(day)) { offset++; }
        else break;
      }
      return { current: current, longest: longest };
    }

    // ---------- renderers ----------
    function renderTiles(perKid) {
      var kids = Object.values(perKid);
      if (!kids.length) return '<div class="empty">No family members yet.</div>';
      return '<div class="tiles">' + kids.map(function (kid) {
        var rate = '';
        if (state.hasKind && (kid.completions + kid.missed) > 0 && kid.missed + kid.completions > 0) {
          // Honest rate: only when missed data exists in-range (or genuinely 0 missed with kind support).
          var pct = Math.round(100 * kid.completions / (kid.completions + kid.missed));
          rate = '<div class="row"><span>Completion rate</span><span class="v">' + pct + '%</span></div>';
        }
        return '<div class="tile">' +
          '<div class="kid">' + esc(kid.name) + '</div>' +
          '<div class="big">' + kid.completions + '</div>' +
          '<div class="row muted"><span>chores done</span><span></span></div>' +
          rate +
          '<div class="row"><span>Streak <span class="streak-fire">🔥</span></span><span class="v">' + kid.currentStreak + ' now · ' + kid.longestStreak + ' best</span></div>' +
          '</div>';
      }).join('') + '</div>';
    }

    // GitHub-style heatmap: sequential single hue (accent) stepped by alpha.
    function renderHeatmap(byDay) {
      var weeks = Math.min(Math.ceil(state.rangeDays / 7), 13);
      var cell = 13, gap = 2;
      var todayDow = new Date().getDay();
      var svg = '';
      var max = 1;
      Object.values(byDay).forEach(function (v) { if (v > max) max = v; });
      var steps = [0.0, 0.25, 0.45, 0.7, 0.95];

      for (var w = 0; w < weeks; w++) {
        for (var dow = 0; dow < 7; dow++) {
          var offset = (weeks - 1 - w) * 7 + (todayDow - dow >= 0 ? todayDow - dow : todayDow - dow + 7);
          if (offset < 0 || offset > state.rangeDays) continue;
          var d = dateStr(daysAgo(offset));
          var count = byDay[d] || 0;
          var stepIdx = count === 0 ? 0 : Math.min(4, 1 + Math.floor(3 * (count - 1) / max));
          var fill = stepIdx === 0
            ? 'rgba(127,127,127,0.12)'
            : 'rgba(var(--accent-rgb, 110,68,255),' + steps[stepIdx] + ')';
          var vacationMark = isVacationDay(d) && count === 0 ? ' 🌴 vacation' : '';
          svg += '<rect x="' + (w * (cell + gap)) + '" y="' + (dow * (cell + gap)) + '"' +
            ' width="' + cell + '" height="' + cell + '" rx="2" fill="' + fill + '">' +
            '<title>' + d + ': ' + count + ' chore' + (count === 1 ? '' : 's') + ' completed' + vacationMark + '</title></rect>';
        }
      }
      var width = weeks * (cell + gap);
      var height = 7 * (cell + gap);
      return '<div class="heatmap"><div>' +
        '<svg width="' + width + '" height="' + height + '" role="img" aria-label="Daily chore completions heatmap">' + svg + '</svg>' +
        '<div class="heatmap-legend">Less ' +
        steps.map(function (s, i) {
          var c = i === 0 ? 'rgba(127,127,127,0.12)' : 'rgba(var(--accent-rgb, 110,68,255),' + s + ')';
          return '<span class="cell" style="background:' + c + '"></span>';
        }).join('') +
        ' More</div></div></div>';
    }

    function renderTopChores() {
      var counts = {};
      state.history.forEach(function (row) {
        if (kindOf(row) !== 'completion' || !row.title || !isShown(row.user_id)) return;
        counts[row.title] = (counts[row.title] || 0) + 1;
      });
      var top = Object.entries(counts).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 5);
      if (!top.length) return '<div class="empty">No completions in this period yet.</div>';
      var max = top[0][1];
      return top.map(function (entry) {
        var pct = Math.max(4, Math.round(100 * entry[1] / max));
        return '<div class="bar-row" title="' + esc(entry[0]) + ': ' + entry[1] + ' completions">' +
          '<span class="label">' + esc(entry[0]) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%"></span></span>' +
          '<span class="value">' + entry[1] + '</span></div>';
      }).join('');
    }

    // Earned vs spent: accent fill vs texture-striped neutral — identity is
    // pattern + legend, never hue alone (the accent is user-configurable).
    function renderSpending(perKid) {
      var kids = Object.values(perKid).filter(function (k) { return k.earned > 0 || k.spent > 0; });
      if (!kids.length) return '<div class="empty">No clam activity in this period.</div>';
      var max = 1;
      kids.forEach(function (k) { max = Math.max(max, k.earned, k.spent); });
      var html = '<div class="legend">' +
        '<span><span class="swatch earned"></span>Earned</span>' +
        '<span><span class="swatch spent"></span>Spent</span></div>';
      kids.forEach(function (kid) {
        var earnedPct = Math.max(2, Math.round(100 * kid.earned / max));
        var spentPct = Math.max(2, Math.round(100 * kid.spent / max));
        html += '<div class="bar-row" title="' + esc(kid.name) + ' earned ' + kid.earned + ', spent ' + kid.spent + '">' +
          '<span class="label">' + esc(kid.name) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="width:' + earnedPct + '%"></span></span>' +
          '<span class="value">+' + kid.earned + '</span></div>';
        html += '<div class="bar-row">' +
          '<span class="label muted"></span>' +
          '<span class="bar-track"><span class="bar-fill spent" style="width:' + spentPct + '%"></span></span>' +
          '<span class="value muted">−' + kid.spent + '</span></div>';
      });
      return html;
    }

    function renderImprover(perKid) {
      if (state.rangeDays < 7) return '';
      var best = null;
      Object.values(perKid).forEach(function (kid) {
        var delta = kid.secondHalf - kid.firstHalf;
        if (delta > 0 && (!best || delta > best.delta)) best = { name: kid.name, delta: delta };
      });
      if (!best) return '';
      return '<div class="highlight">⭐ Biggest improver: ' + esc(best.name) +
        ' (+' + best.delta + ' vs earlier)</div>';
    }

    // ---------- by chore ----------
    // How each chore is going for each person, from the same history rows.
    // The server's nightly job writes a missed row only for an assigned,
    // no-clam chore that was due that day, so the history itself says which
    // days counted:
    //  - A recurring chore keeps one schedule, with a done or missed row for
    //    each day it was due. In date order those rows are its scheduled
    //    days, so a streak is the trailing run of completions and a day it
    //    wasn't due can never break one.
    //  - Until-done, one-time and follow-up chores are one-time schedules,
    //    with a missed row for every day left open and a done row when
    //    finished. Each schedule is one occurrence, counted once.
    //  - Paid and unassigned chores get no missed rows, so only completions
    //    can be shown for them.
    // Done one-time schedules are deleted overnight, and their rows lose their
    // schedule id. Those rows are read as occurrences in date order: each
    // completion closes one, after however many days it was missed. Without
    // the schedule, chores are grouped by title, so a renamed chore shows as
    // two.
    function computeByChore() {
      var schedulesById = {};
      state.schedules.forEach(function (sc) { schedulesById[sc.id] = sc; });

      // A deleted schedule with more than one completion was recurring: a
      // one-time schedule is done at most once.
      var completionsBySchedule = {};
      state.history.forEach(function (row) {
        if (kindOf(row) === 'completion' && row.chore_schedule_id != null) {
          completionsBySchedule[row.chore_schedule_id] = (completionsBySchedule[row.chore_schedule_id] || 0) + 1;
        }
      });
      function isRecurring(scheduleId) {
        var sc = schedulesById[scheduleId];
        if (sc) return sc.crontab != null;
        return (completionsBySchedule[scheduleId] || 0) > 1;
      }

      var chores = {};
      state.history.forEach(function (row) {
        var kind = kindOf(row);
        if (kind !== 'completion' && kind !== 'missed') return;
        if (!row.title || !isShown(row.user_id)) return;
        var title = String(row.title).trim();
        var chore = chores[title] || (chores[title] = { title: title, people: {} });
        var person = chore.people[row.user_id] ||
          (chore.people[row.user_id] = { userId: row.user_id, days: [], occurrences: {}, loose: [], tracked: false });
        // Misses are tracked when the server logs them: an assigned chore
        // with no clams. A missed row proves it even after its schedule is
        // gone; a chore never missed in the range proves it by its schedule.
        var sc = row.chore_schedule_id != null ? schedulesById[row.chore_schedule_id] : null;
        if (kind === 'missed' || (sc && Number(sc.clam_value) === 0 && sc.user_id != null)) person.tracked = true;
        var sid = row.chore_schedule_id;
        if (sid == null) {
          person.loose.push({ date: row.date, done: kind === 'completion' });
        } else if (!isRecurring(sid)) {
          var occ = person.occurrences[sid] || (person.occurrences[sid] = { done: false, daysLate: 0, open: false });
          if (kind === 'completion') occ.done = true; else occ.daysLate++;
        } else {
          person.days.push({ date: row.date, done: kind === 'completion' });
        }
      });

      // An occurrence still on the board, not yet done, is open.
      Object.keys(chores).forEach(function (title) {
        Object.keys(chores[title].people).forEach(function (uid) {
          var person = chores[title].people[uid];
          Object.keys(person.occurrences).forEach(function (sid) {
            var occ = person.occurrences[sid];
            if (!occ.done && schedulesById[sid]) occ.open = true;
          });
          person.days.sort(byDate);
          // Rows whose schedule is gone: a completion closes an occurrence;
          // misses with no completion after them ended undone.
          var late = 0, n = 0;
          person.loose.sort(byDate).forEach(function (row) {
            if (row.done) { person.occurrences['gone' + (n++)] = { done: true, daysLate: late, open: false }; late = 0; }
            else late++;
          });
          if (late) person.occurrences['gone' + n] = { done: false, daysLate: late, open: false };
        });
      });
      return chores;
    }

    function byDate(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }

    function dayStats(days) {
      var done = 0, missed = 0, run = 0, best = 0;
      days.forEach(function (d) {
        if (d.done) { done++; run++; if (run > best) best = run; } else { missed++; run = 0; }
      });
      return { done: done, missed: missed, current: run, best: best };
    }

    function median(values) {
      if (!values.length) return 0;
      var v = values.slice().sort(function (a, b) { return a - b; });
      return v[Math.floor((v.length - 1) / 2)];
    }

    var MAX_DOTS = 20;
    function renderPersonRow(name, person) {
      var parts = [];
      // Without missed rows (paid or unassigned chores, or an older server)
      // a rate or a lateness would read as perfect, so show completions only.
      var tracked = state.hasKind && person.tracked;
      if (person.days.length) {
        var st = dayStats(person.days);
        var shown = person.days.slice(-MAX_DOTS);
        var dots = shown.map(function (d) {
          return '<span class="dot ' + (d.done ? 'done' : 'missed') + '" title="' + esc(d.date) + ': ' +
            (d.done ? 'done' : 'missed') + '"></span>';
        }).join('');
        parts.push('<span class="dots" role="img" aria-label="' + st.done + ' done, ' + st.missed +
          ' missed">' + dots + '</span>');
        if (tracked) {
          parts.push('<span class="stat"><b>' + st.done + '</b> of ' + (st.done + st.missed) + '</span>');
          parts.push('<span class="stat">🔥 ' + st.current + ' <span class="quiet">(best ' + st.best + ')</span></span>');
        } else {
          parts.push('<span class="stat"><b>' + st.done + '</b> done <span class="quiet">(misses aren\u2019t tracked for this chore)</span></span>');
        }
      }
      var occs = Object.keys(person.occurrences).map(function (k) { return person.occurrences[k]; });
      if (occs.length) {
        var done = occs.filter(function (o) { return o.done; });
        var open = occs.filter(function (o) { return o.open; }).length;
        var undone = occs.length - done.length - open;
        var text = '<b>' + done.length + '</b> done';
        if (open) text += ' · ' + open + ' open';
        if (undone) text += ' · ' + undone + ' not done';
        // Lateness comes from missed rows, so only where misses are logged.
        if (!tracked) {
          text += ' <span class="quiet">(misses aren\u2019t tracked for this chore)</span>';
        } else if (done.length) {
          var late = median(done.map(function (o) { return o.daysLate; }));
          text += ' <span class="quiet">(' + (late === 0 ? 'usually on time' :
            'usually ' + late + ' day' + (late === 1 ? '' : 's') + ' late') + ')</span>';
        }
        parts.push('<span class="stat">' + text + '</span>');
      }
      return '<div class="chore-row"><span class="who">' + esc(name) + '</span><span class="what">' +
        parts.join('') + '</span></div>';
    }

    function renderByChore() {
      var chores = computeByChore();
      var titles = Object.keys(chores).sort(function (a, b) { return a.localeCompare(b); });
      if (state.choreFilter && titles.indexOf(state.choreFilter) === -1) state.choreFilter = '';
      var options = '<option value="">All chores</option>' + titles.map(function (t) {
        return '<option value="' + esc(t) + '"' + (t === state.choreFilter ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('');
      var head = '<div class="by-chore-head"><div class="section-title">By chore</div>' +
        (titles.length ? '<select class="chore-filter" id="chore-filter" aria-label="Chore">' + options + '</select>' : '') +
        '</div>';
      if (!titles.length) return head + '<div class="empty">No chores done or missed in this period.</div>';

      var names = {};
      state.users.forEach(function (u) { names[u.id] = u.username; });
      var order = {};
      state.users.forEach(function (u, i) { order[u.id] = i; });
      var shownTitles = state.choreFilter ? [state.choreFilter] : titles;
      return head + shownTitles.map(function (title) {
        var people = chores[title].people;
        var ids = Object.keys(people).sort(function (a, b) { return (order[a] || 0) - (order[b] || 0); });
        return '<div class="chore-block"><div class="chore-name">' + esc(title) + '</div>' +
          ids.map(function (id) { return renderPersonRow(names[id] || ('#' + id), people[id]); }).join('') +
          '</div>';
      }).join('');
    }

    function renderVacationNote() {
      var today = dateStr(daysAgo(0));
      if (!isVacationDay(today)) return '';
      return '<div class="vacation-note">🌴 Vacation mode — missed chores paused, streaks safe</div>';
    }

    function renderTable(perKid) {
      var kids = Object.values(perKid);
      if (!kids.length) return '';
      var rateHeader = state.hasKind ? '<th>Missed</th><th>Rate</th>' : '';
      var rows = kids.map(function (kid) {
        var rateCells = state.hasKind
          ? '<td>' + kid.missed + '</td><td>' + ((kid.completions + kid.missed) ? Math.round(100 * kid.completions / (kid.completions + kid.missed)) + '%' : '—') + '</td>'
          : '';
        return '<tr><td>' + esc(kid.name) + '</td><td>' + kid.completions + '</td>' + rateCells +
          '<td>' + kid.currentStreak + '</td><td>' + kid.longestStreak + '</td>' +
          '<td>+' + kid.earned + '</td><td>−' + kid.spent + '</td></tr>';
      }).join('');
      return '<details class="table-view"><summary>View as table</summary><table>' +
        '<tr><th>Kid</th><th>Done</th>' + rateHeader + '<th>Streak</th><th>Best</th><th>Earned</th><th>Spent</th></tr>' +
        rows + '</table></details>';
    }

    function render() {
      if (state.users.length && !shownUsers().length) {
        document.getElementById('content').innerHTML =
          '<div class="empty">Everyone is hidden on this display.' +
          (document.getElementById('people-gear') ? ' Use the gear to choose who is shown.' : '') + '</div>';
        return;
      }
      var metrics = computeMetrics();
      var showHeatmap = !state.settings || state.settings.showHeatmap !== false;
      var showSpending = !state.settings || state.settings.showSpending !== false;

      var html = renderTiles(metrics.perKid);
      html += renderImprover(metrics.perKid);
      html += renderVacationNote();
      if (showHeatmap) {
        html += '<div class="section-title">Activity — last ' + state.rangeDays + ' days</div>';
        html += renderHeatmap(metrics.byDayHousehold);
      }
      html += renderByChore();
      html += '<div class="section-title">Top chores</div>' + renderTopChores();
      if (showSpending && state.hasKind) {
        html += '<div class="section-title">Clams earned vs spent</div>' + renderSpending(metrics.perKid);
      }
      html += renderTable(metrics.perKid);
      document.getElementById('content').innerHTML = html;
      var filter = document.getElementById('chore-filter');
      if (filter) {
        filter.addEventListener('change', function () {
          state.choreFilter = filter.value;
          render();
          var again = document.getElementById('chore-filter');
          if (again) again.focus();
        });
      }
    }

    // ---------- data ----------
    function loadData() {
      var from = dateStr(daysAgo(state.rangeDays));
      var to = dateStr(daysAgo(0));
      return Promise.all([
        fetchJson('/api/users'),
        fetchJson('/api/chore-history?date_from=' + from + '&date_to=' + to),
        fetchJson('/api/settings').catch(function () { return {}; }),
        fetchJson('/api/chore-schedules').catch(function () { return []; })
      ]).then(function (results) {
        state.users = results[0] || [];
        state.history = results[1] || [];
        state.schedules = Array.isArray(results[3]) ? results[3] : [];
        state.hasKind = state.history.length === 0 || state.history.some(function (r) { return r.kind !== undefined; });
        state.vacation = null;
        try {
          // /api/settings may return the value pre-parsed (object) or raw (string).
          var vm = results[2] && results[2].vacation_mode;
          if (typeof vm === 'string') vm = JSON.parse(vm);
          if (vm && typeof vm === 'object') state.vacation = vm;
        } catch (e) { state.vacation = null; }
        render();
        renderPeoplePanel();
      }).catch(function (error) {
        document.getElementById('content').innerHTML =
          '<div class="empty">Could not load chore data (' + esc(error.message) + ')</div>';
      });
    }

    // ---------- people gear ----------
    // Ids of people who no longer exist are dropped as they're saved, as the
    // chore widget's pruneHiddenUserIds does.
    function prunedHiddenPeople() {
      var known = {};
      state.users.forEach(function (u) { known[u.id] = true; });
      return state.hiddenPeople.filter(function (id) { return known[id]; });
    }

    function renderPeoplePanel() {
      var panel = document.getElementById('people-panel');
      if (!panel) return;
      var people = state.users.filter(function (u) { return u.id !== 0; });
      panel.innerHTML = '<div class="panel-title">Show on this display</div>' +
        (people.length ? people.map(function (u) {
          return '<label><input type="checkbox" data-user="' + u.id + '"' + (isShown(u.id) ? ' checked' : '') +
            '>' + esc(u.username) + '</label>';
        }).join('') : '<div class="empty">No family members yet.</div>');
      Array.prototype.forEach.call(panel.querySelectorAll('input[data-user]'), function (box) {
        box.addEventListener('change', function () {
          var id = Number(box.getAttribute('data-user'));
          state.hiddenPeople = state.hiddenPeople.filter(function (h) { return h !== id; });
          if (!box.checked) state.hiddenPeople.push(id);
          state.hiddenPeople = prunedHiddenPeople();
          render();
          var key = peopleKey();
          if (key && window.HomeGlow && window.HomeGlow.pluginId) {
            window.HomeGlow.storage.set(key, { hidden: state.hiddenPeople }).catch(function () {});
          }
        });
      });
    }

    function setPanelOpen(open) {
      var gear = document.getElementById('people-gear');
      var panel = document.getElementById('people-panel');
      if (!gear || !panel) return;
      panel.hidden = !open;
      gear.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) {
        var first = panel.querySelector('input');
        if (first) first.focus();
      }
    }

    function scheduleRefetch() {
      clearTimeout(refetchTimer);
      refetchTimer = setTimeout(loadData, 750);
    }

    // ---------- boot ----------
    document.addEventListener('DOMContentLoaded', function () {
      var params = new URLSearchParams(window.location.search);
      var theme = params.get('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }
      var gear = document.getElementById('people-gear');
      if (gear) {
        gear.addEventListener('click', function () {
          setPanelOpen(document.getElementById('people-panel').hidden);
        });
        document.addEventListener('click', function (event) {
          var panel = document.getElementById('people-panel');
          if (panel && !panel.hidden && !panel.contains(event.target) && event.target !== gear) setPanelOpen(false);
        });
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && !document.getElementById('people-panel').hidden) {
            setPanelOpen(false);
            gear.focus();
          }
        });
      }

      var rangeSelect = document.getElementById('range');
      rangeSelect.addEventListener('change', function () {
        state.rangeDays = parseInt(rangeSelect.value, 10) || 30;
        loadData();
        // Persist as this display's default when the platform is available.
        if (window.HomeGlow && window.HomeGlow.pluginId) {
          window.HomeGlow.settings.set({ defaultRange: rangeSelect.value }).catch(function () {});
        }
      });

      var start = Promise.resolve();
      if (window.HomeGlow && window.HomeGlow.pluginId) {
        var key = peopleKey();
        var people = key ? window.HomeGlow.storage.get(key).then(function (doc) {
          if (doc && Array.isArray(doc.hidden)) {
            state.hiddenPeople = doc.hidden.map(Number).filter(function (n) { return Number.isFinite(n); });
          }
        }).catch(function () {}) : Promise.resolve();
        start = Promise.all([people, window.HomeGlow.settings.get().then(function (settings) {
          state.settings = settings;
          var range = parseInt(settings.defaultRange, 10);
          if (range === 7 || range === 30 || range === 90) {
            state.rangeDays = range;
            rangeSelect.value = String(range);
          }
        }).catch(function () {})]);

        ['chore.completed', 'chore.uncompleted', 'clam.deposited', 'clam.withdrawn'].forEach(function (event) {
          window.HomeGlow.on(event, scheduleRefetch);
        });
      }

      start.then(loadData);
      // Date rollover on always-on displays.
      setInterval(loadData, 15 * 60 * 1000);
    });
  })();
  </script>
</body>
</html>
