<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Date &amp; Clock</title>
  <link rel="stylesheet" href="/index.css">
  <style>
    :root {
      --text-main: var(--text, #f0f0f0);
      --text-muted: var(--text-secondary, #999999);
      --border-color: var(--border, rgba(128,128,128,0.25));
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    .widget-container {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px;
    }
    .date-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
      flex: 1.1;
    }
    .day-name {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      line-height: 1.1;
    }
    .full-date {
      font-size: 2.35rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.05;
      white-space: nowrap;
      color: var(--text-main);
    }
    .year-val {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      opacity: 0.65;
      line-height: 1.1;
    }
    .divider {
      width: 1px;
      height: 72px;
      background: var(--border-color);
      opacity: 0.35;
      margin: 0 10px;
    }
    .time-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3px;
      flex: 1.1;
    }
    .time-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
    }
    .digits {
      font-size: 3.85rem;
      font-weight: 900;
      color: #00ddeb;
      line-height: 0.95;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
    }
    .ampm-badge {
      font-size: 1.35rem;
      font-weight: 800;
      color: #00ddeb;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .seconds-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      opacity: 0.65;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "date-clock",
    "name": "Date & Clock",
    "description": "Clean, balanced date and digital clock card with responsive scaling. Timezone is configured in the Admin Panel; leave it blank to use the household timezone.",
    "apiVersion": "v1",
    "settings": [
      {
        "key": "timezone",
        "label": "Timezone (IANA name, e.g. America/Chicago — blank for household)",
        "type": "string",
        "default": "",
        "scope": "household"
      }
    ]
  }
  </script>
</head>
<body>
  <div class="widget-container">
    <div class="date-col">
      <span class="day-name" id="dayName">--</span>
      <span class="full-date" id="fullDate">--</span>
      <span class="year-val" id="yearVal">----</span>
    </div>
    <div class="divider"></div>
    <div class="time-col">
      <div class="time-row">
        <span class="digits" id="timeDigits">--:--</span>
        <span class="ampm-badge" id="ampmVal">--</span>
      </div>
      <span class="seconds-val" id="secVal">--</span>
    </div>
  </div>

  <script>
    // Timezone resolution: ?tz= param > Admin Panel setting > household
    // timezone from /api/timezone > device system timezone. There is no
    // on-widget configuration UI; the timezone lives in the Admin Panel.
    let resolvedTz = null;

    function isValidTimezone(tz) {
      try {
        Intl.DateTimeFormat(undefined, { timeZone: tz });
        return true;
      } catch (_) {
        return false;
      }
    }

    async function resolveTimezone() {
      const p = new URLSearchParams(window.location.search);
      const paramTz = p.get('tz');
      if (paramTz && isValidTimezone(paramTz)) return paramTz;
      try {
        if (window.HomeGlow && window.HomeGlow.settings) {
          const cfg = await window.HomeGlow.settings.get();
          if (cfg && cfg.timezone && isValidTimezone(cfg.timezone)) return cfg.timezone;
        }
      } catch (_) {}
      try {
        const res = await fetch('/api/timezone');
        if (res.ok) {
          const data = await res.json();
          const tz = data.timezone || data.tz;
          if (typeof tz === 'string' && isValidTimezone(tz)) return tz;
        }
      } catch (_) {}
      return Intl.DateTimeFormat().resolvedOptions().timeZone;
    }

    function update() {
      const now = new Date();
      const tzOpt = resolvedTz ? { timeZone: resolvedTz } : {};
      document.getElementById('dayName').textContent = now.toLocaleDateString(undefined, { weekday: 'long', ...tzOpt });
      document.getElementById('fullDate').textContent = now.toLocaleDateString(undefined, { month: 'long', day: 'numeric', ...tzOpt });
      document.getElementById('yearVal').textContent = now.toLocaleDateString(undefined, { year: 'numeric', ...tzOpt });

      const parts = new Intl.DateTimeFormat('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true, ...tzOpt
      }).formatToParts(now);
      const get = (t) => (parts.find((x) => x.type === t) || {}).value || '';
      document.getElementById('timeDigits').textContent = `${get('hour')}:${get('minute')}`;
      document.getElementById('ampmVal').textContent = get('dayPeriod').toUpperCase();
      document.getElementById('secVal').textContent = `:${get('second')}`;
    }

    function applyTheme() {
      const p = new URLSearchParams(window.location.search);
      document.documentElement.setAttribute('data-theme', p.get('theme') || 'dark');
      if (p.get('transparent') === 'true') {
        const c = document.querySelector('.widget-container');
        if (c) { c.style.background = 'transparent'; c.style.border = 'none'; }
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      applyTheme();
      resolvedTz = await resolveTimezone();
      update();
      setInterval(update, 1000);
    });
  </script>
</body>
</html>
