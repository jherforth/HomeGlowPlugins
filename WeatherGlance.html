<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Glance</title>
  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "weather-glance",
    "name": "Weather Glance",
    "version": "1.1.0",
    "description": "Two tabs: Now tells the story of the next hours at a glance (a temperature ribbon, what's changing, daylight), and Forecast lists the days ahead, the hourly outlook, feels-like, humidity, wind and air quality. Uses the same weather provider as the core weather widget.",
    "category": "news-weather",
    "author": "adamecker",
    "apiVersion": "v1",
    "settings": [
      { "key": "location", "label": "Location (city, ZIP or lat,lon). Leave empty to use this display's weather widget location.",
        "type": "string", "default": "" },
      { "key": "units", "label": "Temperature unit", "type": "select",
        "options": ["Fahrenheit", "Celsius"], "default": "Fahrenheit" },
      { "key": "layout", "label": "Layout", "type": "select",
        "options": ["Automatic", "Compact", "Medium", "Full"], "default": "Automatic", "scope": "device" },
      { "key": "severeAlerts", "label": "National Weather Service alerts", "type": "boolean", "default": true }
    ]
  }
  </script>
  <link rel="stylesheet" href="/index.css">
  <style>
    :root {
      --wg-hot: #ff6b6b;
      --wg-cold: #2bb3e0;
      --wg-wet: #3a8fd8;
      --wg-sun: #f6b73c;
      /* The current condition's color, as r, g, b; set from the reading. */
      --wg-tint: 246, 183, 60;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      /* /index.css pads the body's bottom to clear the dashboard's dock; in a
         widget frame that padding just cuts the tile short. */
      padding: 0;
      background: var(--card-bg, #fff);
      /* The host defines --text, not --text-color. */
      color: var(--text, #222);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      box-sizing: border-box;
    }
    body.transparent { background: transparent; }
    *, *::before, *::after { box-sizing: inherit; }

    .muted { opacity: 0.7; }
    .cap::first-letter { text-transform: uppercase; }
    .hot { color: var(--wg-hot); font-weight: 700; }
    .cold { color: var(--wg-cold); }
    .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.65; }

    .state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 8px; }
    .state[hidden] { display: none; }
    .state .error { padding: 8px 12px; border-radius: 8px; background: rgba(255, 0, 0, 0.1); color: var(--error, #c62828); font-size: 0.9rem; }

    /* --- frame: tabs over two panels ---------------------------------------- */
    .app { height: 100%; display: flex; flex-direction: column; position: relative; }
    .app[hidden] { display: none; }
    .tabs { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px 0; position: relative; z-index: 1; }
    .tabs[hidden] { display: none; }
    .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(128, 128, 128, 0.14); }
    .tab {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 14px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: inherit;
      opacity: 0.7;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
    }
    .tab:hover { opacity: 1; }
    .tab[aria-selected="true"] { background: var(--accent, #00ddeb); color: #fff; opacity: 1; }
    .tab:focus-visible { outline: 2px solid var(--accent, #00ddeb); outline-offset: 2px; }
    .stamp { margin-left: auto; font-size: 0.72rem; opacity: 0.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .panel { flex: 1; min-height: 0; }
    /* Beats the layout classes, which set their own display. */
    .panel[hidden] { display: none !important; }

    /* --- Now ------------------------------------------------------------------ */
    .now-panel { position: relative; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    /* A wash of the condition's color from the top corner: warm for sun, blue
       for rain, indigo at night. Lighter when the tile sits on the wallpaper. */
    .app::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(130% 120% at 0% 0%, rgba(var(--wg-tint), 0.24), rgba(var(--wg-tint), 0) 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .app.on-now::before { opacity: 1; }
    body.transparent .app.on-now::before { opacity: 0.6; }
    .now-panel > * { position: relative; }

    .hero { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .hero .glyph { font-size: 3.4rem; line-height: 1; filter: drop-shadow(0 4px 10px rgba(var(--wg-tint), 0.45)); }
    .hero .big {
      font-size: 4.4rem;
      font-weight: 200;
      line-height: 0.9;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .hero .big .unit { font-size: 0.34em; font-weight: 500; letter-spacing: 0; vertical-align: top; margin-left: 3px; opacity: 0.6; }
    .hero .side { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .hero .cond { font-size: 1.1rem; font-weight: 600; }
    .hero .place { font-size: 0.85rem; opacity: 0.65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero .hilo { font-size: 0.9rem; font-variant-numeric: tabular-nums; }

    .notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 0.88rem; }
    .notes li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
    .notes .i { flex: 0 0 1.3em; text-align: center; }
    .notes .t { min-width: 0; }

    .ribbon-wrap { flex: 1; min-height: 80px; display: flex; flex-direction: column; gap: 4px; }
    .ribbon { flex: 1; min-height: 0; position: relative; }
    .ribbon svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .ribbon .rb-line { fill: none; stroke: url(#wg-line); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .ribbon .rb-area { fill: url(#wg-fill); }
    .ribbon .rb-dot { fill: var(--card-bg, #fff); stroke: var(--accent, #00ddeb); stroke-width: 2; }
    .ribbon .rb-now { fill: var(--accent, #00ddeb); }
    .ribbon .rb-temp { fill: currentColor; font-size: 11px; font-weight: 700; }
    .ribbon .rb-hour { fill: currentColor; fill-opacity: 0.6; font-size: 10px; }
    .ribbon .rb-wet { fill: var(--wg-wet); fill-opacity: 0.5; }
    .ribbon .rb-base { stroke: currentColor; stroke-opacity: 0.12; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; }
    .stat {
      min-width: 0;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(128, 128, 128, 0.1);
      border: 1px solid var(--card-border, rgba(0, 0, 0, 0.08));
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat .k { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .v { font-size: 1.02rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat .meter { height: 4px; border-radius: 2px; background: rgba(128, 128, 128, 0.2); overflow: hidden; margin-top: 3px; }
    .stat .meter span { display: block; height: 100%; border-radius: 2px; background: var(--wg-wet); }
    .stat .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
    .stat.sun svg { width: 100%; height: 16px; display: block; overflow: visible; margin-top: 2px; }
    .sun-track { fill: none; stroke: currentColor; stroke-opacity: 0.25; stroke-width: 1.5; stroke-dasharray: 2 3; }
    .sun-done { fill: none; stroke: var(--wg-sun); stroke-width: 2; stroke-linecap: round; }
    .sun-ball { fill: var(--wg-sun); }
    .sun-horizon { stroke: currentColor; stroke-opacity: 0.25; }

    /* Full: the story on the left, the ribbon and the numbers on the right. */
    .now-panel.full { display: grid; grid-template-columns: minmax(210px, 0.85fr) 1.6fr; grid-template-rows: minmax(0, 1fr) auto; gap: 12px 22px; }
    .now-panel.full .story { grid-row: 1 / span 2; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .now-panel.full .ribbon-wrap { min-height: 0; }

    .now-panel.compact { align-items: center; justify-content: center; text-align: center; gap: 2px; }
    .now-panel.compact .glyph { font-size: 2.4rem; line-height: 1.1; }
    .now-panel.compact .big { font-size: 2.6rem; font-weight: 200; line-height: 1; letter-spacing: -0.03em; }
    .now-panel.compact .big .unit { font-size: 0.4em; font-weight: 500; vertical-align: top; opacity: 0.6; }
    .now-panel.compact .place { font-size: 0.8rem; opacity: 0.65; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* --- Forecast: the list view ------------------------------------------- */
    .list-panel { overflow-y: auto; padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 16px; }
    .list-head h2 { margin: 0; font-size: 1.05rem; }
    .facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 0.9rem; }
    .facts dt { opacity: 0.65; }
    .facts dd { margin: 0; font-weight: 600; }
    .cards { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .card {
      flex: 0 0 auto;
      min-width: 76px;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid var(--card-border, rgba(0,0,0,0.1));
      background: rgba(var(--accent-rgb, 0, 221, 235), 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-align: center;
    }
    .card .wd { font-weight: 700; }
    .card .dn { font-size: 0.75rem; opacity: 0.65; }
    .card .emoji { font-size: 1.5rem; line-height: 1.1; }
    .card .wet { font-size: 0.75rem; color: var(--wg-wet); font-weight: 600; }
    .card .prob { font-size: 0.75rem; color: var(--wg-wet); font-weight: 600; }
    /* The day's range on a shared scale, so warmer and colder days read at a glance. */
    .range { width: 6px; height: 46px; border-radius: 3px; background: rgba(128,128,128,0.18); position: relative; }
    .range span { position: absolute; left: 0; right: 0; border-radius: 3px; background: linear-gradient(180deg, var(--wg-hot), var(--wg-cold)); }
    .hours { display: flex; flex-direction: column; }
    .hour { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 10px; align-items: center; padding: 7px 2px; border-bottom: 1px solid var(--card-border, rgba(0,0,0,0.06)); }
    .hour:last-child { border-bottom: none; }
    .hour .t { font-weight: 600; font-size: 0.85rem; }
    .hour .temp { font-weight: 700; }
    .hour .wet { color: var(--wg-wet); font-weight: 600; font-size: 0.85rem; }

    /* --- Forecast: the day detail overlay --------------------------------- */
    .card { font: inherit; color: inherit; cursor: pointer; }
    .card:focus-visible { outline: 2px solid var(--accent, #00ddeb); outline-offset: 2px; }
    /* The detail overlay sits on the theme's opaque surface, not the card
       color: some themes (autumn) make --card-bg translucent so the
       wallpaper shows through the tile, and a see-through overlay lets the
       Now view bleed through the alert text. */
    .detail { position: absolute; inset: 0; z-index: 3; background: var(--surface, var(--card-bg, #fff)); overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .detail[hidden] { display: none; }
    .d-head { display: flex; align-items: center; gap: 12px; }
    .d-head .back { font: inherit; font-size: 0.85rem; font-weight: 600; padding: 6px 12px; border: 0; border-radius: 999px; background: rgba(128, 128, 128, 0.14); color: inherit; cursor: pointer; white-space: nowrap; }
    .d-head .back:focus-visible { outline: 2px solid var(--accent, #00ddeb); outline-offset: 2px; }
    .d-head h2 { margin: 0; font-size: 1.15rem; }
    .d-head .sub { font-size: 0.8rem; opacity: 0.65; }
    .d-head .cond { margin-left: auto; text-align: right; font-size: 0.9rem; white-space: nowrap; }
    .d-line { margin: 0; font-size: 1rem; font-weight: 600; }
    .dhours { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .dhour { flex: 0 0 auto; min-width: 62px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--card-border, rgba(0,0,0,0.1)); background: rgba(var(--accent-rgb, 0, 221, 235), 0.06); display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
    .dhour .t { font-size: 0.8rem; font-weight: 600; }
    .dhour .temp { font-weight: 700; }
    .dhour .prob, .dhour .wet { font-size: 0.75rem; color: var(--wg-wet); font-weight: 600; }
    .d-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }

    /* --- NWS severe-weather alerts (US only) -------------------------------- */
    .alerts { flex: 0 0 auto; padding: 6px 12px 0; position: relative; z-index: 1; }
    .alerts[hidden] { display: none; }
    .banner { display: flex; gap: 8px; align-items: center; width: 100%; padding: 8px 12px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; color: #fff; cursor: pointer; text-align: left; }
    .banner:focus-visible { outline: 2px solid var(--accent, #00ddeb); outline-offset: 2px; }
    .banner .b-event { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .banner .b-time { margin-left: auto; font-weight: 400; font-size: 0.8rem; white-space: nowrap; }
    .banner .b-more { font-size: 0.8rem; white-space: nowrap; }
    .banner.sev-extreme { background: #991b1b; }
    .banner.sev-severe { background: #dc2626; }
    .banner.sev-moderate { background: #d97706; }
    .banner.sev-minor { background: #a16207; }
    .banner.sev-unknown { background: #6b7280; }
    /* The small alert icon lives in the tabs row, so it costs the panels no
       height at all. Same severity palette as the banner, as a tinted chip
       instead of a solid bar. */
    .alert-icon { flex: 0 0 auto; border: 0; font: inherit; font-size: 0.95rem; line-height: 1; padding: 5px 7px; border-radius: 8px; cursor: pointer; background: transparent; }
    .alert-icon:focus-visible { outline: 2px solid var(--accent, #00ddeb); outline-offset: 2px; }
    .alert-icon.sev-extreme { color: #991b1b; background: rgba(153, 27, 27, 0.14); }
    .alert-icon.sev-severe { color: #dc2626; background: rgba(220, 38, 38, 0.14); }
    .alert-icon.sev-moderate { color: #d97706; background: rgba(217, 119, 6, 0.14); }
    .alert-icon.sev-minor { color: #a16207; background: rgba(161, 98, 7, 0.14); }
    .alert-icon.sev-unknown { color: #6b7280; background: rgba(107, 114, 128, 0.14); }
    /* With the banner up, the Now panel loses ~38px: let the hourly ribbon
       compress instead of clipping at the panel's bottom edge, and give it
       the heading's room too — the hour labels on the graph say what it is.
       The full layout already shrinks its ribbon (min-height 0), so this is
       for the stacked layouts only. */
    .now-panel.has-alerts:not(.full):not(.compact) .ribbon-wrap { min-height: 32px; }
    .now-panel.has-alerts .ribbon-wrap .section-title { display: none; }
    .alerts-list { display: flex; flex-direction: column; gap: 10px; }
    .alert { border: 1px solid var(--card-border, rgba(0,0,0,0.1)); border-left: 4px solid #6b7280; border-radius: 10px; padding: 10px 12px; }
    .alert.sev-extreme { border-left-color: #991b1b; }
    .alert.sev-severe { border-left-color: #dc2626; }
    .alert.sev-moderate { border-left-color: #d97706; }
    .alert.sev-minor { border-left-color: #a16207; }
    .alert h3 { margin: 0; font-size: 0.95rem; }
    .alert .a-time { margin: 2px 0 6px; font-size: 0.8rem; opacity: 0.65; }
    .alert .a-text { margin: 0; font-size: 0.88rem; white-space: pre-wrap; }
    .alert .a-more { font: inherit; font-size: 0.8rem; font-weight: 600; margin-top: 6px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--card-border, rgba(0,0,0,0.1)); background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="state" class="state"><div class="muted" id="loading">…</div></div>
  <div id="app" class="app" hidden>
    <div class="tabs" id="tabs">
      <div class="seg" role="tablist" id="tablist">
        <button type="button" class="tab" role="tab" id="tab-now" data-tab="now" aria-controls="panel-now" aria-selected="true"></button>
        <button type="button" class="tab" role="tab" id="tab-list" data-tab="list" aria-controls="panel-list" aria-selected="false" tabindex="-1"></button>
      </div>
      <button type="button" class="alert-icon" id="alert-icon" hidden></button>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="alerts" id="alerts" hidden></div>
    <section class="panel now-panel" id="panel-now" role="tabpanel" aria-labelledby="tab-now"></section>
    <section class="panel list-panel" id="panel-list" role="tabpanel" aria-labelledby="tab-list" hidden></section>
    <div class="detail" id="detail" hidden></div>
  </div>

  <script src="/plugin-sdk/v1.js"></script>

        noHours: 'Este proveedor del clima no da un pronóstico por horas.',
        conditions: {
          'clear-night': 'Noche despejada', cloudy: 'Nublado', exceptional: 'Clima inusual', fog: 'Niebla',
          hail: 'Granizo', lightning: 'Relámpagos', 'lightning-rainy': 'Tormentas', partlycloudy: 'Parcialmente nublado',
          pouring: 'Lluvia intensa', rainy: 'Lluvia', snowy: 'Nieve', 'snowy-rainy': 'Aguanieve', sunny: 'Soleado',
          windy: 'Ventoso', 'windy-variant': 'Ventoso y nublado'
        }
      }
    };
    var S = STRINGS[lang] || STRINGS.en;
    var fill = function (text, values) {
      return text.replace(/\{(\w+)\}/g, function (_, k) { return values[k]; });
    };

    var ICONS = {
      'clear-night': '🌙', cloudy: '☁️', exceptional: '🌤️', fog: '🌫️', hail: '🌨️',
      lightning: '🌩️', 'lightning-rainy': '⛈️', partlycloudy: '⛅', pouring: '🌧️', rainy: '🌦️',
      snowy: '❄️', 'snowy-rainy': '🌨️', sunny: '☀️', windy: '💨', 'windy-variant': '💨'
    };
    var icon = function (condition) { return ICONS[condition] || '🌤️'; };
    var describe = function (entry) {
      return (entry && entry.description) || (entry && S.conditions[entry.condition]) || '';
    };
    // The wash behind the Now tab, per condition, as r, g, b.
    var TINTS = {
      sunny: '246, 183, 60', partlycloudy: '242, 198, 109', 'clear-night': '91, 95, 199',
      cloudy: '138, 148, 166', fog: '154, 163, 173', rainy: '58, 143, 216', pouring: '44, 110, 196',
      lightning: '123, 92, 214', 'lightning-rainy': '123, 92, 214', snowy: '159, 211, 240',
      'snowy-rainy': '140, 190, 230', hail: '150, 200, 235', windy: '127, 184, 168', 'windy-variant': '127, 184, 168'
    };
    var WET = { rainy: 1, pouring: 1, 'lightning-rainy': 1, snowy: 1, 'snowy-rainy': 1, hail: 1 };

    // --- formatting ---------------------------------------------------------
    var fmt = function (options) {
      try { return new Intl.DateTimeFormat(lang, options); } catch (e) { return new Intl.DateTimeFormat('en', options); }
    };
    var weekdayFmt = fmt({ weekday: 'short' });
    var longWeekdayFmt = fmt({ weekday: 'long' });
    var dayNumFmt = fmt({ day: 'numeric' });
    var monthFmt = fmt({ month: 'short' });
    var hourFmt = fmt({ hour: 'numeric', minute: '2-digit' });
    var shortHourFmt = fmt({ hour: 'numeric' });
    // A forecast date (YYYY-MM-DD) at local noon, so no zone shift moves it a day.
    var dateOf = function (key) {
      var p = key.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2], 12);
    };
    var todayKey = function () {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };
    var round = function (n) { return n === null || n === undefined ? '—' : String(Math.round(n)); };
    var esc = function (text) {
      return String(text).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };

    // --- state ----------------------------------------------------------------
    var settings = { location: '', units: 'Fahrenheit', layout: 'Automatic', severeAlerts: true };
    var weather = null;
    var updatedAt = null;
    var tab = 'now';
    var detailDay = -1;
    var alerts = [];
    var alertsShown = false; // whether the banner is currently up; renderNow re-fits for it
    var currentAlertTexts = [];
    var currentAlertShorts = [];
    var stateBox = document.getElementById('state');
    var app = document.getElementById('app');
    var tabsBar = document.getElementById('tabs');
    var alertsEl = document.getElementById('alerts');
    var iconEl = document.getElementById('alert-icon');
    var detailEl = document.getElementById('detail');
    var stamp = document.getElementById('stamp');
    var panels = { now: document.getElementById('panel-now'), list: document.getElementById('panel-list') };
    var tabButtons = { now: document.getElementById('tab-now'), list: document.getElementById('tab-list') };
    document.getElementById('loading').textContent = S.loading;
    tabButtons.now.textContent = S.tabNow;
    tabButtons.list.textContent = S.tabForecast;

    var metric = function () { return settings.units === 'Celsius'; };
    var deg = function () { return metric() ? '°C' : '°F'; };
    var windUnit = function () { return metric() ? 'm/s' : 'mph'; };
    // Providers disagree on precipitation units: OpenWeatherMap reports mm
    // whatever units it was asked for, the demo data inches, and Home Assistant
    // whatever it is configured with. Open-Meteo reports the unit requested —
    // inch under imperial, mm under metric — so its source unit is the
    // payload's own units field. The amount is converted to the unit the
    // Temperature setting implies (Fahrenheit → inches, Celsius → mm), the
    // way WeatherScenes asks for its precipitation unit; a provider whose
    // unit is unknown (Home Assistant) is left as-is, unlabelled.
    var wetSourceUnit = function () {
      if (!weather) return '';
      if (weather.provider === 'openweathermap') return 'mm';
      if (weather.provider === 'demo') return 'in';
      if (weather.provider === 'openmeteo') return weather.units === 'metric' ? 'mm' : 'in';
      return '';
    };
    var wetAmount = function (amount) {
      if (!(amount > 0)) return '';
      var source = wetSourceUnit();
      var value = amount;
      var unit = source;
      if (source === 'mm' && !metric()) { value = amount / 25.4; unit = 'in'; }
      else if (source === 'in' && metric()) { value = amount * 25.4; unit = 'mm'; }
      // WeatherScenes' formatting: mm to 1 decimal, inches to 2, with
      // "Trace" for a measurable-but-tiny imperial amount.
      if (unit === 'in') return value < 0.01 ? S.trace : value.toFixed(2) + ' in';
      if (unit === 'mm') return value.toFixed(1) + ' mm';
      return amount < 1 ? amount.toFixed(2).replace(/0$/, '') : amount.toFixed(1);
    };
    var wet = function (amount) {
      var text = wetAmount(amount);
      return text ? '💧 ' + text : '';
    };

    // --- where to ask about ---------------------------------------------------
    // The plugin's own Location setting first. Without one, the location of a
    // core weather widget on this display, so the two agree. Without that, no
    // location at all: Home Assistant and the demo provider answer from their
    // own configuration, and OpenWeatherMap asks for one.
    var parseConfig = function (raw) {
      if (!raw) return {};
      if (typeof raw === 'object') return raw;
      try { var parsed = JSON.parse(raw); return parsed && typeof parsed === 'object' ? parsed : {}; } catch (e) { return {}; }
    };
    var widgetLocation = function () {
      if (!device) return Promise.resolve(null);
      return fetch('/api/devices/' + encodeURIComponent(device) + '/tabs')
        .then(function (res) { return res.ok ? res.json() : []; })
        .then(function (tabs) {
          var ordered = (Array.isArray(tabs) ? tabs : []).slice().sort(function (a, b) { return (a.number || 0) - (b.number || 0); });
          for (var i = 0; i < ordered.length; i += 1) {
            var w = parseConfig(ordered[i].config_json).weather;
            if (!w || typeof w !== 'object') continue;
            if (Number.isFinite(w.lat) && Number.isFinite(w.lon)) return { lat: w.lat, lon: w.lon };
            var q = String(w.locationQuery || w.zipCode || '').trim();
            if (q) return { location: q };
          }
          return null;
        })
        .catch(function () { return null; });
    };
    var resolveLocation = function () {
      var own = String(settings.location || '').trim();
      var coords = own.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
      if (coords) return Promise.resolve({ lat: Number(coords[1]), lon: Number(coords[2]) });
      if (own) return Promise.resolve({ location: own });
      return widgetLocation();
    };

    var load = function () {
      return resolveLocation().then(function (where) {
        var query = new URLSearchParams({ units: metric() ? 'metric' : 'imperial', lang: lang });
        if (where && where.location) query.set('location', where.location);
        if (where && Number.isFinite(where.lat)) { query.set('lat', where.lat); query.set('lon', where.lon); }
        return fetch('/api/weather?' + query.toString()).then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            if (!res.ok) {
              var err = new Error(body.error || S.unavailable);
              err.status = res.status;
              err.noLocation = !where && (res.status === 400 || res.status === 404);
              throw err;
            }
            return body;
          });
        });
      }).then(function (payload) {
        weather = payload;
        updatedAt = new Date();
        stateBox.hidden = true;
        app.hidden = false;
        render();
        loadAlerts();
      }).catch(function (err) {
        // Keep showing the last good reading through a passing failure.
        if (weather) return;
        app.hidden = true;
        stateBox.hidden = false;
        stateBox.innerHTML = '<div style="font-size:2rem">🌤️</div>'
          + '<div class="error">' + esc(err.noLocation ? S.setLocation : (err.message || S.unavailable)) + '</div>';
      });
    };

    // --- sizing: measure the box this plugin renders in -----------------------
    // The plugin runs in an iframe sized to its widget box, so the box — not
    // the top-level window — is the right ruler. In mirror mode the window
    // is the phone's while the box is the wall's, and a window-sized layout
    // comes out compact on the wall's own dashboard. Same breakpoints and
    // same three layouts as before; only the measurement source changes.
    // A box of 0x0 (hidden tab, not yet laid out) keeps the last good size;
    // the window is only a fallback when the box never reported one.
    var lastBox = { w: 0, h: 0 };
    var boxSize = function () {
      var w = app ? app.clientWidth : 0;
      var h = app ? app.clientHeight : 0;
      if (w > 0 && h > 0) { lastBox = { w: w, h: h }; return lastBox; }
      if (lastBox.w > 0 && lastBox.h > 0) return lastBox;
      return { w: window.innerWidth, h: window.innerHeight };
    };
    var layout = function () {
      var choice = settings.layout;
      if (choice === 'Compact' || choice === 'Medium' || choice === 'Full') return choice.toLowerCase();
      var size = boxSize();
      if (size.w < 300 || size.h < 200) return 'compact';
      if (size.w >= 620 && size.h >= 300) return 'full';
      return 'medium';
    };
    // Too small for a tab bar to leave room for anything: just the reading.
    var tiny = function () { var size = boxSize(); return size.w < 200 || size.h < 140; };

    // --- shared pieces ----------------------------------------------------------
    var dayLabel = function (day) {
      return day.date === todayKey() ? S.today : weekdayFmt.format(dateOf(day.date));
    };
    var forecastTitle = function () {
      var n = weather.forecast.length;
      return n > 1 ? fill(S.forecastDays, { n: n }) : S.forecast;
    };
    var todayIndex = function () {
      var key = todayKey();
      for (var i = 0; i < weather.forecast.length; i += 1) if (weather.forecast[i].date === key) return i;
      return -1;
    };
    var aqiLabel = function () {
      return weather.airQuality && weather.airQuality.aqi >= 1 ? S.aqi[Math.min(weather.airQuality.aqi, 5) - 1] : null;
    };

    // The hours ahead: what is still to come within a day, at most a dozen
    // points, led by the current reading so the line starts at "now".
    var ahead = function () {
      var nowS = Date.now() / 1000;
      var all = (weather.hourly || []).filter(function (p) { return Number.isFinite(p.timestamp) && Number.isFinite(p.temp); });
      var points = all.filter(function (p) { return p.timestamp > nowS - 1800; });
      // A stale cache can leave every point behind us; better old hours than none.
      if (!points.length) points = all;
      if (!points.length) return [];
      var limit = points[0].timestamp + 24 * 3600;
      points = points.filter(function (p) { return p.timestamp <= limit; }).slice(0, 12);
      var c = weather.current;
      if (Number.isFinite(c.temp) && points[0].timestamp - nowS > 600) {
        points.unshift({ timestamp: nowS, temp: c.temp, precipitation: 0, isNow: true });
      }
      return points;
    };

    // The day's precipitation probability (0-100), when the provider
    // supplies one. OpenWeatherMap does; Home Assistant and demo do not, and
    // the field is hidden then rather than shown as a misleading 0%.
    var prob = function (value) {
      return Number.isFinite(value) ? Math.round(value) + '%' : '';
    };

    // The day's UV index (daily max), when the provider supplies one.
    // Open-Meteo does; other providers leave it null, and the tile is hidden
    // then rather than shown as a misleading 0. Bands as in WeatherScenes:
    // 0-2 Low, 3-5 Moderate, 6-7 High, 8-10 Very high, 11+ Extreme.
    var uvLabel = function (value) {
      var v = Math.round(value);
      return v <= 2 ? S.uv[0] : v <= 5 ? S.uv[1] : v <= 7 ? S.uv[2] : v <= 10 ? S.uv[3] : S.uv[4];
    };
    var uv = function (value) {
      return Number.isFinite(value) ? Math.round(value) + ' · ' + uvLabel(value) : '';
    };

    // The hourly points that fall on a forecast day, by the wall's local
    // date — the same local-day reading todayKey() uses.
    var localKey = function (ts) {
      var d = new Date(ts * 1000);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };
    var dayHours = function (day) {
      return (weather.hourly || []).filter(function (p) {
        return Number.isFinite(p.timestamp) && localKey(p.timestamp) === day.date;
      });
    };

    // Per-day summary sentence, ported from WeatherScenes' summaryLine: the
    // first hour at >=50% makes rain likely from that hour, a max >=25% is a
    // chance around the likeliest hour, otherwise the day stays dry. Future
    // days have no hourly points (the core ships the next 8 only), so they
    // fall back to the daily max without an hour. '' when the provider
    // supplies no probability at all — the sentence is hidden, not guessed.
    var summaryLine = function (day) {
      var isToday = day.date === todayKey();
      var hours = dayHours(day);
      var probs = hours.map(function (p) {
        return Number.isFinite(p.precipitationProbability) ? p.precipitationProbability : null;
      });
      var known = probs.filter(function (v) { return v !== null; });
      if (known.length) {
        var max = Math.max.apply(null, known);
        var first = -1;
        for (var n = 0; n < probs.length; n += 1) {
          if (probs[n] !== null && probs[n] >= 50) { first = n; break; }
        }
        if (first >= 0) {
          var at = hours[first].timestamp;
          if (isToday && at - Date.now() / 1000 < 3600) return S.rainLikelyNow;
          return fill(S.rainLikelyFrom, { h: shortHourFmt.format(new Date(at * 1000)) });
        }
        if (max >= 25) {
          var atMax = hours[probs.indexOf(max)].timestamp;
          return fill(S.chanceRainAround, { h: shortHourFmt.format(new Date(atMax * 1000)) });
        }
        return isToday ? S.stayingDry : S.looksDry;
      }
      if (Number.isFinite(day.precipitationProbability)) {
        if (day.precipitationProbability >= 50) return S.rainLikely;
        if (day.precipitationProbability >= 25) return S.chanceRain;
        return isToday ? S.stayingDry : S.looksDry;
      }
      return '';
    };

    // --- Now: the story of the next hours -------------------------------------
    var notes = function (points) {
      var c = weather.current;
      var out = [];

      // Where the temperature is headed.
      if (points.length > 1 && Number.isFinite(c.temp)) {
        var hi = points[0], lo = points[0];
        points.forEach(function (p) { if (p.temp > hi.temp) hi = p; if (p.temp < lo.temp) lo = p; });
        var when = function (p) { return shortHourFmt.format(new Date(p.timestamp * 1000)); };
        if (hi.temp - c.temp >= 3) out.push(['📈', fill(S.rising, { t: round(hi.temp) + '°', h: when(hi) })]);
        else if (c.temp - lo.temp >= 4) out.push(['📉', fill(S.falling, { t: round(lo.temp) + '°', h: when(lo) })]);
        else out.push(['〰️', fill(S.steady, { t: round(c.temp) + '°' })]);
      }

      // The next wet spell: the hourly outlook first, then the days.
      var wetHour = points.filter(function (p) { return p.precipitation > 0; })[0];
      var days = weather.forecast;
      var start = Math.max(0, todayIndex());
      var wetDay = null;
      for (var i = start; i < days.length && !wetDay; i += 1) {
        if (WET[days[i].condition] || days[i].precipitation > 0) wetDay = days[i];
      }
      if (wetHour) {
        out.push(['☔', fill(S.wetHour, { h: shortHourFmt.format(new Date(wetHour.timestamp * 1000)) })]);
      } else if (wetDay) {
        var cond = describe(wetDay) || S.conditions.rainy;
        out.push(['☔', wetDay.date === todayKey()
          ? fill(S.wetToday, { cond: cond })
          : fill(S.wetDay, { cond: cond, day: longWeekdayFmt.format(dateOf(wetDay.date)) })]);
      } else {
        var n = days.length - start;
        out.push(['🌂', n > 1 ? fill(S.dryDays, { n: n }) : S.dryHours]);
      }

      if (Number.isFinite(c.feelsLike) && Number.isFinite(c.temp) && Math.abs(c.feelsLike - c.temp) >= 3) {
        out.push(['🌡️', S.feelsLike + ' ' + round(c.feelsLike) + '°']);
      }

      var t = todayIndex();
      if (t >= 0 && days[t + 1] && Number.isFinite(days[t].high) && Number.isFinite(days[t + 1].high)) {
        var diff = Math.round(days[t + 1].high - days[t].high);
        if (diff >= 5) out.push(['🔺', fill(S.warmer, { n: diff })]);
        else if (diff <= -5) out.push(['🔻', fill(S.cooler, { n: -diff })]);
      }

      if (Number.isFinite(c.windSpeed) && c.windSpeed >= (metric() ? 8 : 18)) {
        out.push(['💨', fill(S.windy, { v: round(c.windSpeed) + ' ' + windUnit() })]);
      }
      return out;
    };

    var daylight = function () {
      var sun = weather.sun;
      if (!sun || !Number.isFinite(sun.sunrise) || !Number.isFinite(sun.sunset) || sun.sunset <= sun.sunrise) return '';
      var nowS = Date.now() / 1000;
      var up = nowS >= sun.sunrise && nowS <= sun.sunset;
      // Half an ellipse from the left horizon to the right, the sun along it.
      var track = 'M6 24 A44 21 0 0 1 94 24';
      var svg = '<svg viewBox="0 0 100 27" aria-hidden="true"><line class="sun-horizon" x1="0" x2="100" y1="24" y2="24"/>'
        + '<path class="sun-track" d="' + track + '"/>';
      var label, time;
      if (up) {
        var a = Math.PI * (1 - (nowS - sun.sunrise) / (sun.sunset - sun.sunrise));
        var x = 50 + 44 * Math.cos(a);
        var y = 24 - 21 * Math.sin(a);
        svg += '<path class="sun-done" d="M6 24 A44 21 0 0 1 ' + x.toFixed(1) + ' ' + y.toFixed(1) + '"/>'
          + '<circle class="sun-ball" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4"/>';
        label = S.sunset;
        time = sun.sunset;
      } else {
        svg += '<text x="50" y="20" text-anchor="middle" font-size="12">🌙</text>';
        label = S.sunrise;
        time = sun.sunrise > nowS ? sun.sunrise : sun.sunrise + 86400;
      }
      return '<div class="stat sun"><div class="k">' + esc(label) + '</div>'
        + '<div class="v">' + esc(hourFmt.format(new Date(time * 1000))) + '</div>' + svg + '</svg></div>';
    };

    var AQI_COLORS = ['var(--success, #10b981)', '#84cc16', '#eab308', '#f97316', 'var(--error, #ef4444)'];
    var stats = function () {
      var c = weather.current;
      var out = [];
      var tile = function (k, v, extra) {
        return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>' + (extra || '') + '</div>';
      };
      if (Number.isFinite(c.feelsLike)) out.push(tile(S.feelsLike, esc(round(c.feelsLike) + '°')));
      var todayProb = todayIndex() >= 0 ? weather.forecast[todayIndex()].precipitationProbability : null;
      if (Number.isFinite(todayProb)) out.push(tile(S.rainChance, esc(prob(todayProb))));
      var todayUv = todayIndex() >= 0 ? weather.forecast[todayIndex()].uvIndex : null;
      if (Number.isFinite(todayUv)) out.push(tile(S.uvIndex, esc(uv(todayUv))));
      if (Number.isFinite(c.humidity)) {
        out.push(tile(S.humidity, esc(round(c.humidity) + '%'),
          '<div class="meter"><span style="width:' + Math.max(0, Math.min(100, c.humidity)) + '%"></span></div>'));
      }
      if (Number.isFinite(c.windSpeed)) out.push(tile(S.wind, esc(round(c.windSpeed) + ' ' + windUnit())));
      var aqi = aqiLabel();
      if (aqi) {
        out.push(tile(S.airQuality, '<span class="dot" style="background:' + AQI_COLORS[Math.min(weather.airQuality.aqi, 5) - 1] + '"></span>' + esc(aqi)));
      }
      out.push(daylight());
      return '<div class="stats">' + out.join('') + '</div>';
    };

    var hero = function () {
      var c = weather.current;
      var t = todayIndex();
      var today = t >= 0 ? weather.forecast[t] : null;
      var hilo = today && (Number.isFinite(today.high) || Number.isFinite(today.low))
        ? '<div class="hilo"><span class="hot">↑ ' + round(today.high) + '°</span>&nbsp;&nbsp;<span class="cold">↓ ' + round(today.low) + '°</span></div>'
        : '';
      return '<div class="hero"><div class="glyph" aria-hidden="true">' + icon(c.condition) + '</div>'
        + '<div class="big">' + round(c.temp) + '<span class="unit">' + deg() + '</span></div>'
        + '<div class="side"><div class="cond cap">' + esc(describe(c)) + '</div>'
        + hilo
        + '<div class="place">' + esc(weather.resolvedName || '') + '</div></div></div>';
    };

    var renderNow = function () {
      var c = weather.current;
      var kind = tiny() ? 'compact' : layout();
      var panel = panels.now;
      panel.className = 'panel now-panel ' + kind;
      panel.classList.toggle('has-alerts', alertsShown);
      document.documentElement.style.setProperty('--wg-tint', TINTS[c.condition] || 'var(--accent-rgb, 0, 221, 235)');

      if (kind === 'compact') {
        var t = todayIndex();
        var today = t >= 0 ? weather.forecast[t] : null;
        panel.innerHTML = '<div class="glyph" aria-hidden="true">' + icon(c.condition) + '</div>'
          + '<div class="big">' + round(c.temp) + '<span class="unit">' + deg() + '</span></div>'
          + (today ? '<div><span class="hot">↑ ' + round(today.high) + '°</span>&nbsp; <span class="cold">↓ ' + round(today.low) + '°</span></div>' : '')
          + '<div class="place">' + esc(weather.resolvedName || describe(c)) + '</div>';
        return;
      }

      var points = ahead();
      var list = notes(points);
      var ribbon = '<div class="ribbon-wrap"><div class="section-title">' + esc(S.nextHours) + '</div><div class="ribbon" id="ribbon"></div></div>';
      var noteList = function (max) {
        return '<ul class="notes">' + list.slice(0, max).map(function (n) {
          return '<li><span class="i" aria-hidden="true">' + n[0] + '</span><span class="t cap">' + esc(n[1]) + '</span></li>';
        }).join('') + '</ul>';
      };

      if (kind === 'full') {
        panel.innerHTML = '<div class="story">' + hero() + noteList(5) + '</div>' + ribbon + stats();
      } else {
        // Medium: what fits, in order of what matters at a glance.
        var h = boxSize().h;
        // While the alert banner is up the panel is ~38px shorter: keep two
        // notes at most, so the hourly graph keeps its room. The dropped
        // note is the least important one (notes are ordered by importance).
        var maxNotes = alertsShown ? 2 : 3;
        panel.innerHTML = hero()
          + noteList(h >= 300 ? maxNotes : h >= 240 ? 2 : 1)
          + (h >= 250 ? ribbon : '')
          + (h >= 420 ? stats() : '');
      }
      drawRibbon(document.getElementById('ribbon'), points);
    };

    // --- the ribbon: the next hours as one smooth line, sized to its box -------
    var drawRibbon = function (box, points) {
      if (!box) return;
      if (!points.length) { box.innerHTML = '<div class="muted">' + esc(S.noHours) + '</div>'; return; }
      var W = box.clientWidth || 300;
      var H = box.clientHeight || 120;
      var padX = 14, padT = 20, padB = 18;
      var temps = points.map(function (p) { return p.temp; });
      var min = Math.min.apply(null, temps);
      var max = Math.max.apply(null, temps);
      if (max - min < 4) { var mid = (max + min) / 2; min = mid - 2; max = mid + 2; }
      var n = points.length;
      var x = function (i) { return n === 1 ? W / 2 : padX + i * (W - 2 * padX) / (n - 1); };
      // A little air under the coldest point, so it never sits on the floor.
      var y = function (v) { return padT + (H - padT - padB - 8) * (1 - (v - min) / (max - min)); };
      var xy = points.map(function (p, i) { return [x(i), y(p.temp)]; });
      var base = H - padB;

      // Catmull-Rom through the points, as cubic Béziers.
      var line = 'M' + xy[0][0].toFixed(1) + ' ' + xy[0][1].toFixed(1);
      for (var i = 0; i < n - 1; i += 1) {
        var p0 = xy[i - 1] || xy[i], p1 = xy[i], p2 = xy[i + 1], p3 = xy[i + 2] || p2;
        var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
        var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
        line += ' C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
      }
      var area = line + ' L' + xy[n - 1][0].toFixed(1) + ' ' + base + ' L' + xy[0][0].toFixed(1) + ' ' + base + ' Z';

      var parts = ['<defs>'
        + '<linearGradient id="wg-line" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--secondary, #38bdf8)"/><stop offset="1" style="stop-color:var(--accent, #00ddeb)"/></linearGradient>'
        + '<linearGradient id="wg-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--accent, #00ddeb);stop-opacity:0.28"/><stop offset="1" style="stop-color:var(--accent, #00ddeb);stop-opacity:0"/></linearGradient>'
        + '</defs>'];

      // Precipitation as quiet bars along the floor, on their own scale.
      var wetMax = Math.max.apply(null, points.map(function (p) { return p.precipitation > 0 ? p.precipitation : 0; }));
      if (wetMax > 0) {
        var bw = Math.max(4, Math.min(18, (W - 2 * padX) / n * 0.5));
        var room = (H - padT - padB) * 0.4;
        points.forEach(function (p, j) {
          if (!(p.precipitation > 0)) return;
          var bh = Math.max(2, room * p.precipitation / wetMax);
          parts.push('<rect class="rb-wet" x="' + (x(j) - bw / 2).toFixed(1) + '" y="' + (base - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="2"/>');
        });
      }
      parts.push('<line class="rb-base" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/>');
      parts.push('<path class="rb-area" d="' + area + '"/>');
      parts.push('<path class="rb-line" d="' + line + '"/>');

      // Label as many points as there is room for, always the first.
      var step = Math.max(1, Math.ceil(36 / Math.max(1, (W - 2 * padX) / Math.max(1, n - 1))));
      points.forEach(function (p, j) {
        if (j % step !== 0) return;
        var px = x(j), py = y(p.temp);
        var anchor = j === 0 && n > 1 ? 'start' : (j === n - 1 && n > 1 ? 'end' : 'middle');
        var tx = anchor === 'start' ? px - 4 : anchor === 'end' ? px + 4 : px;
        parts.push('<circle class="' + (p.isNow ? 'rb-now' : 'rb-dot') + '" cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="' + (p.isNow ? 4.5 : 3) + '"/>');
        parts.push('<text class="rb-temp" x="' + tx.toFixed(1) + '" y="' + (py - 9).toFixed(1) + '" text-anchor="' + anchor + '">' + round(p.temp) + '°</text>');
        parts.push('<text class="rb-hour" x="' + tx.toFixed(1) + '" y="' + (H - 3) + '" text-anchor="' + anchor + '">'
          + esc(p.isNow ? S.now : shortHourFmt.format(new Date(p.timestamp * 1000))) + '</text>');
      });

      box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(S.nextHours) + '">' + parts.join('') + '</svg>';
    };

    // --- Forecast: the list view ------------------------------------------------
    var facts = function () {
      var c = weather.current;
      var rows = [];
      if (c.feelsLike !== null) rows.push([S.feelsLike, round(c.feelsLike) + deg()]);
      if (c.humidity !== null) rows.push([S.humidity, round(c.humidity) + '%']);
      if (c.windSpeed !== null) rows.push([S.wind, round(c.windSpeed) + ' ' + windUnit()]);
      if (aqiLabel()) rows.push([S.airQuality, aqiLabel()]);
      if (weather.sun && weather.sun.sunrise) {
        rows.push([S.sunrise, hourFmt.format(new Date(weather.sun.sunrise * 1000))]);
        rows.push([S.sunset, hourFmt.format(new Date(weather.sun.sunset * 1000))]);
      }
      return '<dl class="facts">' + rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>';
    };

    var renderList = function () {
      var c = weather.current;
      var highs = weather.forecast.map(function (d) { return d.high; }).filter(Number.isFinite);
      var lows = weather.forecast.map(function (d) { return d.low; }).filter(Number.isFinite);
      var top = Math.max.apply(null, highs.length ? highs : [1]);
      var bottom = Math.min.apply(null, lows.length ? lows : [0]);
      var span = Math.max(1, top - bottom);

      var cards = weather.forecast.map(function (day, i) {
        var hasRange = Number.isFinite(day.high) && Number.isFinite(day.low);
        var bar = hasRange
          ? '<div class="range" aria-hidden="true"><span style="top:' + ((top - day.high) / span * 100) + '%;bottom:' + ((day.low - bottom) / span * 100) + '%"></span></div>'
          : '';
        var line = summaryLine(day);
        return '<button type="button" class="card" data-day="' + i + '"' + (line ? ' title="' + esc(line) + '"' : '') + '>'
          + '<div class="wd">' + esc(dayLabel(day)) + '</div>'
          + '<div class="dn">' + esc(dayNumFmt.format(dateOf(day.date))) + '</div>'
          + '<div class="emoji" aria-hidden="true">' + icon(day.condition) + '</div>'
          + '<div class="hot">' + round(day.high) + '°</div>' + bar
          + '<div class="cold">' + round(day.low) + '°</div>'
          + (prob(day.precipitationProbability) ? '<div class="prob">🌧️ ' + prob(day.precipitationProbability) + '</div>' : '')
          + (wet(day.precipitation) ? '<div class="wet">' + wet(day.precipitation) + '</div>' : '')
          + '</button>';
      }).join('');

      var hours = (weather.hourly || []).map(function (p) {
        var extra = [prob(p.precipitationProbability), wet(p.precipitation)].filter(function (s) { return s; }).join(' · ');
        return '<div class="hour"><span class="t">' + esc(hourFmt.format(new Date(p.timestamp * 1000))) + '</span>'
          + '<span class="temp">' + round(p.temp) + deg() + '</span>'
          + '<span class="wet">' + extra + '</span></div>';
      }).join('');

      var scroll = panels.list.scrollTop;
      panels.list.innerHTML = '<div class="list-head"><h2>' + esc(weather.resolvedName || S.forecast) + '</h2>'
        + '<div class="muted cap">' + icon(c.condition) + ' ' + esc(describe(c)) + ' · ' + round(c.temp) + deg() + '</div></div>'
        + facts()
        + '<div><div class="section-title">' + esc(forecastTitle()) + '</div><div class="cards">' + cards + '</div></div>'
        + '<div><div class="section-title">' + esc(S.nextHours) + '</div>'
        + (hours ? '<div class="hours">' + hours + '</div>' : '<div class="muted">' + esc(S.noHours) + '</div>') + '</div>';
      // A refresh shouldn't throw someone back to the top mid-read.
      panels.list.scrollTop = scroll;
    };

    // --- Forecast: the day detail overlay ------------------------------------
    // Tapping a day card opens the day: a summary sentence, an hourly strip
    // for that day, and tiles. Future days have no hourly points (the core
    // ships the next 8 only), so they show the sentence and tiles with a
    // note instead of an empty strip. Like WeatherScenes, the overlay closes
    // after 60 s idle.
    var DETAIL_IDLE_MS = 60 * 1000;
    var detailTimer = null;
    var closeDetail = function () {
      detailDay = -1;
      clearTimeout(detailTimer);
      detailEl.hidden = true;
    };
    var armDetail = function () {
      clearTimeout(detailTimer);
      if (detailDay < 0) return;
      detailTimer = setTimeout(closeDetail, DETAIL_IDLE_MS);
    };
    var renderDetail = function (focusAlerts, focusBack) {
      if (detailDay < 0 || !weather) return;
      var day = weather.forecast[detailDay];
      if (!day) { closeDetail(); return; }
      var isToday = day.date === todayKey();
      var title = isToday ? S.today : longWeekdayFmt.format(dateOf(day.date));
      var sub = (isToday ? longWeekdayFmt.format(dateOf(day.date)) + ', ' : '')
        + monthFmt.format(dateOf(day.date)) + ' ' + dayNumFmt.format(dateOf(day.date));
      var line = summaryLine(day);
      var hours = dayHours(day);
      var strip = hours.map(function (p) {
        var h = new Date(p.timestamp * 1000).getHours();
        return '<div class="dhour" data-hour="' + String(h).padStart(2, '0') + '">'
          + '<div class="t">' + esc(shortHourFmt.format(new Date(p.timestamp * 1000))) + '</div>'
          + '<div class="temp">' + round(p.temp) + '°</div>'
          + (prob(p.precipitationProbability) ? '<div class="prob">' + prob(p.precipitationProbability) + '</div>' : '')
          + (wet(p.precipitation) ? '<div class="wet">' + wet(p.precipitation) + '</div>' : '')
          + '</div>';
      }).join('');
      var dTile = function (k, v, extra) {
        return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>' + (extra || '') + '</div>';
      };
      var tiles = [];
      if (Number.isFinite(day.high) || Number.isFinite(day.low)) {
        tiles.push(dTile(S.highLow, esc(round(day.high) + '° / ' + round(day.low) + '°')));
      }
      if (Number.isFinite(day.precipitationProbability)) {
        tiles.push(dTile(S.rainChance, esc(prob(day.precipitationProbability)),
          '<div class="muted" style="font-size:0.8rem">' + esc(S.precipAmount + ': ' + (wetAmount(day.precipitation) || S.precipNone)) + '</div>'));
      } else if (day.precipitation !== null && day.precipitation !== undefined) {
        tiles.push(dTile(S.precipAmount, esc(wetAmount(day.precipitation) || S.precipNone)));
      }
      if (Number.isFinite(day.uvIndex)) {
        tiles.push(dTile(S.uvIndex, esc(uv(day.uvIndex))));
      }

      var dayAlerts = settings.severeAlerts ? alertsForDay(detailDay) : [];
      var alertHTML = dayAlerts.length
        ? '<div class="alerts-list" id="d-alerts">' + alertArticles(dayAlerts) + '</div>'
        : '';

      detailEl.innerHTML = '<div class="d-head"><button type="button" class="back" data-action="back">← ' + esc(S.back) + '</button>'
        + '<div><h2>' + esc(title) + '</h2><div class="sub">' + esc(sub) + '</div></div>'
        + '<div class="cond">' + icon(day.condition) + ' ' + esc(describe(day)) + '<br>'
        + '<span class="hot">↑ ' + round(day.high) + '°</span> <span class="cold">↓ ' + round(day.low) + '°</span></div></div>'
        + (line ? '<p class="d-line">' + esc(line) + '</p>' : '')
        + '<div><div class="section-title">' + esc(S.nextHours) + '</div>'
        + (strip ? '<div class="dhours">' + strip + '</div>' : '<div class="muted">' + esc(S.noHours) + '</div>') + '</div>'
        + alertHTML
        + '<div class="d-tiles">' + tiles.join('') + '</div>';
      detailEl.hidden = false;
      // A fresh open scrolls a future day's strip to 7 AM, as in
      // WeatherScenes; a background re-render leaves the scroll alone.
      if (!focusBack) return;
      var stripEl = detailEl.querySelector('.dhours');
      if (detailDay !== 0 && stripEl) {
        var seven = stripEl.querySelector('[data-hour="07"]');
        if (seven) stripEl.scrollLeft = seven.offsetLeft - stripEl.firstElementChild.offsetLeft;
      }
      if (focusAlerts) {
        var al = detailEl.querySelector('#d-alerts');
        if (al) al.scrollIntoView({ block: 'start' });
      }
      var back = detailEl.querySelector('[data-action="back"]');
      if (back && focusBack) back.focus({ preventScroll: true });
    };
    var openDetail = function (index, focusAlerts) {
      if (!weather || index < 0 || index >= weather.forecast.length) return;
      detailDay = index;
      renderDetail(focusAlerts, true);
      armDetail();
    };

    panels.list.addEventListener('click', function (event) {
      var card = event.target.closest('[data-day]');
      if (card) openDetail(Number(card.getAttribute('data-day')));
      var back = event.target.closest('[data-action="back"]');
      if (back) closeDetail();
    });
    detailEl.addEventListener('click', function (event) {
      if (event.target.closest('[data-action="back"]')) { closeDetail(); return; }
      var more = event.target.closest('[data-action="more"]');
      if (more) {
        var idx = Number(more.getAttribute('data-idx'));
        var article = more.closest('.alert');
        var p = article && article.querySelector('.a-text');
        var expanded = more.getAttribute('data-expanded') === 'true';
        if (p && currentAlertTexts[idx] !== undefined) {
          p.textContent = expanded ? currentAlertShorts[idx] : currentAlertTexts[idx];
          more.textContent = expanded ? S.readFullAlert : S.showLess;
          more.setAttribute('data-expanded', String(!expanded));
        }
      }
    });
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (type) {
      document.addEventListener(type, armDetail, { passive: true });
    });

    // --- NWS severe-weather alerts (US only) ----------------------------------
    // Plugin-side, as in WeatherScenes: api.weather.gov/alerts/active for the
    // payload's own coordinates, refreshed every 5 minutes. The National
    // Weather Service is keyless and sends permissive CORS headers, so the
    // frame fetches it directly; the server proxy is the fallback, and it
    // only answers for hosts on the household's PROXY_WHITELIST. The proxy
    // is only for a direct request that fails outright (a network or CORS
    // error): any HTTP response from NWS, an error included, is NWS's
    // answer. A 400 or 404 means the point isn't covered (outside the US,
    // NWS answers 400 "out of bounds"), so polling stops for that location
    // until it changes — no banner, no icon, no more requests.
    var SEV_RANK = { Extreme: 4, Severe: 3, Moderate: 2, Minor: 1, Unknown: 0 };
    // NWS severity is one of the SEV_RANK keys, but never build a class name
    // straight from the response: an unexpected value would leave white text
    // with no background behind it.
    var sevClass = function (s) {
      return 'sev-' + (Object.prototype.hasOwnProperty.call(SEV_RANK, s) ? s.toLowerCase() : 'unknown');
    };
    var renderAlerts = function () {
      var top = alerts.length > 0 ? alerts[0] : null;
      // Banner threshold: Moderate and above get the full banner. Anything
      // below it (Minor advisories are the bulk of the year — king-tide
      // Coastal Flood, Small Craft, Heat) gets a small icon in the tabs row
      // instead, so it never steals panel height or pushes the graph. The
      // icon also covers tiny tiles, where the banner never fits. Either way
      // a tap opens the same detail dialog, which lists every alert.
      var banner = settings.severeAlerts && !!top && (SEV_RANK[top.severity] || 0) >= 2 && !tiny();
      var icon = settings.severeAlerts && !!top && !banner;
      alertsEl.hidden = !banner;
      iconEl.hidden = !icon;
      if (banner !== alertsShown) {
        alertsShown = banner;
        // The banner steals ~33px from the Now panel: the .has-alerts class
        // lets the hourly ribbon compress (min-height 80 -> 32) instead of
        // clipping at the panel's bottom edge. renderNow keeps the class in
        // place across weather reloads and resizes.
        panels.now.classList.toggle('has-alerts', banner);
      }
      if (!banner) { alertsEl.innerHTML = ''; }
      else {
        alertsEl.innerHTML = '<button type="button" class="banner ' + sevClass(top.severity) + '">'
          + '<span aria-hidden="true">⚠️</span><span class="b-event">' + esc(top.event) + '</span>'
          + '<span class="b-time">' + esc(alertTime(top)) + '</span>'
          + '<span class="b-more">' + esc(alerts.length > 1 ? '+' + (alerts.length - 1) + ' more' : S.alertDetails) + '</span></button>';
      }
      if (icon) {
        iconEl.className = 'alert-icon ' + sevClass(top.severity);
        iconEl.title = top.event;
        iconEl.setAttribute('aria-label', 'Weather alert: ' + top.event + '. Open details.');
        iconEl.textContent = '⚠️';
      }
    };
    var alertsLoading = false;
    // Rounded "lat,lon" of a location NWS says it doesn't cover (a 400 or
    // 404 on /alerts/active?point=). Polling stops for that location until
    // the coordinates change, so a display outside the US doesn't send a
    // failing request every 5 minutes, indefinitely.
    var alertsUnsupportedFor = null;
    var markAlertsUnsupported = function (key) {
      alertsUnsupportedFor = key;
      alerts = [];
      renderAlerts();
      if (detailDay >= 0) renderDetail(false, false);
    };
    var loadAlerts = function () {
      if (!settings.severeAlerts || !weather || !weather.coordinates
          || !Number.isFinite(weather.coordinates.lat) || !Number.isFinite(weather.coordinates.lon)) {
        alerts = [];
        renderAlerts();
        return Promise.resolve();
      }
      // Alerts are zone-based, so 2 decimals (~1 km) returns the same alerts
      // as 4 decimals (~11 m) without sending a precise location.
      var coordKey = weather.coordinates.lat.toFixed(2) + ',' + weather.coordinates.lon.toFixed(2);
      if (alertsUnsupportedFor === coordKey) return Promise.resolve();
      // One request at a time, and none while the page is hidden: the
      // 5-minute timer and the post-weather-load call can otherwise overlap,
      // and hidden displays don't need fresh alerts.
      if (alertsLoading || document.hidden) return Promise.resolve();
      alertsLoading = true;
      var url = 'https://api.weather.gov/alerts/active?point=' + coordKey;
      var parse = function (d) {
        return ((d && d.features) || []).map(function (f) { return f.properties || {}; })
          .filter(function (a) { return a.event && (!a.status || a.status === 'Actual'); })
          .map(function (a) {
            return {
              event: a.event, severity: a.severity || 'Unknown',
              onset: a.onset || a.effective || null, ends: a.ends || a.expires || null,
              description: a.description || '', instruction: a.instruction || ''
            };
          })
          .sort(function (a, b) { return (SEV_RANK[b.severity] || 0) - (SEV_RANK[a.severity] || 0); });
      };
      var checkAlertsResponse = function (res, source) {
        // A 400 or 404 is NWS saying the point isn't covered: outside the
        // US it answers 400 "Parameter point is invalid: out of bounds"
        // (London, Toronto, Sydney). The point is formatted here, so the
        // same request can't succeed later: stop polling for this location
        // until it changes. Any other HTTP response, error included, is
        // NWS's answer — keep the last good alerts and retry next cycle,
        // without falling back to the proxy.
        if (res.status === 400 || res.status === 404) { markAlertsUnsupported(coordKey); return null; }
        if (!res.ok) throw new Error(source + ' ' + res.status);
        return res.json();
      };
      return fetch(url, { headers: { Accept: 'application/geo+json' } })
        .then(function (res) { return checkAlertsResponse(res, 'nws'); },
          function () {
            // Direct request failed outright (a network or CORS error):
            // only then fall back to the server proxy.
            return fetch('/api/proxy?targetUrl=' + encodeURIComponent(url)).then(function (res) {
              return checkAlertsResponse(res, 'proxy');
            });
          })
        .then(function (d) {
          if (d === null) return; // unsupported location: alerts already cleared
          alerts = parse(d);
          renderAlerts();
          if (detailDay >= 0) renderDetail(false, false);
        })
        .catch(function () {
          // Keep the last good alerts through a passing failure.
        })
        .then(function () { alertsLoading = false; });
    };
    var alertsForDay = function (i) {
      if (i === 0) return alerts;
      var day = weather.forecast[i];
      if (!day) return [];
      var start = dateOf(day.date).getTime();
      var end = start + 86400000;
      return alerts.filter(function (a) {
        var on = a.onset ? Date.parse(a.onset) : 0;
        var off = a.ends ? Date.parse(a.ends) : Infinity;
        return on < end && off > start;
      });
    };
    var alertTime = function (a) {
      if (!a.ends) return '';
      var d = new Date(a.ends);
      var today = new Date();
      var same = d.toDateString() === today.toDateString();
      return fill(S.until, { t: (same ? '' : weekdayFmt.format(d) + ' ') + hourFmt.format(d) });
    };
    var alertArticles = function (dayAlerts) {
      currentAlertTexts = dayAlerts.map(function (a) {
        return a.description + (a.instruction ? '\n\n' + a.instruction : '');
      });
      currentAlertShorts = currentAlertTexts.map(function (text) {
        return text.length > 320 ? text.slice(0, 300).replace(/\s+\S*$/, '') + '…' : text;
      });
      return dayAlerts.map(function (a, n) {
        var short = currentAlertShorts[n];
        var full = currentAlertTexts[n];
        return '<article class="alert ' + sevClass(a.severity) + '">'
          + '<h3>' + esc(a.event) + '</h3><p class="a-time">' + esc(alertTime(a)) + '</p>'
          + '<p class="a-text">' + esc(short) + '</p>'
          + (short !== full ? '<button type="button" class="a-more" data-action="more" data-idx="' + n + '" data-expanded="false">' + esc(S.readFullAlert) + '</button>' : '')
          + '</article>';
      }).join('');
    };
    alertsEl.addEventListener('click', function () {
      var today = todayIndex();
      openDetail(today >= 0 ? today : 0, true);
    });
    iconEl.addEventListener('click', function () {
      var today = todayIndex();
      openDetail(today >= 0 ? today : 0, true);
    });
    setInterval(loadAlerts, 5 * 60 * 1000);

    // --- tabs -------------------------------------------------------------------
    var render = function () {
      if (!weather) return;
      var small = tiny();
      tabsBar.hidden = small;
      if (small) tab = 'now';
      stamp.textContent = updatedAt && boxSize().w >= 340 ? fill(S.updated, { t: hourFmt.format(updatedAt) }) : '';
      renderAlerts();
      Object.keys(panels).forEach(function (k) {
        var on = k === tab;
        panels[k].hidden = !on;
        tabButtons[k].setAttribute('aria-selected', String(on));
        tabButtons[k].tabIndex = on ? 0 : -1;
      });
      app.classList.toggle('on-now', tab === 'now');
      // Both panels are drawn on every render; switching tabs renders again, so
      // the ribbon is always measured while its panel is showing.
      renderList();
      renderNow();
      if (detailDay >= 0) renderDetail(false, false);
    };

    var select = function (name, focus) {
      if (name === tab) return;
      tab = name;
      render();
      if (focus) tabButtons[name].focus();
      armReturn();
    };

    // A wall display shouldn't stay parked on the list: after a quiet spell on
    // Forecast, go back to Now.
    var RETURN_AFTER = 3 * 60 * 1000;
    var returnTimer = null;
    var armReturn = function () {
      clearTimeout(returnTimer);
      if (tab !== 'now') returnTimer = setTimeout(function () { closeDetail(); select('now'); }, RETURN_AFTER);
    };
    ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (type) {
      document.addEventListener(type, armReturn, { passive: true });
    });
    panels.list.addEventListener('scroll', armReturn, { passive: true });

    document.getElementById('tablist').addEventListener('click', function (event) {
      var button = event.target.closest('[data-tab]');
      if (button) select(button.getAttribute('data-tab'));
    });
    document.getElementById('tablist').addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight' || event.key === 'Home' || event.key === 'End') {
        event.preventDefault();
        var order = ['now', 'list'];
        var i = order.indexOf(tab);
        if (event.key === 'Home') i = 0;
        else if (event.key === 'End') i = order.length - 1;
        else i = (i + (event.key === 'ArrowRight' ? 1 : -1) + order.length) % order.length;
        select(order[i], true);
      }
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && detailDay >= 0) { closeDetail(); return; }
      if (event.key === 'Escape' && tab !== 'now') select('now', true);
    });

    var resizeTimer = null;
    var scheduleRender = function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 120);
    };
    window.addEventListener('resize', scheduleRender);
    // The box can change without the window resizing (mirror entry settles
    // the grid after the frame first renders; a tab switch shows a box that
    // was hidden) — watch the box itself, not just the window. The app fills
    // the frame (height: 100%), so its own size never moves with content and
    // this cannot loop: render() only rewrites what is inside the box.
    if (typeof ResizeObserver !== 'undefined' && app) {
      var boxObserver = new ResizeObserver(function () { scheduleRender(); });
      boxObserver.observe(app);
    }

    // --- start --------------------------------------------------------------------
    var readSettings = function () {
      if (!window.HomeGlow || !window.HomeGlow.settings) return Promise.resolve();
      return window.HomeGlow.settings.get().then(function (values) {
        if (values && typeof values === 'object') {
          Object.keys(settings).forEach(function (k) { if (values[k] !== undefined && values[k] !== null) settings[k] = values[k]; });
        }
      }).catch(function () {
        // Opened outside the dashboard (no plugin context): use the defaults.
      });
    };

    readSettings().then(load);
    // Weather changes slowly and the server caches it; a quarter hour is plenty.
    setInterval(function () { readSettings().then(load); }, 15 * 60 * 1000);
  })();
  </script>
</body>
</html>
