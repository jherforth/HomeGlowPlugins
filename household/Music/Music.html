  <style>
    /* The whole widget is the player (after the music player of
       HomeGlow #264, by Jason Stantler): the cover large, its colors blurred
       behind, side by side when wide and stacked when tall. Theme roles
       throughout, each with a fallback. */
    :root {
      color-scheme: light dark;
      --acc: var(--accent, #3a7cc4);
      --ink: var(--text, #1e2b3a);
      --ink-2: var(--text-secondary, #5a6b7d);
      --on-bg: var(--hg-button-bg, var(--acc));
      --on-ink: var(--hg-button-text, #fff);
      --level: var(--hg-meter-fill, var(--acc));
      --level-track: var(--hg-meter-track, rgba(127, 127, 127, 0.22));
      --tile-bg: color-mix(in srgb, var(--ink) 7%, transparent);
      --err: var(--hg-error, #c43d3d);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--card-bg, #fff);
      color: var(--ink);
      font-family: var(--hg-font-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    button { font: inherit; color: inherit; }
    svg { display: block; }

    #app { position: relative; height: 100%; container-type: size; isolation: isolate; overflow: hidden; }
    .backdrop { position: absolute; inset: -15%; width: 130%; height: 130%; object-fit: cover; z-index: 0; pointer-events: none;
      filter: blur(46px) saturate(1.3); opacity: 0.55; }
    #app::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(100deg, color-mix(in srgb, var(--surface, #fff) 18%, transparent), color-mix(in srgb, var(--surface, #fff) 74%, transparent) 58%); }
    .stage { --pad: clamp(12px, 5cqmin, 40px); position: relative; z-index: 1; height: 100%; padding: var(--pad);
      display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: clamp(12px, 5cqmin, 48px); }
    .sleeve { height: min(calc(100cqh - 2 * var(--pad)), 46cqw); aspect-ratio: 1; border-radius: var(--hg-radius-md, 14px); overflow: hidden;
      display: grid; place-items: center; background: color-mix(in srgb, var(--acc) 14%, var(--surface, #fff));
      box-shadow: 0 22px 48px -18px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.12); }
    .sleeve img { width: 100%; height: 100%; object-fit: cover; }
    .sleeve > svg { width: 36%; height: 36%; fill: none; stroke: var(--acc); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .info { min-width: 0; display: flex; flex-direction: column; gap: clamp(4px, 1.4cqmin, 12px); }
    .who { align-self: flex-start; display: inline-flex; align-items: center; gap: 0.45em; max-width: 100%; min-height: 32px; padding: 0 0.7em 0 0.5em;
      border: 0; border-radius: 999px; background: var(--tile-bg); color: var(--ink-2); font-weight: 650; font-size: clamp(0.74rem, 2.3cqmin, 1rem); cursor: pointer; }
    .who[disabled] { cursor: default; background: transparent; padding-left: 0; }
    .who svg { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title { font-family: var(--hg-font-heading, inherit); font-size: clamp(1.1rem, 6.4cqmin, 3.2rem); font-weight: 760; line-height: 1.06; letter-spacing: -0.015em;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-wrap: balance; }
    .artist { font-size: clamp(0.9rem, 3.4cqmin, 1.6rem); font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album { font-size: clamp(0.78rem, 2.6cqmin, 1.15rem); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .idle .title { color: var(--ink-2); font-weight: 650; }

    .prog { width: 100%; margin-top: clamp(2px, 2cqmin, 16px); }
    .bar { position: relative; height: 22px; display: flex; align-items: center; }
    .bar[data-seek] { cursor: pointer; touch-action: none; }
    .bar::before { content: ''; position: absolute; left: 0; right: 0; height: 5px; border-radius: 999px; background: var(--level-track); }
    .done { position: absolute; left: 0; width: 0; height: 5px; border-radius: 999px; background: var(--level); }
    .bar[data-seek] .done::after { content: ''; position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
      border-radius: 50%; background: var(--level); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
    .bar:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; border-radius: 6px; }
    .times { display: flex; justify-content: space-between; margin-top: -2px; font-size: clamp(0.68rem, 2.2cqmin, 0.95rem); color: var(--ink-2); font-variant-numeric: tabular-nums; }

    .ctl { display: flex; align-items: center; gap: clamp(4px, 2.4cqmin, 22px); margin-top: clamp(0px, 1cqmin, 8px); }
    .btn { appearance: none; border: 0; cursor: pointer; border-radius: var(--hg-button-radius, 999px); background: color-mix(in srgb, var(--acc) 14%, transparent);
      font-weight: var(--hg-button-weight, 650); min-height: 40px; padding: 0 1em; }
    .btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    .btn[disabled] { opacity: 0.4; cursor: default; }
    .btn.primary { background: var(--on-bg); color: var(--on-ink); }
    .btn.icon { padding: 0; width: clamp(40px, 9.5cqmin, 72px); height: clamp(40px, 9.5cqmin, 72px); display: grid; place-items: center; flex: none; }
    .btn.icon svg { width: 50%; height: 50%; fill: currentColor; }
    .btn.icon.lg { width: clamp(52px, 15cqmin, 104px); height: clamp(52px, 15cqmin, 104px); background: var(--on-bg); color: var(--on-ink); }
    .btn.icon.lg svg { width: 44%; height: 44%; }
    .btn.icon.quiet { background: transparent; }
    .btn.icon.toggled { background: var(--on-bg); color: var(--on-ink); }
    /* Quiet hours: in place of the controls that would start music. */
    .quiet-hours { display: inline-flex; align-items: center; gap: 0.5em; min-height: clamp(52px, 15cqmin, 104px); padding: 0 1.1em; border-radius: 999px;
      background: var(--tile-bg); color: var(--ink-2); font-weight: 650; font-size: clamp(0.8rem, 2.6cqmin, 1.1rem); }
    .quiet-hours svg { width: 1.3em; height: 1.3em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .btn.busy { position: relative; }
    .btn.busy::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--acc); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vol { display: flex; align-items: center; gap: 10px; max-width: 440px; margin-top: clamp(2px, 1.4cqmin, 12px); }
    .vol svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--ink-2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 30px; margin: 0; background: transparent; cursor: pointer; --pct: 50%; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 999px;
      background: linear-gradient(to right, var(--level) 0 var(--pct), var(--level-track) var(--pct) 100%); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;
      background: var(--surface, #fff); border: 3px solid var(--level); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); }
    input[type=range]::-moz-range-track { height: 6px; border-radius: 999px; background: var(--level-track); }
    input[type=range]::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--level); }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface, #fff); border: 3px solid var(--level); }
    input[type=range]:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; border-radius: 8px; }

    .note { margin: auto; max-width: 420px; padding: 16px; text-align: center; color: var(--ink-2); line-height: 1.45; position: relative; z-index: 1; }
    .note.err { color: var(--err); }
    .hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; max-width: 90%; padding: 6px 12px; border-radius: 10px;
      font-size: 0.82rem; font-weight: 650; text-align: center; background: color-mix(in srgb, var(--ink) 85%, transparent); color: var(--background, #fff); }

    /* Taller than wide: the cover on top, everything centered under it. */
    @container (max-aspect-ratio: 6/5) {
      .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; justify-items: center; text-align: center; }
      .sleeve { height: auto; max-height: 100%; width: min(76cqw, 46cqh); }
      .info { align-items: center; width: 100%; max-width: 560px; }
      .who { align-self: center; }
      .ctl { justify-content: center; }
      .vol { width: 100%; }
      #app::after { background: linear-gradient(180deg, color-mix(in srgb, var(--surface, #fff) 18%, transparent), color-mix(in srgb, var(--surface, #fff) 76%, transparent) 52%); }
    }
    /* Too small for the cover above the controls: the controls alone. */
    @container (max-aspect-ratio: 6/5) and (max-height: 460px) {
      .sleeve { display: none; }
      .stage { grid-template-rows: auto; align-content: center; }
    }
    @container (max-height: 340px) { .album { display: none; } }
    @container (max-height: 240px) { .vol, .times { display: none; } .sleeve { display: none; } .stage { grid-template-columns: minmax(0, 1fr); } }

    /* Overlays: the library and the speaker list. */
    .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 8px;
      background: color-mix(in srgb, var(--background, #000) 72%, transparent); }
    .sheet { width: min(640px, 100%); max-height: 100%; height: min(100%, 780px); overflow: hidden; border-radius: var(--hg-radius-lg, 18px); padding: 12px;
      background: var(--surface, #fff); color: var(--ink); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; gap: 8px; }
    .sheet.small { height: auto; width: min(420px, 100%); }
    .sheet h2 { margin: 0; font-size: 1rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head { display: flex; align-items: center; gap: 6px; }
    .head .btn.icon { width: 40px; height: 40px; }
    .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--tile-bg); }
    .tabs .btn { flex: 1; background: transparent; min-height: 36px; }
    .tabs .btn.current { background: var(--on-bg); color: var(--on-ink); }
    .body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    .item { appearance: none; border: 0; text-align: left; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 6px; min-height: 56px; border-radius: 10px; background: transparent; }
    .item:hover, .item:focus-visible { background: var(--tile-bg); }
    .item:focus-visible { outline: 3px solid var(--acc); outline-offset: -3px; }
    .item.current { background: color-mix(in srgb, var(--acc) 14%, transparent); }
    .thumb { width: 44px; height: 44px; flex: none; border-radius: 6px; object-fit: cover; background: var(--tile-bg); display: grid; place-items: center; }
    .thumb svg { width: 55%; height: 55%; fill: none; stroke: var(--acc); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .t { flex: 1; min-width: 0; }
    .t b { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t span { display: block; font-size: 0.78rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .go { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; }
    .go svg { width: 50%; height: 50%; fill: currentColor; }
    .go.play { appearance: none; border: 0; cursor: pointer; background: var(--on-bg); color: var(--on-ink); }
    .go.play:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    .go.grp { appearance: none; border: 0; cursor: pointer; background: var(--tile-bg); color: var(--ink); }
    .go.grp.on { background: var(--on-bg); color: var(--on-ink); }
    .go.grp.busy { opacity: 0.45; cursor: progress; }
    .go.grp:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    label.item { cursor: pointer; }
    label.item input { width: 22px; height: 22px; margin: 0 6px; flex: none; accent-color: var(--acc); cursor: pointer; }
    .hintline { margin: 0 2px; font-size: 0.82rem; color: var(--ink-2); line-height: 1.35; }
    .foot { display: flex; gap: 8px; justify-content: flex-end; }
    .search { display: flex; gap: 6px; position: relative; }
    /* Suggestions as you type, under the search box. */
    .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 2; padding: 4px; border-radius: 12px;
      background: var(--surface, #fff); box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28); border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
    .suggest[hidden] { display: none; }
    .suggest button { appearance: none; border: 0; width: 100%; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 8px;
      background: transparent; text-align: left; cursor: pointer; }
    .suggest button.active, .suggest button:hover { background: var(--tile-bg); }
    .suggest svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--ink-2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .suggest .s { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggest .s b { font-weight: 750; }
    .suggest .k { flex: none; font-size: 0.75rem; color: var(--ink-2); }
    input.text { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 1rem;
      border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); background: var(--background, #fff); color: var(--ink); -webkit-user-select: text; user-select: text; }
    input.text:focus-visible { outline: 3px solid var(--acc); outline-offset: 1px; }
    .label { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; font-weight: 650; color: var(--ink-2); margin: 6px 2px 2px; }
    .label .btn { min-height: 30px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips .btn { min-height: 40px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { padding: 14px 6px; text-align: center; color: var(--ink-2); font-size: 0.9rem; }
    .status.err { color: var(--err); }
    .row { display: flex; gap: 8px; align-items: center; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>

    el.addEventListener('keydown', function (event) { if (event.key === 'Escape') close(); });
    build(sheet, close);
    return close;
  }

  function openSpeakers() {
    overlay(function (sheet, close) {
      var editing = null;   // the ticked speakers while the list is being edited
      var busyIds = {};
      var problemText = null;
      var lastHtml = null;
      var touching = false;
      var scrolledAt = 0;

      // Drawn again only when something shown has changed, at the same place
      // in the list: a poll mustn't throw a scrolling finger back to the top.
      function paintSheet(html) {
        if (html === lastHtml) return false;
        var list = sheet.querySelector('.body');
        var top = list ? list.scrollTop : 0;
        sheet.innerHTML = html;
        lastHtml = html;
        list = sheet.querySelector('.body');
        if (list) list.scrollTop = top;
        return true;
      }

      function draw() {
        if (!sheet.isConnected) { refreshSheet = null; return; }
        var focused = document.activeElement && sheet.contains(document.activeElement) ? document.activeElement : null;
        var mark = focused && (focused.getAttribute('data-id') ? '[data-id="' + focused.getAttribute('data-id') + '"]'
          : focused.getAttribute('data-group') ? '[data-group="' + focused.getAttribute('data-group') + '"]' : null);
        var html;
        if (editing) {
          var everyone = Object.keys(players).sort(function (a, b) { return nameOf(a).localeCompare(nameOf(b)); });
          html = '<div class="head"><h2>' + esc(T.toOffer) + '</h2><button type="button" class="btn icon quiet" data-close aria-label="' + esc(T.close) + '">' + glyph('close') + '</button></div>'
            + '<p class="hintline">' + esc(T.editHint) + '</p>'
            + '<div class="body">' + everyone.map(function (id) {
              return '<label class="item"><input type="checkbox" data-pick="' + esc(id) + '"' + (editing[id] ? ' checked' : '') + '>'
                + '<span class="t"><b>' + esc(nameOf(id)) + '</b><span>' + esc([sourceName(id), id, players[id].state === 'unavailable' ? T.unavailable : ''].filter(Boolean).join(' · ')) + '</span></span></label>';
            }).join('') + '</div>'
            + (problemText ? '<p class="status err">' + esc(problemText) + '</p>' : '')
            + '<div class="foot"><button type="button" class="btn" data-automatic>' + esc(T.automatic) + '</button><span style="flex:1"></span>'
            + '<button type="button" class="btn" data-cancel>' + esc(T.cancel) + '</button><button type="button" class="btn primary" data-save>' + esc(T.save) + '</button></div>';
          paintSheet(html);
          return;
        }
        var ids = offered();
        var group = groupOf(current);
        var groupable = canGroup(current);
        html = '<div class="head"><h2>' + esc(T.speakers) + '</h2>'
          + (viewOnlyDisplay ? '' : '<button type="button" class="btn" data-edit>' + esc(T.edit) + '</button>')
          + '<button type="button" class="btn icon quiet" data-close aria-label="' + esc(T.close) + '">' + glyph('close') + '</button></div>'
          + (groupable && ids.some(function (id) { return id !== current && canGroup(id); }) ? '<p class="hintline">' + esc(fmt(T.groupHint, { name: nameOf(current) })) + '</p>' : '')
          + '<div class="body">' + ids.map(function (id) {
            var p = players[id];
            var what = [p.attributes.media_title && !looksLikeAddress(p.attributes.media_title) ? p.attributes.media_title : p.state, sourceName(id)].filter(Boolean).join(' · ');
            var inGroup = group.indexOf(id) !== -1;
            // In quiet hours a speaker can leave the group but not join it:
            // joining starts the music on it.
            var toggle = id !== current && groupable && canGroup(id) && (inGroup || !quietUntil())
              ? '<button type="button" class="go grp' + (inGroup ? ' on' : '') + (busyIds[id] ? ' busy' : '') + '" data-group="' + esc(id) + '" aria-pressed="' + inGroup + '" aria-label="'
                + esc(fmt(inGroup ? T.groupLeave : T.groupWith, { name: nameOf(id) })) + '">' + glyph(inGroup ? 'check' : 'plus') + '</button>'
              : '';
            return '<div class="row"><button type="button" class="item' + (id === current ? ' current' : '') + '"' + (id === current ? ' aria-current="true"' : '') + ' data-id="' + esc(id) + '">'
              + '<span class="thumb">' + stroke('speaker') + '</span><span class="t"><b>' + esc(nameOf(id)) + '</b><span>' + esc(what) + '</span></span></button>' + toggle + '</div>';
          }).join('') + '</div>'
          + (problemText ? '<p class="status err">' + esc(problemText) + '</p>' : '');
        if (!paintSheet(html)) return;
        var again = mark && sheet.querySelector(mark);
        if (again) again.focus({ preventScroll: true });
      }

      // Join to the group's leader; leave on the speaker itself.
      function toggleGroup(id) {
        if (busyIds[id]) return;
        var group = groupOf(current);
        var joining = group.indexOf(id) === -1;
        if (joining && quietUntil()) { problemText = fmt(T.quietBlocked, { t: timeLabel(quietUntil()) }); draw(); return; }
        var leader = canGroup(group[0]) ? group[0] : current;
        var target = joining ? leader : id;
        busyIds[id] = true;
        problemText = null;
        draw();
        HG.homeAssistant.action(target, joining ? 'join' : 'unjoin', joining ? [id] : undefined).then(function (data) {
          Object.keys((data && data.entities) || {}).forEach(function (key) { if (data.entities[key]) players[key] = data.entities[key]; });
          delete busyIds[id];
          render();
          draw();
          // The other speakers' side of it arrives with the next look.
          setTimeout(poll, 700);
        }).catch(function (error) {
          delete busyIds[id];
          problemText = error.message || T.failed;
          draw();
        });
      }

      // Blank is Automatic: chosen by the widget, and speakers added later
      // are offered too.
      function save(automatic) {
        var picked = Object.keys(players).filter(function (id) { return editing[id]; }).sort();
        if (!automatic && !picked.length) { problemText = T.needOne; draw(); return; }
        var auto = automaticSpeakers().sort();
        var value = automatic || picked.join(',') === auto.join(',') ? '' : picked.join(',');
        HG.settings.set({ speakers: value }).then(function () {
          settings.speakers = value;
          editing = null;
          problemText = null;
          chooseCurrent();
          render();
          draw();
        }).catch(function (error) {
          problemText = error.message || T.failed;
          draw();
        });
      }

      sheet.addEventListener('click', function (event) {
        var t = event.target;
        if (t.closest('[data-close]')) { refreshSheet = null; close(); return; }
        if (t.closest('[data-edit]')) {
          editing = {};
          offered().forEach(function (id) { editing[id] = true; });
          problemText = null;
          draw();
          return;
        }
        if (t.closest('[data-cancel]')) { editing = null; problemText = null; draw(); return; }
        if (t.closest('[data-automatic]')) { save(true); return; }
        if (t.closest('[data-save]')) { save(false); return; }
        var grp = t.closest('[data-group]');
        if (grp) { toggleGroup(grp.getAttribute('data-group')); return; }
        var item = t.closest('[data-id]');
        if (!item) return;
        current = item.getAttribute('data-id');
        // Remembered for this display.
        HG.settings.set({ speaker: current }).catch(function () {});
        settings.speaker = current;
        refreshSheet = null;
        close();
        render();
      });
      sheet.addEventListener('change', function (event) {
        var box = event.target.closest('[data-pick]');
        if (box && editing) editing[box.getAttribute('data-pick')] = box.checked;
      });

      // Not while a finger is on the list or it is still gliding.
      sheet.addEventListener('pointerdown', function () { touching = true; });
      window.addEventListener('pointerup', function () { touching = false; scrolledAt = Date.now(); });
      window.addEventListener('pointercancel', function () { touching = false; scrolledAt = Date.now(); });
      sheet.addEventListener('scroll', function () { scrolledAt = Date.now(); }, true);
      refreshSheet = function () {
        if (editing || touching || Date.now() - scrolledAt < 1500) return;
        draw();
      };
      draw();
      var first = sheet.querySelector('.current') || sheet.querySelector('[data-id]');
      if (first) first.focus();
    }, true);
  }

  // --- Suggestions while searching ------------------------------------------------------
  // HomeGlow remembers every search it runs, so the widget doesn't search on
  // each keystroke. It suggests from what it already knows: recent searches,
  // and the names of artists, albums, playlists and songs it has seen while
  // browsing or searching, kept in plugin storage so every display shares
  // them. A suggestion runs an ordinary search.

  var NAMES_KEY = 'names';
  var NAMES_MAX = 600;
  var NAMES_BYTES = 56000;   // under plugin storage's 64 KB a value
  var NAME_KINDS = { artist: 1, album: 2, playlist: 3, track: 4, podcast: 5, channel: 6 };
  var known = [];            // [name, kind], newest first
  var namesTimer = null;
  var fold = function (text) {
    return String(text || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
  };
  var nameId = function (pair) { return fold(pair[0]) + '|' + pair[1]; };

  // Newest first, one of each, and within the size plugin storage takes.
  function mergeNames(first, then) {
    var seen = {};
    var list = first.concat(then).filter(function (pair) {
      var id = nameId(pair);
      if (seen[id]) return false;
      seen[id] = true;
      return true;
    }).slice(0, NAMES_MAX);
    while (list.length && JSON.stringify(list).length > NAMES_BYTES) list = list.slice(0, Math.floor(list.length * 0.9));
    return list;
  }
  function loadNames() {
    if (!HG.storage) return Promise.resolve();
    return HG.storage.get(NAMES_KEY).then(function (value) {
      if (Array.isArray(value)) known = value.filter(function (pair) { return Array.isArray(pair) && typeof pair[0] === 'string' && NAME_KINDS[pair[1]]; });
    }).catch(function () {});
  }
  function rememberNames(items) {
    var fresh = (items || []).filter(function (item) {
      return item && item.title && NAME_KINDS[item.kind] && !looksLikeAddress(item.title);
    }).map(function (item) { return [String(item.title).slice(0, 120), item.kind]; });
    if (!fresh.length) return;
    known = mergeNames(fresh, known);
    // Saved a little later, on top of what other displays have saved since.
    clearTimeout(namesTimer);
    namesTimer = setTimeout(function () {
      if (!HG.storage) return;
      HG.storage.get(NAMES_KEY).catch(function () { return null; }).then(function (stored) {
        known = mergeNames(known, Array.isArray(stored) ? stored : []);
        return HG.storage.set(NAMES_KEY, known);
      }).catch(function () {});
    }, 4000);
  }

  // Up to six: matching recent searches first, then names, those starting
  // with what was typed before those with a word that does.
  function suggestionsFor(query, recent) {
    var q = fold(query);
    if (!q) return [];
    var tokens = q.split(' ');
    var score = function (text) {
      var f = fold(text);
      if (f === q) return null;
      if (f.indexOf(q) === 0) return 0;
      var words = f.split(/[\s\-–—_()[\],.&/:;'"!?¿¡]+/);
      return tokens.every(function (t) { return words.some(function (w) { return w.indexOf(t) === 0; }); }) ? 1 : null;
    };
    var out = [];
    var seen = {};
    var add = function (text, kind, s) {
      var id = fold(text);
      if (seen[id]) return;
      seen[id] = true;
      out.push({ text: text, kind: kind, prefix: s === 0 });
    };
    (recent || []).forEach(function (r) { var s = score(r); if (s !== null) add(r, 'recent', s); });
    known.map(function (pair) { return { pair: pair, s: score(pair[0]) }; })
      .filter(function (x) { return x.s !== null; })
      .sort(function (a, b) { return a.s - b.s || NAME_KINDS[a.pair[1]] - NAME_KINDS[b.pair[1]]; })
      .forEach(function (x) { add(x.pair[0], x.pair[1], x.s); });
    return out.slice(0, 6);
  }

  // --- The library: the speaker's own ----------------------------------------------------

  // view: { tab: 'browse'|'search', stack: [levels], query, results, recent, status }
  function openLibrary() {
    var s = st();
    var speakerLibrary = has(s, F.BROWSE) || has(s, F.SEARCH);
    // Most speakers can be browsed; only some (Music Assistant) searched.
    var can = function (tab) { return has(s, tab === 'search' ? F.SEARCH : F.BROWSE); };
    var view = { tab: can('browse') ? 'browse' : 'search', stack: [], query: '', results: null, recent: [], status: null };
    overlay(function (sheet, close) {
      function draw() {
        var top = view.stack[view.stack.length - 1];
        var title = view.tab === 'search' ? T.search : (top && top.title) || T.library;
        var html = '<div class="head">'
          + (view.tab === 'browse' && view.stack.length > 1 ? '<button type="button" class="btn icon quiet" data-back aria-label="' + esc(T.back) + '">' + glyph('back') + '</button>' : '')
          + '<h2>' + esc(title) + '</h2><button type="button" class="btn icon quiet" data-close aria-label="' + esc(T.close) + '">' + glyph('close') + '</button></div>';
        if (can('browse') && can('search')) {
          html += '<div class="tabs" role="tablist"><button type="button" class="btn' + (view.tab === 'browse' ? ' current' : '') + '" data-tab="browse">' + esc(T.browse) + '</button>'
            + '<button type="button" class="btn' + (view.tab === 'search' ? ' current' : '') + '" data-tab="search">' + esc(T.search) + '</button></div>';
        }
        html += '<div class="body">';
        if (!speakerLibrary) {
          html += '<p class="status">' + esc(T.cannotBrowse) + '</p>';
        } else if (view.tab === 'search') {
          html += '<form class="search" data-search><input class="text" type="search" name="q" value="' + esc(view.query) + '" placeholder="' + esc(T.searchPlaceholder) + '" aria-label="' + esc(T.search) + '" enterkeyhint="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">'
            + '<button class="btn primary">' + esc(T.go) + '</button><div class="suggest" id="suggestions" role="listbox" data-suggestions hidden></div></form>';
          if (view.status) html += '<p class="status' + (view.status.err ? ' err' : '') + '">' + esc(view.status.text) + '</p>';
          else if (view.results) html += view.results.length ? view.results.map(itemHtml).join('') : '<p class="status">' + esc(T.noResults) + '</p>';
          else if (view.recent.length) {
            html += '<div class="label"><span>' + esc(T.recent) + '</span><button type="button" class="btn" data-clear-recent>' + esc(T.clear) + '</button></div>'
              + '<div class="chips">' + view.recent.map(function (q) { return '<button type="button" class="btn" data-recent="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') + '</div>';
          }
        } else if (view.status) {
          html += '<p class="status' + (view.status.err ? ' err' : '') + '">' + esc(view.status.text) + '</p>';
        } else if (top) {
          html += top.items.length ? top.items.map(itemHtml).join('') : '<p class="status">' + esc(T.empty) + '</p>';
        }
        html += '</div>';
        sheet.innerHTML = html;
        var input = sheet.querySelector('input[name=q]');
        if (input && !view.results && !view.status) input.focus();
      }

      function itemHtml(item, index) {
        var thumb = item.thumb ? '<img class="thumb" alt="" loading="lazy" src="' + esc(item.thumb) + '">' : '<span class="thumb">' + stroke('music') + '</span>';
        var kind = T['kind_' + item.kind] || item.kind || '';
        var sub = [kind, item.sub].filter(Boolean).join(' · ');
        var action = item.canOpen ? 'open' : 'play';
        return '<div class="row">'
          + '<button type="button" class="item" data-index="' + index + '" data-do="' + action + '">' + thumb + '<span class="t"><b>' + esc(item.title) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</span>'
          + (item.canOpen ? '<span class="go">' + glyph('open') + '</span>' : '') + '</button>'
          + (item.canOpen && item.canPlay ? '<button type="button" class="go play" data-index="' + index + '" data-do="play" aria-label="' + esc(T.play + ' ' + item.title) + '">' + glyph('play') + '</button>' : '')
          + '</div>';
      }

      var listOf = function () { return view.tab === 'search' ? view.results || [] : (view.stack[view.stack.length - 1] || { items: [] }).items; };

      function load(promise, push) {
        view.status = { text: T.loading };
        draw();
        return promise.then(function (level) {
          view.status = null;
          rememberNames(level.items);
          if (push) view.stack.push(level);
          draw();
        }).catch(function (error) {
          if (error && error.status === 410) { flash(T.stale); return openRoot(); }
          view.status = { text: (error && error.message) || T.failed, err: true };
          draw();
        });
      }

      function openRoot() {
        view.stack = [];
        view.results = null;
        if (!speakerLibrary) { draw(); return Promise.resolve(); }
        if (view.tab === 'search') return loadRecent();
        return load(speakerSource.browse(null), true);
      }

      function loadRecent() {
        return speakerSource.recent().then(function (list) { view.recent = list || []; draw(); }).catch(function () { view.recent = []; draw(); });
      }

      function play(items, index) {
        var item = items[index];
        if (!st() || !has(st(), F.PLAY_MEDIA)) { flash(T.cannotPlay); return; }
        if (quietBlocks(st())) { close(); quietHint(); return; }
        close();
        act('play_media', item.key, { busy: 'play_pause', optimistic: { state: 'playing' } }).catch(function (error) {
          if (error && error.status === 410) flash(T.stale);
        });
      }

      sheet.addEventListener('click', function (event) {
        var t = event.target;
        if (t.closest('[data-close]')) { close(); return; }
        if (t.closest('[data-back]')) { view.stack.pop(); view.status = null; draw(); return; }
        var tab = t.closest('[data-tab]');
        if (tab) { view.tab = tab.getAttribute('data-tab'); view.status = null; view.results = null; openRoot(); return; }
        var recent = t.closest('[data-recent]');
        if (recent) { runSearch(recent.getAttribute('data-recent')); return; }
        if (t.closest('[data-clear-recent]')) {
          speakerSource.clearRecent().then(function () { view.recent = []; draw(); });
          return;
        }
        var row = t.closest('[data-index]');
        if (!row) return;
        var items = listOf();
        var index = Number(row.getAttribute('data-index'));
        var item = items[index];
        if (!item) return;
        if (row.getAttribute('data-do') === 'open') {
          view.tab = 'browse';
          load(speakerSource.browse(item), true);
          view.results = null;
        } else {
          play(items, index);
        }
      });

      function runSearch(query) {
        var q = String(query || '').trim();
        if (!q) return;
        view.query = q;
        view.status = { text: T.loading };
        draw();
        speakerSource.search(q).then(function (result) {
          view.status = null;
          rememberNames(result.items);
          view.results = result.items;
          view.recent = result.recent || view.recent;
          draw();
        }).catch(function (error) {
          view.status = { text: (error && error.message) || T.failed, err: true };
          draw();
        });
      }

      sheet.addEventListener('submit', function (event) {
        event.preventDefault();
        var form = event.target;
        if (form.hasAttribute('data-search')) runSearch(form.q.value);
      });

      // Suggestions: drawn into their own box as the query changes, so the
      // search box keeps its place and caret.
      var shownSuggestions = [];
      var active = -1;
      function showSuggestions(value) {
        var box = sheet.querySelector('[data-suggestions]');
        var input = sheet.querySelector('input[name=q]');
        if (!box || !input) return;
        shownSuggestions = suggestionsFor(value, view.recent);
        active = -1;
        box.hidden = !shownSuggestions.length;
        input.setAttribute('aria-expanded', String(!!shownSuggestions.length));
        input.removeAttribute('aria-activedescendant');
        box.innerHTML = shownSuggestions.map(function (s, i) {
          var shown = s.prefix
            ? '<b>' + esc(s.text.slice(0, value.trim().length)) + '</b>' + esc(s.text.slice(value.trim().length))
            : esc(s.text);
          var kind = s.kind === 'recent' ? '' : (T['kind_' + s.kind] || '');
          return '<button type="button" role="option" id="suggestion-' + i + '" data-suggestion="' + i + '">'
            + stroke(s.kind === 'recent' ? 'recent' : 'find') + '<span class="s">' + shown + '</span>'
            + (kind ? '<span class="k">' + esc(kind) + '</span>' : '') + '</button>';
        }).join('');
      }
      function highlight(index) {
        var buttons = sheet.querySelectorAll('[data-suggestion]');
        var input = sheet.querySelector('input[name=q]');
        active = index;
        buttons.forEach(function (b, i) { b.classList.toggle('active', i === index); b.setAttribute('aria-selected', String(i === index)); });
        if (input) {
          if (index >= 0) input.setAttribute('aria-activedescendant', 'suggestion-' + index);
          else input.removeAttribute('aria-activedescendant');
        }
      }
      function hideSuggestions() {
        var box = sheet.querySelector('[data-suggestions]');
        if (box) box.hidden = true;
        shownSuggestions = [];
        active = -1;
      }
      sheet.addEventListener('input', function (event) {
        if (event.target.name !== 'q') return;
        view.query = event.target.value;
        showSuggestions(event.target.value);
      });
      sheet.addEventListener('keydown', function (event) {
        if (event.target.name !== 'q' || !shownSuggestions.length) return;
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          // Down from the box into the list and round again; -1 is the box.
          event.preventDefault();
          var next = active + (event.key === 'ArrowDown' ? 1 : -1);
          if (next < -1) next = shownSuggestions.length - 1;
          if (next > shownSuggestions.length - 1) next = -1;
          highlight(next);
        } else if (event.key === 'Enter' && active >= 0) {
          event.preventDefault();
          var pickedText = shownSuggestions[active].text;
          hideSuggestions();
          runSearch(pickedText);
        } else if (event.key === 'Escape') {
          // Closes the suggestions, not the library.
          event.stopPropagation();
          hideSuggestions();
        }
      });
      // A tap on a suggestion mustn't take the focus (and the keyboard) away first.
      sheet.addEventListener('pointerdown', function (event) {
        if (event.target.closest('[data-suggestion]')) event.preventDefault();
      });
      sheet.addEventListener('click', function (event) {
        var pick = event.target.closest('[data-suggestion]');
        if (!pick) return;
        var chosen = shownSuggestions[Number(pick.getAttribute('data-suggestion'))];
        hideSuggestions();
        if (chosen) runSearch(chosen.text);
      });

      draw();
      openRoot();
    });
  }

  // The speaker's own library, through HomeGlow and Home Assistant.
  var speakerSource = {
    browse: function (item) {
      return HG.homeAssistant.media.browse(current, item ? item.key : undefined).then(function (level) {
        return { title: level.title || (item && item.title) || nameOf(current), items: level.items };
      });
    },
    search: function (q) { return HG.homeAssistant.media.search(current, q); },
    recent: function () { return HG.homeAssistant.media.recent(current).then(function (r) { return r.recent; }); },
    clearRecent: function () { return HG.homeAssistant.media.clearRecent(current); }
  };

  // --- Starting -----------------------------------------------------------------------------

  // Settings are read again now and then, so quiet hours set in the Admin
  // Panel reach a display that is already showing the widget.
  function readSettings() {
    return HG.settings.get().then(function (values) { Object.assign(settings, values || {}); }).catch(function () {});
  }
  Promise.all([readSettings(), readTimezone(), loadNames()]).then(poll);

  setInterval(poll, POLL_MS);
  setInterval(function () { readSettings().then(render); }, 60 * 1000);
  setInterval(readTimezone, 60 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  var nudge = null;
  HG.on('ha.state', function (payload) {
    if (!payload || !Array.isArray(payload.entityIds) || payload.entityIds.indexOf(current) === -1) return;
    clearTimeout(nudge);
    nudge = setTimeout(poll, 150);
  });
  HG.onTheme(function () { render(); });
  render();
})();
</script>
