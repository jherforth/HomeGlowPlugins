<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sports Scores</title>
  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "sports-scores",
    "name": "Sports Scores",
    "author": "HomeGlow",
    "description": "Scores and schedules for the leagues you pick: NFL, college football, NBA, MLB, NHL, MLS and the Premier League. Data source: ESPN (no key needed) or TheSportsDB (uses the key below). Pick favorite teams to see just theirs. Checks every few minutes while a game is on, about hourly otherwise.",
    "category": "news-weather",
    "version": "1.1.0",
    "apiVersion": "v1",
    "settings": [
      { "key": "dataSource", "label": "Data source (ESPN needs no key; TheSportsDB uses the key below)", "type": "select", "options": ["TheSportsDB", "ESPN"], "default": "TheSportsDB", "scope": "household" },
      { "key": "apiKey", "label": "TheSportsDB API key (123 is the free public key; only used when the data source is TheSportsDB)", "type": "string", "default": "123", "scope": "household" },
      { "key": "teams", "label": "Favorite teams, comma-separated (full names find them best, e.g. Green Bay Packers, Milwaukee Brewers)", "type": "string", "default": "", "scope": "household" },
      { "key": "teamsOnly", "label": "Show only my teams' games (when favorite teams are set)", "type": "boolean", "default": true, "scope": "household" },
      { "key": "showNfl", "label": "NFL", "type": "boolean", "default": true, "scope": "household" },
      { "key": "showCollegeFootball", "label": "College football", "type": "boolean", "default": false, "scope": "household" },
      { "key": "showNba", "label": "NBA", "type": "boolean", "default": true, "scope": "household" },
      { "key": "showMlb", "label": "MLB", "type": "boolean", "default": true, "scope": "household" },
      { "key": "showNhl", "label": "NHL", "type": "boolean", "default": true, "scope": "household" },
      { "key": "showMls", "label": "MLS", "type": "boolean", "default": false, "scope": "household" },
      { "key": "showPremierLeague", "label": "Premier League", "type": "boolean", "default": false, "scope": "household" },
      { "key": "gamesPerLeague", "label": "Games shown per league", "type": "number", "default": 4, "min": 1, "max": 10, "scope": "household" },
      { "key": "liveMinutes", "label": "Refresh minutes while a game is on", "type": "number", "default": 5, "min": 2, "max": 30, "scope": "household" }
    ]
  }
  </script>
  <link rel="stylesheet" href="/index.css">
  <style>
    * {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    body {
      font-family: var(--hg-font-body, 'Inter', sans-serif);
      font-size: 0.85rem;
      color: var(--text, #333);
      margin: 0;
      padding: 0.75rem;
      box-sizing: border-box;
    }

    [data-theme="dark"] body {
      color: var(--text, #e6e6f0);
    }

    .scores {
      max-height: calc(100vh - 2.5rem);
      overflow-y: auto;
      font-variant-numeric: tabular-nums;
    }

    .scores-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 0.5rem;
      font-family: var(--hg-font-heading, inherit);
      font-size: 1rem;
      font-weight: 700;
      text-transform: var(--hg-heading-transform, none);
      letter-spacing: var(--hg-heading-letter-spacing, normal);
    }

    .live-badge {
      display: none;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--success, #10b981);
    }

    .live-badge.on {
      display: inline-flex;
    }

    .live-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .league {
      margin-bottom: 0.6rem;
    }

    .league-name {
      margin: 0 0 0.2rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary, #666);
    }

    .game {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.3rem 0;
    }

    .game + .game {
      border-top: 1px solid var(--border, rgba(128, 128, 128, 0.25));
    }

    .teams {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .team.loser {
      opacity: 0.6;
    }

    .team img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex: none;
    }

    .team .name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .team.fav .name {
      color: var(--accent, #3a7cc4);
      font-weight: 750;
    }

    .team .star {
      flex: none;
      color: var(--accent, #3a7cc4);
      font-size: 0.75rem;
    }

    .team .score {
      min-width: 2ch;
      text-align: right;
      font-weight: 700;
    }

    .status {
      min-width: 6.5rem;
      text-align: right;
      font-size: 0.75rem;
      color: var(--text-secondary, #666);
      white-space: nowrap;
    }

    .status.live {
      color: var(--success, #10b981);
      font-weight: 600;
    }

    .note {
      margin: 0.2rem 0;
      font-size: 0.8rem;
      color: var(--text-secondary, #666);
    }

    .stamp {
      margin: 0.5rem 0 0;
      text-align: right;
      font-size: 0.7rem;
      color: var(--text-secondary, #666);
    }
  </style>
</head>
<body>
  <div class="scores" id="scores">
    <div class="scores-title">
      <span>Scores</span>
      <span class="live-badge" id="live">Live</span>
    </div>
    <p class="note">Loading scores…</p>
  </div>
  <p class="stamp" id="stamp"></p>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var theme = new URLSearchParams(window.location.search).get('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    });

    (function () {
      'use strict';

      // Two data sources, selected by the dataSource setting (default
      // TheSportsDB, so existing users see no change unless they opt in):
      // - TheSportsDB: free, no sign-up needed for the public key "123", and it
      //   allows cross-origin reads. (The old free key "3" is disabled for good:
      //   every request with it is refused, so a saved "3" is read as "123".) Each check makes one livescore request,
      //   which covers every sport at once. The full schedule and results are
      //   fetched per league at most once an hour, or when a live game ends.
      // - ESPN: keyless, no account, one scoreboard request per league at
      //   https://site.api.espn.com/apis/site/v2/sports/<sport>/<league>/scoreboard.
      //   The default scoreboard covers today (the current week for football);
      //   the ESPN path additionally fetches the next 7 days, one day at a
      //   time, until a league has enough upcoming games, plus the previous
      //   2 days for recent finals when a league is still short — so upcoming
      //   fixtures and recent finals both show, as with TheSportsDB.
      var API = 'https://www.thesportsdb.com/api/v1/json/';
      var ESPN_API = 'https://site.api.espn.com/apis/site/v2/sports/';
      var FULL_MS = 60 * 60 * 1000;
      var IDLE_MS = 30 * 60 * 1000;
      var SOON_MS = 30 * 60 * 1000;
      var MAX_WAIT_MS = 60 * 60 * 1000;
      var FIND_MS = 24 * 60 * 60 * 1000;
      var MAX_TEAMS = 8;

      var LEAGUES = [
        { id: '4391', espn: 'football/nfl', name: 'NFL', setting: 'showNfl' },
        { id: '4479', espn: 'football/college-football', name: 'College football', setting: 'showCollegeFootball' },
        { id: '4387', espn: 'basketball/nba', name: 'NBA', setting: 'showNba' },
        { id: '4424', espn: 'baseball/mlb', name: 'MLB', setting: 'showMlb' },
        { id: '4380', espn: 'hockey/nhl', name: 'NHL', setting: 'showNhl' },
        { id: '4346', espn: 'soccer/usa.1', name: 'MLS', setting: 'showMls' },
        { id: '4328', espn: 'soccer/eng.1', name: 'Premier League', setting: 'showPremierLeague' }
      ];
      var LEAGUE_BY_ID = {};
      LEAGUES.forEach(function (league) { LEAGUE_BY_ID[league.id] = league; });

      var DEFAULTS = {
        dataSource: 'TheSportsDB',
        apiKey: '123',
        showNfl: true, showCollegeFootball: false, showNba: true, showMlb: true,
        showNhl: true, showMls: false, showPremierLeague: false,
        gamesPerLeague: 4, liveMinutes: 5,
        teams: '', teamsOnly: true
      };

      var LIVE_LABEL = {
        P1: '1st period', P2: '2nd period', P3: '3rd period', OT: 'Overtime',
        Q1: 'Q1', Q2: 'Q2', Q3: 'Q3', Q4: 'Q4',
        '1H': '1st half', '2H': '2nd half', HT: 'Halftime', ET: 'Extra time'
      };
      var FINAL = { FT: true, AP: true, AET: true, PEN: true, AOT: true };
      var NOT_STARTED = { NS: true, '': true, TBD: true };

      var root = document.getElementById('scores');
      var badge = document.getElementById('live');
      var stamp = document.getElementById('stamp');

      var settings = DEFAULTS;
      var full = {};        // league id -> { games, error }
      var liveRows = {};    // idEvent -> livescore row, for enabled leagues
      var lastFull = 0;
      var needFull = true;
      var liveError = false;
      var timer = null;
      var inFlight = false;
      var failures = 0;
      var checkedAt = 0;
      var live = false;
      var soon = false;
      var found = {};       // a favorite's name, lower case -> { team: { id, name, leagueId } | null, at }
      var teamGames = {};   // team id -> { games, error }
      var favorites = { words: [], ids: {}, teams: [], missing: [], elsewhere: [] };
      var teamsAsked = null; // the teams setting the last full refresh was for

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function note(text) {
        return el('p', 'note', text);
      }

      function clamp(value, low, high, fallback) {
        var n = Number(value);
        if (!isFinite(n)) return fallback;
        return Math.min(high, Math.max(low, n));
      }

      function loadSettings() {
        var sdk = window.HomeGlow;
        if (!sdk || !sdk.pluginId) return Promise.resolve(DEFAULTS);
        return sdk.settings.get().then(function (values) {
          var merged = Object.assign({}, DEFAULTS, values || {});
          // Keys go into the URL, so only accept the characters a key uses.
          if (!/^[A-Za-z0-9]{1,32}$/.test(String(merged.apiKey))) merged.apiKey = DEFAULTS.apiKey;
          // The old free key, saved before TheSportsDB retired it.
          if (String(merged.apiKey) === '3') merged.apiKey = DEFAULTS.apiKey;
          // Unknown data sources fall back to the default (TheSportsDB).
          if (merged.dataSource !== 'ESPN' && merged.dataSource !== 'TheSportsDB') merged.dataSource = DEFAULTS.dataSource;
          merged.gamesPerLeague = clamp(merged.gamesPerLeague, 1, 10, DEFAULTS.gamesPerLeague);
          merged.liveMinutes = clamp(merged.liveMinutes, 2, 30, DEFAULTS.liveMinutes);
          return merged;
        }, function () {
          return DEFAULTS;
        });
      }

      function getJson(path) {
        return fetch(API + settings.apiKey + '/' + path).then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        });
      }

      // TheSportsDB sends times as UTC without a zone marker.
      function utc(stamp) {
        return Date.parse(String(stamp || '').replace(' ', 'T') + 'Z');
      }

      function toGame(event) {
        return {
          id: event.idEvent,
          leagueId: event.idLeague,
          leagueName: event.strLeague || '',
          date: utc(event.strTimestamp),
          status: event.strStatus || '',
          progress: event.strProgress || '',
          home: side(event.idHomeTeam, event.strHomeTeam, event.strHomeTeamBadge, event.intHomeScore),
          away: side(event.idAwayTeam, event.strAwayTeam, event.strAwayTeamBadge, event.intAwayScore),
          state: 'pre'
        };
      }

      function side(id, name, badgeUrl, score) {
        return {
          id: id || '',
          name: name || 'TBD',
          badge: badgeUrl || '',
          score: score === null || score === undefined ? '' : String(score),
          winner: false
        };
      }

      function fetchLeague(league) {
        return Promise.all([
          getJson('eventspastleague.php?id=' + league.id),
          getJson('eventsnextleague.php?id=' + league.id)
        ]).then(function (lists) {
          var events = [].concat(lists[0].events || [], lists[1].events || []);
          var seen = {};
          var games = [];
          events.forEach(function (event) {
            if (seen[event.idEvent]) return;
            seen[event.idEvent] = true;
            games.push(toGame(event));
          });
          return games;
        });
      }

      // ---- ESPN path (no key, no account) ----
      function espnGet(path) {
        return fetch(ESPN_API + path).then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        });
      }

      // ESPN's dates parameter takes a viewer-local calendar day.
      function espnDate(d) {
        var m = d.getMonth() + 1, day = d.getDate();
        return d.getFullYear() + (m < 10 ? '0' : '') + m + (day < 10 ? '0' : '') + day;
      }

      // Map one ESPN event onto the plugin's game shape, so the existing
      // render, ordering, favorite filter, and status text all work unchanged.
      function toEspnGame(event, league) {
        var competitors = (event.competitions[0] || {}).competitors || [];
        var home = null, away = null;
        competitors.forEach(function (c) {
          if (c.homeAway === 'home') home = c;
          if (c.homeAway === 'away') away = c;
        });
        home = home || competitors[0] || {};
        away = away || competitors[1] || {};
        var type = (event.status || {}).type || {};
        var state = type.state || 'pre';
        var status, progress = '';
        if (state === 'in') {
          // ESPN's own live clock text (e.g. a quarter and clock) renders
          // verbatim: statusText passes unknown codes through.
          status = type.detail || 'Live';
          progress = type.displayClock || '';
        } else if (state === 'post') {
          var desc = type.description || '';
          if (/OT/i.test(desc)) status = 'AOT';
          else if (/SO|Shootout|Pens/i.test(desc)) status = 'AP';
          else status = 'FT';
        } else {
          state = 'pre';
          status = 'NS';
        }
        function espnSide(c) {
          var team = c.team || {};
          return {
            id: team.id || '',
            name: team.displayName || team.shortDisplayName || 'TBD',
            badge: team.logo || '',
            score: c.score === null || c.score === undefined ? '' : String(c.score),
            winner: !!c.winner
          };
        }
        return {
          id: String(event.id),
          leagueId: league.id,
          leagueName: league.name,
          date: Date.parse(event.date),
          status: status,
          progress: progress,
          home: espnSide(home),
          away: espnSide(away),
          state: state
        };
      }

      // One league's ESPN games: the default scoreboard (today, or the
      // current week for football), then one day at a time up to 7 days out
      // until the league has enough upcoming or live games, then up to 2 days
      // back for recent finals when it is still short. A failed day fetch is
      // skipped; only a failed default scoreboard fails the league, so the
      // per-league error UX still covers an ESPN outage.
      function espnLeagueGames(league, want) {
        var seen = {};
        var games = [];
        function add(events) {
          (events || []).forEach(function (event) {
            if (!event || seen[event.id]) return;
            seen[event.id] = true;
            games.push(toEspnGame(event, league));
          });
        }
        function upcomingCount() {
          return games.filter(function (g) { return g.state !== 'post'; }).length;
        }
        function dayFetch(offset) {
          var d = new Date();
          d.setDate(d.getDate() + offset);
          return espnGet(league.espn + '/scoreboard?dates=' + espnDate(d)).then(function (json) {
            add(json.events || []);
          }, function () { /* skip a failed day */ });
        }
        var chain = espnGet(league.espn + '/scoreboard').then(function (json) {
          add(json.events || []);
        });
        var f;
        for (f = 1; f <= 7; f++) {
          (function (off) {
            chain = chain.then(function () {
              if (upcomingCount() >= want) return;
              return dayFetch(off);
            });
          })(f);
        }
        var b;
        for (b = 1; b <= 2; b++) {
          (function (off) {
            chain = chain.then(function () {
              if (games.length >= want) return;
              return dayFetch(-off);
            });
          })(b);
        }
        return chain.then(function () { return games; });
      }

      // ESPN refresh: per-league scoreboards straight into the shared `full`
      // map, so render and the per-league error notes work exactly as with
      // TheSportsDB. Favorites match by team name (ESPN has no TheSportsDB
      // ids), and no team lookup is needed. No live-row merge: ESPN's
      // scoreboard already carries scores and status.
      function espnRefresh(enabled) {
        favorites = {
          words: favoriteWords().map(function (w) { return w.toLowerCase(); }),
          ids: {}, teams: [], missing: [], elsewhere: []
        };
        liveRows = {};
        return Promise.all(enabled.map(function (league) {
          return espnLeagueGames(league, settings.gamesPerLeague).then(function (games) {
            full[league.id] = { games: games, error: false };
          }, function () {
            var before = full[league.id] || { games: [] };
            full[league.id] = { games: before.games, error: true };
          });
        })).then(function () {
          liveError = enabled.length > 0 && enabled.every(function (league) {
            return full[league.id] && full[league.id].error;
          });
        });
      }

      function favoriteWords() {
        return String(settings.teams || '').split(',').map(function (w) { return w.trim(); }).filter(Boolean).slice(0, MAX_TEAMS);
      }

      // A name is looked up once a day, and taken only if it is a current
      // team in one of the leagues here whose name contains it (a search for
      // "Packers" alone finds a defunct basketball team).
      function findTeam(word) {
        var key = word.toLowerCase();
        var known = found[key];
        if (known && Date.now() - known.at < FIND_MS) return Promise.resolve(known.team);
        return getJson('searchteams.php?t=' + encodeURIComponent(word)).then(function (json) {
          var team = (json.teams || []).filter(function (t) {
            return LEAGUE_BY_ID[t.idLeague] && [t.strTeam, t.strTeamShort, t.strTeamAlternate].some(function (n) {
              return n && String(n).toLowerCase().indexOf(key) !== -1;
            });
          })[0];
          var value = team ? { id: team.idTeam, name: team.strTeam, leagueId: team.idLeague } : null;
          found[key] = { team: value, at: Date.now() };
          return value;
        }, function () {
          // Not reachable: try again next time, without deciding it is missing.
          return known ? known.team : undefined;
        });
      }

      function fetchTeam(team) {
        return Promise.all([
          getJson('eventslast.php?id=' + team.id),
          getJson('eventsnext.php?id=' + team.id)
        ]).then(function (lists) {
          return [].concat(lists[0].results || [], lists[1].events || []).map(toGame);
        });
      }

      function refreshTeams() {
        var words = favoriteWords();
        teamsAsked = settings.teams || '';
        return Promise.all(words.map(findTeam)).then(function (teams) {
          // Only the leagues turned on count: "Bruins" finds UCLA (college
          // football) on the free key, which mustn't bring college football
          // back when it is turned off.
          var on = enabledLeagues();
          var ids = {};
          var mine = [];
          var elsewhere = [];
          teams.forEach(function (team, i) {
            if (!team) return;
            if (!on[team.leagueId]) { elsewhere.push({ word: words[i], team: team }); return; }
            if (!ids[team.id]) { ids[team.id] = true; mine.push(team); }
          });
          var covered = function (w) { return mine.some(function (t) { return t.name.toLowerCase().indexOf(w.toLowerCase()) !== -1; }); };
          favorites = {
            words: words.map(function (w) { return w.toLowerCase(); }),
            ids: ids,
            teams: mine,
            // Not found, and not part of a team that was ("Packers" beside
            // "Green Bay Packers").
            missing: words.filter(function (w, i) { return teams[i] === null && !covered(w); }),
            // Found only in a league that is turned off.
            elsewhere: elsewhere.filter(function (e) { return !covered(e.word); })
          };
          return Promise.all(mine.map(function (team) {
            return fetchTeam(team).then(function (games) {
              teamGames[team.id] = { games: games, error: false };
            }, function () {
              teamGames[team.id] = { games: (teamGames[team.id] || { games: [] }).games, error: true };
            });
          }));
        });
      }

      // A favorite's game: one of the teams found, or a name containing one
      // of the words.
      function isFavorite(team) {
        if (team.id && favorites.ids[team.id]) return true;
        var name = String(team.name || '').toLowerCase();
        return favorites.words.some(function (w) { return name.indexOf(w) !== -1; });
      }
      function favoriteGame(game) {
        if (!settings[(LEAGUE_BY_ID[game.leagueId] || {}).setting] && !(favorites.ids[game.home.id] || favorites.ids[game.away.id])) return false;
        return isFavorite(game.home) || isFavorite(game.away);
      }

      function fetchLive() {
        return getJson('livescore.php').then(function (json) {
          var rows = {};
          var wanted = enabledLeagues();
          favorites.teams.forEach(function (team) { wanted[team.leagueId] = true; });
          (json.livescore || []).forEach(function (row) {
            // The feed also lists games that have not started and some that
            // have finished; only an in-progress status counts as live.
            if (wanted[row.idLeague] && LIVE_LABEL[row.strStatus]) rows[row.idEvent] = row;
          });
          return rows;
        });
      }

      function enabledLeagues() {
        var map = {};
        LEAGUES.forEach(function (league) {
          if (settings[league.setting]) map[league.id] = league;
        });
        return map;
      }

      function refreshFull(enabled) {
        return Promise.all(enabled.map(function (league) {
          return fetchLeague(league).then(function (games) {
            full[league.id] = { games: games, error: false };
          }, function () {
            var before = full[league.id] || { games: [] };
            full[league.id] = { games: before.games, error: true };
          });
        })).then(function () {
          lastFull = Date.now();
          needFull = false;
        });
      }

      function statusLabel(code, progress) {
        if (LIVE_LABEL[code]) {
          // Soccer halves carry a minute; show it.
          var minute = (code === '1H' || code === '2H') && progress ? ' ' + progress + '’' : '';
          return LIVE_LABEL[code] + minute;
        }
        return code || 'Live';
      }

      // Merge the schedule with the live feed. A game counts as live when the
      // livescore feed lists it; the live row supplies its score and clock.
      function merge(enabled) {
        var byId = {};
        enabled.forEach(function (league) {
          var result = full[league.id];
          if (!result) return;
          result.games.forEach(function (game) { byId[game.id] = game; });
        });
        favorites.teams.forEach(function (team) {
          var result = teamGames[team.id];
          if (result) result.games.forEach(function (game) { byId[game.id] = game; });
        });
        Object.keys(liveRows).forEach(function (id) {
          var row = liveRows[id];
          var game = byId[id] || toGame(row);
          game.state = 'in';
          game.status = row.strStatus || '';
          game.progress = row.strProgress || '';
          game.home.score = row.intHomeScore === null || row.intHomeScore === undefined ? '' : String(row.intHomeScore);
          game.away.score = row.intAwayScore === null || row.intAwayScore === undefined ? '' : String(row.intAwayScore);
          byId[id] = game;
        });
        Object.keys(byId).forEach(function (id) {
          var game = byId[id];
          if (game.state === 'in') return;
          game.state = NOT_STARTED[game.status] ? 'pre' : 'post';
        });
        return byId;
      }

      function ordered(games) {
        var rank = { in: 0, pre: 1, post: 2 };
        return games.slice().sort(function (a, b) {
          var fa = favoriteGame(a), fb = favoriteGame(b);
          if (fa !== fb) return fa ? -1 : 1;
          if (rank[a.state] !== rank[b.state]) return rank[a.state] - rank[b.state];
          return a.state === 'post' ? b.date - a.date : a.date - b.date;
        });
      }

      function statusText(game) {
        var time = function (d) { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
        if (game.state === 'in') return statusLabel(game.status, game.progress);
        if (game.state === 'pre') {
          var when = new Date(game.date);
          if (when.toDateString() === new Date().toDateString()) return time(when);
          return when.toLocaleDateString([], { weekday: 'short' }) + ' ' + time(when);
        }
        var labels = { PST: 'Postponed', CANC: 'Cancelled', ABD: 'Abandoned' };
        if (labels[game.status]) return labels[game.status];
        var finals = { AET: 'Final (OT)', AOT: 'Final (OT)', AP: 'Final (SO)', PEN: 'Final (pens)' };
        return finals[game.status] || 'Final';
      }

      function teamLine(team, done, started) {
        var fav = isFavorite(team);
        var line = el('div', 'team' + (done && !team.winner ? ' loser' : '') + (fav ? ' fav' : ''));
        if (team.badge) {
          var img = el('img');
          img.src = team.badge;
          img.alt = '';
          img.loading = 'lazy';
          line.appendChild(img);
        }
        line.appendChild(el('span', 'name', team.name));
        if (fav) {
          var star = el('span', 'star', '★');
          star.setAttribute('aria-label', 'favorite');
          line.appendChild(star);
        }
        line.appendChild(el('span', 'score', started ? team.score : ''));
        return line;
      }

      function gameRow(game) {
        var done = game.state === 'post';
        var started = game.state !== 'pre';
        // A final shows the higher score as the winner.
        if (done && game.home.score !== '' && game.away.score !== '') {
          var h = Number(game.home.score);
          var a = Number(game.away.score);
          game.home.winner = h > a;
          game.away.winner = a > h;
        }
        var row = el('div', 'game');
        var teams = el('div', 'teams');
        teams.appendChild(teamLine(game.away, done, started));
        teams.appendChild(teamLine(game.home, done, started));
        row.appendChild(teams);
        row.appendChild(el('div', 'status' + (game.state === 'in' ? ' live' : ''), statusText(game)));
        return row;
      }

      function render(enabled, games) {
        root.textContent = '';
        var title = el('div', 'scores-title');
        title.appendChild(el('span', null, 'Scores'));
        badge.classList.toggle('on', live);
        title.appendChild(badge);
        root.appendChild(title);

        var onlyMine = settings.teamsOnly && favorites.words.length > 0;
        if (favorites.missing.length) {
          root.appendChild(note('Not found: ' + favorites.missing.join(', ') + '. The full team name finds it, e.g. Green Bay Packers; meanwhile it picks out games already shown.'));
        }
        favorites.elsewhere.forEach(function (e) {
          var league = LEAGUE_BY_ID[e.team.leagueId];
          root.appendChild(note(e.word + ' found only ' + e.team.name + ', in ' + (league ? league.name : 'a league') + ', which is turned off. Type the full name of the team you mean.'));
        });

        if (onlyMine) {
          // Only the favorites' games, under their leagues.
          var picked = games.filter(favoriteGame);
          var leagueIds = [];
          picked.forEach(function (g) { if (leagueIds.indexOf(g.leagueId) === -1) leagueIds.push(g.leagueId); });
          if (!picked.length) {
            var teamFailed = favorites.teams.some(function (t) { return teamGames[t.id] && teamGames[t.id].error; });
            root.appendChild(note(teamFailed ? 'Could not load your teams\' games. Trying again soon.' : 'No games for your teams on the schedule.'));
          }
          leagueIds.forEach(function (id) {
            var section = el('section', 'league');
            var name = LEAGUE_BY_ID[id] ? LEAGUE_BY_ID[id].name : (picked.filter(function (g) { return g.leagueId === id; })[0].leagueName || 'Other');
            section.appendChild(el('h2', 'league-name', name));
            ordered(picked.filter(function (g) { return g.leagueId === id; })).slice(0, settings.gamesPerLeague).forEach(function (game) {
              section.appendChild(gameRow(game));
            });
            root.appendChild(section);
          });
        } else if (!enabled.length) {
          root.appendChild(note('No leagues are turned on. Choose them under Plugin Options.'));
          return;
        }

        if (!onlyMine) enabled.forEach(function (league) {
          var result = full[league.id] || { games: [] };
          var mine = games.filter(function (g) { return g.leagueId === league.id; });
          var section = el('section', 'league');
          section.appendChild(el('h2', 'league-name', league.name));
          if (!mine.length) {
            section.appendChild(note(result.error ? 'Could not load scores. Trying again soon.' : 'No games on the schedule.'));
          } else {
            ordered(mine).slice(0, settings.gamesPerLeague).forEach(function (game) {
              section.appendChild(gameRow(game));
            });
            if (result.error) section.appendChild(note('Could not refresh. Showing the last scores.'));
          }
          root.appendChild(section);
        });

        stamp.textContent = checkedAt
          ? 'Updated ' + new Date(checkedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
          : '';
      }

      function schedule() {
        var wait = live || soon ? settings.liveMinutes * 60 * 1000 : IDLE_MS;
        // Back off while every request fails: 2x, 4x, ... up to an hour.
        if (failures) wait = Math.min(wait * Math.pow(2, failures), MAX_WAIT_MS);
        clearTimeout(timer);
        timer = setTimeout(refresh, wait);
      }

      function refresh() {
        clearTimeout(timer);
        // A hidden page waits for the visibility handler below.
        if (document.hidden || inFlight) return;
        inFlight = true;

        loadSettings().then(function (values) {
          settings = values;
          var enabled = LEAGUES.filter(function (league) { return settings[league.setting]; });
          // ESPN path: scoreboards straight into `full`, then the shared
          // tail below (checkedAt, failures, merge, render). TheSportsDB
          // flow underneath is untouched.
          if (settings.dataSource === 'ESPN') {
            return espnRefresh(enabled).then(function () { return enabled; });
          }
          if ((settings.teams || '') !== teamsAsked) needFull = true;
          var previouslyLive = Object.keys(liveRows);
          return fetchLive().then(function (rows) {
            // A game that was live and has left the live feed has finished:
            // fetch its final result in this same check.
            previouslyLive.forEach(function (id) {
              if (!rows[id]) needFull = true;
            });
            liveRows = rows;
            liveError = false;
          }, function () {
            liveError = true;
          }).then(function () {
            if (!needFull && Date.now() - lastFull < FULL_MS) return enabled;
            return Promise.all([refreshFull(enabled), refreshTeams()]).then(function () { return enabled; });
          });
        }).then(function (enabled) {
          checkedAt = Date.now();
          var failed = 0;
          enabled.forEach(function (league) {
            if (full[league.id] && full[league.id].error) failed += 1;
          });
          var allFailed = (!enabled.length || failed === enabled.length) && liveError;
          failures = allFailed ? failures + 1 : 0;

          var byId = merge(enabled);
          var games = Object.keys(byId).map(function (id) { return byId[id]; });
          var watched = settings.teamsOnly && favorites.words.length ? games.filter(favoriteGame) : games;
          live = watched.some(function (g) { return g.state === 'in'; });
          soon = watched.some(function (g) {
            return g.state === 'pre' && g.date > checkedAt && g.date - checkedAt < SOON_MS;
          });
          render(enabled, games);
        }).catch(function () {
          failures += 1;
        }).then(function () {
          inFlight = false;
          schedule();
        });
      }

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && Date.now() - checkedAt > 60 * 1000) refresh();
      });

      refresh();
    })();
  </script>
</body>
</html>
