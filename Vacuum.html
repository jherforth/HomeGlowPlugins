<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacuum</title>
<script type="application/json" id="homeglow-manifest">
{
  "manifestVersion": 1,
  "id": "ha-vacuum-card",
  "name": "Vacuum",
  "version": "3.0.0",
  "description": "A robot vacuum from Home Assistant on one tile: start, pause, dock, mode, suction, clean and room buttons, last clean, station alerts and the map. Finds your vacuum and its settings on its own. Clean and room buttons run scripts: see Vacuum.md.",
  "category": "household",
  "author": "jasonstantler",
  "apiVersion": "v1",
  "storage": true,
  "homeAssistant": {
    "domains": ["vacuum", "select", "sensor", "binary_sensor", "switch", "script"],
    "entities": ["camera.vacuum_map"],
    "control": true
  },
  "events": ["ha.state"],
  "settings": [
    { "key": "vacuum", "label": "Vacuum (vacuum entity; blank finds it)", "type": "string", "default": "" },
    { "key": "title", "label": "Name on the card (blank uses Home Assistant's name)", "type": "string", "default": "" },
    { "key": "modeSelect", "label": "Cleaning mode (select entity; blank finds it, - hides it)", "type": "string", "default": "" },
    { "key": "suctionSelect", "label": "Suction (select entity; blank finds it, - hides it)", "type": "string", "default": "" },
    { "key": "battery", "label": "Battery (sensor entity; blank finds it)", "type": "string", "default": "" },
    { "key": "roomSwitch", "label": "Per-room settings switch, like Dreame's Customized Cleaning (blank finds it, - hides it)", "type": "string", "default": "" },
    { "key": "presets", "label": "Clean buttons: Name = script, separated by semicolons. Add a short note after a | (Quick vacuum | Vacuum · Standard = script.vacuum_quick)", "type": "string",
      "default": "Quick vacuum = script.vacuum_quick; Deep clean = script.vacuum_deep_clean" },
    { "key": "showRooms", "label": "Show room buttons", "type": "boolean", "default": false },
    { "key": "rooms", "label": "Room buttons: Room = script, separated by semicolons (Kitchen = script.vacuum_kitchen)", "type": "string", "default": "" },
    { "key": "showMap", "label": "Show the map when the tile is wide enough", "type": "boolean", "default": true, "scope": "device" }
  ]
}
</script>
<style>
/* Layout: a header (robot, status, battery, map), the main action, two segmented settings, and the
   clean buttons. Wide tiles add the map beside; tall tiles add it below; any tile can flip to it. */
:root{
  --ink:var(--text-color,var(--text,#1F2421));
  --acc:var(--accent,#4F7A5E);
  --muted:color-mix(in srgb, var(--ink) 58%, transparent);
  --line:color-mix(in srgb, var(--ink) 10%, transparent);
  --track:color-mix(in srgb, var(--ink) 6%, transparent);
  --raised:#FFFFFF;
  --tint:color-mix(in srgb, var(--acc) 12%, transparent);
  --warn:#C2410C;
  --ok:#15803D;
  --font:var(--hg-font-body,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif);
}
[data-theme="dark"] #app{background:linear-gradient(var(--card-bg,#2C2A26),var(--card-bg,#2C2A26)),#2C2A26}
[data-theme="dark"]{--raised:#34322E;--track:color-mix(in srgb, var(--ink) 9%, transparent);--warn:#FB923C;--ok:#4ADE80}
*{box-sizing:border-box}
/* HomeGlow's /index.css styles its own page's body (bottom padding for its dock, its font and line
   spacing). Undo that here so the widget fills its frame. */
html,body{margin:0;padding:0;height:100%;min-height:0;line-height:normal;font-family:var(--font)}
html[data-theme] body,body{background:transparent !important;background-image:none !important}
body{color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;font-variant-numeric:tabular-nums}
button{appearance:none;-webkit-appearance:none;border:0;margin:0;background:none;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
svg{flex:none}

#app{position:relative;height:100%;background:linear-gradient(var(--card-bg,#FBFAF8),var(--card-bg,#FBFAF8)),#FBFAF8;padding:clamp(10px,3.4cqh,16px) clamp(10px,3.4cqw,16px);container-type:size}
.card{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px;min-height:0}
.card.side{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.card.below{grid-template-rows:auto minmax(0,1fr)}
.main{display:flex;flex-direction:column;gap:clamp(8px,3cqh,14px);min-height:0;min-width:0;container:main / inline-size}

/* Header */
.head{display:flex;align-items:center;gap:12px;min-width:0}
.disc{position:relative;flex:none;width:clamp(36px,12cqh,44px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--acc)}
.disc svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.disc::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2.5px solid transparent;border-top-color:var(--acc);opacity:0}
.is-cleaning .disc::after,.is-returning .disc::after{opacity:1;animation:orbit 1.1s linear infinite}
.is-error .disc{background:color-mix(in srgb, var(--warn) 14%, transparent);color:var(--warn)}
@keyframes orbit{to{transform:rotate(360deg)}}
.who{flex:1;min-width:0}
.name{font-weight:650;font-size:clamp(.95rem,5.2cqh,1.15rem);letter-spacing:-.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:clamp(.74rem,3.8cqh,.84rem);font-weight:550;color:var(--muted);white-space:nowrap;overflow:hidden}
.status span{overflow:hidden;text-overflow:ellipsis}
.status i{flex:none;width:7px;height:7px;border-radius:50%;background:color-mix(in srgb, var(--ink) 30%, transparent)}
.is-docked .status i{background:var(--ok)}
.is-cleaning .status i,.is-returning .status i{background:var(--acc);box-shadow:0 0 0 3px var(--tint)}
.is-cleaning .status,.is-returning .status{color:var(--ink)}
.status.warn,.is-error .status{color:var(--warn)}
.status.warn i,.is-error .status i{background:var(--warn)}
.meta{margin-top:2px;font-size:clamp(.68rem,3.4cqh,.78rem);font-weight:550;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta.alert{color:var(--warn);font-weight:650}
@container (max-height: 230px){ .meta:not(.alert){display:none} }
.rooms{display:flex;flex-wrap:wrap;gap:6px}
.rooms button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);
  font-weight:600;font-size:clamp(.74rem,3.8cqh,.84rem);box-shadow:0 1px 2px rgba(0,0,0,.04);transition:transform .12s}
.rooms button svg{width:15px;height:15px;fill:none;stroke:var(--acc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rooms button:active{transform:scale(.97)}
.rooms button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);color:var(--acc)}
.batt{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:var(--track);font-weight:650;font-size:.8rem}
.batt svg{width:22px;height:12px}
.batt .shell{fill:none;stroke:currentColor;stroke-width:1.4;opacity:.7}
.batt .level{fill:var(--ok)}
.batt.low .level{fill:var(--warn)}
.batt .bolt{fill:var(--ok)}
.icon-btn{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--track)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{background:var(--acc);color:#fff}

/* Main action */
.go{display:flex;gap:8px}
.go button{flex:1;height:clamp(40px,13cqh,48px);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:650;font-size:clamp(.88rem,4.6cqh,1rem);background:var(--track);transition:transform .12s ease,filter .12s ease}
.go button.primary{flex:2;background:var(--acc);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px color-mix(in srgb, var(--acc) 28%, transparent)}
.go button:active{transform:scale(.98);filter:brightness(.95)}
.go svg{width:18px;height:18px;fill:currentColor}

/* Settings */
.opts{display:flex;flex-direction:column;gap:clamp(8px,2.8cqh,12px);min-height:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.7rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--track);min-width:0}
.seg button{flex:1 1 0;min-width:0;height:clamp(32px,10.5cqh,38px);border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;
  font-weight:550;font-size:clamp(.74rem,3.9cqh,.86rem);color:var(--muted);white-space:nowrap;overflow:hidden;transition:background .15s,color .15s,box-shadow .15s}
.seg button span{overflow:hidden;text-overflow:ellipsis}
.seg button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg button svg .f{fill:currentColor;stroke:none}
.seg button svg .e{fill:currentColor;stroke:none;opacity:.22}
.seg button svg .gt{opacity:.25}
.seg button svg .hub{fill:currentColor;stroke:none}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--acc);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.06)}
.notice{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--track);font-size:.8rem;font-weight:550;color:var(--muted);line-height:1.35}
.notice button{flex:none;padding:7px 12px;border-radius:9px;background:var(--raised);color:var(--acc);font-weight:650;font-size:.78rem;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chip{padding:3px 9px;border-radius:999px;font-size:.66rem;letter-spacing:.04em;font-weight:650;color:var(--muted);background:var(--track)}
.chip[aria-pressed="true"]{background:var(--tint);color:var(--acc)}
.hint{font-size:.8rem;font-weight:550;color:var(--muted);padding:9px 12px;border-radius:12px;background:var(--track)}

/* Clean buttons */
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets.one{grid-template-columns:minmax(0,1fr)}
@container main (min-width: 600px){ .presets:not(.one){grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr))} }
.preset{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 12px 8px 8px;border-radius:12px;text-align:left;background:var(--raised);
  border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s,transform .12s}
.preset:active{transform:scale(.98)}
.preset .ico{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--tint);color:var(--acc)}
.preset .ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.preset b{display:block;font-weight:650;font-size:clamp(.8rem,4cqh,.9rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset small{display:block;font-size:.72rem;color:var(--muted);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.preset .txt{min-width:0}

/* Map */
.map{position:relative;border-radius:14px;overflow:hidden;background:var(--track);min-height:0}
.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
.map .tag{position:absolute;left:12px;bottom:10px;font-size:.72rem;font-weight:600;color:var(--muted)}
.mapview{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;gap:10px;padding:inherit;background:var(--raised);border-radius:16px}
.mapview.open{display:flex}
.mapview .top{display:flex;align-items:center;gap:10px}
.mapview .top b{flex:1;font-weight:650;font-size:.95rem}
.mapview .top span{font-size:.8rem;color:var(--muted);font-weight:550}
.mapview .map{flex:1}

/* Short tiles: settings fold into a sheet */
.more{display:none;height:36px;border-radius:12px;font-weight:650;font-size:.85rem;background:var(--track)}
.sheet{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;gap:12px;padding:inherit;background:var(--raised);border-radius:16px;overflow:auto}
.sheet.open{display:flex}
.sheet .top{display:flex;justify-content:space-between;align-items:center;font-weight:650}
.sheet .top button{padding:6px 14px;border-radius:9px;background:var(--track);font-weight:650;font-size:.85rem}
.note{margin:0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb, var(--warn) 12%, transparent);font-size:.86rem;font-weight:550;line-height:1.4}
@container (max-height: 300px){ .card:not(.side) .opts{display:none} .card:not(.side) .more{display:block} .card:not(.side) .main{justify-content:space-between} .card:not(.side) .go button{height:clamp(44px,26cqh,64px);font-size:1.05rem} }
@container main (max-width: 430px){ .seg button{flex-direction:column;gap:2px;height:clamp(44px,15cqh,52px);padding:4px 2px;font-size:.74rem} .seg button svg{width:17px;height:17px} }
@container main (max-width: 330px){ .seg button{font-size:.74rem} .preset small{display:none} }
@container main (max-width: 360px){ .preset{padding:6px 8px 6px 6px;gap:8px} .preset .ico{width:26px;height:26px} .preset .ico svg{width:15px;height:15px} .preset b{font-size:.8rem} }
@container main (max-width: 280px){ .preset{padding:6px;gap:6px} .preset .ico{width:22px;height:22px} .preset b{font-size:.74rem} }
@container (max-width: 300px){ .batt{padding:0 8px} .batt svg{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>

      function put(id, st, attrs){ e[id] = {state: st, attributes: attrs || {}}; src[id] = {integration: 'sample', device: 'robot'}; }
      put('vacuum.robot', s.state, {friendly_name: cfgName || 'Robot vacuum', battery_level: s.battery, supported_features: 8192 | 4 | 16});
      put('select.robot_cleaning_mode', s.perRoom ? 'unavailable' : s.mode, s.perRoom ? {} : {options: ['sweeping', 'mopping', 'sweeping_and_mopping', 'mopping_after_sweeping']});
      put('select.robot_suction_level', s.perRoom ? 'unavailable' : s.suction, s.perRoom ? {} : {options: ['quiet', 'standard', 'strong', 'turbo']});
      put('sensor.robot_battery_level', String(s.battery), {unit_of_measurement: '%', device_class: 'battery'});
      put('switch.robot_customized_cleaning', s.perRoom ? 'on' : 'off', {friendly_name: 'Customized cleaning'});
      put('sensor.robot_cleaned_area', String(s.state === 'docked' ? 54 : Math.round(s.steps * 1.6)), {unit_of_measurement: 'm²'});
      put('sensor.robot_cleaning_time', String(s.state === 'docked' ? 38 : Math.round(s.steps / 2)), {unit_of_measurement: 'min'});
      put('sensor.robot_last_clean', new Date(Date.now() - 2 * 3600000).toISOString(), {device_class: 'timestamp'});
      put('sensor.robot_clean_water_tank_status', s.alert ? 'empty' : 'installed', {friendly_name: (cfgName || 'Robot vacuum') + ' Clean water tank status'});
      put('camera.vacuum_map', 'idle', {});
      SCRIPTS.forEach(function(id){ e[id] = {state: 'off', attributes: {}}; src[id] = {integration: 'script'}; });
      return {entities: e, sources: src};
    }
    var MAP = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150">' +
      '<g stroke="#fff" stroke-width="2"><path fill="#9FC5E8" d="M10 10h80v60H10z"/><path fill="#F6C59A" d="M94 10h116v86H94z"/><path fill="#B6D7A8" d="M10 74h80v66H10z"/><path fill="#D5A6BD" d="M94 100h60v40H94z"/><path fill="#FFE599" d="M158 100h52v40h-52z"/></g>' +
      '<g font-family="Segoe UI,sans-serif" font-size="9" fill="#2b2b2b" opacity=".75"><text x="16" y="24">Kitchen</text><text x="100" y="24">Living room</text><text x="16" y="88">Dining</text><text x="100" y="114">Hall</text><text x="164" y="114">Bath</text></g>' +
      '<path d="M30 40h40M30 48h40M30 56h40" stroke="#fff" stroke-width="3" opacity=".7"/>' +
      '<rect x="196" y="128" width="10" height="6" rx="1.5" fill="#444"/><circle cx="201" cy="122" r="5" fill="#fff" stroke="#444" stroke-width="1.5"/></svg>');
    return {
      state: function(){ var b = build(); return Promise.resolve({entities: b.entities, sources: b.sources, control: [], unit: '°F'}); },
      cameraUrl: function(){ return MAP; },
      action: function(id, what, val){
        if (id.indexOf('switch.') === 0){ s.perRoom = what === 'turn_on'; }
        else if (id.indexOf('select.') === 0){ if (/mode/.test(id)) s.mode = val; else s.suction = val; }
        else if (id.indexOf('script.') === 0 || what === 'start'){ if (s.state !== 'paused') s.steps = 0; s.state = 'cleaning'; }
        else if (what === 'pause') s.state = 'paused';
        else if (what === 'dock'){ s.state = 'returning'; s.steps = 31; }
        return new Promise(function(r){ setTimeout(r, 300); });
      }
    };
  }
})();
</script>
