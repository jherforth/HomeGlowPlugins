<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Poll Widget</title>
  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "family-polls",
    "name": "Family Poll",
    "version": "1.2.0",
    "description": "Runs a quick family vote. Ask a question, add the options, and everyone picks their profile and votes from the dashboard. Every display shows the same tally. A poll closes when everyone has voted, or when someone closes it, and is kept under Past polls. Phones can hear the result.",
    "category": "family-hub",
    "apiVersion": "v1",
    "storage": true,
    "notify": true,
    "settings": [
      { "key": "voter", "label": "Who votes from this display (profile id; the widget sets it when a profile is picked)",
        "type": "string", "default": "", "scope": "device" }
    ],
    "hideableControls": [
      { "id": "managePolls", "label": "Create, edit, close, or delete polls" }
    ]
  }
  </script>
  <link rel="stylesheet" href="/index.css">
  <style>
    * {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    body {
      background: transparent !important;
      font-family: var(--hg-font-body, 'Inter', sans-serif);
      margin: 0;
      padding: 0.75rem;
      box-sizing: border-box;
      font-size: 0.85rem;
      color: var(--text, #FFFFFF);
    }


    .widget-container {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      border-radius: 12px;
      padding: 0.5rem;
      text-align: center;
      width: 100%;
      max-height: calc(100vh - 1.5rem);
      overflow-y: auto;
    }

    .widget-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
      color: inherit;
    }

    .current-user-display {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .current-user-avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }

    .user-selection {
      background: rgba(128, 128, 128, 0.15) !important;
      border: 1px solid var(--card-border, #3a3a3a);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }


    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .user-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(128, 128, 128, 0.08) !important;
    }


    .user-option:hover {
      background: rgba(128, 128, 128, 0.18) !important;
      transform: translateY(-2px);
    }


    .user-option.selected {
      border-color: var(--accent, #757575);
      background: rgba(var(--accent-rgb, 158, 127, 255), 0.15) !important;
    }


    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(128, 128, 128, 0.15) !important;
      margin-bottom: 0.5rem;
      border: 2px solid var(--card-border, #3a3a3a);
    }


    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .user-name {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .current-user-display {
      background: rgba(var(--accent-rgb, 158, 127, 255), 0.1) !important;
      border: 1px solid var(--accent, #757575);
      border-radius: 6px;
      padding: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .poll-section {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .poll-creation {
      border: 1px solid var(--card-border, #3a3a3a);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }


    .form-group {
      margin-bottom: 0.75rem;
    }

    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.25rem;
      font-size: 0.8rem;
    }

    .form-input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--card-border, #3a3a3a);
      border-radius: 4px;
      background: rgba(128, 128, 128, 0.12) !important;
      color: inherit;
      font-size: 0.8rem;
      box-sizing: border-box;
    }


    .form-input:focus {
      outline: none;
      border-color: var(--accent, #757575);
    }

    .option-input-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .option-input {
      flex: 1;
    }

    .remove-option-btn {
      background: var(--hg-error, var(--error, #ef4444)) !important;
      color: #fff !important;
      border: none;
      border-radius: calc(var(--hg-button-radius, 8px) / 2);
      padding: 0.5rem;
      cursor: pointer;
      font-size: 0.7rem;
      min-width: auto;
    }

    .custom-button {
      /* The theme's button roles. The fallbacks are the look these buttons
         had before themes, a blend of the two interface colors the
         household picks, for a dashboard too old to send the roles. */
      background: var(--hg-button-bg, linear-gradient(45deg, var(--secondary, #38bdf8), var(--accent, #757575))) !important;
      color: var(--hg-button-text, var(--text, #333)) !important;
      border: none;
      border-radius: var(--hg-button-radius, 8px);
      padding: 8px 16px;
      cursor: pointer;
      font-family: var(--hg-font-heading, inherit);
      font-size: 0.8rem;
      font-weight: var(--hg-button-weight, 600);
      text-transform: var(--hg-heading-transform, none);
      letter-spacing: var(--hg-heading-letter-spacing, normal);
      transition: all 0.3s ease;
      margin: 0.25rem;
    }


    .custom-button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .custom-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .poll-item {
      border: 1px solid var(--card-border, #3a3a3a);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: left;
    }


    .poll-question {
      font-weight: 600;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .poll-option {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }

    .poll-option:hover {
      background: rgba(128, 128, 128, 0.15) !important;
    }


    .poll-option input[type="radio"] {
      margin-right: 0.5rem;
    }

    .poll-results {
      margin-top: 1rem;
    }

    .result-bar {
      display: flex;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .result-label {
      min-width: 100px;
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }

    .result-progress {
      flex: 1;
      height: 20px;
      background: var(--hg-meter-track, rgba(128, 128, 128, 0.15)) !important;
      border-radius: 10px;
      overflow: hidden;
      margin-right: 0.5rem;
    }


    .result-fill {
      height: 100%;
      background: var(--hg-meter-fill, linear-gradient(45deg, var(--secondary, #38bdf8), var(--accent, #757575))) !important;
      transition: width 0.5s ease;
      border-radius: 10px;
    }


    .archive-item {
      border-top: 1px solid var(--border, rgba(128, 128, 128, 0.3));
      padding: 0.5rem 0;
    }

    .archive-summary {
      cursor: pointer;
    }

    .archive-question {
      font-weight: 600;
    }

    .archive-outcome {
      font-size: 0.8rem;
      color: var(--text-secondary, #A3A3A3);
    }

    .result-percentage {
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 40px;
    }

    .poll-meta {
      font-size: 0.7rem;
      color: var(--text-secondary, #A3A3A3);
      margin-top: 0.5rem;
      text-align: center;
    }


    .voter-list {
      font-size: 0.7rem;
      color: var(--text-secondary, #A3A3A3);
      margin-top: 0.25rem;
    }


    .no-polls {
      text-align: center;
      color: var(--text-secondary, #A3A3A3);
      font-style: italic;
      padding: 2rem;
    }


    .error-message {
      background: rgba(239, 68, 68, 0.1) !important;
      border: 1px solid var(--hg-error, var(--error, #ef4444));
      color: var(--hg-error, var(--error, #ef4444));
      padding: 0.5rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }


    .success-message {
      background: rgba(16, 185, 129, 0.1) !important;
      border: 1px solid var(--success, #10b981);
      color: var(--success, #10b981);
      padding: 0.5rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }


    .loading {
      text-align: center;
      color: var(--text-secondary, #A3A3A3);
      font-style: italic;
      padding: 1rem;
    }

  </style>
</head>
<body>
  <div class="widget-container">
    <h1 class="widget-title">📊 Family Poll</h1>
    
    <div id="errorMessage" class="error-message" style="display: none;"></div>
    <div id="successMessage" class="success-message" style="display: none;"></div>
    
    <!-- User Selection Section -->
    <div class="user-selection">
      <h3 style="margin-top: 0; font-size: 0.9rem;">Select Your Profile</h3>
      <div id="userGrid" class="user-grid">
        <div class="loading">Loading family members...</div>
      </div>
    </div>
    
    <!-- Current User Display -->
    <div id="currentUserDisplay" class="current-user-display" style="display: none;">
      <span id="currentUserAvatar" class="current-user-avatar"></span>
      Voting as: <span id="currentUserName"></span>
      <button type="button" class="custom-button" id="switchUserBtn" onclick="clearUserSelection()" style="margin-left: 0.5rem; font-size: 0.7rem; padding: 4px 8px;">Switch User</button>
    </div>
    
    <!-- Poll Creation Section -->
    <div class="poll-section" id="pollCreationSection">
      <button type="button" class="custom-button" id="toggleCreateBtn" onclick="toggleCreateForm()">+ Create Poll</button>
      <div class="poll-creation" id="pollCreation" style="display: none; margin-top: 0.75rem;">
        
        <div class="form-group">
          <label class="form-label">Poll Question:</label>
          <input type="text" id="pollQuestion" class="form-input" placeholder="What should we decide on?">
        </div>
        
        <div class="form-group">
          <label class="form-label">Options:</label>
          <div id="optionsContainer">
            <div class="option-input-group">
              <input type="text" class="form-input option-input" placeholder="Option 1">
            </div>
            <div class="option-input-group">
              <input type="text" class="form-input option-input" placeholder="Option 2">
            </div>
          </div>
          <button type="button" class="custom-button" onclick="addOption()">+ Add Option</button>
        </div>
        
        <button type="button" class="custom-button" onclick="createPoll()">Create Poll</button>
      </div>
    </div>
    
    <!-- Active Polls Section -->
    <div class="poll-section">
      <h3 style="margin-top: 0; font-size: 1rem;">Family Polls</h3>
      <div id="pollsContainer">
        <div class="no-polls">No polls created yet. Create your first poll above!</div>
      </div>
    </div>

    <!-- Closed polls, kept. Shown only once there is one. -->
    <div class="poll-section" id="archiveSection" style="display: none;">
      <button type="button" class="custom-button" id="toggleArchiveBtn" onclick="toggleArchive()" style="font-size: 0.8rem; padding: 4px 10px;">Past polls</button>
      <div id="archiveContainer" style="display: none; margin-top: 0.5rem;"></div>
    </div>
  </div>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
    let polls = [];
    let users = [];
    let currentUser = null;
    // Votes keyed by poll id, then by user id: { [pollId]: { [userId]: {o, u, t} } }.
    // Tallies are derived from this at render time rather than stored, so there is
    // no counter to drift out of step with the votes themselves.
    let votes = {};
    // False until polls are actually in hand. Gates every write: without it a
    // failed read leaves an empty list that the next write would persist.
    let dataLoaded = false;
    // Which poll the form is editing, or null when creating a new one.
    let editingPollId = null;
    // Which past poll's Delete, or which open poll's Close, has been armed. The
    // sandbox blocks confirm(), so the second click on the button confirms.
    let pendingDeleteId = null;
    let pendingCloseId = null;
    // Closed polls, newest first: { id, question, options: [{ text, voters }],
    // createdBy, createdAt, closedAt, closedBy }. closedBy is null when the poll
    // closed itself because everyone had voted.
    let archive = [];
    let archiveOpen = false;
    let expandedArchiveId = null;
    // Set by the click that arms, so the same click bubbling up to the document
    // listener below does not immediately disarm it again.
    let armClickHandled = false;

    // This page is served from the API origin, so relative paths reach the
    // backend wherever it is. The previous ':3000' -> ':5000' rewrite only held
    // for one dev layout.
    const API_BASE = '';

    const POLLS_KEY = 'polls';
    // Closed polls live in one document per year, archive:<year>, continued in
    // archive:<year>:2 and on once a document nears the 64 KB value cap. A key
    // per poll would use up the 500-key cap; a year rarely fills one document.
    const ARCHIVE_PREFIX = 'archive:';
    const ARCHIVE_DOC_BYTES = 56 * 1024;
    const VOTE_PREFIX = 'v:';
    const MIGRATION_KEY = 'migratedFromLocalStorage';
    const LEGACY_POLLS_KEY = 'pollWidget_polls';

    const SDK = window.HomeGlow && window.HomeGlow.pluginId ? window.HomeGlow : null;
    const STORAGE = SDK ? SDK.storage : null;
    const PLATFORM_AVAILABLE = Boolean(STORAGE);
    const SETTINGS = SDK ? SDK.settings : null;

    // Control limits: the dashboard names this plugin's hidden controls on the
    // iframe URL, already unprefixed. No param means hide nothing, which is what
    // an older dashboard and a direct load of this page both produce.
    const HIDDEN_CONTROLS = (new URLSearchParams(window.location.search).get('hide') || '')
      .split(',').filter(Boolean);
    const HIDE_MANAGE_POLLS = HIDDEN_CONTROLS.indexOf('managePolls') !== -1;
    // Switch User is deliberately not hideable: on a shared display, switching
    // voters is how a poll works, and a Wall display would hide it for good.

    // At parse time, not on DOMContentLoaded: this script sits after the
    // controls in the document, so a hidden one can go before it is painted.
    applyControlLimits();

    function applyControlLimits() {
      if (HIDE_MANAGE_POLLS) {
        // The section holds only the Create Poll toggle and the form it opens.
        // Edit and Delete on each poll are left out at render time instead.
        const section = document.getElementById('pollCreationSection');
        if (section) section.remove();
      }
    }

    // Which profile votes from this display. On the platform it is a
    // device-scoped setting, so the kitchen display and a phone hold different
    // voters and the choice survives cleared site data. localStorage remains
    // the whole story without a plugin identity, and a fallback copy with one:
    // the SDK resolves device scope from the ?device= param the dashboard
    // passes, so a direct load can have its settings call rejected.
    const VOTER_KEY = 'pollWidget_currentUser';

    async function readVoterId() {
      const local = localStorage.getItem(VOTER_KEY);
      if (!SETTINGS) return local;
      try {
        const values = await SETTINGS.get();
        const stored = values && typeof values.voter === 'string' ? values.voter : '';
        if (stored) return stored;
        // Imported once from the browser key; the key is left intact as a copy.
        if (local) await SETTINGS.set({ voter: local });
        return local;
      } catch (error) {
        console.error('Could not read the voter setting:', error);
        return local;
      }
    }

    function writeVoterId(id) {
      if (id === null) localStorage.removeItem(VOTER_KEY);
      else localStorage.setItem(VOTER_KEY, id);
      if (!SETTINGS) return;
      SETTINGS.set({ voter: id === null ? '' : id }).catch((error) => {
        console.error('Could not save the voter setting:', error);
      });
    }

    // One key per voter per poll. A single document holding nested votes would
    // be get-modify-set, so two people voting at the same moment on different
    // displays would lose one of the votes.
    const voteKey = (pollId, userId) => VOTE_PREFIX + pollId + ':' + userId;

    // Date.now() alone collides when two displays create a poll within the same
    // millisecond, and under one-key-per-poll a collision silently overwrites.
    const newPollId = () => String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);

    const pollVotes = (pollId) => votes[pollId] || {};
    const voteCountsFor = (poll) => {
      const cast = Object.values(pollVotes(poll.id));
      const counts = poll.options.map(() => []);
      // `total` counts only votes that landed on an option. Counting every
      // stored record instead would let a vote whose index no longer resolves
      // inflate the denominator, so the percentages would not sum to 100.
      let total = 0;
      for (const v of cast) {
        if (typeof v.o !== 'number' || !counts[v.o]) continue;
        counts[v.o].push(v.u);
        total++;
      }
      return { counts, total };
    };

    document.addEventListener('DOMContentLoaded', () => {
      // Handle theme
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }

      // Render once the stored polls are actually in hand, so the list is never
      // drawn empty and then repopulated.
      (async () => {
        await loadData();
        await loadUsers();
        renderPolls();
      })();
    });

    async function loadUsers() {
      try {
        const response = await fetch(`${API_BASE}/api/users`);
        if (!response.ok) throw new Error('Failed to fetch users');
        
        const allUsers = await response.json();
        // Filter out the bonus user (ID 0) as it's not a real family member
        users = allUsers.filter(user => user.id !== 0);
        
        renderUserSelection();
        
        // Load saved user selection
        const savedUserId = await readVoterId();
        if (savedUserId) {
          const savedUser = users.find(u => u.id === parseInt(savedUserId));
          if (savedUser) {
            applyUser(savedUser);
          }
        }
      } catch (error) {
        console.error('Error loading users:', error);
        showError('Could not load family members. Please check your connection.');
        document.getElementById('userGrid').innerHTML = '<div class="error-message">Failed to load family members</div>';
      }
    }

    function renderUserSelection() {
      const userGrid = document.getElementById('userGrid');

      if (users.length === 0) {
        userGrid.innerHTML = '<div class="no-polls">No family members found</div>';
        return;
      }

      userGrid.innerHTML = users.map(user => `
        <div class="user-option" onclick="selectUser(${JSON.stringify(user).replace(/"/g, '&quot;')})">
          <div class="user-avatar">${avatarMarkup(user, 40)}</div>
          <div class="user-name">${escapeHtml(user.username)}</div>
        </div>
      `).join('');
    }

    // Someone picked their profile: show it and remember it for this display.
    function selectUser(user) {
      applyUser(user);
      writeVoterId(user.id.toString());
      showSuccess(`Selected ${user.username} as current voter`);
    }

    // Shows the voter without saving. Restoring the saved voter on load uses
    // only this; going through selectUser wrote the same setting back to the
    // server, and announced it, on every page load.
    function applyUser(user) {
      currentUser = user;

      // Update UI
      document.getElementById('currentUserName').textContent = user.username;
      document.getElementById('currentUserAvatar').innerHTML = avatarMarkup(user, 28);
      document.getElementById('currentUserDisplay').style.display = 'block';
      document.querySelector('.user-selection').style.display = 'none';
      
      // Update user selection visual
      document.querySelectorAll('.user-option').forEach(option => {
        option.classList.remove('selected');
      });
      
      renderPolls(); // Re-render polls to show user-specific voting status
    }

    function clearUserSelection() {
      currentUser = null;
      writeVoterId(null);
      
      document.getElementById('currentUserDisplay').style.display = 'none';
      document.querySelector('.user-selection').style.display = 'block';
      
      renderPolls(); // Re-render polls
    }

    // Poll metadata only. Votes never live in here -- see voteKey().
    function normalizePoll(candidate) {
      if (!candidate || typeof candidate !== 'object') return null;
      if (typeof candidate.question !== 'string' || !candidate.question.trim()) return null;
      if (!Array.isArray(candidate.options) || candidate.options.length < 2) return null;
      // Arity is preserved deliberately: a vote stores the option's *index*, so
      // dropping one option silently reattributes every vote after it to its
      // neighbour and pushes the last one out of range. A label that is not a
      // string is coerced, and one with nothing usable gets a placeholder, so an
      // index always means what it meant when the vote was cast.
      const options = candidate.options.map((o, index) => {
        if (o && typeof o.text === 'string') return { text: o.text };
        if (o && (typeof o.text === 'number' || typeof o.text === 'boolean')) return { text: String(o.text) };
        return { text: `Option ${index + 1}` };
      });
      return {
        id: String(candidate.id != null ? candidate.id : newPollId()),
        question: candidate.question,
        options,
        createdBy: typeof candidate.createdBy === 'string' ? candidate.createdBy : 'Anonymous',
        createdAt: typeof candidate.createdAt === 'string' ? candidate.createdAt : new Date().toISOString()
      };
    }

    async function loadData() {
      polls = [];
      votes = {};
      archive = [];
      dataLoaded = false;

      if (!PLATFORM_AVAILABLE) {
        showError('Shared storage unavailable — install this widget through Admin > Widgets.');
        return;
      }

      try {
        const documents = await readAll();

        const stored = documents[POLLS_KEY];
        polls = Array.isArray(stored) ? stored.map(normalizePoll).filter(Boolean) : [];

        for (const key of Object.keys(documents)) {
          if (key.indexOf(VOTE_PREFIX) !== 0) continue;
          // v:<pollId>:<userId> — the poll id may itself contain '-', never ':'.
          const rest = key.slice(VOTE_PREFIX.length);
          const split = rest.lastIndexOf(':');
          if (split <= 0) continue;
          const pollId = rest.slice(0, split);
          const userId = rest.slice(split + 1);
          const value = documents[key];
          if (!value || typeof value !== 'object') continue;
          (votes[pollId] = votes[pollId] || {})[userId] = value;
        }

        archive = [];
        for (const key of Object.keys(documents)) {
          if (key.indexOf(ARCHIVE_PREFIX) !== 0 || !Array.isArray(documents[key])) continue;
          for (const candidate of documents[key]) {
            const record = normalizeArchived(candidate);
            if (record) archive.push(record);
          }
        }
        archive.sort((a, b) => (a.closedAt < b.closedAt ? 1 : a.closedAt > b.closedAt ? -1 : 0));
        // Closing archives first and then takes the poll off the open list. If
        // that second write failed, the poll is in both; it counts as closed.
        const archivedIds = new Set(archive.map(record => record.id));
        polls = polls.filter(poll => !archivedIds.has(String(poll.id)));

        dataLoaded = true;

        if (polls.length === 0 && documents[MIGRATION_KEY] === undefined) {
          await migrateFromLocalStorage();
          await STORAGE.set(MIGRATION_KEY, { at: new Date().toISOString() });
        }
      } catch (error) {
        console.error('Error loading poll data:', error);
        showError('Error loading saved polls');
        polls = [];
        votes = {};
        archive = [];
        dataLoaded = false;
      }
    }

    // Every stored document, read fresh. Closing a poll works from this rather
    // than from what this display loaded, which may be minutes old.
    async function readAll() {
      const all = await STORAGE.list();
      return all && typeof all === 'object' && !Array.isArray(all) ? all : {};
    }

    // One poll's votes in a set of stored documents: { [userId]: {o, u, t} }.
    function votesIn(documents, pollId) {
      const prefix = voteKey(pollId, '');
      const cast = {};
      for (const key of Object.keys(documents)) {
        if (key.indexOf(prefix) !== 0) continue;
        const value = documents[key];
        if (value && typeof value === 'object') cast[key.slice(prefix.length)] = value;
      }
      return cast;
    }

    function normalizeArchived(candidate) {
      const poll = normalizePoll(candidate);
      if (!poll || typeof candidate.closedAt !== 'string') return null;
      const options = poll.options.map((option, index) => {
        const voters = candidate.options[index] && Array.isArray(candidate.options[index].voters)
          ? candidate.options[index].voters.filter(name => typeof name === 'string') : [];
        return { text: option.text, voters };
      });
      return {
        ...poll,
        options,
        closedAt: candidate.closedAt,
        closedBy: typeof candidate.closedBy === 'string' ? candidate.closedBy : null
      };
    }

    // Writes the poll list only. Votes are written one key at a time by vote(),
    // so a concurrent vote elsewhere cannot be clobbered by a metadata write.
    async function savePolls() {
      if (!dataLoaded) {
        console.error('Polls: data was never loaded; refusing to overwrite stored polls.');
        showError('Error saving poll data');
        return false;
      }
      try {
        await STORAGE.set(POLLS_KEY, polls);
        return true;
      } catch (error) {
        console.error('Error saving poll data:', error);
        showError('Error saving poll data');
        return false;
      }
    }

    // Polls written before this plugin moved to server storage live in one
    // browser. Imported once; the original key is left intact as a fallback.
    async function migrateFromLocalStorage() {
      let legacy = [];
      try {
        const saved = localStorage.getItem(LEGACY_POLLS_KEY);
        const parsed = saved ? JSON.parse(saved) : null;
        legacy = Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.error('Error reading legacy polls:', error);
        return;
      }
      if (legacy.length === 0) return;

      const imported = [];
      for (const candidate of legacy) {
        const poll = normalizePoll(candidate);
        if (!poll) continue;
        imported.push(poll);

        // Votes were nested per option; fan them out into per-voter keys.
        const optionList = Array.isArray(candidate.options) ? candidate.options : [];
        for (let index = 0; index < optionList.length; index++) {
          const cast = Array.isArray(optionList[index] && optionList[index].votes)
            ? optionList[index].votes : [];
          for (const v of cast) {
            if (!v || v.userId === undefined || v.userId === null) continue;
            const record = {
              o: index,
              u: typeof v.username === 'string' ? v.username : '',
              t: typeof v.timestamp === 'string' ? v.timestamp : new Date().toISOString()
            };
            await STORAGE.set(voteKey(poll.id, v.userId), record);
            (votes[poll.id] = votes[poll.id] || {})[String(v.userId)] = record;
          }
        }
      }

      if (imported.length === 0) return;
      polls = imported;
      await STORAGE.set(POLLS_KEY, polls);
    }

    // Each message replaces the last, and so does its timer: an older message's
    // timer used to hide a newer one early (a vote, then "everyone has voted").
    const messageTimers = {};
    function showMessage(id, message, ms) {
      const div = document.getElementById(id);
      div.textContent = message;
      div.style.display = 'block';
      clearTimeout(messageTimers[id]);
      messageTimers[id] = setTimeout(() => {
        div.style.display = 'none';
      }, ms);
    }

    function showError(message) {
      showMessage('errorMessage', message, 5000);
    }

    function showSuccess(message) {
      showMessage('successMessage', message, 3000);
    }

    function addOption() {
      const container = document.getElementById('optionsContainer');
      const optionCount = container.children.length + 1;
      
      const optionGroup = document.createElement('div');
      optionGroup.className = 'option-input-group';
      
      optionGroup.innerHTML = `
        <input type="text" class="form-input option-input" placeholder="Option ${optionCount}">
        <button type="button" class="remove-option-btn" onclick="removeOption(this)">×</button>
      `;
      
      container.appendChild(optionGroup);
    }

    function removeOption(button) {
      const container = document.getElementById('optionsContainer');
      if (container.children.length > 2) {
        button.parentElement.remove();
      } else {
        showError('A poll must have at least 2 options');
      }
    }

    async function createPoll() {
      if (HIDE_MANAGE_POLLS) return;
      const question = document.getElementById('pollQuestion').value.trim();
      const optionInputs = document.querySelectorAll('.option-input');
      
      if (!question) {
        showError('Please enter a poll question');
        return;
      }
      
      const options = [];
      optionInputs.forEach(input => {
        const value = input.value.trim();
        if (value) {
          options.push(value);
        }
      });
      
      if (options.length < 2) {
        showError('Please provide at least 2 options');
        return;
      }
      
      const poll = {
        id: newPollId(),
        question: question,
        // Metadata carries no votes or counts; both are derived from the
        // per-voter keys at render time.
        options: options.map(option => ({ text: option })),
        createdAt: new Date().toISOString(),
        createdBy: currentUser ? currentUser.username : 'Anonymous'
      };

      const previous = polls;
      polls = [poll].concat(polls);
      if (!await savePolls()) { polls = previous; return; }
      pendingDeleteId = null;
      toggleCreateForm(false);
      renderPolls();
      
      // toggleCreateForm(false) above already cleared and collapsed the form.
      showSuccess('Poll created successfully!');
    }

    async function vote(pollId, optionIndex) {
      if (!currentUser) {
        showError('Please select your profile first');
        return;
      }
      if (!dataLoaded) {
        console.error('Polls: data was never loaded; refusing to vote.');
        showError('Error saving vote');
        return;
      }

      const poll = polls.find(p => String(p.id) === String(pollId));
      if (!poll || !poll.options[optionIndex]) return;

      // The voter writes only their own key, so two people voting at once
      // cannot collide. Voting again overwrites that one key, which moves the
      // vote rather than adding a second.
      const userId = String(currentUser.id);
      const previous = pollVotes(poll.id)[userId];
      const moved = previous !== undefined && previous.o !== optionIndex;
      if (previous !== undefined && previous.o === optionIndex) return;

      const record = { o: optionIndex, u: currentUser.username, t: new Date().toISOString() };
      try {
        await STORAGE.set(voteKey(poll.id, userId), record);
      } catch (error) {
        console.error('Error saving vote:', error);
        showError('Error saving vote');
        return;
      }

      (votes[poll.id] = votes[poll.id] || {})[userId] = record;
      pendingDeleteId = null;
      pendingCloseId = null;
      renderPolls();
      showSuccess(moved
        ? `Vote moved for ${currentUser.username}`
        : `Vote recorded for ${currentUser.username}!`);
      if (!moved) await closeIfEveryoneVoted(poll.id);
    }

    // Read fresh, so votes cast on other displays since this one loaded count.
    async function closeIfEveryoneVoted(pollId) {
      const id = String(pollId);
      let documents;
      try {
        documents = await readAll();
      } catch (error) {
        console.error('Polls: could not check whether everyone has voted:', error);
        return;
      }
      const cast = votesIn(documents, id);
      const open = Array.isArray(documents[POLLS_KEY]) && documents[POLLS_KEY].some(p => p && String(p.id) === id);
      if (!open) {
        // Closed on another display after this one loaded: the vote just cast
        // has no poll. Remove it rather than leave it against the key cap.
        await Promise.allSettled(Object.keys(cast).map(userId => STORAGE.remove(voteKey(id, userId))));
        await reloadAndRender();
        showError('That poll was already closed. It is under Past polls.');
        return;
      }
      if (users.length > 0 && users.every(user => cast[String(user.id)] !== undefined)) {
        await closePoll(id, true);
      }
    }

    // The first click on Close arms it, the second closes; a poll closing
    // because everyone has voted skips that. The result is written to the
    // archive first, and only then is the poll taken off the open list and its
    // votes removed, so a failure part way never loses the poll.
    async function closePoll(pollId, everyoneVoted = false) {
      const id = String(pollId);
      if (!everyoneVoted) {
        if (HIDE_MANAGE_POLLS) return;
        if (pendingCloseId !== id) {
          pendingCloseId = id;
          pendingDeleteId = null;
          armClickHandled = true;
          renderPolls();
          return;
        }
        pendingCloseId = null;
      }
      if (!dataLoaded) {
        console.error('Polls: data was never loaded; refusing to close.');
        showError('Error closing poll');
        return;
      }

      let documents;
      try {
        documents = await readAll();
      } catch (error) {
        console.error('Error closing poll:', error);
        showError('Error closing poll');
        return;
      }
      const stored = Array.isArray(documents[POLLS_KEY]) ? documents[POLLS_KEY].map(normalizePoll).filter(Boolean) : [];
      const poll = stored.find(p => String(p.id) === id);
      if (!poll) {
        // Closed or deleted on another display meanwhile.
        await reloadAndRender();
        return;
      }

      const cast = votesIn(documents, id);
      const record = {
        id,
        question: poll.question,
        options: poll.options.map(option => ({ text: option.text, voters: [] })),
        createdBy: poll.createdBy,
        createdAt: poll.createdAt,
        closedAt: new Date().toISOString(),
        closedBy: everyoneVoted ? null : (currentUser ? currentUser.username : 'Anonymous')
      };
      Object.values(cast).forEach(v => {
        if (v && typeof v.o === 'number' && record.options[v.o]) {
          record.options[v.o].voters.push(typeof v.u === 'string' && v.u ? v.u : 'Someone');
        }
      });

      const key = archiveKeyFor(documents, record);
      const doc = Array.isArray(documents[key]) ? documents[key] : [];
      try {
        if (!doc.some(r => r && String(r.id) === id)) await STORAGE.set(key, doc.concat([record]));
      } catch (error) {
        console.error('Error archiving poll:', error);
        showError('Error closing poll');
        return;
      }
      try {
        await STORAGE.set(POLLS_KEY, stored.filter(p => String(p.id) !== id));
      } catch (error) {
        console.error('Error taking the poll off the open list:', error);
        showError('Poll saved to Past polls, but it could not be taken off the open list');
        await reloadAndRender();
        return;
      }
      // Left behind, vote keys are invisible and count against the 500-key cap.
      const results = await Promise.allSettled(Object.keys(cast).map(userId => STORAGE.remove(voteKey(id, userId))));
      const failed = results.filter(r => r.status === 'rejected').length;

      await reloadAndRender();
      void notifyClosed(record, everyoneVoted);
      if (failed > 0) {
        showError(`Poll closed, but ${failed} of ${results.length} votes could not be removed`);
      } else {
        showSuccess(everyoneVoted ? 'Everyone has voted. The poll is closed and saved under Past polls.' : 'Poll closed and saved under Past polls');
      }
    }

    // A closed poll's result in a few words: "Pizza, 4 of 6", a tie, or none.
    function outcomeOf(record) {
      const counts = record.options.map(option => option.voters.length);
      const total = counts.reduce((a, b) => a + b, 0);
      const top = Math.max(...counts);
      const leaders = record.options.filter((option, index) => counts[index] === top && top > 0).map(option => option.text);
      return total === 0 ? 'No votes'
        : leaders.length === 1 ? `${leaders[0]}, ${top} of ${total}`
        : `Tie: ${leaders.join(', ')}, ${top} each`;
    }

    // Tell the phones that ticked Polls. The display that closed the poll is
    // the only one that gets here, so a result is sent once. A HomeGlow
    // without notify(), or one refusing (no phone, over the limit), is no
    // reason to trouble whoever closed it.
    async function notifyClosed(record, everyoneVoted) {
      if (!SDK || typeof SDK.notify !== 'function') return;
      const tag = `poll-${String(record.id).toLowerCase().replace(/[^a-z0-9-]/g, '')}`.slice(0, 40);
      try {
        await SDK.notify({
          title: `Poll closed: ${record.question}`,
          message: `${everyoneVoted ? 'Everyone voted. ' : ''}${outcomeOf(record)}`,
          tag,
        });
      } catch (error) {
        console.warn('Polls: could not send the result to phones:', error);
      }
    }

    // The year's archive document with room for this record, by its JSON size.
    function archiveKeyFor(documents, record) {
      const year = new Date(record.closedAt).getFullYear();
      const bytes = (value) => new TextEncoder().encode(JSON.stringify(value)).length;
      for (let n = 1; ; n++) {
        const key = ARCHIVE_PREFIX + year + (n === 1 ? '' : ':' + n);
        const doc = documents[key];
        if (!Array.isArray(doc) || doc.some(r => r && String(r.id) === record.id) || bytes(doc.concat([record])) <= ARCHIVE_DOC_BYTES) return key;
      }
    }

    async function reloadAndRender() {
      await loadData();
      renderPolls();
    }

    // Anything that is not the armed button disarms it. Without this the only way
    // out of the armed state is to perform another action, so a stray first click
    // leaves "Confirm delete" sitting there with nowhere to click to take it back.
    function disarmDelete() {
      if (!pendingDeleteId && !pendingCloseId) return;
      pendingDeleteId = null;
      pendingCloseId = null;
      renderPolls();
    }

    document.addEventListener('click', () => {
      // The arming click reaches this listener too, on its way up.
      if (armClickHandled) { armClickHandled = false; return; }
      disarmDelete();
    });

    // A click on another widget never reaches this document -- the plugin is in an
    // iframe -- but it does take focus away from it, which is the closest signal
    // available for "the family is looking at something else now".
    window.addEventListener('blur', disarmDelete);

    // Deleting is for past polls only; an open poll is closed instead, so
    // nothing is lost by accident. The first click arms, the second deletes.
    // confirm() is ignored in the sandboxed iframe the dashboard embeds plugins
    // in -- it returns false, so a confirm-guarded delete silently did nothing.
    async function deletePoll(pollId) {
      if (HIDE_MANAGE_POLLS) return;
      const id = String(pollId);
      if (pendingDeleteId !== id) {
        pendingDeleteId = id;
        pendingCloseId = null;
        armClickHandled = true;
        renderPolls();
        return;
      }
      pendingDeleteId = null;

      if (!dataLoaded) {
        console.error('Polls: data was never loaded; refusing to delete.');
        showError('Error deleting poll');
        return;
      }
      try {
        const documents = await readAll();
        for (const key of Object.keys(documents)) {
          if (key.indexOf(ARCHIVE_PREFIX) !== 0 || !Array.isArray(documents[key])) continue;
          if (!documents[key].some(r => r && String(r.id) === id)) continue;
          const rest = documents[key].filter(r => !(r && String(r.id) === id));
          if (rest.length > 0) await STORAGE.set(key, rest);
          else await STORAGE.remove(key);
        }
      } catch (error) {
        console.error('Error deleting past poll:', error);
        showError('Error deleting poll');
        return;
      }
      if (expandedArchiveId === id) expandedArchiveId = null;
      await reloadAndRender();
      showSuccess('Past poll deleted');
    }

    function toggleArchive() {
      archiveOpen = !archiveOpen;
      pendingDeleteId = null;
      renderArchive();
    }

    function toggleArchived(id) {
      expandedArchiveId = expandedArchiveId === id ? null : id;
      pendingDeleteId = null;
      renderArchive();
    }

    // The create form starts collapsed: on a wall display the widget is mostly
    // read, so an always-open form is permanent clutter.
    function toggleCreateForm(show) {
      const form = document.getElementById('pollCreation');
      const btn = document.getElementById('toggleCreateBtn');
      // Gone under managePolls; see applyControlLimits().
      if (!form || !btn) return;
      const open = show === undefined ? form.style.display === 'none' : Boolean(show);
      form.style.display = open ? '' : 'none';
      btn.textContent = open ? '✕ Cancel' : '+ Create Poll';
      if (open) {
        document.getElementById('pollQuestion').focus();
      } else {
        clearCreateForm();
      }
    }

    function clearCreateForm() {
      document.getElementById('pollQuestion').value = '';
      document.getElementById('optionsContainer').innerHTML = `
        <div class="option-input-group">
          <input type="text" class="form-input option-input" placeholder="Option 1">
        </div>
        <div class="option-input-group">
          <input type="text" class="form-input option-input" placeholder="Option 2">
        </div>
      `;
    }

    // Editing happens in the poll's own card rather than in the create form: the
    // create form is collapsed by default, so reopening it to edit would present
    // create UI for an edit, and the poll's own tally stays in view this way.
    // prompt() is not an option either -- the dashboard embeds
    // plugins in an iframe sandboxed without allow-modals, so prompt() and
    // confirm() are ignored outright and return null / false. Anything built on
    // them silently does nothing.
    //
    // Text only. Votes reference an option *index*, so relabelling is safe while
    // adding or removing an option would silently repoint every vote cast so far
    // -- hence the option inputs are fixed in number while editing.
    function editPoll(pollId) {
      if (HIDE_MANAGE_POLLS) return;
      const poll = polls.find(p => String(p.id) === String(pollId));
      if (!poll) return;
      editingPollId = String(poll.id);
      pendingDeleteId = null;
      renderPolls();
      const field = document.getElementById('editQuestion');
      if (field) field.focus();
    }

    function cancelEdit() {
      editingPollId = null;
      renderPolls();
    }

    // Text only. Votes reference an option *index*, so relabelling is safe while
    // adding or removing an option would silently repoint every vote already
    // cast -- which is why the card offers no way to change the option count.
    async function savePollEdit(pollId) {
      if (HIDE_MANAGE_POLLS) return;
      const poll = polls.find(p => String(p.id) === String(pollId));
      if (!poll) { showError('That poll no longer exists'); cancelEdit(); return; }

      const question = (document.getElementById('editQuestion').value || '').trim();
      if (!question) { showError('Please enter a poll question'); return; }

      const inputs = document.querySelectorAll('.edit-option-input');
      const labels = [];
      for (let i = 0; i < poll.options.length; i++) {
        const value = inputs[i] ? (inputs[i].value || '').trim() : '';
        if (!value) { showError('Options cannot be empty'); return; }
        labels.push(value);
      }

      const before = { question: poll.question, options: poll.options };
      poll.question = question;
      poll.options = labels.map(text => ({ text }));
      if (!await savePolls()) {
        poll.question = before.question;
        poll.options = before.options;
        return;
      }
      editingPollId = null;
      renderPolls();
      showSuccess('Poll updated');
    }

    function getUserVoteForPoll(poll) {
      if (!currentUser) return null;
      const own = pollVotes(poll.id)[String(currentUser.id)];
      return own && typeof own.o === 'number' ? own.o : null;
    }

    function renderPolls() {
      const container = document.getElementById('pollsContainer');
      
      renderArchive();

      if (polls.length === 0) {
        container.innerHTML = archive.length > 0
          ? '<div class="no-polls">No open polls.</div>'
          : '<div class="no-polls">No polls created yet. Create your first poll above!</div>';
        return;
      }

      if (pendingCloseId && !polls.some(p => String(p.id) === pendingCloseId)) {
        pendingCloseId = null;
      }

      container.innerHTML = polls.map(poll => {
        const userVoteIndex = getUserVoteForPoll(poll);
        const hasVoted = userVoteIndex !== null;
        const { counts, total } = voteCountsFor(poll);
        const pollId = escapeHtml(String(poll.id));
        const armed = pendingCloseId === String(poll.id);

        if (editingPollId === String(poll.id)) {
          return `
            <div class="poll-item">
              <div class="form-group">
                <label class="form-label">Poll Question:</label>
                <input type="text" id="editQuestion" class="form-input" value="${escapeAttr(poll.question)}">
              </div>
              <div class="form-group">
                <label class="form-label">Options:</label>
                ${poll.options.map((option, index) => `
                  <div class="option-input-group">
                    <input type="text" class="form-input edit-option-input" value="${escapeAttr(option.text)}" placeholder="Option ${index + 1}">
                  </div>
                `).join('')}
              </div>
              <button type="button" class="custom-button" onclick="savePollEdit('${pollId}')">Save Changes</button>
              <button type="button" class="custom-button" onclick="cancelEdit()" style="margin-left: 0.5rem; background: var(--text-secondary, #A3A3A3) !important;">Cancel</button>
              <div class="poll-meta" style="margin-top: 0.5rem;">
                ${total} vote${total === 1 ? '' : 's'} cast — options cannot be added or removed without invalidating them
              </div>
            </div>
          `;
        }

        return `
          <div class="poll-item">
            <div class="poll-question">${escapeHtml(poll.question)}</div>
            
            ${!hasVoted && currentUser ? `
              <div class="poll-options">
                ${poll.options.map((option, index) => `
                  <div class="poll-option" onclick="vote('${pollId}', ${index})">
                    <input type="radio" name="poll_${pollId}" value="${index}">
                    <span>${escapeHtml(option.text)}</span>
                  </div>
                `).join('')}
              </div>
            ` : `
              <div class="poll-results">
                ${poll.options.map((option, index) => {
                  const voters = counts[index] || [];
                  const percentage = total > 0 ? Math.round((voters.length / total) * 100) : 0;
                  const isUserVote = index === userVoteIndex;
                  
                  return `
                    <div class="result-bar">
                      <div class="result-label">${escapeHtml(option.text)}${isUserVote ? ' ✓' : ''}</div>
                      <div class="result-progress">
                        <div class="result-fill" style="width: ${percentage}%"></div>
                      </div>
                      <div class="result-percentage">${percentage}%</div>
                    </div>
                    ${voters.length > 0 ? `
                      <div class="voter-list">
                        Voted by: ${voters.map(name => escapeHtml(name)).join(', ')}
                      </div>
                    ` : ''}
                  `;
                }).join('')}
              </div>
            `}
            
            ${!currentUser ? '<div style="text-align: center; color: var(--text-secondary, #A3A3A3); font-style: italic; margin: 1rem 0;">Select your profile above to vote</div>' : ''}
            
            <div class="poll-meta">
              Total votes: ${total} | Created by: ${escapeHtml(poll.createdBy)} | ${new Date(poll.createdAt).toLocaleDateString()}
              ${HIDE_MANAGE_POLLS ? '' : `
              <button type="button" class="custom-button" onclick="editPoll('${pollId}')" style="margin-left: 1rem; font-size: 0.7rem; padding: 4px 8px;">Edit</button>
              <button type="button" class="custom-button" onclick="closePoll('${pollId}')" style="margin-left: 0.5rem; font-size: 0.7rem; padding: 4px 8px;">${armed ? 'Confirm close' : 'Close'}</button>`}

            </div>
          </div>
        `;
      }).join('');
    }

    // Past polls: collapsed to a count until opened; each shows its outcome and
    // opens to the full tally.
    function renderArchive() {
      const section = document.getElementById('archiveSection');
      if (!section) return;
      section.style.display = archive.length > 0 ? '' : 'none';
      document.getElementById('toggleArchiveBtn').textContent = `${archiveOpen ? '▾' : '▸'} Past polls (${archive.length})`;
      const container = document.getElementById('archiveContainer');
      container.style.display = archiveOpen ? '' : 'none';
      if (!archiveOpen) return;
      if (pendingDeleteId && !archive.some(r => r.id === pendingDeleteId)) pendingDeleteId = null;

      container.innerHTML = archive.map(record => {
        const id = escapeHtml(record.id);
        const outcome = outcomeOf(record);
        const closed = new Date(record.closedAt).toLocaleDateString();
        const open = expandedArchiveId === record.id;
        const armed = pendingDeleteId === record.id;
        return `
          <div class="archive-item">
            <div class="archive-summary" onclick="toggleArchived('${id}')">
              <div class="archive-question">${open ? '▾' : '▸'} ${escapeHtml(record.question)}</div>
              <div class="archive-outcome">${escapeHtml(outcome)} · closed ${escapeHtml(closed)}</div>
            </div>
            ${open ? `
              <div class="poll-results" style="margin-top: 0.5rem;">
                ${record.options.map((option, index) => {
                  const percentage = total > 0 ? Math.round((counts[index] / total) * 100) : 0;
                  return `
                    <div class="result-bar">
                      <div class="result-label">${escapeHtml(option.text)}</div>
                      <div class="result-progress"><div class="result-fill" style="width: ${percentage}%"></div></div>
                      <div class="result-percentage">${percentage}%</div>
                    </div>
                    ${option.voters.length > 0 ? `<div class="voter-list">Voted by: ${option.voters.map(name => escapeHtml(name)).join(', ')}</div>` : ''}
                  `;
                }).join('')}
              </div>
              <div class="poll-meta">
                Created by: ${escapeHtml(record.createdBy)} | ${escapeHtml(new Date(record.createdAt).toLocaleDateString())} | ${record.closedBy ? `Closed by ${escapeHtml(record.closedBy)}` : 'Closed when everyone had voted'}
                ${HIDE_MANAGE_POLLS ? '' : `
                <button type="button" class="custom-button" onclick="deletePoll('${id}')" style="margin-left: 0.5rem; font-size: 0.7rem; padding: 4px 8px;${armed ? ' background: var(--hg-error, var(--error, #ef4444)) !important;' : ''}">${armed ? 'Confirm delete' : 'Delete'}</button>`}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // escapeHtml() works by round-tripping textContent through innerHTML, which
    // escapes & < > and leaves quotes alone. That is correct for text between
    // tags and wrong inside an attribute, where a quote ends the value early.
    function escapeAttr(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Shared by the picker and the "Voting as" line, so both stay consistent.
    function avatarMarkup(user, size) {
      const px = size || 40;
      if (user && user.profile_picture) {
        return `<img src="${escapeAttr(window.location.origin + '/Uploads/users/' + user.profile_picture)}"`
          + ` alt="${escapeAttr(user.username)}"`
          + ` style="width: ${px}px; height: ${px}px; border-radius: 50%; object-fit: cover; display: block;">`;
      }
      return `<span style="font-size: ${Math.round(px * 0.7)}px; line-height: 1;">👤</span>`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
