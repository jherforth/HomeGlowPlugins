<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week Board</title>
  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "week-board",
    "name": "Week Board",
    "version": "1.0.0",
    "description": "A family whiteboard for the week: short notes on the days they're for, like \"Kids buy lunch\" every Monday or \"Library books due\" this Thursday. Shows today and the days ahead on every display, no calendar needed.",
    "category": "family-hub",
    "author": "HomeGlow",
    "apiVersion": "v1",
    "storage": true,
    "settings": [
      { "key": "days", "label": "Days to show", "type": "select",
        "options": ["Automatic", "Today", "Today and tomorrow", "3 days", "A week"], "default": "Automatic", "scope": "device" },
      { "key": "person", "label": "Show notes for (username; blank = everyone). Notes for everyone always show.", "type": "string", "default": "", "scope": "device" }
    ],
    "hideableControls": [
      { "id": "edit", "label": "Add, change and remove notes" }
    ]
  }
  </script>
  <link rel="stylesheet" href="/index.css">
  <style>
    :root {
      --acc: var(--accent, #3a7cc4);
      --ink: var(--text, #1e2b3a);
      --ink-2: var(--text-secondary, #5a6b7d);
      --line: var(--card-border, rgba(128, 128, 128, 0.28));
      --tint: rgba(var(--accent-rgb, 58, 124, 196), 0.12);
      --tile: color-mix(in srgb, var(--ink) 6%, transparent);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      /* /index.css pads the body for the dashboard's dock; not in a tile. */
      padding: 0;
      background: var(--card-bg, #fff);
      color: var(--ink);
      font-family: var(--hg-font-body, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif);
      font-size: 15px;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    body.transparent { background: transparent; }
    button { font: inherit; color: inherit; }

    #app { height: 100%; display: flex; flex-direction: column; padding: 12px 14px; gap: 10px; container-type: size; }
    .head { display: flex; align-items: center; gap: 10px; flex: none; }
    .head h1 { margin: 0; font-size: 1rem; font-weight: 750; letter-spacing: -0.01em; }
    .head .date { color: var(--ink-2); font-size: 0.85rem; margin-left: auto; white-space: nowrap; }
    .add {
      appearance: none; border: 0; cursor: pointer; flex: none;
      min-height: 34px; padding: 0 14px; border-radius: 999px;
      background: var(--acc); color: #fff; font-weight: 700; font-size: 0.85rem;
    }
    .add:focus-visible, .day:focus-visible, .note:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

    .notice { font-size: 0.78rem; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 10px; padding: 6px 10px; flex: none; }

    /* The board: a row per day, the day on the left, its notes beside it. */
    .board { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .day {
      display: grid; grid-template-columns: 4.6em minmax(0, 1fr); align-items: start; gap: 12px;
      padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
      text-align: left; width: 100%; appearance: none;
    }
    button.day { cursor: pointer; }
    .day.today { background: var(--tint); border-color: color-mix(in srgb, var(--acc) 45%, transparent); }
    .when { display: flex; flex-direction: column; line-height: 1.15; padding-top: 2px; }
    .when b { font-size: 0.95rem; font-weight: 750; }
    .when span { font-size: 0.75rem; color: var(--ink-2); }
    .today .when b { color: var(--acc); }
    .notes { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .note { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 26px; border-radius: 8px; }
    .note .ico { flex: none; width: 1.4em; text-align: center; font-size: 1.05rem; }
    .note .txt { flex: 1; min-width: 0; font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
    .note .who { flex: none; display: inline-flex; align-items: center; gap: 5px; max-width: 45%; padding: 2px 8px 2px 2px; border-radius: 999px;
      background: var(--tile); font-size: 0.78rem; font-weight: 650; color: var(--ink-2); }
    .note .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note .rep { flex: none; color: var(--ink-2); opacity: 0.7; font-size: 0.8rem; }
    .empty { color: var(--ink-2); opacity: 0.6; font-size: 0.9rem; padding-top: 2px; }

    .av { flex: none; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
      background: var(--acc); color: #fff; font-size: 0.7rem; font-weight: 800; }
    .av img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* A small tile: the day labels go above their notes. */
    @container (max-width: 340px) {
      .day { grid-template-columns: minmax(0, 1fr); gap: 4px; }
      .when { flex-direction: row; gap: 6px; align-items: baseline; }
      .head .date { display: none; }
    }

    /* The sheet for adding or changing a note, over the whole tile. */
    .sheet { position: fixed; inset: 0; z-index: 10; background: var(--card-bg, #fff); color: var(--ink); display: flex; flex-direction: column; }
    body.transparent .sheet { background: var(--surface, var(--card-bg, #fff)); }
    .sheet[hidden] { display: none; }
    .sheet header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
    .sheet header h2 { margin: 0; font-size: 1rem; flex: 1; }
    .sheet .body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }
    .sheet footer { display: flex; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--line); }
    .label { font-size: 0.75rem; font-weight: 750; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
    input.text {
      width: 100%; min-height: 46px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 1.05rem;
      border: 1px solid var(--line); background: transparent; color: var(--ink); -webkit-user-select: text; user-select: text;
    }
    input.text:focus-visible { outline: 3px solid var(--acc); outline-offset: 1px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    .row.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
    .pill {
      appearance: none; cursor: pointer; flex: none; min-height: 38px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); background: transparent; font-size: 0.88rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .pill[aria-pressed="true"] { background: var(--acc); border-color: var(--acc); color: #fff; }
    .pill:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    .icon-pill { width: 42px; padding: 0; justify-content: center; font-size: 1.15rem; }
    .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--tile); }
    .seg .pill { border: 0; background: transparent; }
    .seg .pill[aria-pressed="true"] { background: var(--acc); color: #fff; }
    .btn { appearance: none; cursor: pointer; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
    .btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
    .btn.danger { margin-right: auto; color: var(--hg-error, #c43d3d); border-color: color-mix(in srgb, var(--hg-error, #c43d3d) 50%, transparent); }
    .btn.danger.armed { background: var(--hg-error, #c43d3d); color: #fff; }
    .btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    .err { color: var(--hg-error, #c43d3d); font-size: 0.85rem; font-weight: 600; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
  (function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var theme = params.get('theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    if (params.get('transparent') === 'true') document.body.classList.add('transparent');
    var HIDE_EDIT = (params.get('hide') || '').split(',').indexOf('edit') !== -1;
    var lang = (params.get('lang') || navigator.language || 'en').split('-')[0];

    // Notes live in plugin storage, one key each, so displays editing at
    // once never overwrite each other's notes. Without HomeGlow's storage
    // (a file dropped in rather than installed) this browser's own storage
    // stands in, and the board says so.
    var SDK = window.HomeGlow && window.HomeGlow.pluginId && window.HomeGlow.storage ? window.HomeGlow : null;
    var LOCAL = 'homeglow.weekboard.';
    var store = {
      list: function () {
        if (SDK) return SDK.storage.list().then(function (all) { return all || {}; });
        var out = {};
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k.indexOf(LOCAL) === 0) { try { out[k.slice(LOCAL.length)] = JSON.parse(localStorage.getItem(k)); } catch (e) {} }
          }
        } catch (e) {}
        return Promise.resolve(out);
      },
      set: function (key, value) {
        if (SDK) return SDK.storage.set(key, value);
        try { localStorage.setItem(LOCAL + key, JSON.stringify(value)); } catch (e) { return Promise.reject(e); }
        return Promise.resolve();
      },
      remove: function (key) {
        if (SDK) return SDK.storage.remove(key).catch(function () {});
        try { localStorage.removeItem(LOCAL + key); } catch (e) {}
        return Promise.resolve();
      }
    };

    // A note: { id, text, icon, days: [0-6] for every week, or date:
    // 'YYYY-MM-DD' for just once, userId (null = everyone), at }.
    var ICONS = ['', '\u{1F34E}', '\u{1F96A}', '\u{1F392}', '\u{1F68C}', '⚽', '\u{1F3CA}', '\u{1F3B5}', '\u{1F4DA}', '\u{1F9F9}',
      '\u{1F5D1}️', '\u{1F6D2}', '\u{1F436}', '\u{1F48A}', '\u{1F382}', '\u{1F454}', '\u{1F45F}', '\u{1F3A8}', '⭐', '❗'];

    var state = { notes: [], users: [], tz: null, settings: { days: 'Automatic', person: '' }, loaded: false, error: null };
    var app = document.getElementById('app');
    var sheet = document.getElementById('sheet');

    var esc = function (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    };
    var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

    // --- dates, in the household's timezone ----------------------------------
    var fmt = function (opts) {
      try { return new Intl.DateTimeFormat(lang, Object.assign({ timeZone: state.tz || undefined }, opts)); }
      catch (e) { return new Intl.DateTimeFormat('en', opts); }
    };
    function todayKey() {
      var parts = {};
      fmt({ year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
      return parts.year + '-' + parts.month + '-' + parts.day;
    }
    function addDays(key, n) {
      var p = key.split('-');
      var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
      return d.toISOString().slice(0, 10);
    }
    var weekdayOf = function (key) { var p = key.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay(); };
    // Labels for a date key, written the way this display writes dates.
    var noon = function (key) { var p = key.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12)); };
    var dayName = function (key, style) {
      try { return new Intl.DateTimeFormat(lang, { weekday: style || 'short', timeZone: 'UTC' }).format(noon(key)); } catch (e) { return key; }
    };
    var monthDay = function (key) {
      try { return new Intl.DateTimeFormat(lang, { month: 'short', day: 'numeric', timeZone: 'UTC' }).format(noon(key)); } catch (e) { return key; }
    };
    var WEEK = [0, 1, 2, 3, 4, 5, 6];
    var weekdayLabel = function (d) { return dayName(addDays('2026-01-04', d)); }; // 4 Jan 2026 was a Sunday

    // --- people ------------------------------------------------------------------
    var userById = function (id) { for (var i = 0; i < state.users.length; i++) if (state.users[i].id === id) return state.users[i]; return null; };
    function avatar(user) {
      // A letter or digit only: it also goes inside the image's fallback script.
      var first = String(user.username || '').charAt(0).toUpperCase();
      var letter = /[\p{L}\p{N}]/u.test(first) ? first : '?';
      if (user.profile_picture) {
        return '<span class="av"><img alt="" src="' + esc(window.location.origin + '/Uploads/users/' + user.profile_picture)
          + '" onerror="this.parentNode.textContent=\'' + letter + '\'"></span>';
      }
      return '<span class="av">' + letter + '</span>';
    }

    // --- loading -----------------------------------------------------------------
    function load() {
      return Promise.all([
        fetch('/api/timezone').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
        fetch('/api/users').then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }),
        store.list(),
        SDK && SDK.settings ? SDK.settings.get().catch(function () { return {}; }) : Promise.resolve({})
      ]).then(function (res) {
        var tz = res[0] && (typeof res[0] === 'string' ? res[0] : res[0].timezone);
        if (tz) { try { new Intl.DateTimeFormat('en', { timeZone: tz }); state.tz = tz; } catch (e) {} }
        // id 0 is the core's bonus pool, not a person.
        state.users = (Array.isArray(res[1]) ? res[1] : []).filter(function (u) { return u && u.id !== 0; });
        var all = res[2] || {};
        state.notes = Object.keys(all).filter(function (k) { return k.indexOf('note:') === 0 && all[k] && all[k].text; })
          .map(function (k) { return all[k]; });
        state.settings = Object.assign({ days: 'Automatic', person: '' }, res[3] || {});
        state.loaded = true;
        state.error = null;
        tidy();
        render();
      }).catch(function (e) {
        state.loaded = true;
        state.error = 'Couldn\'t load the board: ' + (e && e.message ? e.message : 'try again in a moment');
        render();
      });
    }

    // A note for one day gone by more than a day is cleared away, by
    // whichever display notices first.
    function tidy() {
      var cutoff = addDays(todayKey(), -1);
      state.notes.filter(function (n) { return n.date && n.date < cutoff; }).forEach(function (n) {
        state.notes = state.notes.filter(function (m) { return m.id !== n.id; });
        store.remove('note:' + n.id);
      });
    }

    // --- the board -------------------------------------------------------------------
    function dayCount() {
      var choice = state.settings.days;
      if (choice === 'Today') return 1;
      if (choice === 'Today and tomorrow') return 2;
      if (choice === '3 days') return 3;
      if (choice === 'A week') return 7;
      // As many days as fit, a row being about 64px under a 64px header;
      // a day with more notes than that scrolls.
      return Math.max(1, Math.min(7, Math.floor((window.innerHeight - 64) / 64)));
    }
    function shownFor() {
      var want = String(state.settings.person || '').trim().toLowerCase();
      if (!want) return null;
      var u = state.users.filter(function (x) { return String(x.username).toLowerCase() === want; })[0];
      return u ? u.id : -1;
    }
    function notesOn(key) {
      var wd = weekdayOf(key);
      var only = shownFor();
      return state.notes.filter(function (n) {
        var on = n.date ? n.date === key : Array.isArray(n.days) && n.days.indexOf(wd) !== -1;
        return on && (only === null || n.userId == null || n.userId === only);
      }).sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
    }

    var lastHtml = '';
    function render() {
      var today = todayKey();
      var html = '<div class="head"><h1>Week Board</h1><span class="date">' + esc(fmt({ weekday: 'long', month: 'long', day: 'numeric' }).format(new Date())) + '</span>'
        + (HIDE_EDIT ? '' : '<button type="button" class="add" data-add>+ Add</button>') + '</div>';
      if (!SDK && state.loaded) html += '<div class="notice">Saved on this screen only. Install Week Board from Admin → Plugins to share it with every display.</div>';
      if (state.error) html += '<div class="notice err">' + esc(state.error) + '</div>';
      html += '<div class="board">';
      if (state.loaded) {
        for (var i = 0; i < dayCount(); i++) {
          var key = addDays(today, i);
          var notes = notesOn(key);
          var label = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : dayName(key);
          var tag = HIDE_EDIT ? 'div' : 'button type="button" data-day="' + key + '" aria-label="' + esc(label + ', ' + monthDay(key) + ': add or change notes') + '"';
          html += '<' + tag + ' class="day' + (i === 0 ? ' today' : '') + '">'
            + '<span class="when"><b>' + esc(label) + '</b><span>' + esc(i < 2 ? dayName(key) + ' ' + monthDay(key) : monthDay(key)) + '</span></span>'
            + '<span class="notes">' + (notes.length ? notes.map(noteHtml).join('') : '<span class="empty">—</span>') + '</span>'
            + '</' + (HIDE_EDIT ? 'div' : 'button') + '>';
        }
      }
      html += '</div>';
      if (html !== lastHtml) { app.innerHTML = html; lastHtml = html; }
    }
    function noteHtml(n) {
      var who = n.userId != null ? userById(n.userId) : null;
      return '<span class="note" data-note="' + esc(n.id) + '">'
        + '<span class="ico" aria-hidden="true">' + (n.icon || '•') + '</span>'
        + '<span class="txt">' + esc(n.text) + '</span>'
        + (who ? '<span class="who">' + avatar(who) + '<span>' + esc(who.username) + '</span></span>' : '')
        + (n.days ? '<span class="rep" title="Every week" aria-label="every week">↻</span>' : '')
        + '</span>';
    }

    // --- adding and changing a note ----------------------------------------------------
    var draft = null;
    function openSheet(note, dayKey) {
      sheet.innerHTML = '';
      var key = dayKey || todayKey();
      draft = note ? JSON.parse(JSON.stringify(note)) : { id: null, text: '', icon: '', days: [weekdayOf(key)], date: null, userId: null };
      draft.mode = draft.date ? 'once' : 'weekly';
      if (!draft.date) draft.onceDate = key; else draft.onceDate = draft.date;
      if (!draft.days || !draft.days.length) draft.days = [weekdayOf(draft.onceDate)];
      draft.armed = false;
      draft.error = '';
      drawSheet();
      sheet.hidden = false;
      // Straight to typing for a new note; a change may only be its day.
      var input = sheet.querySelector('input.text');
      if (input && !note) input.focus();
    }
    function closeSheet() { sheet.hidden = true; draft = null; }

    function drawSheet() {
      // Keep what's been typed, and the caret, if the box had it. A tap on a
      // day or a person mustn't put the keyboard up on a touch screen.
      var input = sheet.querySelector('input.text');
      var typing = !!input && document.activeElement === input;
      var caret = typing ? input.selectionStart : null;
      if (input) draft.text = input.value;
      var today = todayKey();
      var h = '<header><h2 id="sheet-title">' + (draft.id ? 'Change note' : 'New note') + '</h2></header><div class="body">';
      h += '<div><div class="label">Note</div><input class="text" maxlength="80" placeholder="Kids buy lunch" value="' + esc(draft.text) + '" aria-label="Note"></div>';
      h += '<div><div class="label">Picture</div><div class="row">' + ICONS.map(function (ic) {
        return '<button type="button" class="pill icon-pill" data-icon="' + esc(ic) + '" aria-pressed="' + (draft.icon === ic) + '" aria-label="' + (ic ? ic : 'No picture') + '">' + (ic || '—') + '</button>';
      }).join('') + '</div></div>';
      h += '<div><div class="label">When</div><div class="seg" role="group">'
        + '<button type="button" class="pill" data-mode="weekly" aria-pressed="' + (draft.mode === 'weekly') + '">Every week</button>'
        + '<button type="button" class="pill" data-mode="once" aria-pressed="' + (draft.mode === 'once') + '">Just once</button></div>';
      if (draft.mode === 'weekly') {
        h += '<div class="row" style="margin-top:8px">' + WEEK.map(function (d) {
          return '<button type="button" class="pill" data-wd="' + d + '" aria-pressed="' + (draft.days.indexOf(d) !== -1) + '">' + esc(weekdayLabel(d)) + '</button>';
        }).join('') + '</div>';
      } else {
        h += '<div class="row scroll" style="margin-top:8px">';
        for (var i = 0; i < 21; i++) {
          var key = addDays(today, i);
          var label = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : dayName(key) + ' ' + monthDay(key);
          h += '<button type="button" class="pill" data-date="' + key + '" aria-pressed="' + (draft.onceDate === key) + '">' + esc(label) + '</button>';
        }
        h += '</div>';
      }
      h += '</div>';
      h += '<div><div class="label">For</div><div class="row">'
        + '<button type="button" class="pill" data-user="" aria-pressed="' + (draft.userId == null) + '">Everyone</button>'
        + state.users.map(function (u) {
          return '<button type="button" class="pill" data-user="' + u.id + '" aria-pressed="' + (draft.userId === u.id) + '">' + avatar(u) + esc(u.username) + '</button>';
        }).join('') + '</div></div>';
      if (draft.error) h += '<div class="err">' + esc(draft.error) + '</div>';
      h += '</div><footer>'
        + (draft.id ? '<button type="button" class="btn danger' + (draft.armed ? ' armed' : '') + '" data-delete>' + (draft.armed ? 'Delete it' : 'Delete') + '</button>' : '<span style="margin-right:auto"></span>')
        + '<button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn primary" data-save>Save</button></footer>';
      sheet.innerHTML = h;
      if (typing) {
        var again = sheet.querySelector('input.text');
        again.focus();
        try { again.setSelectionRange(caret, caret); } catch (e) { /* not a text type that has one */ }
      }
    }

    function save() {
      var input = sheet.querySelector('input.text');
      var text = (input ? input.value : draft.text).trim().slice(0, 80);
      if (!text) { draft.error = 'Write the note first.'; drawSheet(); return; }
      if (draft.mode === 'weekly' && !draft.days.length) { draft.error = 'Pick at least one day.'; drawSheet(); return; }
      var note = {
        id: draft.id || uid(),
        text: text,
        icon: draft.icon || '',
        userId: draft.userId == null ? null : draft.userId,
        at: draft.at || Date.now()
      };
      if (draft.mode === 'weekly') note.days = draft.days.slice().sort(); else note.date = draft.onceDate;
      store.set('note:' + note.id, note).then(function () {
        state.notes = state.notes.filter(function (n) { return n.id !== note.id; }).concat([note]);
        closeSheet();
        render();
      }).catch(function (e) {
        draft.error = 'Couldn\'t save: ' + (e && e.message ? e.message : 'try again');
        drawSheet();
      });
    }

    function remove() {
      if (!draft.armed) { draft.armed = true; drawSheet(); return; }
      var id = draft.id;
      store.remove('note:' + id).then(function () {
        state.notes = state.notes.filter(function (n) { return n.id !== id; });
        closeSheet();
        render();
      });
    }

    // --- taps -------------------------------------------------------------------------------
    app.addEventListener('click', function (event) {
      if (HIDE_EDIT) return;
      if (event.target.closest('[data-add]')) { openSheet(null, todayKey()); return; }
      var noteEl = event.target.closest('[data-note]');
      if (noteEl) {
        var n = state.notes.filter(function (x) { return x.id === noteEl.getAttribute('data-note'); })[0];
        if (n) { openSheet(n, n.date || todayKey()); return; }
      }
      var dayEl = event.target.closest('[data-day]');
      if (dayEl) openSheet(null, dayEl.getAttribute('data-day'));
    });
    sheet.addEventListener('click', function (event) {
      var t = event.target;
      var input = sheet.querySelector('input.text');
      if (input) draft.text = input.value;
      if (!t.closest('[data-delete]') && draft.armed) { draft.armed = false; }
      var el;
      if ((el = t.closest('[data-icon]'))) { draft.icon = el.getAttribute('data-icon'); drawSheet(); return; }
      if ((el = t.closest('[data-mode]'))) { draft.mode = el.getAttribute('data-mode'); draft.error = ''; drawSheet(); return; }
      if ((el = t.closest('[data-wd]'))) {
        var d = +el.getAttribute('data-wd');
        var at = draft.days.indexOf(d);
        if (at === -1) draft.days.push(d); else draft.days.splice(at, 1);
        draft.error = '';
        drawSheet();
        return;
      }
      if ((el = t.closest('[data-date]'))) { draft.onceDate = el.getAttribute('data-date'); drawSheet(); return; }
      if ((el = t.closest('[data-user]'))) { var v = el.getAttribute('data-user'); draft.userId = v === '' ? null : +v; drawSheet(); return; }
      if (t.closest('[data-cancel]')) { closeSheet(); return; }
      if (t.closest('[data-save]')) { save(); return; }
      if (t.closest('[data-delete]')) { remove(); return; }
      if (draft && !draft.armed) drawSheet();
    });
    sheet.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeSheet();
      if (event.key === 'Enter' && event.target.matches('input.text')) { event.preventDefault(); save(); }
    });

    // --- start ------------------------------------------------------------------------------
    load();
    // Notes added on another display arrive within a minute; the day rolls
    // over at midnight on its own.
    setInterval(function () { if (!document.hidden && sheet.hidden) load(); }, 60 * 1000);
    setInterval(function () { if (sheet.hidden) render(); }, 30 * 1000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && sheet.hidden) load(); });
    var resizeTimer = null;
    window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { lastHtml = ''; render(); }, 120); });
  })();
  </script>
</body>
</html>
