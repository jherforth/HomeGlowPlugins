<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Calendar Agenda</title>
  <link rel="stylesheet" href="/index.css">

  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "calendar-agenda",
    "name": "Calendar Agenda",
    "description": "An agenda list of what is coming up, read from the calendars already connected in HomeGlow. Pick which of them to show, choose how far ahead to look, and it groups events by day with times, locations and each calendar's colour. No ICS URL to paste.",
    "apiVersion": "v1",
    "settings": [
      { "key": "days", "label": "How far ahead to look", "type": "select",
        "options": ["3", "7", "14", "30"], "default": "7", "scope": "device" },
      { "key": "sources", "label": "Calendar ids to show (blank = all)", "type": "string",
        "default": "", "scope": "device" },
      { "key": "showLocation", "label": "Show event locations", "type": "boolean",
        "default": true, "scope": "device" },
      { "key": "showCalendarName", "label": "Show which calendar each event came from", "type": "boolean",
        "default": true, "scope": "device" }
    ]
  }
  </script>

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: var(--card-bg, #fff);
      /* The host defines --text, not --text-color. */
      color: var(--text, #333);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }

    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .head h1 { font-size: 0.9rem; margin: 0; font-weight: 700; }
    .head .range { font-size: 0.75rem; opacity: 0.6; margin-left: auto; }

    .btn {
      background: transparent;
      border: 1px solid var(--card-border, rgba(128,128,128,0.35));
      color: inherit;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 4px 9px;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--accent, #757575); }
    .btn.primary { background: var(--accent, #757575); color: #fff; border-color: var(--accent, #757575); }

    .note {
      font-size: 0.72rem;
      opacity: 0.65;
      border: 1px dashed var(--card-border, rgba(128,128,128,0.35));
      border-radius: 8px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    .err {
      border: 1px solid rgba(244, 67, 54, 0.55);
      background: rgba(244, 67, 54, 0.10);
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 0.78rem;
      margin-bottom: 8px;
    }

    /* --- agenda --- */
    .day { margin-bottom: 12px; }
    .dayhead {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding-bottom: 4px;
      margin-bottom: 5px;
      border-bottom: 1px solid var(--card-border, rgba(128,128,128,0.28));
    }
    .dayname { font-size: 0.8rem; font-weight: 700; }
    .daydate { font-size: 0.72rem; opacity: 0.55; }
    .day.today .dayname { color: var(--accent, #757575); }
    .daycount { margin-left: auto; font-size: 0.7rem; opacity: 0.5; }

    .ev {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 6px 4px;
      border-radius: 6px;
    }
    .ev + .ev { border-top: 1px solid var(--card-border, rgba(128,128,128,0.14)); }

    /* Time column is fixed width so titles line up down the day. */
    .when {
      flex: 0 0 62px;
      font-size: 0.75rem;
      opacity: 0.75;
      padding-top: 1px;
      font-variant-numeric: tabular-nums;
    }
    .when.allday { opacity: 0.55; font-style: italic; }

    .dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 6px;
      background: var(--accent, #757575);
    }

    .body { min-width: 0; flex: 1; }
    .title { font-size: 0.84rem; font-weight: 600; }
    .sub { font-size: 0.72rem; opacity: 0.6; margin-top: 1px; }
    .sub .cal { opacity: 0.85; }

    .empty { opacity: 0.6; font-size: 0.82rem; padding: 12px 2px; }
    .nothing { font-size: 0.75rem; opacity: 0.4; padding: 2px 4px 6px; }

    /* --- picker --- */
    h2 {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.5;
      margin: 12px 0 6px;
      font-weight: 700;
    }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
    .src {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 4px;
      border-bottom: 1px solid var(--card-border, rgba(128,128,128,0.18));
      cursor: pointer;
      user-select: none;
      font-size: 0.82rem;
    }
    .box {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid var(--card-border, rgba(128,128,128,0.45));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .box.on { background: var(--accent, #757575); border-color: var(--accent, #757575); color: #fff; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .hint { font-size: 0.72rem; opacity: 0.55; margin: 2px 0 8px; line-height: 1.45; }
    select {
      background: transparent;
      color: inherit;
      border: 1px solid var(--card-border, rgba(128,128,128,0.35));
      border-radius: 8px;
      padding: 5px 7px;
      font-size: 0.82rem;
      font-family: inherit;
    }
    select option { color: initial; }
  </style>
</head>
<body>
  <div class="head">
    <h1 id="heading">Agenda</h1>
    <span class="range" id="range"></span>
    <button class="btn" id="pick">Calendars</button>
  </div>

  <div id="notes"></div>
  <div id="view"></div>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
  (function () {
    'use strict';

    // ---------------------------------------------------------------------
    // Reads the calendars HomeGlow is already syncing, rather than asking for
    // an ICS URL of its own. /api/calendar-events already returns each event
    // with source_id, source_name, source_color and all_day, and only for
    // sources that are enabled — so the agenda needs no core change and no
    // second copy of anyone's credentials.
    // ---------------------------------------------------------------------

    var API = '';
    var SDK = window.HomeGlow && window.HomeGlow.pluginId ? window.HomeGlow : null;
    var LOCAL_KEY = 'homeglow.calendarAgenda.settings';

    // Every setting here is device-scoped, and the platform refuses to write
    // those without a ?device= parameter — which the dashboard supplies but the
    // Admin Panel's preview iframe does not. So the platform is used only when
    // there is a device to attribute the value to; otherwise this display keeps
    // its own copy, and the picker works in a preview instead of erroring.
    var deviceName = new URLSearchParams(window.location.search).get('device');
    var usePlatform = !!(SDK && deviceName);

    var state = {
      tz: null,
      today: null,
      sources: [],
      events: [],
      notes: [],
      picking: false,
      settings: { days: '7', sources: '', showLocation: true, showCalendarName: true }
    };

    // ---------- helpers ----------

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function note(m) { if (state.notes.indexOf(m) === -1) state.notes.push(m); }

    function fetchJson(url) {
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + url);
        return r.json();
      });
    }

    // Every date decision is made in the household timezone, the same way the
    // core calendar does it. A display in another zone must not group an
    // event under a different day than the wall calendar shows.
    function localDate(iso) {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: state.tz || undefined, year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date(iso));
    }
    function localTime(iso) {
      return new Intl.DateTimeFormat(undefined, {
        timeZone: state.tz || undefined, hour: 'numeric', minute: '2-digit'
      }).format(new Date(iso));
    }
    function shiftDate(dateStr, delta) {
      var p = dateStr.split('-');
      var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
      d.setUTCDate(d.getUTCDate() + delta);
      return d.toISOString().slice(0, 10);
    }
    // Already a plain calendar date, so format it as UTC — re-applying the
    // household zone here would shift it a day.
    function formatDate(dateStr, options) {
      var p = dateStr.split('-');
      return new Intl.DateTimeFormat(undefined, Object.assign({ timeZone: 'UTC' }, options))
        .format(new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])));
    }
    function shortDate(dateStr) {
      return formatDate(dateStr, { month: 'short', day: 'numeric' });
    }
    // The heading carries the weekday, so the date beside it does not repeat it.
    function dayLabel(dateStr) {
      if (dateStr === state.today) return 'Today';
      if (dateStr === shiftDate(state.today, 1)) return 'Tomorrow';
      return formatDate(dateStr, { weekday: 'long' });
    }

    function selectedIds() {
      var raw = String(state.settings.sources || '').trim();
      if (!raw) return null;                       // null = every enabled calendar
      var ids = raw.split(',').map(function (s) { return parseInt(s.trim(), 10); })
        .filter(function (n) { return !isNaN(n); });
      return ids.length ? ids : null;
    }

    function daysAhead() {
      var n = parseInt(state.settings.days, 10);
      return isNaN(n) || n < 1 ? 7 : Math.min(n, 60);
    }

    // ---------- settings persistence ----------

    function loadSettings() {
      if (usePlatform) {
        return SDK.settings.get()
          .then(function (v) { state.settings = Object.assign(state.settings, v || {}); })
          .catch(function () {});
      }
      // No plugin identity, or no device to attribute device-scoped values to.
      // Keep the picker working on this display rather than refusing to run.
      try {
        var raw = localStorage.getItem(LOCAL_KEY);
        if (raw) state.settings = Object.assign(state.settings, JSON.parse(raw));
      } catch (e) {}
      return Promise.resolve();
    }

    function saveSettings(partial) {
      state.settings = Object.assign(state.settings, partial);
      if (usePlatform) {
        return SDK.settings.set(partial).catch(function (e) {
          note('Could not save the calendar selection: ' + e.message);
        });
      }
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state.settings)); }
      catch (e) { note('Could not save the calendar selection: ' + e.message); }
      return Promise.resolve();
    }

    // ---------- load ----------

    function loadAll() {
      state.notes = [];
      if (!usePlatform) {
        note('Choices are saved on this display only.' + (SDK ? '' :
          ' Install the plugin from the Admin Panel to store them with HomeGlow.'));
      }
      return fetchJson(API + '/api/timezone').catch(function () { return {}; })
        .then(function (tz) {
          state.tz = tz && tz.timezone;
          state.today = localDate(new Date().toISOString());

          // Fetch a day either side of the window: the endpoint filters on UTC
          // timestamps while the agenda groups by local date, so an event at
          // the edge could otherwise fall outside the query and vanish.
          var from = shiftDate(state.today, -1);
          var to = shiftDate(state.today, daysAhead() + 1);
          return Promise.all([
            fetchJson(API + '/api/calendar-sources').catch(function () { return []; }),
            fetchJson(API + '/api/calendar-events?start=' + from + '&end=' + to)
          ]);
        })
        .then(function (res) {
          // Only enabled sources produce events, so only they are offerable.
          state.sources = (res[0] || []).filter(function (s) { return s.enabled; });
          state.events = res[1] || [];
        });
    }

    // ---------- shaping ----------

    // Which local dates an event should appear under. A timed event belongs to
    // the day it starts. An all-day event spans start..end, which is how a
    // two-day trip shows up on both days.
    function datesFor(ev) {
      var startDate = localDate(ev.start);
      if (!ev.all_day) return [startDate];

      var endDate = ev.end ? localDate(ev.end) : startDate;
      // Real feeds contain rows whose end precedes their start; treat those as
      // a single day rather than looping or dropping them.
      if (endDate < startDate) return [startDate];

      var out = [];
      var cursor = startDate;
      var guard = 0;
      while (cursor <= endDate && guard++ < 400) {
        out.push(cursor);
        cursor = shiftDate(cursor, 1);
      }
      return out;
    }

    function buildAgenda() {
      var ids = selectedIds();
      var last = shiftDate(state.today, daysAhead());
      var byDay = {};

      state.events.forEach(function (ev) {
        if (ids && ids.indexOf(ev.source_id) === -1) return;
        datesFor(ev).forEach(function (date) {
          if (date < state.today || date > last) return;
          (byDay[date] = byDay[date] || []).push(ev);
        });
      });

      Object.keys(byDay).forEach(function (date) {
        byDay[date].sort(function (a, b) {
          // All-day first, then chronological, then by title so the order is
          // stable between refreshes.
          if (!!a.all_day !== !!b.all_day) return a.all_day ? -1 : 1;
          if (a.start !== b.start) return a.start < b.start ? -1 : 1;
          return String(a.title || '').localeCompare(String(b.title || ''));
        });
      });

      return byDay;
    }

    // ---------- render ----------

    function eventRow(ev, date) {
      // Same precedence the core calendar uses for an event's colour.
      var color = ev.event_color || ev.source_color || 'var(--accent, #757575)';
      var when;
      if (ev.all_day) {
        when = '<span class="when allday">all day</span>';
      } else if (localDate(ev.start) !== date) {
        // A timed event only lands on its start day, so this is a spillover
        // guard rather than a normal case.
        when = '<span class="when allday">cont.</span>';
      } else {
        when = '<span class="when">' + esc(localTime(ev.start)) + '</span>';
      }

      var sub = [];
      if (state.settings.showLocation && ev.location) sub.push(esc(ev.location));
      if (state.settings.showCalendarName && ev.source_name) {
        sub.push('<span class="cal">' + esc(ev.source_name) + '</span>');
      }

      return '<div class="ev">' + when +
        '<span class="dot" style="background:' + esc(color) + '"></span>' +
        '<div class="body"><div class="title">' + esc(ev.title || 'Untitled') + '</div>' +
        (sub.length ? '<div class="sub">' + sub.join(' &middot; ') + '</div>' : '') +
        '</div></div>';
    }

    function render() {
      var noteBox = document.getElementById('notes');
      noteBox.innerHTML = state.notes.map(function (n) {
        return '<div class="' + (/could not|failed/i.test(n) ? 'err' : 'note') + '">' + esc(n) + '</div>';
      }).join('');

      document.getElementById('range').textContent = state.today
        ? 'next ' + daysAhead() + ' days'
        : '';

      if (state.picking) return renderPicker();

      var view = document.getElementById('view');

      if (!state.sources.length) {
        view.innerHTML = '<div class="empty">No calendars are connected yet. Add one under ' +
                         'Settings &rarr; Connections, then choose it here.</div>';
        return;
      }

      var byDay = buildAgenda();
      var dates = Object.keys(byDay).sort();
      if (!dates.length) {
        view.innerHTML = '<div class="empty">Nothing scheduled in the next ' + daysAhead() + ' days.</div>';
        return;
      }

      var html = '';
      dates.forEach(function (date) {
        var events = byDay[date];
        html += '<div class="day ' + (date === state.today ? 'today' : '') + '">';
        html += '<div class="dayhead"><span class="dayname">' + esc(dayLabel(date)) + '</span>' +
                '<span class="daydate">' + esc(shortDate(date)) + '</span>' +
                '<span class="daycount">' + events.length + '</span></div>';
        events.forEach(function (ev) { html += eventRow(ev, date); });
        html += '</div>';
      });

      view.innerHTML = html;
    }

    function renderPicker() {
      var ids = selectedIds();
      var h = '<h2>Calendars</h2>';
      h += '<div class="hint">Only calendars enabled in HomeGlow appear here. ' +
           'With none ticked, the agenda shows them all.</div>';

      state.sources.forEach(function (s) {
        var on = !ids || ids.indexOf(s.id) !== -1;
        h += '<div class="src" data-source="' + s.id + '">' +
             '<span class="box ' + (on ? 'on' : '') + '">' + (on ? '&#10003;' : '') + '</span>' +
             '<span class="swatch" style="background:' + esc(s.color || '#888') + '"></span>' +
             '<span>' + esc(s.name) + '</span></div>';
      });

      h += '<h2>Range</h2><div class="row"><select id="daysSel">';
      ['3', '7', '14', '30'].forEach(function (d) {
        h += '<option value="' + d + '"' + (String(daysAhead()) === d ? ' selected' : '') + '>' +
             'next ' + d + ' days</option>';
      });
      h += '</select></div>';

      h += '<div class="row"><button class="btn primary" id="closePicker">Done</button>' +
           '<button class="btn" id="selectAll">Show all</button></div>';

      document.getElementById('view').innerHTML = h;
    }

    // ---------- events ----------

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-source]');
      if (el) {
        var id = parseInt(el.getAttribute('data-source'), 10);
        var ids = selectedIds();
        // "All" is stored as blank. Ticking off one calendar has to start from
        // the full list, or the first click would select only that one.
        if (!ids) ids = state.sources.map(function (s) { return s.id; });
        var at = ids.indexOf(id);
        if (at === -1) ids.push(id); else ids.splice(at, 1);

        var everything = ids.length === state.sources.length;
        saveSettings({ sources: everything ? '' : ids.join(',') }).then(renderPicker);
        return;
      }

      switch (ev.target.id) {
        case 'pick':
          state.picking = !state.picking;
          document.getElementById('pick').textContent = state.picking ? 'Close' : 'Calendars';
          render();
          break;
        case 'closePicker':
          state.picking = false;
          document.getElementById('pick').textContent = 'Calendars';
          render();
          break;
        case 'selectAll':
          saveSettings({ sources: '' }).then(renderPicker);
          break;
      }
    });

    document.addEventListener('change', function (ev) {
      if (ev.target.id !== 'daysSel') return;
      saveSettings({ days: ev.target.value }).then(function () {
        return loadAll();
      }).then(renderPicker).catch(function () {});
    });

    // ---------- boot ----------

    document.addEventListener('DOMContentLoaded', function () {
      var params = new URLSearchParams(window.location.search);
      var theme = params.get('theme');
      if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
      if (params.get('transparent') === 'true') document.body.style.background = 'transparent';

      loadSettings()
        .then(loadAll)
        .then(render)
        .catch(function (e) {
          note('Could not load the agenda: ' + e.message);
          render();
        });

      // Calendars change slowly and sync on the server's own schedule, so a
      // five-minute poll is plenty. Polled rather than event-driven: there is
      // no calendar event in the plugin catalog, and the event stream does not
      // reach the browser on every deployment anyway.
      setInterval(function () {
        if (state.picking || document.hidden) return;
        loadAll().then(render).catch(function () {});
      }, 5 * 60 * 1000);

      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && !state.picking) loadAll().then(render).catch(function () {});
      });
    });
  })();
  </script>
</body>
</html>
