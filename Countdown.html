<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Countdown</title>
  <script type="application/json" id="homeglow-manifest">
  {
    "manifestVersion": 1,
    "id": "family-countdown",
    "name": "Family Countdown",
    "description": "Counts down to the days the family is waiting for: birthdays, holidays, the start of a trip. Countdowns are saved on the server, each countdown can be made per-display (default) or shown on all displays.",
    "apiVersion": "v1",
    "storage": true,
    "hideableControls": [
      { "id": "manageCountdowns", "label": "Add, edit, or delete countdowns" }
    ]
  }
  </script>
  <link rel="stylesheet" href="/index.css">
  <style>
    * {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    body {
      background: transparent !important;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0.75rem;
      box-sizing: border-box;
      font-size: 0.85rem;
      color: #333;
    }

    [data-theme="dark"] body {
      color: #a6a6d1;
      background: transparent !important;
    }

    .widget-container {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      border-radius: 12px;
      padding: 0.5rem;
      text-align: center;
      width: 100%;
      max-height: calc(100vh - 1.5rem);
      overflow-y: auto;
    }

    .widget-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
      color: inherit;
    }

    .countdown-list {
      margin-bottom: 1rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .countdown-item {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      position: relative;
    }

    [data-theme="dark"] .countdown-item {
      background: rgba(30, 30, 50, 0.3);
      border-color: rgba(100, 100, 150, 0.3);
    }

    .countdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .countdown-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: inherit;
      margin: 0;
    }

    .countdown-emoji {
      font-size: 1.2rem;
    }

    .countdown-display {
      font-size: 1.1rem;
      font-weight: 700;
      color: #00ddeb;
      margin: 0.25rem 0;
    }

    [data-theme="dark"] .countdown-display {
      color: #00ddeb;
    }

    .countdown-date {
      font-size: 0.75rem;
      opacity: 0.8;
      margin: 0;
    }

    .countdown-expired {
      color: #ff6b6b !important;
      font-weight: 600;
    }

    .countdown-today {
      color: #28a745 !important;
      font-weight: 700;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .countdown-actions {
      display: flex;
      gap: 0.35rem;
    }

    .edit-btn {
      background: #4a90d9 !important;
      color: white !important;
      border: none;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .edit-btn:hover {
      background: #3a7bc0 !important;
      transform: translateY(-1px);
    }

    .delete-btn {
      background: #ff6b6b !important;
      color: white !important;
      border: none;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      background: #ff5252 !important;
      transform: translateY(-1px);
    }

    .add-form {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 1rem;
    }

    [data-theme="dark"] .add-form {
      background: rgba(30, 30, 50, 0.2);
      border-color: rgba(100, 100, 150, 0.2);
    }

    .scope-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
    }

    .scope-badge {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      border: 1px solid currentColor;
      opacity: 0.7;
      white-space: nowrap;
    }

    .form-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }

    .form-input {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 4px;
      padding: 0.5rem;
      color: inherit !important;
      font-size: 0.8rem;
      flex: 1;
    }

    [data-theme="dark"] .form-input {
      background: rgba(30, 30, 50, 0.3) !important;
      border-color: rgba(100, 100, 150, 0.3) !important;
    }

    .form-input:focus {
      outline: none;
      border-color: #00ddeb !important;
      box-shadow: 0 0 0 2px rgba(0, 221, 235, 0.2);
    }

    .emoji-select {
      background: rgba(255, 255, 255, 0.1) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      border-radius: 4px;
      padding: 0.5rem;
      color: inherit !important;
      font-size: 0.8rem;
      width: 60px;
    }

    [data-theme="dark"] .emoji-select {
      background: rgba(30, 30, 50, 0.3) !important;
      border-color: rgba(100, 100, 150, 0.3) !important;
    }

    .custom-button {
      background: linear-gradient(45deg, #00ddeb, #ff6b6b) !important;
      color: #333 !important;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s ease;
      margin: 0.25rem;
    }

    [data-theme="dark"] .custom-button {
      background: linear-gradient(45deg, #2e2767, #620808) !important;
      color: #a6a6d1 !important;
    }

    .custom-button:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .custom-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      color: #ff6b6b;
      font-size: 0.75rem;
      margin: 0.5rem 0;
      text-align: center;
    }

    .success-message {
      color: #28a745;
      font-size: 0.75rem;
      margin: 0.5rem 0;
      text-align: center;
    }

    .no-countdowns {
      color: inherit;
      opacity: 0.7;
      font-style: italic;
      margin: 2rem 0;
    }

    .toggle-form-btn {
      background: rgba(255, 255, 255, 0.1) !important;
      color: inherit !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    [data-theme="dark"] .toggle-form-btn {
      background: rgba(30, 30, 50, 0.3) !important;
      border-color: rgba(100, 100, 150, 0.3);
    }

    .toggle-form-btn:hover {
      background: rgba(255, 255, 255, 0.2) !important;
      transform: translateY(-1px);
    }

    [data-theme="dark"] .toggle-form-btn:hover {
      background: rgba(30, 30, 50, 0.5) !important;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <h1 class="widget-title">⏰ Family Countdown</h1>
    
    <div id="countdownList" class="countdown-list"></div>
    
    <button id="toggleFormBtn" class="toggle-form-btn">+ Add New Countdown</button>
    
    <div id="addForm" class="add-form" style="display: none;">
      <div class="form-row">
        <input type="text" id="eventTitle" class="form-input" placeholder="Event name (e.g., Christmas)" maxlength="50">
        <select id="eventEmoji" class="emoji-select">
          <option value="🎉">🎉</option>
          <option value="🎂">🎂</option>
          <option value="🎄">🎄</option>
          <option value="🎃">🎃</option>
          <option value="💝">💝</option>
          <option value="🏖️">🏖️</option>
          <option value="✈️">✈️</option>
          <option value="🎓">🎓</option>
          <option value="💍">💍</option>
          <option value="🏠">🏠</option>
          <option value="⭐">⭐</option>
          <option value="🎊">🎊</option>
        </select>
      </div>
      <div class="form-row">
        <input type="date" id="eventDate" class="form-input">
        <input type="time" id="eventTime" class="form-input" value="00:00">
      </div>
      <div class="form-row">
        <label class="scope-option">
          <input type="checkbox" id="eventAllDisplays">
          <span>Show on every display</span>
        </label>
      </div>
      <div class="form-row">
        <button id="addCountdownBtn" class="custom-button">Add Countdown</button>
        <button id="cancelBtn" class="custom-button" style="background: #6c757d !important;">Cancel</button>
      </div>
      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>
    </div>
  </div>

  <script src="/plugin-sdk/v1.js"></script>
  <script>
    // Control limits: the dashboard names this plugin's hidden controls on the
    // iframe URL, already unprefixed. No param means hide nothing, which is what
    // an older dashboard and a direct load of this page both produce.
    var HIDDEN_CONTROLS = (new URLSearchParams(window.location.search).get('hide') || '')
      .split(',').filter(Boolean);
    var HIDE_MANAGE = HIDDEN_CONTROLS.indexOf('manageCountdowns') !== -1;

    // At parse time, not on DOMContentLoaded: this script sits after the button
    // and the form in the document, so hidden ones can go before they are ever
    // painted. The per-item Edit and Delete buttons are rendered later, and
    // renderCountdowns() leaves them out under the same gate.
    applyControlLimits();

    function applyControlLimits() {
      if (!HIDE_MANAGE) return;
      var toggle = document.getElementById('toggleFormBtn');
      if (toggle) toggle.remove();
      var form = document.getElementById('addForm');
      if (form) form.remove();
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Handle theme
      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      if (theme === 'dark' || theme === 'light') {
        document.documentElement.setAttribute('data-theme', theme);
      }

      // Widget state
      let countdowns = [];
      let updateInterval;
      let showForm = false;
      // Which countdown the form is editing, or null when adding a new one.
      let editingId = null;
      // False until the stored countdowns are actually in hand. Gates every
      // write: without it a failed read leaves an empty list that the next
      // mutation would persist over the real one.
      let countdownsLoaded = false;

      // One key per countdown. A single document would make two displays
      // adding at the same moment a get-modify-set race on one key, and one
      // add would be lost.
      const KEY_PREFIX = 'c:';
      const MIGRATION_KEY = 'migratedFromLocalStorage';
      const LEGACY_KEY = 'homeglowCountdowns';

      // The dashboard passes this display's device name on the iframe URL.
      const MY_DEVICE = params.get('device') || '';

      // Names of devices the server currently knows, used only to decide
      // whether a countdown's owning display still exists. Null means the
      // lookup failed, which is treated as "cannot tell" -- see isVisible().
      let knownDevices = null;

      const SDK = window.HomeGlow && window.HomeGlow.pluginId ? window.HomeGlow : null;
      const STORAGE = SDK ? SDK.storage : null;
      const PLATFORM_AVAILABLE = Boolean(STORAGE);

      // DOM elements
      const countdownList = document.getElementById('countdownList');
      const toggleFormBtn = document.getElementById('toggleFormBtn');
      const addForm = document.getElementById('addForm');
      const eventTitle = document.getElementById('eventTitle');
      const eventEmoji = document.getElementById('eventEmoji');
      const eventDate = document.getElementById('eventDate');
      const eventTime = document.getElementById('eventTime');
      const eventAllDisplays = document.getElementById('eventAllDisplays');
      const addCountdownBtn = document.getElementById('addCountdownBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');

      // Interpolated into innerHTML below. Titles are free text, and with
      // countdowns shared across displays an unescaped one would run on every
      // other display in the house, not just the one that typed it.
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Date.now() alone collides when two displays add within the same
      // millisecond, and under one-key-per-countdown a collision silently
      // overwrites. The random suffix is what makes the key unique.
      function newCountdownId() {
        return String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8);
      }

      // Drop anything that is not a usable countdown rather than rendering
      // undefined, and keep the id the key carries so the two cannot disagree.
      function normalizeCountdown(id, value) {
        if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
        if (typeof value.title !== 'string' || !value.title.trim()) return null;
        if (typeof value.date !== 'string' || Number.isNaN(new Date(value.date).getTime())) return null;
        return {
          id: id,
          title: value.title,
          emoji: typeof value.emoji === 'string' && value.emoji ? value.emoji : '🎉',
          date: value.date,
          created: typeof value.created === 'string' ? value.created : new Date().toISOString(),
          // null / absent means every display. A device name means that one
          // display only. Anything else is treated as every display rather
          // than as a countdown nobody can see.
          device: typeof value.device === 'string' && value.device ? value.device : null
        };
      }

      async function loadKnownDevices() {
        try {
          const response = await fetch('/api/devices');
          if (!response.ok) return null;
          const devices = await response.json();
          if (!Array.isArray(devices)) return null;
          return devices.map((device) => device && device.name).filter(Boolean);
        } catch (error) {
          console.error('Error loading device list:', error);
          return null;
        }
      }

      // A countdown for every display is always shown. One pinned to a display
      // is shown there.
      //
      // The third case is a display that was renamed after the countdown was
      // created: plugin storage holds the old name and, unlike device settings,
      // nothing rewrites it on rename. Rather than let that countdown become
      // invisible everywhere -- the silent loss this plugin exists to stop --
      // an owner no longer present in the device list is treated as every
      // display, so it resurfaces and can be fixed or deleted. If the device
      // list could not be read at all, the name is honored as written, so a
      // pinned countdown is never broadcast on a guess.
      function isVisible(countdown) {
        if (!countdown.device) return true;
        if (countdown.device === MY_DEVICE) return true;
        if (knownDevices === null) return false;
        return knownDevices.indexOf(countdown.device) === -1;
      }

      // Countdowns written before this plugin moved to server storage live in
      // one browser key. Imported once per install, and the original key is
      // deliberately left intact as a fallback copy.
      function readLegacyCountdowns() {
        try {
          const saved = localStorage.getItem(LEGACY_KEY);
          const parsed = saved ? JSON.parse(saved) : null;
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          console.error('Error reading legacy countdowns:', error);
          return [];
        }
      }

      async function migrateFromLocalStorage() {
        const legacy = readLegacyCountdowns();
        if (legacy.length === 0) return [];

        const imported = [];
        for (const candidate of legacy) {
          const id = newCountdownId();
          const countdown = normalizeCountdown(id, candidate);
          if (!countdown) continue;
          await STORAGE.set(KEY_PREFIX + id, {
            title: countdown.title,
            emoji: countdown.emoji,
            date: countdown.date,
            created: countdown.created,
            // Countdowns that predate server storage were only ever on one
            // browser, so they are pinned to the display that imports them.
            device: MY_DEVICE || null
          });
          imported.push(countdown);
        }
        return imported;
      }

      // Load countdowns from server storage, shared by every display.
      async function loadCountdowns() {
        countdowns = [];
        countdownsLoaded = false;

        if (!PLATFORM_AVAILABLE) {
          showError('Shared storage unavailable — install this widget through Admin > Widgets.');
          return;
        }

        try {
          const all = await STORAGE.list();
          const documents = all && typeof all === 'object' && !Array.isArray(all) ? all : {};

          countdowns = Object.keys(documents)
            .filter((key) => key.indexOf(KEY_PREFIX) === 0)
            .map((key) => normalizeCountdown(key.slice(KEY_PREFIX.length), documents[key]))
            .filter(Boolean);
          countdownsLoaded = true;

          // Only migrate on a genuinely empty store, and only once, so a
          // deleted countdown does not come back on the next load.
          if (countdowns.length === 0 && documents[MIGRATION_KEY] === undefined) {
            countdowns = await migrateFromLocalStorage();
            await STORAGE.set(MIGRATION_KEY, { at: new Date().toISOString() });
          }
        } catch (error) {
          console.error('Error loading countdowns:', error);
          showError('Failed to load countdowns');
          countdowns = [];
          countdownsLoaded = false;
        }
      }

      // Writes touch one countdown's key, never the whole list, so a
      // concurrent add or delete on another display cannot be clobbered.
      async function saveCountdown(countdown) {
        if (!countdownsLoaded) {
          console.error('Countdown: list was never loaded; refusing to write.');
          showError('Failed to save countdown');
          return false;
        }
        try {
          await STORAGE.set(KEY_PREFIX + countdown.id, {
            title: countdown.title,
            emoji: countdown.emoji,
            date: countdown.date,
            created: countdown.created,
            device: countdown.device || null
          });
          return true;
        } catch (error) {
          console.error('Error saving countdown:', error);
          showError('Failed to save countdown');
          return false;
        }
      }

      async function removeCountdown(id) {
        if (!countdownsLoaded) {
          console.error('Countdown: list was never loaded; refusing to delete.');
          showError('Failed to delete countdown');
          return false;
        }
        try {
          await STORAGE.remove(KEY_PREFIX + id);
          return true;
        } catch (error) {
          console.error('Error deleting countdown:', error);
          showError('Failed to delete countdown');
          return false;
        }
      }

      // Show error message
      function showError(message) {
        errorMessage.textContent = message;
        successMessage.textContent = '';
        setTimeout(() => {
          errorMessage.textContent = '';
        }, 3000);
      }

      // Show success message
      function showSuccess(message) {
        successMessage.textContent = message;
        errorMessage.textContent = '';
        setTimeout(() => {
          successMessage.textContent = '';
        }, 3000);
      }

      // Calculate time remaining
      function calculateTimeRemaining(targetDate) {
        const now = new Date().getTime();
        const target = new Date(targetDate).getTime();
        const difference = target - now;

        if (difference <= 0) {
          return { expired: true, text: 'Event has passed!' };
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        // Check if it's today
        const today = new Date();
        const targetDateObj = new Date(targetDate);
        const isToday = today.toDateString() === targetDateObj.toDateString();

        if (isToday && days === 0) {
          if (hours === 0 && minutes === 0) {
            return { 
              isToday: true, 
              text: `${seconds} second${seconds !== 1 ? 's' : ''} left!` 
            };
          } else if (hours === 0) {
            return { 
              isToday: true, 
              text: `${minutes}m ${seconds}s left!` 
            };
          } else {
            return { 
              isToday: true, 
              text: `${hours}h ${minutes}m left!` 
            };
          }
        }

        if (days === 0) {
          return { text: `${hours}h ${minutes}m ${seconds}s` };
        } else if (days === 1) {
          return { text: `1 day, ${hours}h ${minutes}m` };
        } else {
          return { text: `${days} days, ${hours}h ${minutes}m` };
        }
      }

      // Format date for display
      function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      // Render countdowns
      function renderCountdowns() {
        const visible = countdowns.filter(isVisible);

        if (visible.length === 0) {
          countdownList.innerHTML = '<div class="no-countdowns">No countdowns yet. Add one to get started!</div>';
          return;
        }

        // Sort countdowns by date (soonest first)
        const sortedCountdowns = [...visible].sort((a, b) => new Date(a.date) - new Date(b.date));

        countdownList.innerHTML = sortedCountdowns.map((countdown) => {
          const timeRemaining = calculateTimeRemaining(countdown.date);

          let displayClass = 'countdown-display';
          if (timeRemaining.expired) {
            displayClass += ' countdown-expired';
          } else if (timeRemaining.isToday) {
            displayClass += ' countdown-today';
          }

          return `
            <div class="countdown-item">
              <div class="countdown-header">
                <div class="countdown-emoji">${escapeHtml(countdown.emoji)}</div>
                ${HIDE_MANAGE ? '' : `
                <div class="countdown-actions">
                  <button class="edit-btn" onclick="editCountdown('${escapeHtml(countdown.id)}')">Edit</button>
                  <button class="delete-btn" onclick="deleteCountdown('${escapeHtml(countdown.id)}')">Delete</button>
                </div>`}
              </div>
              <h3 class="countdown-title">${escapeHtml(countdown.title)}${
                countdown.device ? '' : ' <span class="scope-badge">All displays</span>'
              }</h3>
              <div class="${displayClass}">${timeRemaining.text}</div>
              <p class="countdown-date">${formatDate(countdown.date)}</p>
            </div>
          `;
        }).join('');
      }

      // Delete by id, never by array index: the rendered list is sorted by
      // date and the underlying list can change on another display, so an
      // index resolves to the wrong countdown.
      window.deleteCountdown = async function(id) {
        if (HIDE_MANAGE) return;
        const index = countdowns.findIndex(c => c.id === id);
        if (index === -1) return;

        if (!await removeCountdown(id)) return;
        countdowns.splice(index, 1);
        if (editingId === id) cancelEdit();
        renderCountdowns();
        showSuccess('Countdown deleted successfully!');
      };

      // Load the countdown into the form for editing.
      window.editCountdown = function(id) {
        if (HIDE_MANAGE) return;
        const countdown = countdowns.find(c => c.id === id);
        if (!countdown) return;

        editingId = id;
        const [datePart, timePart] = String(countdown.date).split('T');
        eventTitle.value = countdown.title;
        eventEmoji.value = countdown.emoji;
        eventDate.value = datePart || '';
        eventTime.value = (timePart || '00:00').slice(0, 5);
        eventAllDisplays.checked = !countdown.device;

        showForm = true;
        addForm.style.display = 'block';
        toggleFormBtn.textContent = '✕ Cancel';
        addCountdownBtn.textContent = 'Save Changes';
        eventTitle.focus();
      };

      function cancelEdit() {
        editingId = null;
        addCountdownBtn.textContent = 'Add Countdown';
      }

      // Toggle form visibility
      function toggleForm() {
        showForm = !showForm;
        addForm.style.display = showForm ? 'block' : 'none';
        toggleFormBtn.textContent = showForm ? '✕ Cancel' : '+ Add New Countdown';
        
        if (showForm) {
          cancelEdit();
          eventAllDisplays.checked = false;
          eventTitle.focus();
          // Set default date to tomorrow
          const tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          eventDate.value = tomorrow.toISOString().split('T')[0];
        } else {
          clearForm();
        }
      }

      // Clear form
      function clearForm() {
        cancelEdit();
        eventTitle.value = '';
        eventEmoji.value = '🎉';
        eventDate.value = '';
        eventTime.value = '00:00';
        eventAllDisplays.checked = false;
        errorMessage.textContent = '';
        successMessage.textContent = '';
      }

      // Add, or save an edit when the form was opened from the Edit button.
      async function addCountdown() {
        const title = eventTitle.value.trim();
        const emoji = eventEmoji.value;
        const date = eventDate.value;
        const time = eventTime.value;
        // Chosen while creating the countdown rather than configured afterwards,
        // so the decision is made where it is understood. Unticked keeps the
        // behavior this plugin has always had -- a countdown belongs to the
        // display it was typed on -- and sharing it is the deliberate act.
        const device = eventAllDisplays.checked ? null : (MY_DEVICE || null);

        // Validation
        if (!title) {
          showError('Please enter an event name');
          return;
        }

        if (!date) {
          showError('Please select a date');
          return;
        }

        // Create full date string
        const fullDate = `${date}T${time}`;
        const targetDate = new Date(fullDate);
        const now = new Date();

        if (targetDate <= now) {
          showError('Please select a future date and time');
          return;
        }

        // Check for duplicate titles. A countdown being edited must not
        // collide with itself.
        // Only against countdowns this display can see: another display's
        // pinned countdown is not a name clash anyone here could resolve.
        if (countdowns.some(c => c.id !== editingId && isVisible(c) && c.title.toLowerCase() === title.toLowerCase())) {
          showError('A countdown with this name already exists');
          return;
        }

        if (editingId) {
          const existing = countdowns.find(c => c.id === editingId);
          if (!existing) {
            showError('That countdown no longer exists');
            return;
          }

          const updated = { ...existing, title, emoji, date: fullDate, device };
          if (!await saveCountdown(updated)) return;
          Object.assign(existing, updated);
          renderCountdowns();
          showSuccess(`Countdown "${title}" updated successfully!`);
          toggleForm();
          return;
        }

        const newCountdown = {
          id: newCountdownId(),
          title,
          emoji,
          date: fullDate,
          created: new Date().toISOString(),
          device
        };

        if (!await saveCountdown(newCountdown)) return;
        countdowns.push(newCountdown);
        renderCountdowns();
        showSuccess(`Countdown "${title}" added successfully!`);
        toggleForm();
      }

      // Start update interval
      function startUpdateInterval() {
        if (updateInterval) {
          clearInterval(updateInterval);
        }
        updateInterval = setInterval(renderCountdowns, 1000);
      }

      // Event listeners. Under the control limit the button and the form were
      // removed before this ran, so there is nothing to listen on.
      if (!HIDE_MANAGE) {
        toggleFormBtn.addEventListener('click', toggleForm);
        addCountdownBtn.addEventListener('click', addCountdown);
        cancelBtn.addEventListener('click', toggleForm);

        // Enter key support
        eventTitle.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') addCountdown();
        });
      }

      // Initialize. The first render waits for the load so the list is never
      // drawn empty and then repopulated. The 1 s interval that follows is
      // pure arithmetic over the in-memory list -- it issues no requests.
      (async () => {
        knownDevices = await loadKnownDevices();
        await loadCountdowns();
        renderCountdowns();
        startUpdateInterval();
      })();

      // Cleanup on page unload
      window.addEventListener('beforeunload', () => {
        if (updateInterval) {
          clearInterval(updateInterval);
        }
      });
    });
  </script>
</body>
</html>
